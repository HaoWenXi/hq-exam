section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对转入的机动车进行查验时，按注册登记规定的项目查验机动车，但“车辆品牌和型号”项目除外；对属于卧铺客车、专用校车和设有乘客站立区的客车的，还应查验车内外录像监控装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1568, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对手动挡乘用车加装肢体残疾人操纵辅助装置申请变更备案的，查验车辆识别代号、车辆号牌、车辆外观形状、轮胎完好情况、操纵辅助装置加装合格证明、操纵辅助装置的产品型号和产品编号，核对安全技术检验合格证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1569, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对残疾人专用汽车拆除肢体残疾人操纵辅助装置申请变更备案的，查验车辆识别代号、车辆号牌、车辆外观形状、轮胎完好情况，确认是否已拆除操纵辅助装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1570, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对申请换发新能源汽车专用号牌的，确认是否属于新能源汽车及新能源汽车种类，查验车辆识别代号、驱动电机号码、车辆外观形状和轮胎完好情况；对插电式混合动力汽车、纯电动汽车，还应查验是否具有外接充电接口。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1571, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，公安机关交通管理部门车辆管理所查验机动车应在专门查验区进行，特殊情况下不能在专门查验区进行查验的，须经市级公安机关交通管理部门备案。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1572, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，公安机关交通管理部门车辆管理所查验机动车应在专门查验区进行，但特殊情况下不能在专门查验区进行查验并经省级公安机关交通管理部门备案的除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1573, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，专门查验区的视线应良好，其场地应平坦、硬实，长度、宽度和高度应能满足查验车型的实际需要。专门查验区应施划有标志标线，安装有视频监控系统，按标准配备有查验工具箱。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1574, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，查验过程中，民警查验员应按照规定使用执法记录仪，非民警查验员应按照规定使用与执法记录仪功能相同的视音频记录装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1575, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，查验员应按照规定的项目查验机动车，按照相关法律法规和GB7258、GB1589等机动车国家安全技术标准确认所查验项目是否符合规定，使用机动车查验智能终端记录机动车查验结果、采集查验照片和视频，录入机动车查验监管系统，制作《机动车查验记录表》或《校车查验记录表》。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1576, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，与车辆结构或安全装置相关的查验项目，应按照机动车前来办理查验时所执行版本的机动车国家安全技术标准确认是否符合规定，但法律法规和强制性国家标准另有规定的除外。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1577, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，中型（含）以上载客汽车、中型（含）以上载货汽车的变更迁出查验应由民警查验员负责。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1578, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，确定车辆类型时，机动车实车车长符合GB1589等机动车国家安全技术标准的规定且实车车长与《道路机动车辆生产企业及产品公告》（以下简称《公告》）、机动车整车出厂合格证明等技术文件记载的名义车长的偏差在允许范围内时，按照《公告》、机动车整车出厂合格证明等技术文件记载的名义车长核定车辆类型。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1579, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，确定车身颜色时，应根据实车核定；车身颜色随观察位置的不同及光线的明暗会发生变化的，应根据机动车标准照片确定相应的车身颜色。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1580, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，确定核定载人数时，对驾驶室前排核定乘坐3人的汽车，应实车测量驾驶室（区）内部宽度。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1581, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对2018年1月1日起出厂的总质量大于或等于12000kg 的栏板式、仓栅式、自卸式、罐式货车及总质量大于或等于10000kg 的栏板式、仓栅式、自卸式、罐式挂车，还应查验其货箱或常压罐体（或固定在货箱或常压罐体上且用于与车架连接的结构件）上是否按规定打刻了车辆识别代号。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1582, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，办理机动车重新打刻车辆识别代号变更备案时，应核对车辆识别代号拓印膜与实车打刻的车辆识别代号的字体、间距（或拍摄/制作打刻的车辆识别代号1：1还原照片），使用机动车查验智能终端拍摄打刻的车辆识别代号照片，并收存重新打刻的车辆识别代号拓印膜。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1583, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，查验车辆外廓尺寸、轴距等尺寸参数时，应采用机动车安全技术检验机构或其他具备资质的机构按照规定测得的相关尺寸参数数值，并与《公告》、机动车整车出厂合格证明等凭证、技术资料记载的数值进行比对，确认是否在允许的误差范围内。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1584, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，查验车辆外廓尺寸、轴距等尺寸参数时，应采用机动车安全技术检验机构或其他具备资质的机构按照规定测得的相关尺寸参数数值或使用量具测量相关尺寸参数，并与《公告》、机动车整车出厂合格证明等凭证、技术资料记载的数值进行比对，确认是否在允许的误差范围内。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1585, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，查验整备质量时，应采用机动车安全技术检验机构或其他具备资质的机构按照规定测得的整备质量数值，并与《公告》、机动车整车出厂合格证明等凭证、技术资料记载的数值进行比对，确认是否在允许的误差范围内。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1586, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对申请注册登记的机动车进行查验时，查验员应在对应的判定栏内签注确定的“车身颜色”“核定载人数”（对设有乘客站立区的客车为“载客人数/座位数”）及根据GA802核定的“车辆类型”。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1587, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对申请注册登记或换发新能源汽车专用号牌的插电式混合动力汽车、纯电动汽车（换电式除外）进行查验时，对具有外接充电接口的，在“备注”栏中记录“新能源汽车”。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1588, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对进口机动车，查验外部照明和信号装置的配置和光色、车速里程表指示、排气管布置和中文警告性文字特别项目出现不合格情形时，在“判定栏”栏中记录不合格的项目并说明具体情形。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1589, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对乘用车进行查验时，发现车身外部进行了改装但未改变车辆长度宽度和车身主体结构、不影响运行安全的，告知机动车所有人或申请人（或被委托的经办人）交通安全法律法规和技术标准相关要求和使用规定，并在“备注”栏中记录。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1590, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，查验不合格的机动车复检合格时，查验员在《机动车查验记录表》或《校车查验记录表》对应的位置签字（或签章）并签注日期；复检仍不合格的，不签注。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1591, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，注册登记查验时，发现申请注册登记的机动车不符合GB7258、GB1589等机动车国家安全技术标准或与《公告》、机动车整车出厂合格证明的数据不一致时，或发现《公告》、机动车整车出厂合格证明的技术参数不符合GB7258、GB1589等机动车国家安全技术标准的，属于办理业务前经机动车安全技术检验机构安全技术检验合格的，应按规定对机动车安全技术检验机构予以处罚，并将相关信息通报给当地市场监督管理部门。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1592, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对初次注册登记查验确认为违规机动车产品的机动车再次进行注册登记查验时，应确认机动车生产厂家是否已对先前查验不合格的项目进行了整改并出具了与整改日期相适应的整改合格说明，确认的结果应通过视频录像或拍摄照片留存。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1593, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，摩托车和小型、微型载客汽车（面包车除外）以及经省级公安机关交通管理部门备案的其他类型机动车，实行先行核发机动车检验合格标志后监督检查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1594, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，在办理远程核发检验合格标志时，机动车安全技术检验监管系统出现检验异常情况预警报警提示时，经核实并非异常情形的，应及时远程核发检验合格标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1595, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，轮式专用机械车应在右侧前部的车辆结构件上打刻产品识别代码（或车辆识别代号），如受结构限制也可打刻在右侧其他车辆结构件上。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1596, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，挂车（无纵梁的除外）的车辆识别代号应打刻在右前支腿前端纵梁外侧。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1597, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，打刻车辆识别代号（或产品识别代码、整车型号和出厂编号）的部件不应有明显的采用打磨、挖补、垫片、凿改、重新涂漆等方式处理的痕迹。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1598, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，同一辆车上标识的所有车辆识别代号（包括电子控制单元记载的车辆识别代号）内容应相同。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1599, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，注册登记查验时，发现打刻的车辆识别代号及其附近可视区域存在局部打磨、涂漆等加工处理痕迹时，若上述痕迹不足以影响管理部门对车辆识别代号的识别和认定，不应简单认定为不符合GB7258国家标准的要求。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1600, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，在用车因腐蚀、交通事故等原因造成打刻的车辆识别代号无法确认需重新打刻的，按照规定打刻新的原车辆识别代号时应把原始号码打磨掉。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1601, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，在用车更换车身或车架的，更换的车身或车架上应按规定打刻原车辆识别代号的号码。重新打刻的车辆识别代号的打刻位置，应符合GB7258-2017的4.1.3的规定。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1602, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，在用车查验时，已采集发动机标识（或可见的发动机号码）电子照片的，实车的发动机标识（或可见的发动机号码）与电子照片一致的，视为合格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1603, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，注册登记查验时，机动车整车出厂合格证明（对国产机动车）、进口车辆中英文对照表（对进口机动车）等凭证和技术资料上记载的“车辆品牌”和“车辆型号”与整车产品标牌上标明的车辆品牌、型号应相符，对进口车辆中英文对照表未列入车辆品牌/型号的进口机动车不应办理注册登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1604, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，在确认车身颜色时，对于车身颜色随观察位置不同及光线明暗会发生变化的机动车（俗称“变色龙”），应在判定栏签注“×”，并在备注栏简要说明情况。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1605, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，对实行《公告》管理的国产机动车，载货汽车和专项作业车核定的驾驶室乘坐人数可小于《公告》和机动车整车出厂合格证明标明的驾驶室乘坐人数，但载客汽车核定的乘坐人数与机动车整车出厂合格证明标明的乘坐人数的数值应一致且符合《公告》管理的相关规定。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1606, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，在用车查验时，对需喷涂或粘贴/放置放大的号牌号码的车型,受结构限制车厢后部无法粘贴/放置放大的号牌号码时，车厢左右两侧喷涂有放大的号牌号码的，视为满足要求。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1607, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，车辆运输挂车（包括中置轴挂车、半挂车）的后部不应设置有可能用于载运车辆的可伸缩的结构。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1608, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，注册登记查验时，对实行《公告》管理的国产机动车，实车外观形状应与《公告》的机动车照片一致，但装有《公告》允许选装部件的以及乘用车在不改变车辆长度宽度和车身主体结构且保证安全的情况下加装车顶行李架、出入口踏步件、换装散热器面罩和/或保险杠、更换轮毂、加装尾翼等情形的除外。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1609, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，专用客车、专项作业车的乘坐区与作业区重合的部分，可只在一侧设置车窗，防弹运钞车押运员乘坐区的两侧可不设置车窗。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1610, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，非注册登记查验时，乘用车未按规定配备机动车用三角警告牌和/或反光背心的，在《机动车查验记录表》相应栏内签注“不合格”，应要求机动车所有人或申请人（或被委托人的经办人）配置齐全后复检。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1611, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，按照GB7258-2017规定不核定乘坐人数的座椅，以及其他仅在机动车停止状态下供人员乘坐的座椅不属于乘员座椅，这些座椅不应装备汽车安全带，且汽车产品使用说明书对这些座椅的设计和制造用途、使用安全事项等应予以说明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1612, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对所有货车、货车底盘改装的专项作业车和挂车，以及带驾驶室的正三轮摩托车查验整备质量。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1613, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，辖区内转移登记查验判定整备质量时，确认车辆无非法改装情形且最近一次安全技术检验的轴荷等相关数据正常的，视为合格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1614, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，所有客车、危险货物运输车辆、旅居车应配备使用状态有效的灭火器，灭火器在车身应安装牢靠并便于使用，其压力表应在不移动灭火器的条件下能观察到压力状态。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1615, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，2018年10月1日起出厂的设有乘客站立区的客车，2019年1月1日起出厂的其他客车，应安装符合规定的行驶记录仪、具有行驶记录功能的卫星定位装置等行驶记录装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1616, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，卧铺客车、2018年1月1日起出厂的设有乘客站立区的客车，还应安装车内外视频监控录像系统。车内外视频监控录像系统摄像头的配备数量及拍摄方向应符合相关标准和管理规定，无遮挡。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1617, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，2013年9月1日起出厂的设有乘客站立区的客车车身两侧的车窗，若洞口可内接一个面积大于或等于800mm×900mm的矩形时，应设置为推拉式或外推式应急窗；若洞口可内接一个面积大于或等于500mm×700mm的矩形时，应设置为击碎玻璃式的应急窗，并在附近配置应急锤或具有自动破窗功能。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1618, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，2014年9月1日起出厂的车长大于或等于6m的客车，如车身右侧仅有一个乘客门且在车身左侧未设置驾驶人门，应在车身左侧或后部设置应急门。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1619, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，2019年1月1日起出厂的公路客车、旅游客车和未设置乘客站立区的公共汽车，车长大于8m时车身左右两侧应至少各配置2个外推式应急窗并应在车身左侧设置1个应急门，车长大于6m且小于或等于8m时车身左右两侧应至少各配置1个外推式应急窗；外推式应急窗玻璃的上方中部或右角应标记有击破点标记，邻近处应配置应急锤。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1620, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，使用应急窗时，应采用易于迅速从车内、外开启的装置；或采用自动破窗装置；或在车窗玻璃上方中部或右角标记有直径不小于50mm的圆心击破点标志，并在每个应急窗的邻近处提供一个应急锤以方便地击碎车窗玻璃，且应急锤取下时应能通过声响信号实现报警。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1621, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，2012年9月1日起出厂的车长大于9m的公路客车、旅游客车，以及2018年1月1日起出厂的车长大于9m的其他未设置乘客站立区的客车应设置两个乘客门。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1622, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，乘客门和应急出口的应急控制器应在其附近标有清晰的符号或字样并注明其操作方法，字体高度应不小于20mm。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1623, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，在用车更换发动机进行安全技术检验时，安全技术检验合格证明上应记载有更换后的发动机型号和出厂编号。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1624, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定， 2019年1月1日起出厂的车长大于或等于6m的旅居车，应具有限速功能，否则应配备限速装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1625, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，总质量大于等于4500kg的危险货物运输货车应装备缓速器或其他辅助制动装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1626, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，2019年1月1日起出厂的危险货物运输半挂车及2020年1月1日起出厂的三轴栏板式和仓栅式半挂车，其所有车轮均应装备盘式制动器。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1627, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定， 2015年7月1日起出厂的发动机中置的乘用车，2018年1月1日起出厂的其他乘用车、总质量大于3500kg且小于12000kg的货车和专项作业车、总质量大于3500kg且小于或等于10000kg的挂车，以及2019年1月1日起出厂的总质量小于或等于3500kg的货车和专项作业车，均应安装符合规定的防抱制动装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1628, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，进口机动车标注的（正常查验时能观察到的）警告性文字均应有中文。如有英文“warning”等明确属于警告提示内容的均应有相关中文说明，但如无相应文字，或已经用图形表示警告内容，视为满足要求。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1629, "section": "第三部分 查验业务知识", "header": "", "question": "按照《机动车运行安全技术条件》GB7258-2017第1号修改单要求，中置轴挂车列车的中置轴挂车的总质量应小于或等于货车的总质量。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1630, "section": "第三部分 查验业务知识", "header": "", "question": "按照《机动车运行安全技术条件》GB7258-2017第1号修改单要求，自2020年1月1日起出厂的车长大于或等于6 m 的设有乘客站立区的客车和未设置乘客站立区的公共汽车, 其驾驶区应有隔离设施, 防止他人侵入驾驶区。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1631, "section": "第三部分 查验业务知识", "header": "", "question": "按照《机动车运行安全技术条件》GB7258-2017第1号修改单要求，自2019年11月1日起出厂的车长大于或等于9m 的设有乘客站立区的客车和未设置乘客站立区的公共汽车, 其驾驶区应有隔离设施, 防止他人侵入驾驶区。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1632, "section": "第三部分 查验业务知识", "header": "", "question": "按照《机动车运行安全技术条件》GB7258-2017第1号修改单要求，自2019年8月1日起出厂的平板式载货车辆的平板不应有插桩结构、 凹槽、集装箱锁具等装置, 且平板式载货车辆、仓栅式载货车辆的载货部位不应具有举升功能或采用自卸结构。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1633, "section": "第三部分 查验业务知识", "header": "", "question": "按照《机动车运行安全技术条件》GB7258-2017第1号修改单要求，自2020年2月1日起出厂的平板式载货车辆的平板不应有插桩结构、 凹槽、集装箱锁具等装置, 且平板式载货车辆、仓栅式载货车辆的载货部位不应具有举升功能或采用自卸结构。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1634, "section": "第三部分 查验业务知识", "header": "", "question": "按规定应经强制计量检定的查验工具，经过检定后可以一直使用。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1635, "section": "第三部分 查验业务知识", "header": "", "question": "查验包应配置机动车查验检验智能终端、螺丝刀、金属卷尺、强光手电等常用查验工具。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1636, "section": "第三部分 查验业务知识", "header": "", "question": "查验包应配置伸缩旋转镜、轮胎花纹深度尺、平面放大镜、VIN码信息读取仪器、汽车行驶记录仪检查装置、车身反光标识查验仪器等仪器装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1637, "section": "第三部分 查验业务知识", "header": "", "question": "金属卷尺长度不小于3m，分辨力不小1mm，主要用于测量部件尺寸参数。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1638, "section": "第三部分 查验业务知识", "header": "", "question": "查验智能终端应提供设置固定查验区域功能，未经授权禁止在固定查验区域外进行查验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1639, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站可以选择使用公安部统一的公安交通管理综合应用平台专网服务系统或公安内网服务系统办理机动车登记业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1640, "section": "第三部分 查验业务知识", "header": "", "question": "申请设立机动车登记服务站的工作人员，应当具有高中（含）以上学历，熟悉国家机动车和驾驶证管理相关法律、法规、政策和技术标准，上岗前接受相关业务培训、考核合格，从事机动车查验的应具有大专（含）以上学历，还应当取得相应车型的查验员资格证书。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1641, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站开办的业务包括机动车注册登记、转移登记、变更登记、抵押登记及检验标志核发等业务，不可办理注销登记业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1642, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站可以协助办理小型、微型载客汽车，以及载货汽车、摩托车注册登记，使用性质为危险货物运输、警用、消防、救护、工程救险、校车的机动车除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1643, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站可以协助办理载客汽车、载货汽车、摩托车二手车交易转移登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1644, "section": "第三部分 查验业务知识", "header": "", "question": "对机动车查验相关技术标准规定的需由民警查验员现场查验的业务，经车辆管理所民警查验员授权后可以由机动车登记服务站非民警查验员代为查验。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1645, "section": "第三部分 查验业务知识", "header": "", "question": "对业务办理中需要收回的号牌，机动车登记服务站应当收回后自行销毁。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1646, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站有擅自增加或减少查验项目、降低查验标准，为查验不合格车辆办理业务，或者聘用未取得相应查验员资格证书人员开展机动车查验的，所属的车辆管理所应当暂停其业务办理，责令限期整改，在其整改完毕并经验收通过后，书面通知其恢复业务办理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1647, "section": "第三部分 查验业务知识", "header": "", "question": "省级公安机关交通管理部门负责本省（自治区、直辖市）机动车查验工作的指导、检查和监督。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1648, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所开展机动车查验业务时，应当设置查验业务岗、查验审核岗。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1649, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所应当使用符合相关标准和规定的查验场地、查验工具、查验智能终端查验机动车，按规定使用全国统一的机动车查验监管系统。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1650, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所应当规范机动车查验区建设，设置“机动车查验岗”标识，设置查验工位，施划标志标线，安装视频监控系统，配置计算机、打印机、扫描仪等设备。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1651, "section": "第三部分 查验业务知识", "header": "", "question": "查验员查验机动车时应当随身携带使用查验工具包和查验智能终端，并使用执法记录仪或者便携式视音频记录装置记录查验过程。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1652, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所查验机动车可以在查验区进行。对辖区内出租、公交等运输企业需要上门查验机动车的，应当报省级公安机关交通管理部门备案。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1653, "section": "第三部分 查验业务知识", "header": "", "question": "初级查验员查验的车型为：小型和微型载客汽车、轻型和微型载货汽车、低速汽车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1654, "section": "第三部分 查验业务知识", "header": "", "question": "从事机动车查验监管、机动车安全技术检验监督的工作人员应当经过培训，掌握监管工作内容和异常情形处置要求，其负责人应为中级查验员或者高级查验员。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1655, "section": "第三部分 查验业务知识", "header": "", "question": "省级公安机关交通管理部门应当制定查验员培训教育管理规定，制定培训计划，指导、监督设区的市或者相当于同级的公安机关交通管理部门开展集中培训和日常培训相结合的培训教育工作。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1656, "section": "第三部分 查验业务知识", "header": "", "question": "设区的市或者相当于同级的公安机关交通管理部门、县级公安机关交通管理部门应当对查验员每月组织一次廉政教育、业务知识、实战技能集中培训。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1657, "section": "第三部分 查验业务知识", "header": "", "question": "查验不合格的，查验监督岗应当向机动车所有人或者代理人出具书面告知，一次性书面告知查验不合格原因，在机动车查验监管系统中记录机动车基本信息、查验不合格原因及相关证明图片（视频）资料。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1658, "section": "第三部分 查验业务知识", "header": "", "question": "对摩托车和非营运小型、微型载客汽车（面包车除外）以及经省级公安机关交通管理部门备案的其他类型机动车，经检验机构检验合格后，先行远程核发机动车检验合格标志，在检验照片（视频）上传后的48小时内审查完毕。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1659, "section": "第三部分 查验业务知识", "header": "", "question": "省级公安机关交通管理部门应当会同公安机关刑侦部门、海关等单位，建立被盗抢、走私机动车案件办理协作机制。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1660, "section": "第三部分 查验业务知识", "header": "", "question": "民警查验员在查验工作中发现机动车被盗抢、走私嫌疑的，还应当先行采取必要的处置措施防止嫌疑机动车驶离，并要求机动车所有人或者代理人配合调查；嫌疑机动车强行驶离的，应当记录嫌疑机动车的号牌号码、车型、颜色、特征等信息，并立即报告公安机关交通管理部门查缉。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1661, "section": "第三部分 查验业务知识", "header": "", "question": "公安机关交通管理部门接到机动车被盗抢、走私嫌疑报告后，应当立即指派2名以上民警依法开展现场调查，调查期间应当开启执法记录仪，记录现场全过程，并制作现场笔录。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1662, "section": "第三部分 查验业务知识", "header": "", "question": "对机动车存在被盗抢、走私嫌疑的，公安机关交通管理部门应当采集嫌疑机动车的车辆识别代号、发动机号及零部件编号，比对盗抢库、机动车登记信息，并应联系生产、销售或者进口企业进行核查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1663, "section": "第三部分 查验业务知识", "header": "", "question": "对机动车存在走私嫌疑的，经过核查机动车涉嫌走私的，应当根据《刑事诉讼法》、《海关法》、《公安机关办理刑事案件程序规定》的规定，移交查获地的海关部门处理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1664, "section": "第三部分 查验业务知识", "header": "", "question": "经查验发现申请注册登记的机动车不符合机动车国家安全技术标准，或者与《公告》、合格证等凭证记载的数据不一致等情形时，查验监督岗在机动车查验监管系统中记录机动车的基本信息及整车生产厂家、生产日期、《公告》批次、违规类型、情形、违规原因初步调查等信息，填写《嫌疑违规机动车产品通报表》，上传整车、违规项目及询问笔录等照片；属于进口机动车的，还应记录进口证明凭证名称、编号。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1665, "section": "第三部分 查验业务知识", "header": "", "question": "查验监督岗承担审核工作的人员应当为民警中级查验员以上资格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1666, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所应当指导、监督机动车安全技术检验机构、机动车登记服务站按本规范采集、报送嫌疑违规机动车产品信息。车辆管理所接到机动车安全技术检验机构、机动车登记服务站报告嫌疑违规机动车后，应当安排开展调查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1667, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站可以办理的具体查验业务范围，由县公安机关交通管理部门以上或者相当于同级的公安机关交通管理部门按照相关规定确定。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1668, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站应当配备与机动车查验工作相适应的社会辅助查验员，社会辅助查验员不得兼任登记审核岗。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1669, "section": "第三部分 查验业务知识", "header": "", "question": "社会辅助查验员可以对小型和微型载客汽车、轻型和微型载货汽车、低速汽车、摩托车进行查验（进口机动车注册登记除外）。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1670, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所应当组织对机动车登记服务站查验业务的日常检查，每月明查暗访次数应当不少于1次，每季度完成对辖区全部机动车登记服务站检查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1671, "section": "第三部分 查验业务知识", "header": "", "question": "机动车所有人的住所迁出车辆管理所管辖区域的，转出地车辆管理所应当自受理之日起三日内，查验机动车，在机动车登记证书上签注变更事项，将机动车档案交机动车所有人。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1672, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所实现与机动车制造厂新车出厂查验信息联网的，机动车所有人申请小型、微型载客汽车注册登记时，免予交验机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1673, "section": "第三部分 查验业务知识", "header": "", "question": "小型、微型载客汽车因改变车身颜色申请变更登记，仅能向车辆登记地车辆管理所提出申请。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1674, "section": "第三部分 查验业务知识", "header": "", "question": "《机动车登记规定》（164号令）规定，在不影响安全和识别号牌的情况下，小型、微型载客汽车可以加装前后防撞装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1675, "section": "第三部分 查验业务知识", "header": "", "question": "机动车虽未达到国家强制报废标准，但机动车所有人自愿报废的，可以向登记地车辆管理所申请注销登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1676, "section": "第三部分 查验业务知识", "header": "", "question": "公安机关交通管理部门应当实行机动车检验合格标志电子化，在核发检验合格标志的同时，发放检验合格标志电子凭证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1677, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所在办理机动车登记及相关业务过程中发现机动车涉嫌走私、被盗抢骗、非法生产销售、拼（组）装、非法改装的，应当及时开展调查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1678, "section": "第三部分 查验业务知识", "header": "", "question": "对不符合《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》的机动车产品，自2022年3月1日起，生产企业应立即停止生产，对已列入《公告》的排量大于2.5升但符合其他要求的轻型货车在产产品，给予生产销售过渡期6个月。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1679, "section": "第三部分 查验业务知识", "header": "", "question": "对《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》发布之日后出厂的轻型货车、小微型载客汽车产品，均应当符合《通知》及《技术规范》的要求。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1680, "section": "第三部分 查验业务知识", "header": "", "question": "《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》中定义的小微型载客汽车，是指车顶外覆盖件（覆盖在车身骨架表面上的车顶结构件，不包括行李架、天线等车顶结构件上的附件）最大离地高度大于或等于1800mm，车长小于6000mm且乘坐人数小于或等于9人，单层地板，一厢或两厢式结构，安装座椅的载客汽车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1681, "section": "第三部分 查验业务知识", "header": "", "question": "《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》中定义的面包车，指平头或短头车身结构，单层地板，发动机中置，乘坐人数小于或等于 9人，安装座椅的载客汽车,包括纯电动汽车与燃料电池电动汽车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1682, "section": "第三部分 查验业务知识", "header": "", "question": "《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》规定，对符合小微型载客汽车定义的车辆的行李区纵向长度应当小于或等于车长的30%。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1683, "section": "第三部分 查验业务知识", "header": "", "question": "对符合《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》规定的小微型载客汽车，车辆仅设置两排座椅时，第二排座椅的座椅骨架和靠背应为固定式结构且不能被翻转。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1684, "section": "第三部分 查验业务知识", "header": "", "question": "《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》规定的小微型载客汽车，车辆设置的第二排及以后排的普通座椅，如其纵向位置可以调节，调节范围应小于或等于600mm；如果配备豪华座椅，调节范围应小于或等于900mm。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1685, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对插电式混合动力汽车、纯电动汽车（换电式除外），查验是否具有外接充电接口。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1686, "section": "第四部分 驾驶证业务知识", "header": "1.1.1", "question": "对持港澳台驾驶证申领内地大中型客货车驾驶证的港澳台居民，申请年龄应为____以下。", "options": ["A、50周岁", "B、55周岁", "C、60周岁", "D、65周岁"], "answer": "C", "type": "choice"}, {"id": 1687, "section": "第四部分 驾驶证业务知识", "header": "1.1.2", "question": "除接受全日制驾驶职业教育的学生外，申请大型客车准驾车型的，应符合的年龄要求________。", "options": ["A、18周岁以上、60周岁以下", "B、21周岁以上、50周岁以下", "C、24周岁以上、50周岁以下", "D、22周岁以上、60周岁以下"], "answer": "D", "type": "choice"}, {"id": 1688, "section": "第四部分 驾驶证业务知识", "header": "1.1.3", "question": "_____拇指健全，每只手其他手指必须有三指健全，肢体和手指运动功能正常。但手指末节残缺或者_____有三指健全，且_____手掌完整的，可以申请小型汽车、小型自动挡汽车、低速载货汽车、三轮汽车准驾车型的机动车驾驶证。", "options": ["A、双手  左手  双手", "B、双手  右手  右手", "C、左手  左手  双手", "D、左手  右手  右手"], "answer": "A", "type": "choice"}, {"id": 1689, "section": "第四部分 驾驶证业务知识", "header": "1.1.4", "question": "申请小型汽车、小型自动挡汽车、残疾人专用小型自动挡载客汽车、轻便摩托车准驾车型的，年龄应在________。", "options": ["A、18周岁以上、无上限", "B、18周岁以上、60周岁以下", "C、16周岁以上、60周岁以下", "D、18周岁以上、70周岁以下"], "answer": "A", "type": "choice"}, {"id": 1690, "section": "第四部分 驾驶证业务知识", "header": "1.1.5", "question": "申请低速载货汽车、三轮汽车、普通三轮摩托车、普通二轮摩托车或者轮式自行机械车准驾车型的，年龄应在18周岁以上，________以下。", "options": ["A、50周岁", "B、70周岁", "C、55周岁", "D、60周岁"], "answer": "D", "type": "choice"}, {"id": 1691, "section": "第四部分 驾驶证业务知识", "header": "1.1.6", "question": "申请城市公交车、大型货车、无轨电车或者有轨电车准驾车型的，年龄应在________以上，60周岁以下。", "options": ["A、21周岁", "B、20周岁", "C、22周岁", "D、24周岁"], "answer": "B", "type": "choice"}, {"id": 1692, "section": "第四部分 驾驶证业务知识", "header": "1.1.7", "question": "申请中型客车准驾车型的，应符合的年龄要求________。", "options": ["A、18周岁以上、60周岁以下", "B、20周岁以上、60周岁以下", "C、21周岁以上、50周岁以下", "D、24周岁以上、50周岁以下"], "answer": "B", "type": "choice"}, {"id": 1693, "section": "第四部分 驾驶证业务知识", "header": "1.1.8", "question": "除接受全日制驾驶职业教育的学生外，申请重型牵引挂车准驾车型的，年龄应在________以上，60周岁以下。", "options": ["A、21周岁", "B、22周岁", "C、23周岁", "D、26周岁"], "answer": "B", "type": "choice"}, {"id": 1694, "section": "第四部分 驾驶证业务知识", "header": "1.1.9", "question": "驾驶证申请人应符合上肢双手拇指健全，每只手其他手指必须有________指健全，肢体和手指运动功能正常的身体条件。", "options": ["A、二", "B、三", "C、四", "D、五"], "answer": "B", "type": "choice"}, {"id": 1695, "section": "第四部分 驾驶证业务知识", "header": "1.1.10", "question": "申请中型客车准驾车型的，身高应在________以上。", "options": ["A、155厘米", "B、150厘米", "C、160厘米", "D、145厘米"], "answer": "B", "type": "choice"}, {"id": 1696, "section": "第四部分 驾驶证业务知识", "header": "1.1.11", "question": "驾驶证申请人的听力应当符合：两耳分别距音叉________能辨别声源方向。", "options": ["A、20厘米", "B、30厘米", "C、50厘米", "D、60厘米"], "answer": "C", "type": "choice"}, {"id": 1697, "section": "第四部分 驾驶证业务知识", "header": "1.1.12", "question": "除申请驾驶小型自动挡汽车、残疾人专用小型自动挡载客汽车准驾车型外，驾驶证申请人应当符合：双下肢健全且运动功能应正常，下肢不等长度不得大于________。", "options": ["A、2厘米", "B、3厘米", "C、5厘米", "D、7厘米"], "answer": "C", "type": "choice"}, {"id": 1698, "section": "第四部分 驾驶证业务知识", "header": "1.1.13", "question": "申请无轨电车或者有轨电车准驾车型的，两眼裸视力或者矫正视力应达到对数视力表________以上。", "options": ["A、4.9", "B、5.0", "C、5.1", "D、5.2"], "answer": "B", "type": "choice"}, {"id": 1699, "section": "第四部分 驾驶证业务知识", "header": "1.1.14", "question": "除单眼视力障碍外，申请小型汽车准驾车型的，两眼裸视力或者矫正视力达到对数视力表________以上。", "options": ["A、4.9", "B、5.0", "C、5.1", "D、5.2"], "answer": "A", "type": "choice"}, {"id": 1700, "section": "第四部分 驾驶证业务知识", "header": "1.1.15", "question": "驾驶证申请人辨色力应无________色盲。", "options": ["A、红蓝", "B、红绿", "C、红黄", "D、红橙"], "answer": "B", "type": "choice"}, {"id": 1701, "section": "第四部分 驾驶证业务知识", "header": "1.1.16", "question": "初次申领机动车驾驶证的，可以申请的准驾车型是________。", "options": ["A、大型客车", "B、重型牵引挂车", "C、城市公交车", "D、中型客车"], "answer": "C", "type": "choice"}, {"id": 1702, "section": "第四部分 驾驶证业务知识", "header": "1.1.17", "question": "不可以通过初次申领直接申请的准驾车型是________。", "options": ["A、城市公交车", "B、重型牵引挂车", "C、无轨电车", "D、大型货车"], "answer": "B", "type": "choice"}, {"id": 1703, "section": "第四部分 驾驶证业务知识", "header": "1.1.18", "question": "________服用依赖性精神药品成瘾尚未戒除的，不得申请机动车驾驶证。", "options": ["A、三年内有", "B、长期", "C、五年内有", "D、一年内有"], "answer": "B", "type": "choice"}, {"id": 1704, "section": "第四部分 驾驶证业务知识", "header": "1.1.19", "question": "造成交通事故后逃逸构成犯罪的，________不得申请机动车驾驶证。", "options": ["A、未满两年", "B、未满三年", "C、未满五年", "D、终生"], "answer": "D", "type": "choice"}, {"id": 1705, "section": "第四部分 驾驶证业务知识", "header": "1.1.20", "question": "驾驶机动车追逐竞驶、超员、超速、违反危险化学品安全管理规定运输危险化学品构成犯罪依法被吊销机动车驾驶证未满________的，不得申请机动车驾驶证。", "options": ["A、两年", "B、三年", "C、五年", "D、十年"], "answer": "C", "type": "choice"}, {"id": 1706, "section": "第四部分 驾驶证业务知识", "header": "1.1.21", "question": "接受全日制驾驶职业教育的学生，申请大型客车、重型牵引挂车准驾车型的，年龄应在_______。", "options": ["A、20周岁以上，50周岁以下", "B、18周岁以上，50周岁以下", "C、19周岁以上，60周岁以下", "D、22周岁以上，60周岁以下"], "answer": "C", "type": "choice"}, {"id": 1707, "section": "第四部分 驾驶证业务知识", "header": "1.1.22", "question": "除正在接受全日制驾驶职业教育的学生外，申请增加重型牵引挂车准驾车型的，应当取得驾驶中型客车或大型货车准驾车型资格________以上，并在申请前最近连续两个记分周期内没有满分记录。", "options": ["A、一年", "B、两年", "C、三年", "D、五年"], "answer": "B", "type": "choice"}, {"id": 1708, "section": "第四部分 驾驶证业务知识", "header": "1.1.23", "question": "申请增加重型牵引挂车准驾车型的，应当取得驾驶大型客车准驾车型资格________以上，并在申请前最近连续两个记分周期内没有满分记录。", "options": ["A、一年", "B、两年", "C、三年", "D、五年"], "answer": "A", "type": "choice"}, {"id": 1709, "section": "第四部分 驾驶证业务知识", "header": "1.1.24", "question": "除正在接受全日制驾驶职业教育的学生外，申请增加大型客车准驾车型的，应当取得驾驶城市公交车、中型客车________以上或者大型货车准驾车型资格________以上，并在申请前最近连续三个记分周期内没有满分记录。", "options": ["A、一年  两年", "B、两年  三年", "C、三年  三年", "D、五年  五年"], "answer": "B", "type": "choice"}, {"id": 1710, "section": "第四部分 驾驶证业务知识", "header": "1.1.25", "question": "正在接受全日制驾驶职业教育的学生，_____可以申请增加大型客车、重型牵引挂车准驾车型。", "options": ["A、已在校取得驾驶小型汽车准驾车型资格", "B、本记分周期没有记满12分记录", "C、申请前最近一个记分周期内没有记满12分记录", "D、以上均需要"], "answer": "D", "type": "choice"}, {"id": 1711, "section": "第四部分 驾驶证业务知识", "header": "1.1.26", "question": "单眼视力障碍，优眼裸视力或者矫正视力达到对数视力表5.0以上，且水平视野达到_____度的，可以申请小型汽车准驾车型的机动车驾驶证。", "options": ["A、90", "B、120", "C、150", "D、180"], "answer": "C", "type": "choice"}, {"id": 1712, "section": "第四部分 驾驶证业务知识", "header": "1.1.27", "question": "申请小型自动挡汽车准驾车型的，身高_____。", "options": ["A、应在150厘米以上", "B、应在155厘米以上", "C、无要求", "D、应在145厘米以上"], "answer": "C", "type": "choice"}, {"id": 1713, "section": "第四部分 驾驶证业务知识", "header": "1.1.28", "question": "除单眼视力障碍外，申请小型自动挡汽车准驾车型的，两眼裸视力或者矫正视力应达到对数视力表_____以上。", "options": ["A、4.8", "B、4.9", "C、5.0", "D、无要求"], "answer": "B", "type": "choice"}, {"id": 1714, "section": "第四部分 驾驶证业务知识", "header": "1.1.29", "question": "申请大型客车、大型货车准驾车型的，两眼裸视力或者矫正视力应达到对数视力表_____以上。", "options": ["A、4.9", "B、5.0", "C、5.1", "D、5.2"], "answer": "B", "type": "choice"}, {"id": 1715, "section": "第四部分 驾驶证业务知识", "header": "1.1.30", "question": "有听力障碍但佩戴助听设备能够达到两耳分别距音叉50厘米能辨别声源方向条件的，_____机动车驾驶证。", "options": ["A、可以申请", "B、仅可以申请小型汽车、小型自动挡汽车准驾车型", "C、仅可以申请小型汽车准驾车型", "D、仅可以申请小型自动挡汽车准驾车型"], "answer": "B", "type": "choice"}, {"id": 1716, "section": "第四部分 驾驶证业务知识", "header": "1.1.31", "question": "_____，可以申请残疾人专用小型自动挡载客汽车准驾车型。", "options": ["A、双下肢不等长度未大于5厘米的", "B、左下肢缺失或者丧失运动功能的", "C、右下肢、双下肢缺失或者丧失运动功能但能够自主坐立的", "D、右下肢、双下肢缺失或者丧失运动功能但能够自主坐立，且上肢符合规定的"], "answer": "D", "type": "choice"}, {"id": 1717, "section": "第四部分 驾驶证业务知识", "header": "1.1.32", "question": "单独左下肢缺失或者丧失运动功能，但右下肢正常的，_____机动车驾驶证。", "options": ["A、不可以申请", "B、可以申请残疾人专用小型自动挡载客汽车准驾车型", "C、可以申请小型自动挡汽车准驾车型", "D、可以申请小型汽车、小型自动挡汽车准驾车型"], "answer": "C", "type": "choice"}, {"id": 1718, "section": "第四部分 驾驶证业务知识", "header": "1.1.33", "question": "重型牵引牵引挂车对应的准驾车型是____。", "options": ["A、A1", "B、A2", "C、B2", "D、C6"], "answer": "B", "type": "choice"}, {"id": 1719, "section": "第四部分 驾驶证业务知识", "header": "1.1.34", "question": "轻型牵引牵引挂车对应的准驾车型是____。", "options": ["A、A1", "B、A2", "C、B2", "D、C6"], "answer": "D", "type": "choice"}, {"id": 1720, "section": "第四部分 驾驶证业务知识", "header": "1.1.36", "question": "取得境外相应准驾车型机动车驾驶证_____以上,可以持境外机动车驾驶证申请的准驾车型为大型客车、重型牵引挂车、中型客车机动车驾驶证。", "options": ["A、一年", "B、两年", "C、三年", "D、五年"], "answer": "B", "type": "choice"}, {"id": 1721, "section": "第四部分 驾驶证业务知识", "header": "1.1.37", "question": "持有境外机动车驾驶证，需要临时驾驶机动车的，应当按规定向车辆管理所申领临时机动车驾驶许可。对入境短期停留的，可以申领有效期为_____的临时机动车驾驶证。", "options": ["A、三个月", "B、六个月", "C、一年", "D、六年"], "answer": "A", "type": "choice"}, {"id": 1722, "section": "第四部分 驾驶证业务知识", "header": "1.1.38", "question": "持军队、武装警察部队机动车驾驶证的人申请机动车驾驶证，应当确认申请信息，并提交以下证明、凭证：", "options": ["A、申请人的身份证明。属于复员、转业、退伍的人员，还应当提交军队、武装警察部队核发的复员、转业、退伍证明", "B、医疗机构出具的有关身体条件的证明", "C、军队、武装警察部队机动车驾驶证", "D、以上均需要"], "answer": "D", "type": "choice"}, {"id": 1723, "section": "第四部分 驾驶证业务知识", "header": "1.1.39", "question": "已持有大型客车、城市公交车、中型客车、大型货车、小型汽车、小型自动挡汽车准驾车型驾驶证申请增加轻型牵引挂车准驾车型的，应当考试_____。 科目二和科目三安全文明驾驶常识", "options": ["B、科目一、科目二、科目三", "C、科目二、科目三", "D、科目一、科目三"], "answer": "A", "type": "choice"}, {"id": 1724, "section": "第四部分 驾驶证业务知识", "header": "1.1.40", "question": "已持有轻便摩托车准驾车型驾驶证申请增加普通三轮摩托车、普通二轮摩托车准驾车型的，或者持有普通二轮摩托车驾驶证申请增加普通三轮摩托车准驾车型的，应当考试_____。", "options": ["A、科目二和科目三", "B、科目一", "C、科目二", "D、科目三"], "answer": "A", "type": "choice"}, {"id": 1725, "section": "第四部分 驾驶证业务知识", "header": "1.1.41", "question": "已持有大型客车、重型牵引挂车、城市公交车、中型客车、大型货车、小型汽车、小型自动挡汽车准驾车型驾驶证的机动车驾驶人身体条件发生变化，不符合所持机动车驾驶证准驾车型的条件，但符合残疾人专用小型自动挡载客汽车准驾车型条件，申请变更的，应当考试_____。", "options": ["A、科目二和科目三", "B、科目一", "C、科目二", "D、科目三"], "answer": "A", "type": "choice"}, {"id": 1726, "section": "第四部分 驾驶证业务知识", "header": "1.1.42", "question": "_____有吸食、注射毒品行为或者解除强制隔离戒毒措施未满_____，或者长期服用依赖性精神药品成瘾尚未戒除的，不得申请机动车驾驶证。", "options": ["A、一年内  一年", "B、三年内  三年", "C、五年内  五年", "D、长期  十年"], "answer": "B", "type": "choice"}, {"id": 1727, "section": "第四部分 驾驶证业务知识", "header": "1.1.43", "question": "醉酒驾驶机动车或者饮酒后驾驶营运机动车依法被吊销机动车驾驶证的，_____不得申请机动车驾驶证。", "options": ["A、未满二年", "B、未满三年", "C、未满五年", "D、终生"], "answer": "C", "type": "choice"}, {"id": 1728, "section": "第四部分 驾驶证业务知识", "header": "1.1.44", "question": "_____，不得申请大型客车、重型牵引挂车、城市公交车、中型客车、大型货车准驾车型。", "options": ["A、被吊销或者撤销机动车驾驶证未满二年的", "B、被吊销或者撤销机动车驾驶证未满三年的", "C、被吊销或者撤销机动车驾驶证未满十年的", "D、被吊销未满二年或者被撤销未满三年的"], "answer": "C", "type": "choice"}, {"id": 1729, "section": "第四部分 驾驶证业务知识", "header": "1.1.45", "question": "申请驾驶证的人员应符合上肢双手拇指健全，每只手其他手指必须有三指健全，肢体和手指运动功能正常的身体条件。但手指末节残缺或者左手有三指健全，且双手手掌完整的，_____准驾车型的机动车驾驶证。", "options": ["A、仅可以申请残疾人专用小型自动挡载客汽车", "B、仅可以申请小型自动挡汽车", "C、仅可以申请小型汽车、小型自动挡汽车", "D、仅可以申请小型汽车、小型自动挡汽车、低速载货汽车、三轮汽车"], "answer": "D", "type": "choice"}, {"id": 1730, "section": "第四部分 驾驶证业务知识", "header": "1.1.46", "question": "申请_____准驾车型的，身高应在155厘米以上。", "options": ["A、大型客车、重型重型牵引挂车、城市公交车、大型货车、无轨电车", "B、大型客车、重型重型牵引挂车、城市公交车、中型客车、大型货车", "C、大型客车、重型重型牵引挂车、城市公交车、大型货车、无轨电车、有轨电车", "D、大型客车、重型重型牵引挂车、中型客车、大型货车"], "answer": "A", "type": "choice"}, {"id": 1731, "section": "第四部分 驾驶证业务知识", "header": "1.1.47", "question": "未取得机动车驾驶证醉酒驾驶营运机动车依法被吊销机动车驾驶证的，_____申请机动车驾驶证。", "options": ["A、可以不受时间限制", "B、未满五年的不可以", "C、未满十年的不可以", "D、不可以"], "answer": "C", "type": "choice"}, {"id": 1732, "section": "第四部分 驾驶证业务知识", "header": "1.1.48", "question": "对于符合机动车驾驶证申请条件的，车辆管理所应当按规定安排预约考试；不需要考试的，_____内核发机动车驾驶证。", "options": ["A、当日", "B、一日", "C、二日", "D、三日"], "answer": "B", "type": "choice"}, {"id": 1733, "section": "第四部分 驾驶证业务知识", "header": "1.1.49", "question": "车辆管理所对申请人的_____有疑义的，可以对实质内容进行调查核实。", "options": ["A、申请条件", "B、提交的材料", "C、申告的事项", "D、以上均可以"], "answer": "D", "type": "choice"}, {"id": 1734, "section": "第四部分 驾驶证业务知识", "header": "1.1.50", "question": "车辆管理所在受理机动车驾驶证申请时，对不符合申请条件或者受理申请后经审查不符合法律、法规和规章规定的，应当出具_____，告知申请人不予受理、不予许可的理由。", "options": ["A、《不予受理/许可申请决定书》", "B、一次书面告知书", "C、《不予办理决定书》", "D、《不予受理/批准申请决定书》"], "answer": "A", "type": "choice"}, {"id": 1735, "section": "第四部分 驾驶证业务知识", "header": "1.2.1", "question": "有器质性心脏病、癫痫病、美尼尔氏症、眩晕症、癔病、震颤麻痹、精神病、痴呆以及影响肢体活动的神经系统疾病等妨碍安全驾驶疾病的, 不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1736, "section": "第四部分 驾驶证业务知识", "header": "1.2.2", "question": "申请人在场地和道路上学习驾驶，应当按规定取得学习驾驶证明。学习驾驶证明的有效期为三年，但有效期截止日期不得超过申请年龄条件上限。申请人应当在有效期内完成科目二和科目三考试。未在有效期内完成考试的，已考试合格的科目成绩作废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1737, "section": "第四部分 驾驶证业务知识", "header": "1.2.3", "question": "申请增加重型牵引挂车准驾车型的，应当取得驾驶中型客车或者大型货车准驾车型资格三年以上，并在申请前最近连续两个记分周期内没有满分记录。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1738, "section": "第四部分 驾驶证业务知识", "header": "1.2.4", "question": "已取得驾驶城市公交车、大型货车准驾车型资格一年以上，并在申请前最近一个记分周期内没有满分记录，可以申请增加中型客车准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1739, "section": "第四部分 驾驶证业务知识", "header": "1.2.5", "question": "申请大型客车、重型牵引挂车、城市公交车、中型客车、大型货车准驾车型的，不得有在造成人员死亡的交通事故中承担同等以上责任的记录。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1740, "section": "第四部分 驾驶证业务知识", "header": "1.2.6", "question": "驾驶许可依法被撤销满二年后，可以申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1741, "section": "第四部分 驾驶证业务知识", "header": "1.2.7", "question": "单眼视力障碍，只要优眼裸视力或者矫正视力达到对数视力表5.0以上，就可以申请小型汽车、小型自动挡汽车、低速载货汽车、三轮汽车、残疾人专用小型自动挡载客汽车准驾车型的机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1742, "section": "第四部分 驾驶证业务知识", "header": "1.2.8", "question": "初次申领机动驾驶证的，可以申请中型客车准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1743, "section": "第四部分 驾驶证业务知识", "header": "1.2.9", "question": "初次申领机动驾驶证的，可以申请大型货车准驾车型。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1744, "section": "第四部分 驾驶证业务知识", "header": "1.2.10", "question": "有间歇性精神病的人，在精神正常时，可以申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1745, "section": "第四部分 驾驶证业务知识", "header": "1.2.11", "question": "申请摩托车准驾车型的，对申请人无身高要求。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1746, "section": "第四部分 驾驶证业务知识", "header": "1.2.12", "question": "眼睛有色弱的人，不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1747, "section": "第四部分 驾驶证业务知识", "header": "1.2.13", "question": "眼睛全色盲的人，不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1748, "section": "第四部分 驾驶证业务知识", "header": "1.2.14", "question": "申请机动车驾驶证的人，躯干、颈部应当无运动功能障碍。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1749, "section": "第四部分 驾驶证业务知识", "header": "1.2.15", "question": "持有境外机动车驾驶证，需要临时驾驶机动车的，应当按规定向车辆管理所申领临时机动车驾驶许可。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1750, "section": "第四部分 驾驶证业务知识", "header": "1.2.16", "question": "一只手掌缺失，另一只手拇指健全，其他手指有两指健全，上肢和手指运动功能正常，且下肢符合规定的，可以申请残疾人专用小型自动挡载客汽车准驾车型的机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1751, "section": "第四部分 驾驶证业务知识", "header": "1.2.17", "question": "持有军队、武装警察部队机动车驾驶证，或者持有境外机动车驾驶证，符合《机动车驾驶证申领和使用规定》的申请条件，应当申请对应准驾车型的机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1752, "section": "第四部分 驾驶证业务知识", "header": "1.2.18", "question": "申领机动车驾驶证的人，在户籍所在地以外居住的，可以在居住地提出申请。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1753, "section": "第四部分 驾驶证业务知识", "header": "1.2.19", "question": "左手仅拇指末节残缺的，不可以申请小型汽车、小型自动挡汽车、低速载货汽车、三轮汽车准驾车型的机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1754, "section": "第四部分 驾驶证业务知识", "header": "1.2.20", "question": "有醉酒后驾驶机动车记录的，不得申请大型客车、重型重型牵引挂车、城市公交车、中型客车、大型货车准驾车型机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1755, "section": "第四部分 驾驶证业务知识", "header": "1.2.21", "question": "未取得机动车驾驶证驾驶机动车，有造成交通事故后逃逸构成犯罪记录的，不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1756, "section": "第四部分 驾驶证业务知识", "header": "1.2.22", "question": "未取得机动车驾驶证饮酒后或者醉酒驾驶机动车发生重大交通事故构成犯罪的，不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1757, "section": "第四部分 驾驶证业务知识", "header": "1.2.23", "question": "有器质性心脏病、癫痫病、美尼尔氏症、眩晕症、癔病、震颤麻痹、精神病、痴呆以及影响肢体活动的神经系统疾病等妨碍安全驾驶疾病的，不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1758, "section": "第四部分 驾驶证业务知识", "header": "1.2.24", "question": "饮酒后或者醉酒驾驶机动车发生重大交通事故构成犯罪的，不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1759, "section": "第四部分 驾驶证业务知识", "header": "1.2.25", "question": "未取得机动车驾驶证醉酒驾驶机动车或者饮酒后驾驶营运机动车，不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1760, "section": "第四部分 驾驶证业务知识", "header": "1.2.26", "question": "持有国际驾驶证，符合《机动车驾驶证申领和使用规定》的申请条件，可以申请相应准驾车型的机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1761, "section": "第四部分 驾驶证业务知识", "header": "1.2.27", "question": "有饮酒后驾驶机动车记录的，不得申请大型客车、重型重型牵引挂车、城市公交车、中型客车、大型货车准驾车型机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1762, "section": "第四部分 驾驶证业务知识", "header": "1.2.28", "question": "有醉酒驾驶机动车记录的，不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1763, "section": "第四部分 驾驶证业务知识", "header": "1.2.29", "question": "在户籍所在地以外居住的，不可以在居住地申请大型客车、重型牵引挂车、城市公交车、中型客车、大型货车准驾车型的机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1764, "section": "第四部分 驾驶证业务知识", "header": "1.2.30", "question": "接受全日制驾驶职业教育的学生，申请增加大型客车、重型重型牵引挂车准驾车型的，应当在接受教育地提出申请。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1765, "section": "第四部分 驾驶证业务知识", "header": "1.2.31", "question": "城市公交车准驾车型不可以申请增加大型客车准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1766, "section": "第四部分 驾驶证业务知识", "header": "1.2.32", "question": "临时入境机动车驾驶人的临时机动车驾驶许可在一个记分周期内累积记分达到12分，未按规定参加道路交通安全法律、法规和相关知识学习、考试的，不得申请机动车驾驶证，但可以再次申请临时机动车驾驶许可。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1767, "section": "第四部分 驾驶证业务知识", "header": "1.2.33", "question": "申请增加准驾车型的，申领人可以向所持机动车驾驶证核发地或者核发地以外的车辆管理所提出申请。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1768, "section": "第四部分 驾驶证业务知识", "header": "1.2.34", "question": "机动车驾驶人在一个记分周期累积记分满12分的，大型客车、重型牵引挂车、城市公交车、中型客车、大型货车驾驶人应当参加为期三十天的道路交通安全法律、法规和相关知识学习。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1769, "section": "第四部分 驾驶证业务知识", "header": "1.2.35", "question": "一年内有代替他人参加机动车驾驶人考试行为的，不得申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1770, "section": "第四部分 驾驶证业务知识", "header": "1.2.36", "question": "持境外机动车驾驶证申请机动车驾驶证的，应当考试科目一。申请准驾车型为大型客车、重型重型牵引挂车、城市公交车、中型客车、大型货车机动车驾驶证的，应当考试科目一、科目三。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1771, "section": "第四部分 驾驶证业务知识", "header": "1.2.37", "question": "科目二考试满分为100分，考试成绩达到80分的为合格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1772, "section": "第四部分 驾驶证业务知识", "header": "1.2.38", "question": "审验教育可以采取现场教育或者网络教育开展。但属于校车驾驶人及一个记分周期内累积记分达到9至11分的大中型客货车驾驶人，应当采用现场教育形式开展审验教育。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1773, "section": "第四部分 驾驶证业务知识", "header": "1.2.39", "question": "机动车驾驶人处理完交通违法行为记录后累积记分未满12分，参加公安机关交通管理部门组织的交通安全教育并达到规定要求的，可以申请在机动车驾驶人现有累积记分分值中扣减记分。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1774, "section": "第四部分 驾驶证业务知识", "header": "1.2.40", "question": "初次申领机动车驾驶证的，可以申请轻型牵引挂车准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1775, "section": "第四部分 驾驶证业务知识", "header": "1.2.41", "question": "申请机动车驾驶证，应当确认申请信息，并提交申请人的身份证明和医疗机构出具的有关身体条件的证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1776, "section": "第四部分 驾驶证业务知识", "header": "1.2.42", "question": "持境外机动车驾驶证的人申请机动车驾驶证，所持机动车驾驶证属于非 中文表述的，还应当提供指定的翻译机构出具或者公证机构公证的中文 翻译文本。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1777, "section": "第四部分 驾驶证业务知识", "header": "1.2.43", "question": "县级公安机关交通管理部门车辆管理所不可以办理境外换证业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1778, "section": "第四部分 驾驶证业务知识", "header": "1.2.44", "question": "在最近三个记分周期内，机动车驾驶人参加接受交通安全教育扣减交通违法行为记分或者机动车驾驶人满分教育、审验教育时，有弄虚作假、冒名顶替记录的，公安机关交通管理部门不予受理申请接受交通安全教育扣减交通违法行为记分。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1779, "section": "第四部分 驾驶证业务知识", "header": "1.2.45", "question": "申请机动车驾驶证的人，符合规定要求的驾驶许可条件，因准驾车型资 格被注销的，不可以按照规定直接申请相应准驾车型的机动车驾驶证考 试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1780, "section": "第四部分 驾驶证业务知识", "header": "2.1.1", "question": "办理机动车驾驶证注销业务时，属于机动车驾驶证被吊销的，档案管理岗审核并收存________。", "options": ["A、《公安交通管理转递通知书》", "B、《公安交通管理撤销决定书》", "C、《身体条件证明》原件", "D、身份证明复印件"], "answer": "A", "type": "choice"}, {"id": 1781, "section": "第四部分 驾驶证业务知识", "header": "2.1.2", "question": "办理申请注销机动车驾驶证业务时，不属于受理岗审核事项的是________。", "options": ["A、申请人的身份证明", "B、机动车驾驶证", "C、《机动车驾驶证申请表》", "D、《身体条件证明》"], "answer": "D", "type": "choice"}, {"id": 1782, "section": "第四部分 驾驶证业务知识", "header": "2.1.3", "question": "办理机动车驾驶证注销业务时，属于机动车驾驶证被撤销的，档案管理岗审核并收存________。", "options": ["A、身份证明复印件", "B、《公安交通管理撤销决定书》", "C、《公安交通管理转递通知书》", "D、《身体条件证明》原件"], "answer": "B", "type": "choice"}, {"id": 1783, "section": "第四部分 驾驶证业务知识", "header": "2.1.4", "question": "办理初次申领机动车驾驶证业务时，不属于受理岗审核事项的是________。", "options": ["A、《机动车驾驶证申请表》", "B、申请人的身份证明", "C、所在单位或相关部门出具的准予申请驾驶证的证明", "D、《身体条件证明》"], "answer": "C", "type": "choice"}, {"id": 1784, "section": "第四部分 驾驶证业务知识", "header": "2.1.5", "question": "办理增加准驾车型申领业务，在核发机动车驾驶证时，应收存________。", "options": ["A、预约考试凭证原件", "B、申请人的身份证明复印件", "C、原机动车驾驶证原件", "D、原机动车驾驶证复印件"], "answer": "C", "type": "choice"}, {"id": 1785, "section": "第四部分 驾驶证业务知识", "header": "2.1.6", "question": "办理持军队、武装警察部队机动车驾驶证申领机动车驾驶证业务时，申请人属于复员、退伍、转业的，除应收存申请人的身份证明（复印件或电子影像）外，还应收存________。", "options": ["A、《学习驾驶证明》原件", "B、团级以上单位出具的本人住所证明原件", "C、复员、退伍、转业证明复印件", "D、军队、武装警察部队机动车驾驶证复印件"], "answer": "C", "type": "choice"}, {"id": 1786, "section": "第四部分 驾驶证业务知识", "header": "2.1.7", "question": "办理持军队、武装警察部队机动车驾驶证申领机动车驾驶证业务时，不属于受理岗审核事项的是________。", "options": ["A、确认初次领取军队、武装警察部队机动车驾驶证时申请人已年满18周岁", "B、《身体条件证明》", "C、军队、武装警察部队机动车驾驶证档案", "D、军队、武装警察部队机动车驾驶证"], "answer": "C", "type": "choice"}, {"id": 1787, "section": "第四部分 驾驶证业务知识", "header": "2.1.8", "question": "办理持境外机动车驾驶证申请机动车驾驶证业务时，不属于受理岗审核事项的是________。", "options": ["A、境外机动车驾驶证", "B、《身体条件证明》", "C、身份证明", "D、驾驶信用记录"], "answer": "D", "type": "choice"}, {"id": 1788, "section": "第四部分 驾驶证业务知识", "header": "2.1.9", "question": "办理持境外机动车驾驶证申请机动车驾驶证业务时，不收存________。", "options": ["A、《机动车驾驶证申请表》", "B、境外机动车驾驶证复印件", "C、中文翻译文本原件", "D、境外机动车驾驶证原件"], "answer": "D", "type": "choice"}, {"id": 1789, "section": "第四部分 驾驶证业务知识", "header": "2.1.10", "question": "办理小型汽车临时驾驶许可申领业务时，不属于受理岗审核事项的是________。", "options": ["A、属于驾驶自带临时入境机动车的，审核其自带临时入境机动车号牌、行驶证", "B、通过计算机管理系统，对申请人以前的入境记录进行核查，发现有道路交通违法行为和交通事故未处理完毕的，告知其处理完毕后再申请", "C、参加有组织的比赛以及其他交往活动的，审核中国相关主管部门出具的证明", "D、《身体条件证明》"], "answer": "D", "type": "choice"}, {"id": 1790, "section": "第四部分 驾驶证业务知识", "header": "2.1.11", "question": "接受全日制驾驶职业教育的在校学生，申请增加大型客车、重型重型牵引挂车准驾车型的，应当审核________。", "options": ["A、学校出具的学籍证明", "B、教育部门出具的学籍证明", "C、学籍卡片", "D、学生证"], "answer": "A", "type": "choice"}, {"id": 1791, "section": "第四部分 驾驶证业务知识", "header": "2.1.12", "question": "办理机动车驾驶证遗失补证业务时，不属于受理岗审核事项的是________。", "options": ["A、通过计算机管理系统核查申请人不具有记满12分、逾期未审验、被扣押、扣留、暂扣、注销、吊销或者撤销机动车驾驶证的情形", "B、《机动车驾驶证申请表》", "C、公安机关报案证明", "D、身份证明"], "answer": "C", "type": "choice"}, {"id": 1792, "section": "第四部分 驾驶证业务知识", "header": "2.1.13", "question": "办理满分考试业务时，受理岗审核________、公安机关交通管理部门出具的接受教育凭证。", "options": ["A、《机动车驾驶证申请表》", "B、《身体条件证明》", "C、身份证明", "D、机动车驾驶证"], "answer": "C", "type": "choice"}, {"id": 1793, "section": "第四部分 驾驶证业务知识", "header": "2.1.14", "question": "办理持军队、武装警察部队机动车驾驶证申请机动车驾驶证业务时，属于________的，收存军队、武装警察部队机动车驾驶证复印件。", "options": ["A、复员的", "B、退伍的", "C、转业的", "D、现役的"], "answer": "D", "type": "choice"}, {"id": 1794, "section": "第四部分 驾驶证业务知识", "header": "2.1.15", "question": "办理________业务时，受理岗审核申请人提交的《身体条件证明》。", "options": ["A、因身体条件变化降低准驾车型换证", "B、自愿降低准驾车型换证", "C、机动车驾驶人信息发生变化换证", "D、机动车驾驶证损毁换证"], "answer": "A", "type": "choice"}, {"id": 1795, "section": "第四部分 驾驶证业务知识", "header": "2.1.16", "question": "办理________业务时，受理岗审核申请人提交的《身体条件证明》。", "options": ["A、达到规定年龄换证", "B、自愿降低准驾车型换证", "C、机动车驾驶人信息发生变化换证", "D、机动车驾驶证损毁换证"], "answer": "A", "type": "choice"}, {"id": 1796, "section": "第四部分 驾驶证业务知识", "header": "2.1.17", "question": "办理持军队、武装警察部队机动车驾驶证申领机动车驾驶证业务时，受理岗审核申请人提交的《机动车驾驶证申请表》、身份证明、军队或武装警察部队机动车驾驶证和________。", "options": ["A、人武部证明", "B、《身体条件证明》", "C、军队或武装警察部队机动车驾驶证档案", "D、部队团级以上单位出具的同意申请的证明"], "answer": "B", "type": "choice"}, {"id": 1797, "section": "第四部分 驾驶证业务知识", "header": "2.1.18", "question": "办理机动车驾驶证业务时，可作为居民的身份证明的是________。", "options": ["A、《临时居民身份证》", "B、公安机关核发的居住证明", "C、公安机关的户籍证明", "D、《居民户口薄》"], "answer": "A", "type": "choice"}, {"id": 1798, "section": "第四部分 驾驶证业务知识", "header": "2.1.19", "question": "不符合机动车驾驶证相片要求的是_____。", "options": ["A、申请人申请机动车驾驶证前6个月内", "B、白色背景", "C、直边正面免冠彩色本人单人半身证件照", "D、着制式服装"], "answer": "D", "type": "choice"}, {"id": 1799, "section": "第四部分 驾驶证业务知识", "header": "2.1.20", "question": "经计算机管理系统核查，申请人具有交通违法行为或者交通事故未处理完毕的情形，不予办理____。", "options": ["A、有效期满换证", "B、达到规定年龄换证", "C、机动车驾驶人信息发生变化换证", "D、机动车驾驶证损毁换证"], "answer": "A", "type": "choice"}, {"id": 1800, "section": "第四部分 驾驶证业务知识", "header": "2.1.21", "question": "经计算机管理系统核查，申请人具有交通违法行为或者交通事故未处理完毕的情形，可以办理____。", "options": ["A、有效期满换证", "B、转入换证", "C、补证", "D、审验"], "answer": "C", "type": "choice"}, {"id": 1801, "section": "第四部分 驾驶证业务知识", "header": "2.1.22", "question": "申请取得校车驾驶资格，申请人不需要提交的是____。", "options": ["A、申请人的身份证明", "B、所在地县级公安机关出具的无犯罪、吸毒行为记录证明", "C、医疗机构出具的有关身体条件证明", "D、机动车驾驶证"], "answer": "B", "type": "choice"}, {"id": 1802, "section": "第四部分 驾驶证业务知识", "header": "2.1.23", "question": "2017年1月1日起办理军队驾驶证换证业务，应____。", "options": ["A、对退役军人持新军队驾驶证申请换证的，要审核、收存《中国人民解放军车辆驾驶证申领表》", "B、对退役军人持军队驾驶证申请换证的，要审核、收存中国人民解放军车辆驾驶证档案", "C、对退役军人持新军队驾驶证申请换证的，要审核、收存《军车驾驶员基本信息登记表》", "D、对军人持新军队驾驶证申请换证的，要审核、收存《军车驾驶员基本信息登记表》"], "answer": "C", "type": "choice"}, {"id": 1803, "section": "第四部分 驾驶证业务知识", "header": "2.1.24", "question": "对一个记分周期内有记分的大中型客货车驾驶人，车辆管理所办理审验业务时，受理岗不审核____。", "options": ["A、公安机关交通管理部门出具的接受教育的凭证", "B、《身体条件证明》", "C、机动车驾驶证", "D、《机动车驾驶人身体情况申报表》"], "answer": "B", "type": "choice"}, {"id": 1804, "section": "第四部分 驾驶证业务知识", "header": "2.1.25", "question": "办理道路运输企业聘用的机动车驾驶人备案业务时，受理岗不审核____。", "options": ["A、身份证明", "B、从业单位出具的证明", "C、《身体条件证明》", "D、机动车驾驶证"], "answer": "C", "type": "choice"}, {"id": 1805, "section": "第四部分 驾驶证业务知识", "header": "2.1.26", "question": "不可以直接按规定申请相应准驾车型机动车驾驶证考试情形是____。", "options": ["A、原机动车驾驶证因吸毒被注销的", "B、原机动车驾驶证由本人申请注销的", "C、原机动车驾驶证因身体条件暂时不符合规定被注销的", "D、原机动车驾驶证被吊销或者被撤销的"], "answer": "D", "type": "choice"}, {"id": 1806, "section": "第四部分 驾驶证业务知识", "header": "2.1.27", "question": "车辆管理所办理驾驶证转入换证业务，下列哪项材料不需要存入机动车驾驶证档案？", "options": ["A、机动车驾驶证原件", "B、机动车驾驶证申请表", "C、机动车驾驶人身体情况申报表", "D、身体条件证明"], "answer": "D", "type": "choice"}, {"id": 1807, "section": "第四部分 驾驶证业务知识", "header": "2.1.28", "question": "以下机动车驾驶证审验内容描述正确的是：", "options": ["A、道路交通安全违法行为、交通事故处理情况；", "B、身体条件情况；", "C、年龄在70周岁以上的机动车驾驶人，还应当按照规定进行记忆力、判断力、反应力等能力测试。", "D、以上都正确"], "answer": "D", "type": "choice"}, {"id": 1808, "section": "第四部分 驾驶证业务知识", "header": "2.1.29", "question": "车辆管理所办理机动车驾驶证业务时，_____、资料审查，应当由民警承担或者由文职、聘用人员按照规定在民警监督下执行。", "options": ["A、业务导办", "B、业务受理", "C、制作证件", "D、档案整理"], "answer": "B", "type": "choice"}, {"id": 1809, "section": "第四部分 驾驶证业务知识", "header": "2.1.30", "question": "机动车驾驶人申请取得校车驾驶资格，应当向县级或者设区的市级公安机关交通管理部门提出申请，确认申请信息，并提交____。", "options": ["A、申请人的身份证明", "B、机动车驾驶证", "C、医疗机构出具的有关身体条件的证明", "D、以上均需要"], "answer": "D", "type": "choice"}, {"id": 1810, "section": "第四部分 驾驶证业务知识", "header": "2.1.31", "question": "香港、澳门特别行政区居民的身份证明，是____。", "options": ["A、港澳居民居住证", "B、港澳居民来往内地通行证以及公安机关出具的住宿登记证明", "C、外交部核发的中华人民共和国旅行证以及公安机关出具的住宿登记 证明", "D、以上均是"], "answer": "D", "type": "choice"}, {"id": 1811, "section": "第四部分 驾驶证业务知识", "header": "2.1.32", "question": "台湾地区居民的身份证明，是____。", "options": ["A、台湾居民居住证", "B、公安机关核发的五年有效的台湾居民来往大陆通行证以及公安机关 出具的住宿登记证明", "C、外交部核发的中华人民共和国旅行证以及公安机关出具的住宿登记 证明", "D、以上均是"], "answer": "D", "type": "choice"}, {"id": 1812, "section": "第四部分 驾驶证业务知识", "header": "2.2.1", "question": "现役军人（含武警）的身份证明，是《居民身份证》或者《临时居民身份证》。在未办理《居民身份证》前，是军队有关部门核发的《军官证》《文职干部证》《士兵证》《离休证》《退休证》等有效军人身份证件。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1813, "section": "第四部分 驾驶证业务知识", "header": "2.2.2", "question": "《机动车驾驶证申领和使用规定》中外国人的身份证明，是指其入境时所持有的护照或者其他旅行证件、居（停）留期为六个月以上的有效签证或者停留、居留证件，以及公安机关核发的住宿登记证明；", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1814, "section": "第四部分 驾驶证业务知识", "header": "2.2.3", "question": "外国驻华使馆、领馆人员及国际组织驻华代表机构人员的身份证明，是外交部核发的有效身份证件。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1815, "section": "第四部分 驾驶证业务知识", "header": "2.2.4", "question": "办理持军队、武装警察部队机动车驾驶证申领机动车驾驶证时，属于复员、退伍、转业的，应当收存军队、武装警察部队机动车驾驶证原件和复员、退伍、转业证明复印件。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1816, "section": "第四部分 驾驶证业务知识", "header": "2.2.5", "question": "外国驻华使馆、领馆人员及国际组织驻华代表机构人员申请机动车驾驶证的，应当按照外交对等原则执行。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1817, "section": "第四部分 驾驶证业务知识", "header": "2.2.6", "question": "办理持境外机动车驾驶证申请机动车驾驶证业务时，申请人为外国驻华使馆、领馆人员及国际组织驻华代表机构人员，受理岗不审核《身体条件证明》。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1818, "section": "第四部分 驾驶证业务知识", "header": "2.2.7", "question": "持有外国人永久居留证的外国人办理机动车驾驶证业务的，外国人的身份证明是其外国人永久居留身份证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1819, "section": "第四部分 驾驶证业务知识", "header": "2.2.8", "question": "机动车驾驶证申请人必须认真阅读《机动车驾驶证申请表》上\"申告的义务和内容\"，如实申告，并在\"申请人签字\"栏内签字名。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1820, "section": "第四部分 驾驶证业务知识", "header": "2.2.9", "question": "持境外机动车驾驶证申请机动车驾驶证，申请人属于内地居民的，还应当提交申请人的护照或者往来港澳通行证、大陆居民往来台湾通行证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1821, "section": "第四部分 驾驶证业务知识", "header": "2.2.10", "question": "车辆管理所办理持境外机动车驾驶证申领机动车驾驶证业务时，对境外机动车驾驶证属于非中文表述的，受理岗还应当审核其中文翻译文本。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1822, "section": "第四部分 驾驶证业务知识", "header": "2.2.11", "question": "在办理机动车驾驶证业务时，在户籍地以外居住的内地居民，其身份证 明是居民身份证或者临时居民身份证，以及公安机关核发的居住证明或 者居住登记证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1823, "section": "第四部分 驾驶证业务知识", "header": "2.2.12", "question": "定居国外的中国公民的身份证明，是中华人民共和国护照和公安机关出具的住宿登记证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1824, "section": "第四部分 驾驶证业务知识", "header": "2.2.13", "question": "道路交通安全违法行为记分及记满12分后参加学习和考试情况，属于机动车驾驶证审验内容。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1825, "section": "第四部分 驾驶证业务知识", "header": "2.2.14", "question": "持有境外机动车驾驶证的外国人，有居留证件的可以向出具住宿登记证明的公安机关所在地的车辆管理所申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1826, "section": "第四部分 驾驶证业务知识", "header": "2.2.15", "question": "持有境外机动车驾驶证的外国驻华使馆、领馆人员、国际组织驻华代表机构人员应当向使馆、领馆、国际组织驻华代表机构所在地的车辆管理所申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1827, "section": "第四部分 驾驶证业务知识", "header": "2.2.16", "question": "持有境外机动车驾驶证的外国人，没有居留证件但持有有效签证或者停留证件的应当向出具住宿登记证明的公安机关所在地的车辆管理所申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1828, "section": "第四部分 驾驶证业务知识", "header": "2.2.17", "question": "车辆管理所办理审验业务时，申请人机动车驾驶证遗失的，受理岗需审核身份证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1829, "section": "第四部分 驾驶证业务知识", "header": "2.2.18", "question": "办理机动车驾驶人信息变更备案业务,属于从业单位发生变更的，车辆管理所还应当核实并收存从业单位出具的证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1830, "section": "第四部分 驾驶证业务知识", "header": "2.2.19", "question": "每个科目的考试成绩单应当有申请人和考试员的签名。未签名的不得核发机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1831, "section": "第四部分 驾驶证业务知识", "header": "2.2.20", "question": "办理初次申领机动车驾驶证业务时，受理岗应当确认申请人年龄、身体条件、申请的准驾车型等符合规定。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1832, "section": "第四部分 驾驶证业务知识", "header": "2.2.21", "question": "办理临时机动车驾驶许可申领业务时，申请人属于参加有组织的比赛以及其他交往活动的，还应当审核中国相关主管部门出具的证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1833, "section": "第四部分 驾驶证业务知识", "header": "2.2.22", "question": "办理临时机动车驾驶许可申领业务时，属于驾驶自带临时入境机动车的，还需审核其自带临时入境机动车号牌、行驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1834, "section": "第四部分 驾驶证业务知识", "header": "2.2.23", "question": "车辆管理所办理恢复驾驶资格业务时，受理岗不需要确认申请人的年龄条件、身体条件是否允许驾驶原准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1835, "section": "第四部分 驾驶证业务知识", "header": "2.2.24", "question": "道路交通安全违法行为、交通事故未处理完毕的，车辆管理所不予办理提交《身体条件证明》业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1836, "section": "第四部分 驾驶证业务知识", "header": "2.2.25", "question": "王某于2019年5月1日取得C1准驾车型的驾驶证，于2022年4月1日通过增驾取得了B2准驾车型的驾驶证，那么他的实习期起算时间为2022年4月1日至2023年4月1日。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1837, "section": "第四部分 驾驶证业务知识", "header": "2.2.26", "question": "王某于2019年5月1日取得C1准驾车型的驾驶证，于2022年4月1日通过增驾取得了B2准驾车型的驾驶证，那么他的实习期起算时间为2022年4月1日至2023年4月1日。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1838, "section": "第四部分 驾驶证业务知识", "header": "2.2.27", "question": "车辆管理所办理道路运输企业聘用的机动车驾驶人备案业务时，通过计算机管理系统核查申请人信息、机动车驾驶证信息，以及不具有记满12分、逾期未审验、被扣押、扣留、暂扣、注销、吊销、撤销机动车驾驶证或者道路交通安全违法行为、交通事故未处理完毕的情形。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1839, "section": "第四部分 驾驶证业务知识", "header": "2.2.28", "question": "车辆管理所在办理机动车驾驶证业务过程中，对身份证明有疑义的，通过向发证机关查询、与全国人口信息系统比对、使用身份证明阅读器等方法核查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1840, "section": "第四部分 驾驶证业务知识", "header": "2.2.29", "question": "车辆管理所在办理机动车驾驶证业务过程中，对内地居民持有的境外机动车驾驶证有疑义的，可以通过政府外事部门与核发境外机动车驾驶证的国家（地区）的驻华使领馆或办事机构联系进行核查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1841, "section": "第四部分 驾驶证业务知识", "header": "2.2.30", "question": "车辆管理所在办理机动车驾驶证业务过程中，对申请人的身体条件是否适合驾驶机动车有疑义的，向省级医疗机构核查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1842, "section": "第四部分 驾驶证业务知识", "header": "2.2.31", "question": "持有的境外机动车驾驶证超过有效期的，不可以直接申请相应准驾车型的机动车驾驶证考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1843, "section": "第四部分 驾驶证业务知识", "header": "2.2.32", "question": "原机动车驾驶证因超过有效期未换证被注销，直接申请相应准驾车型的机动车驾驶证考试的，应当提交超过有效期的机动车驾驶证或《注销机动车驾驶许可决定书》。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1844, "section": "第四部分 驾驶证业务知识", "header": "2.2.33", "question": "军队、武装警察部队机动车驾驶证超过有效期直接申请相应准驾车型的机动车驾驶证考试的，应当提交超过有效期的机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1845, "section": "第四部分 驾驶证业务知识", "header": "2.2.34", "question": "境外机动车驾驶证超过有效期直接申请相应准驾车型的机动车驾驶证考试的，应当提交超过有效期的机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1846, "section": "第四部分 驾驶证业务知识", "header": "2.2.36", "question": "公安机关交通管理部门办理申请取得校车驾驶资格业务时，应当向所在地县级公安机关核查，确认申请人无犯罪、吸毒行为记录。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1847, "section": "第四部分 驾驶证业务知识", "header": "2.2.37", "question": "变更考试地业务的《学习驾驶证明》有效期以转出地车辆管理所核发时间为准。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1848, "section": "第四部分 驾驶证业务知识", "header": "2.2.38", "question": "考试场地、车辆、设施设备和系统不得用于训练。任何单位和个人不得利用考场、车辆、设施设备和系统收取训练费、服务费等费用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1849, "section": "第四部分 驾驶证业务知识", "header": "2.2.39", "question": "机动车驾驶证因准驾车型、有效期、发证机关信息发生变化的，车辆管理所应当告知申请人已签发的机动车电子驾驶证失效，需重新申领。机动车电子驾驶证记载的其他信息发生变化的，受理岗一日内更新机动车电子驾驶证信息。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1850, "section": "第四部分 驾驶证业务知识", "header": "2.2.40", "question": "机动车电子驾驶证需要变更照片的，申请人可以在一个记分周期内变更三次。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1851, "section": "第四部分 驾驶证业务知识", "header": "2.2.41", "question": "机动车驾驶人因服兵役、出国（境）等原因，无法在规定时间内办理驾驶证期满换证、审验、提交身体条件证明的，应当在驾驶证有效期内向机动车驾驶证核发地车辆管理所申请延期办理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1852, "section": "第四部分 驾驶证业务知识", "header": "3.1.1", "question": "临时入境人员在中国境内停居留时间超过3个月的，临时驾驶许可有效期与准许入境期限一致，但有效期最长不超过________。", "options": ["A、6个月", "B、9个月", "C、1年", "D、2年"], "answer": "C", "type": "choice"}, {"id": 1853, "section": "第四部分 驾驶证业务知识", "header": "3.1.2", "question": "机动车驾驶人应当于机动车驾驶证有效期满________，向机动车驾驶证核发地或者核发地以外的车辆管理所申请换证。", "options": ["A、前三十日内", "B、前三个月内", "C、前九十日内", "D、当月内"], "answer": "C", "type": "choice"}, {"id": 1854, "section": "第四部分 驾驶证业务知识", "header": "3.1.3", "question": "在车辆管理所管辖区域内，机动车驾驶证记载的机动车驾驶人信息发生变化的，机动车驾驶人应当在________到机动车驾驶证核发地或者核发地以外的车辆管理所申请换证。", "options": ["A、十日内", "B、三十日后", "C、三十日内", "D、九十日内"], "answer": "C", "type": "choice"}, {"id": 1855, "section": "第四部分 驾驶证业务知识", "header": "3.1.4", "question": "机动车驾驶证损毁无法辨认的，机动车驾驶人应当在________到机动车驾驶证核发地或者核发地以外的车辆管理所申请换证。", "options": ["A、十日内", "B、三十日后", "C、三十日内", "D、六十日内"], "answer": "C", "type": "choice"}, {"id": 1856, "section": "第四部分 驾驶证业务知识", "header": "3.1.5", "question": "机动车驾驶人在一个记分周期内累积记分达到12分的，拒不参加学习，也不接受考试的，由公安机关交通管理部门________。", "options": ["A、公告其驾驶证停止使用", "B、撤销其驾驶证", "C、注销其驾驶证", "D、吊销其驾驶证"], "answer": "A", "type": "choice"}, {"id": 1857, "section": "第四部分 驾驶证业务知识", "header": "3.1.6", "question": "人民法院、人民检察院、公安机关因办案需要查阅机动车驾驶证档案的，应当出具_____。", "options": ["A、公函", "B、经办人的工作证", "C、公函和经办人的工作证", "D、经办人的身份证明"], "answer": "C", "type": "choice"}, {"id": 1858, "section": "第四部分 驾驶证业务知识", "header": "3.1.7", "question": "车辆管理所因意外事件致使机动车驾驶证档案损毁、丢失的，应当书面报告_____，经批准后，按照计算机管理系统的信息补建机动车驾驶证档案。", "options": ["A、本级公安交通管理部门", "B、省级公安交通管理部门", "C、上一级公安交通管理部门", "D、设区的市级公安交通管理部门"], "answer": "B", "type": "choice"}, {"id": 1859, "section": "第四部分 驾驶证业务知识", "header": "3.1.8", "question": "造成交通事故后逃逸被吊销机动车驾驶证的，机动车驾驶证档案资料_____。", "options": ["A、保留两年后销毁", "B、保留三年后销毁", "C、保留五年后销毁", "D、长期保留"], "answer": "D", "type": "choice"}, {"id": 1860, "section": "第四部分 驾驶证业务知识", "header": "3.1.9", "question": "临时机动车驾驶许可档案资料_____。", "options": ["A、保留两年后销毁", "B、保留三年后销毁", "C、保留五年后销毁", "D、应长期保留"], "answer": "A", "type": "choice"}, {"id": 1861, "section": "第四部分 驾驶证业务知识", "header": "3.1.10", "question": "车辆管理所档案管理岗_____从全国公安交通管理信息系统下载并打印本辖区内机动车驾驶人异地违法满分考试信息，清除记分分值。", "options": ["A、每周", "B、每天", "C、每个工作日", "D、每月"], "answer": "C", "type": "choice"}, {"id": 1862, "section": "第四部分 驾驶证业务知识", "header": "3.1.11", "question": "机动车驾驶人申请延期办理期满换证、审验或提交身体条件证明的，延期期限自驾驶证有效期截止日期、记分周期结束日期或者应当提交身体条件证明的日期开始计算，最长不得超过________。", "options": ["A、六个月", "B、一年", "C、二年", "D、三年"], "answer": "D", "type": "choice"}, {"id": 1863, "section": "第四部分 驾驶证业务知识", "header": "3.1.12", "question": "车辆管理所在办理期满换证、转入换证、降级换证、信息变化换证和损毁换证业务时，对符合规定的，应当在________内换发机动车驾驶证。", "options": ["A、当日", "B、一日", "C、二日", "D、三日"], "answer": "B", "type": "choice"}, {"id": 1864, "section": "第四部分 驾驶证业务知识", "header": "3.1.13", "question": "A1准驾车型增驾D准驾车型的机动车驾驶人，在实习期内发生道路交通安全违法行为被记满12分，且在一个记分周期内有记满12分记录的，车辆管理所应当________。", "options": ["A、只注销D准驾车型", "B、实习期限延长一年", "C、注销D准驾车型且A1准驾车型降为A3B1B2准驾车型", "D、D准驾车型降为E准驾车型"], "answer": "A", "type": "choice"}, {"id": 1865, "section": "第四部分 驾驶证业务知识", "header": "3.1.14", "question": "机动车驾驶证遗失的，机动车驾驶人应当向机动车驾驶证核发地或者核发地以外的车辆管理所申请补发。申请时应当确认申请信息，并提交机动车驾驶人的身份证明。符合规定的，车辆管理所应当在________内补发机动车驾驶证。", "options": ["A、当日", "B、一日", "C、二日", "D、三日"], "answer": "B", "type": "choice"}, {"id": 1866, "section": "第四部分 驾驶证业务知识", "header": "3.1.15", "question": "下列情形中属于免予审验的是________。", "options": ["A、申请期满换证、转入换证的驾驶人", "B、持有大型客车、重型重型牵引挂车、城市公交车、中型客车、大型货车驾驶证的驾驶人，一个记分周期内有记分记录的", "C、持有大型客车、重型重型牵引挂车、城市公交车、中型客车、大型货车驾驶证的驾驶人，一个记分周期内没有记分记录的", "D、发生交通事故造成人员死亡承担同等以上责任未被吊销机动车驾驶证的驾驶人"], "answer": "C", "type": "choice"}, {"id": 1867, "section": "第四部分 驾驶证业务知识", "header": "3.1.16", "question": "对超过机动车驾驶证有效期一年以上未换证的，由计算机管理系统自动注销机动车驾驶证。车辆管理所________，通过信函、手机短信等方式告知机动车驾驶人。", "options": ["A、有条件的，可以在自动注销前三个月", "B、应当在自动注销前三个月", "C、应当在自动注销后三个月内", "D、有条件的，可以在自动注销后三个月内"], "answer": "B", "type": "choice"}, {"id": 1868, "section": "第四部分 驾驶证业务知识", "header": "3.1.17", "question": "年龄在________以上，只具有低速载货汽车、三轮汽车准驾车型的，车辆管理所应注销其驾驶证。", "options": ["A、50周岁", "B、55周岁", "C、60周岁", "D、70周岁"], "answer": "D", "type": "choice"}, {"id": 1869, "section": "第四部分 驾驶证业务知识", "header": "3.1.18", "question": "年龄在________以上，持有大型客车、重型牵引挂车、城市公交车、中型客车、大型货车的，应当到机动车驾驶证核发地或者核发地以外的车辆管理所换领准驾车型为小型汽车或者小型自动挡汽车的机动车驾驶证。", "options": ["A、50周岁", "B、55周岁", "C、60周岁", "D、70周岁"], "answer": "C", "type": "choice"}, {"id": 1870, "section": "第四部分 驾驶证业务知识", "header": "3.1.19", "question": "年龄在________以上，持有普通三轮摩托车、普通两轮摩托车驾驶证的，应当到机动车驾驶证核发地或者核发地以外的车辆管理所换领准驾车型为轻便摩托车的机动车驾驶证。", "options": ["A、50周岁", "B、55周岁", "C、60周岁", "D、70周岁"], "answer": "D", "type": "choice"}, {"id": 1871, "section": "第四部分 驾驶证业务知识", "header": "3.1.20", "question": "在办理机动车驾驶证业务时，经核查发现记满12分的，应当按规定_____。", "options": ["A、不予办理业务，并退回其申请材料", "B、注销其机动车驾驶证", "C、扣留机动车驾驶证，并书面告知其应当在三十日内接受道路交通安全法律、法规和相关知识的教育和考试", "D、公告停止使用"], "answer": "C", "type": "choice"}, {"id": 1872, "section": "第四部分 驾驶证业务知识", "header": "3.1.21", "question": "机动车驾驶人具有________情形的，车辆管理所应当注销其机动车驾驶证。", "options": ["A、年龄在60周岁以上，所持机动车驾驶证只具有无轨电车或者有轨电车准驾车型的", "B、年龄在50周岁以上，所持机动车驾驶证只具有无轨电车或者有轨电车准驾车型的", "C、持有残疾人专用小型自动挡载客汽车准驾车型，在一个记分周期结束后一年内未提交身体条件证明的", "D、年龄在60周岁以上，所持机动车驾驶证只具有低速载货汽车、三轮汽车、轮式自行机械车准驾车型的"], "answer": "A", "type": "choice"}, {"id": 1873, "section": "第四部分 驾驶证业务知识", "header": "3.1.22", "question": "属于\t________注销情形，未收回机动车驾驶证的，不需要公告机动车驾驶证作废。", "options": ["A、超过机动车驾驶证有效期一年以上未换证的", "B、提出注销申请的", "C、丧失民事行为能力，监护人提出注销申请的", "D、死亡的"], "answer": "D", "type": "choice"}, {"id": 1874, "section": "第四部分 驾驶证业务知识", "header": "3.1.23", "question": "身体条件证明自出具之日起____内有效。", "options": ["A、1个月", "B、3个月", "C、6个月", "D、12个月"], "answer": "C", "type": "choice"}, {"id": 1875, "section": "第四部分 驾驶证业务知识", "header": "3.1.24", "question": "对机动车驾驶证有效期满未换证、未按期审验或者未按期提交身体条件证明的，车辆管理所应当在驾驶证有效期满或者一个记分周期结束后的____内向社会公告。", "options": ["A、一个月", "B、二个月", "C、三个月", "D、六个月"], "answer": "B", "type": "choice"}, {"id": 1876, "section": "第四部分 驾驶证业务知识", "header": "3.1.25", "question": "机动车驾驶人身体条件发生变化，不符合所持机动车驾驶证准驾车型的条件，但符合准予驾驶的其他准驾车型条件，应当在_____内，到机动车驾驶证核发地或者核发地以外的车辆管理所申请降低准驾车型。", "options": ["A、十日", "B、二十日", "C、三十日", "D、六十日"], "answer": "C", "type": "choice"}, {"id": 1877, "section": "第四部分 驾驶证业务知识", "header": "3.1.26", "question": "吊销机动车驾驶证的，机动车驾驶证档案资料保留___后销毁。", "options": ["A、二年", "B、五年", "C、十年", "D、至申领机动车驾驶证限制期满"], "answer": "D", "type": "choice"}, {"id": 1878, "section": "第四部分 驾驶证业务知识", "header": "3.1.27", "question": "公安机关交通管理部门应当自收到校车驾驶资格申请材料之日起___内审查完毕。", "options": ["A、一日", "B、三日", "C、五日", "D、十日"], "answer": "C", "type": "choice"}, {"id": 1879, "section": "第四部分 驾驶证业务知识", "header": "3.1.28", "question": "公安机关交通管理部门车辆管理所应当按照_____规定的程序办理机动车驾驶证业务。", "options": ["A、《机动车驾驶证申领和使用规定》", "B、《机动车驾驶证业务工作规范》", "C、计算机管理系统", "D、机动车驾驶证信息采集和签注标准"], "answer": "B", "type": "choice"}, {"id": 1880, "section": "第四部分 驾驶证业务知识", "header": "3.1.29", "question": "在车辆管理所办事大厅和辖区运输企业张贴公布的机动车驾驶证作废公告，信息保留时间不得少于_____。", "options": ["A、十五日", "B、三十日", "C、六十日", "D、九十日"], "answer": "C", "type": "choice"}, {"id": 1881, "section": "第四部分 驾驶证业务知识", "header": "3.1.30", "question": "年龄在60周岁以上，可以保留_______准驾车型。", "options": ["A、大型货车", "B、轻型牵引挂车", "C、轮式专用机械车", "D、有轨电车"], "answer": "B", "type": "choice"}, {"id": 1882, "section": "第四部分 驾驶证业务知识", "header": "3.1.31", "question": "对机动车驾驶证有效期满未换证、未按期审验或者未按期提交身体条件证明的，车辆管理所应当在驾驶证有效期满或者一个记分周期结束后的_____个月内向社会公告。", "options": ["A、一", "B、二", "C、三", "D、六"], "answer": "B", "type": "choice"}, {"id": 1883, "section": "第四部分 驾驶证业务知识", "header": "3.2.1", "question": "机动车驾驶人自愿降低准驾车型的，应当当场确认申请信息，并提交机动车驾驶人的身份证明和机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1884, "section": "第四部分 驾驶证业务知识", "header": "3.2.2", "question": "办理临时机动车驾驶许可申领业务时，受理岗应组织申请人参加道路交通安全法律、法规学习。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1885, "section": "第四部分 驾驶证业务知识", "header": "3.2.3", "question": "超过机动车驾驶证有效期一年以上未换证的，车辆管理所应当注销其机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1886, "section": "第四部分 驾驶证业务知识", "header": "3.2.4", "question": "办理机动车驾驶证初次申领业务时，因计算机网络问题暂时无法完成核查的，可以先受理，在每次考试预约前进行核查，并在核发机动车驾驶证前完成最终核查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1887, "section": "第四部分 驾驶证业务知识", "header": "3.2.5", "question": "保险机构因办案需要查阅机动车驾驶证档案的，应当出具公函和经办人的工作证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1888, "section": "第四部分 驾驶证业务知识", "header": "3.2.6", "question": "机动车驾驶人在一个记分周期内记分未达到12分，所处罚款已经缴纳的，记分予以清除。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1889, "section": "第四部分 驾驶证业务知识", "header": "3.2.7", "question": "机动车驾驶人身体条件发生变化，不符合所持机动车驾驶证准驾车型的条件，但符合准予驾驶的其他准驾车型条件的，应当在三十日内到机动车驾驶证核发地或者核发地以外的车辆管理所申请降低准驾车型。申请时应当确认申请信息，并提交机动车驾驶人的身份证明、机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1890, "section": "第四部分 驾驶证业务知识", "header": "3.2.8", "question": "吊销机动车驾驶证的，机动车驾驶证档案资料一律保留两年后销毁。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1891, "section": "第四部分 驾驶证业务知识", "header": "3.2.9", "question": "机动车驾驶人应当在机动车驾驶证有效期满后，向机动车驾驶证核发地或者核发地以外的车辆管理所申请换证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1892, "section": "第四部分 驾驶证业务知识", "header": "3.2.10", "question": "机动车驾驶人户籍迁出原车辆管理所管辖区的，可以向迁入地车辆管理所申请换证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1893, "section": "第四部分 驾驶证业务知识", "header": "3.2.11", "question": "任何单位和个人不得擅自涂改、故意损毁或者伪造机动车驾驶证档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1894, "section": "第四部分 驾驶证业务知识", "header": "3.2.12", "question": "办理初次申领机动车驾驶证业务时，因计算机网络问题暂时无法完成核查的，必须完成核查后再予以受理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1895, "section": "第四部分 驾驶证业务知识", "header": "3.2.13", "question": "办理延期换证、延期审验、延期提交《身体条件证明》业务时，受理岗对符合规定受理申请的，录入相关信息，出具延期回执，告知申请人延期期间不得驾驶机动车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1896, "section": "第四部分 驾驶证业务知识", "header": "3.2.14", "question": "对于持有军队、武装警察部队机动车驾驶证或者境外机动车驾驶证申领机动车驾驶证的申请人，因年龄、身高等申请条件不符合对应准驾车型申请条件的，申请人不得申请对应的准驾车型。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1897, "section": "第四部分 驾驶证业务知识", "header": "3.2.15", "question": "年龄在70周岁以上的机动车驾驶人审验时应当按照规定进行记忆力、判断力、反应力等能力测试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1898, "section": "第四部分 驾驶证业务知识", "header": "3.2.16", "question": "机动车驾驶证作废公告应当采用在当地报纸刊登、电视媒体播放、车辆管理所办事大厅张贴、互联网网站公布等形式；公告内容应当包括机动车驾驶人的姓名、身份证明号码、注销原因和注销时间。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1899, "section": "第四部分 驾驶证业务知识", "header": "3.2.17", "question": "车辆管理所办理持境外机动车驾驶证申领业务，核发的机动车驾驶证的初次领证日期，按照境外机动车驾驶证记载的初次领证日期签注。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1900, "section": "第四部分 驾驶证业务知识", "header": "3.2.18", "question": "车辆管理所应当在申请人参加领证宣誓仪式的一日内核发机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1901, "section": "第四部分 驾驶证业务知识", "header": "3.2.19", "question": "办理驾驶证有效期满换证、审验时，对本记分周期内当时无记分的大型客车、重型牵引挂车、城市公交车、中型客车、大型货车机动车驾驶人，应当书面告知其如在本记分周期结束前有记分的，还应当按规定参加审验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1902, "section": "第四部分 驾驶证业务知识", "header": "3.2.20", "question": "车辆管理所在办理机动车驾驶证业务时，经核查发现未按规定参加审验的，应当按规定进行审验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1903, "section": "第四部分 驾驶证业务知识", "header": "3.2.21", "question": "机动车驾驶人在实习期内有发生道路交通安全违法行为被记满12分的，注销其实习的准驾车型驾驶资格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1904, "section": "第四部分 驾驶证业务知识", "header": "3.2.22", "question": "车辆管理所办理持境外机动车驾驶证申领业务，核发的机动车驾驶证的初次领证日期，按照境外机动车驾驶证记载的初次领证日期签注。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1905, "section": "第四部分 驾驶证业务知识", "header": "3.2.23", "question": "机动车驾驶人丧失民事行为能力，监护人提出注销申请的，车辆管理所应当注销其机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1906, "section": "第四部分 驾驶证业务知识", "header": "3.2.24", "question": "车辆管理所办理持境外机动车驾驶证申领业务，核发的机动车驾驶证的初次领证日期，按照境外机动车驾驶证记载的初次领证日期签注。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1907, "section": "第四部分 驾驶证业务知识", "header": "3.2.25", "question": "车辆管理所档案管理岗每个工作日从全国公安交通管理信息系统下载并打印本辖区内的机动车驾驶证转出信息，并存入相关机动车驾驶证档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1908, "section": "第四部分 驾驶证业务知识", "header": "3.2.26", "question": "持有军队、武装警察部队机动车驾驶证或者境外机动车驾驶证申领机动车驾驶证的，因年龄、身高等申请条件不符合对应准驾车型申请条件的，申请人可降级申请符合申请条件的准驾车型。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1909, "section": "第四部分 驾驶证业务知识", "header": "3.2.27", "question": "持有小型汽车驾驶证的机动车驾驶人，在机动车驾驶证有效期内不需要提交《身体条件证明》。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1910, "section": "第四部分 驾驶证业务知识", "header": "3.2.28", "question": "机动车驾驶人向核发地以外的车辆管理所申请办理换证、补证业务时，应当同时按照转入换证业务规定办理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1911, "section": "第四部分 驾驶证业务知识", "header": "3.2.29", "question": "机动车驾驶人在一个记分周期内累积记分满12分，机动车驾驶证未被依法扣留或者收到满分教育通知书后三十日内拒不参加公安机关交通管理部门通知的满分学习、考试的，由公安机关交通管理部门公告其机动车驾驶证停止使用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1912, "section": "第四部分 驾驶证业务知识", "header": "3.2.30", "question": "车辆管理所在办理增加准驾车型业务核发机动车驾驶证时，距原机动车驾驶证有效期满不足九十日，或者已超过机动车驾驶证有效期但不足一年的，应当合并办理增加准驾车型和有效期满换证业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1913, "section": "第四部分 驾驶证业务知识", "header": "3.2.31", "question": "因未按规定提交身体条件证明被注销，机动车驾驶证在有效期内或者超过有效期不满一年的，机动车驾驶人提交身体条件证明后可以恢复驾驶资格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1914, "section": "第四部分 驾驶证业务知识", "header": "3.2.32", "question": "年龄在60周岁以上的机动车驾驶人，应当每年进行一次身体检查，在记分周期结束后三十日内，提交上医疗机构出具的有关身体条件的证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1915, "section": "第四部分 驾驶证业务知识", "header": "3.2.33", "question": "有器质性心脏病、癫痫病、美尼尔氏症、眩晕症、癔病、震颤麻痹、精神病、痴呆以及影响肢体活动的神经系统疾病等妨碍安全驾驶疾病的，车辆管理所应当注销其机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1916, "section": "第四部分 驾驶证业务知识", "header": "3.2.34", "question": "年龄在70周岁以上，在一个记分周期结束后一年内未提交身体条件证明的，车辆管理所应当注销其机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1917, "section": "第四部分 驾驶证业务知识", "header": "3.2.35", "question": "持有残疾人专用小型自动挡载客汽车准驾车型，在三个记分周期结束后一年内未提交身体条件证明的，车辆管理所应当注销其机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1918, "section": "第四部分 驾驶证业务知识", "header": "3.2.36", "question": "因被查获有吸食、注射毒品后驾驶机动车行为而被注销机动车驾驶证的，机动车驾驶人参加道路交通安全法律、法规和相关知识考试合格后，可以恢复驾驶资格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1919, "section": "第四部分 驾驶证业务知识", "header": "3.2.37", "question": "机动车驾驶证注销后重新申请，直接申请机动车驾驶证考试的，有道路交通安全违法行为或者交通事故未处理记录的，应当将道路交通安全违法行为、交通事故处理完毕。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1920, "section": "第四部分 驾驶证业务知识", "header": "3.2.38", "question": "车辆管理所办理申请注销机动车驾驶证业务时，对审核符合规定的，应当出具《注销机动车驾驶许可决定书》。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1921, "section": "第四部分 驾驶证业务知识", "header": "3.2.39", "question": "校车驾驶人接受审验时，提交的有关身体条件的证明必须由县级或者部队团级以上医疗机构出具。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1922, "section": "第四部分 驾驶证业务知识", "header": "3.2.40", "question": "公安机关交通管理部门注销校车驾驶资格时，应当通知机动车驾驶人换领机动车驾驶证，并通报教育行政部门和学校。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1923, "section": "第四部分 驾驶证业务知识", "header": "3.2.41", "question": "公安机关交通管理部门注销校车驾驶资格时，未收回签注校车驾驶许可的机动车驾驶证的，应当公告其校车驾驶资格作废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1924, "section": "第四部分 驾驶证业务知识", "header": "3.2.42", "question": "持有准驾车型为大型客车、重型牵引挂车、城市公交车、中型客车、大型货车、无轨电车、有轨电车的机动车驾驶人，应当每两年一次身体检查，在记分周期结束后三十日内，提交县级或者部队团级以上医疗机构出具的有关身体条件的证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1925, "section": "第四部分 驾驶证业务知识", "header": "3.2.43", "question": "办理转入换证、审验时，对本记分周期内当时无记分的大型客车、重型牵引挂车、城市公交车、中型客车、大型货车机动车驾驶人，应当书面告知其如在本记分周期结束前有记分的，还应当按规定参加审验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1926, "section": "第四部分 驾驶证业务知识", "header": "3.2.44", "question": "查阅档案后需要出具证明或者复印档案资料的，应当经业务领导批准。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1927, "section": "第四部分 驾驶证业务知识", "header": "3.2.45", "question": "机动车驾驶证作废公告的内容应当包括机动车驾驶人的姓名、证号、档案编号，注销原因和注销时间。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1928, "section": "第四部分 驾驶证业务知识", "header": "3.2.46", "question": "车辆管理所办理恢复驾驶资格业务核发预约考试凭证时，在预约考试凭证上应当告知申请人恢复驾驶资格的截止时间。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1929, "section": "第四部分 驾驶证业务知识", "header": "3.2.47", "question": "车辆管理所在办理增加准驾车型申领业务核发机动车驾驶证时，原机动车驾驶证被公安机关交通管理部门扣押、扣留或者暂扣的，应当审核扣押、扣留或者暂扣凭证后核发机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1930, "section": "第四部分 驾驶证业务知识", "header": "3.2.48", "question": "车辆管理所办理机动车驾驶证转入换证业务时，发现机动车驾驶人身份证明的种类、号码等信息发生变化的，应当一次书面退办。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1931, "section": "第四部分 驾驶证业务知识", "header": "3.2.49", "question": "机动车驾驶人身体条件不适合驾驶机动车，有妨碍安全驾驶疾病，被查获有吸食、注射毒品后驾驶机动车行为，正在执行社区戒毒、强制隔离戒毒、社区康复措施，或者长期服用依赖性精神药品成瘾尚未戒除的，车辆管理所应当通过信函、手机短信等方式告知机动车驾驶人在三十日内申请注销驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1932, "section": "第四部分 驾驶证业务知识", "header": "3.2.50", "question": "机动车驾驶证作废公告应当采用在当地报纸刊登、电视媒体播放、车辆管理所办事大厅张贴、互联网网站公布等形式。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1933, "section": "第四部分 驾驶证业务知识", "header": "3.2.51", "question": "申请人应当在车辆管理所受理恢复驾驶资格业务后二年内完成考试，逾期未完成考试的，终止恢复驾驶资格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1934, "section": "第四部分 驾驶证业务知识", "header": "3.2.52", "question": "在申请恢复驾驶资格业务时或者恢复考试期间，申请人超过原准驾车型允许的准驾年龄或者身体条件发生变化的，车辆管理所应当终止办理恢复业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1935, "sec
