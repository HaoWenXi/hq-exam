ce"}, {"id": 832, "section": "第二部分 考试业务知识", "header": "3.1.31", "question": "倒车入库中途停车的，_____。", "options": ["A、评判为不合格", "B、每次扣20分", "C、每次扣10分", "D、每次扣5分"], "answer": "D", "type": "choice"}, {"id": 833, "section": "第二部分 考试业务知识", "header": "3.1.32", "question": "车辆管理所应当建立考试质量和考试纪律抽查制度，每日抽查不少于_____的当天的音视频电子信息档案和执法记录仪信息档案，发现存在违反考试纪律、考场秩序混乱以及视频、音频信息缺失或者不完整的，应当进行调查处理。", "options": ["A、5%", "B、10%", "C、1%", "D、3%"], "answer": "A", "type": "choice"}, {"id": 834, "section": "第二部分 考试业务知识", "header": "3.1.33", "question": "不属于三轮汽车、普通三轮摩托车、普通二轮摩托车和轻便摩托车科目二考试内容的是_____。", "options": ["A、桩考", "B、坡道定点停车和起步", "C、起伏路行驶", "D、通过单边桥"], "answer": "C", "type": "choice"}, {"id": 835, "section": "第二部分 考试业务知识", "header": "3.1.34", "question": "大型客车、重型牵引挂车、城市公交车、中型客车、大型货车考试里程不少于10公里，其中初次申领城市公交车、大型货车准驾车型的，白天考试里程不少于_____公里，夜间考试里程不少于_____公里。", "options": ["A、5  3", "B、10  5", "C、6  3", "D、10  3"], "answer": "A", "type": "choice"}, {"id": 836, "section": "第二部分 考试业务知识", "header": "3.1.35", "question": "直辖市、设区的市或者相当于同级的公安机关交通管理部门应当_____通过监管系统对机动车驾驶人考试和机动车驾驶证业务办理情况进行监控、分析，及时查处整改发现的问题。", "options": ["A、每周", "B、每月", "C、每半年", "D、每年"], "answer": "A", "type": "choice"}, {"id": 837, "section": "第二部分 考试业务知识", "header": "3.1.36", "question": "考试用车标志式样由_____统一规定。", "options": ["A、公安部交通管理局", "B、省级公安机关交通管理部门", "C、直辖市、设区的市或者相当于同级的公安机关交通管理部门", "D、各地车辆管理所"], "answer": "B", "type": "choice"}, {"id": 838, "section": "第二部分 考试业务知识", "header": "3.1.37", "question": "_____负责组织中级考试员资格培训、考试工作，核发考试员资格证书。", "options": ["A、公安部交通管理局", "B、省级公安机关交通管理部门", "C、设区的市或者相当于同级的公安机关交通管理部门", "D、县级以上公安机关交通管理部门"], "answer": "B", "type": "choice"}, {"id": 839, "section": "第二部分 考试业务知识", "header": "3.1.38", "question": "持有_____机动车驾驶证的考试员，不能承担残疾人专用小型自动挡载客汽车准驾车型科目三道路驾驶技能考试。", "options": ["A、大型货车", "B、小型汽车", "C、中型客车", "D、小型自动挡汽车"], "answer": "D", "type": "choice"}, {"id": 840, "section": "第二部分 考试业务知识", "header": "3.1.39", "question": "夜间考试应当在_____进行。", "options": ["A、18点以后", "B、19点以后", "C、路灯开启的时间段内", "D、各地根据实际情况确定的时间段内"], "answer": "C", "type": "choice"}, {"id": 841, "section": "第二部分 考试业务知识", "header": "3.1.40", "question": "进行夜间考试时，_____。", "options": ["A、考生应当穿反光背心，考试员可以不穿反光背心", "B、考试员应当穿反光背心，考生可以不穿反光背心", "C、考试员和考生都应当穿反光背心", "D、考试员和考生都可以不穿反光背心"], "answer": "C", "type": "choice"}, {"id": 842, "section": "第二部分 考试业务知识", "header": "3.1.41", "question": "对学习驾驶证明有效期不足_____的，车辆管理所应当根据申请人提出的考试预约申请，在学习驾驶证明有效期内每个科目优先安排1次考试。", "options": ["A、一个月", "B、两个月", "C、三个月", "D、六个月"], "answer": "D", "type": "choice"}, {"id": 843, "section": "第二部分 考试业务知识", "header": "3.1.42", "question": "考试过程音视频资料保存期限不得少于_____。", "options": ["A、半年", "B、一年", "C、二年", "D、三年"], "answer": "D", "type": "choice"}, {"id": 844, "section": "第二部分 考试业务知识", "header": "3.1.43", "question": "_____不得担任社会辅助考试人员。", "options": ["A、运输企业驾驶人", "B、警风警纪监督员", "C、社会志愿者", "D、驾培机构教练员"], "answer": "D", "type": "choice"}, {"id": 845, "section": "第二部分 考试业务知识", "header": "3.1.44", "question": "恢复驾驶资格考试试题数量为_____道试题，考试时间为_____min。", "options": ["A、50  30", "B、50  45", "C、100  30", "D、100  45"], "answer": "A", "type": "choice"}, {"id": 846, "section": "第二部分 考试业务知识", "header": "3.1.45", "question": "科目三安全文明驾驶常识考试试题数量为_____道试题，考试时间为_____min。", "options": ["A、50  30", "B、50  45", "C、100  30", "D、100  45"], "answer": "B", "type": "choice"}, {"id": 847, "section": "第二部分 考试业务知识", "header": "3.1.46", "question": "大型客车、城市公交车、中型客车、大型货车准驾车型桩考的项目完成时间不得超过_____。", "options": ["A、3min", "B、5min", "C、8min", "D、10min"], "answer": "C", "type": "choice"}, {"id": 848, "section": "第二部分 考试业务知识", "header": "3.1.47", "question": "申请考试员资格的人员应持有机动车驾驶证_________以上，没有发生致人死亡或者重伤的交通事故责任记录，最近_________记分周期内无满分记录。", "options": ["A、二年  二个", "B、三年  三个", "C、五年  三个", "D、五年  五个"], "answer": "B", "type": "choice"}, {"id": 849, "section": "第二部分 考试业务知识", "header": "3.1.48", "question": "考试员资格证书有效期为_________。", "options": ["A、一年", "B、二年", "C、三年", "D、五年"], "answer": "C", "type": "choice"}, {"id": 850, "section": "第二部分 考试业务知识", "header": "3.1.49", "question": "机动车驾驶人考试业务管理系统、考试业务权限设置和系统维护应当由_________负责。", "options": ["A、民警", "B、考场工作人员", "C、考试系统供货厂商维护人员", "D、监督岗的专职考试员"], "answer": "D", "type": "choice"}, {"id": 851, "section": "第二部分 考试业务知识", "header": "3.1.50", "question": "拟选拔为考试员的人员应当参加不少于_________的培训，进行专业技能考试。", "options": ["A、30学时", "B、40学时", "C、16学时", "D、24学时"], "answer": "B", "type": "choice"}, {"id": 852, "section": "第二部分 考试业务知识", "header": "3.1.51", "question": "取得资格证书的考试员，应当每年参加不少于_________小时的业务知识培训和廉政警示教育，并进行考核。", "options": ["A、16学时", "B、24学时", "C、30学时", "D、40学时"], "answer": "A", "type": "choice"}, {"id": 853, "section": "第二部分 考试业务知识", "header": "3.1.52", "question": "考试员具有_________，应当取消考试员资格。", "options": ["A、业务知识抽查考试不合格的", "B、工作考评不合格的", "C、给未经考试或者考试不合格人员直接签注考试合格成绩的", "D、因不恰当行为受到有效投诉的"], "answer": "C", "type": "choice"}, {"id": 854, "section": "第二部分 考试业务知识", "header": "3.1.53", "question": "考试员应当在考试期间使用执法记录仪。考试结束后，应当_______按规定上传执法记录仪记录信息，检查考试过程音视频监控资料是否完整有效。", "options": ["A、当日内", "B、一日内", "C、七日内", "D、随时"], "answer": "A", "type": "choice"}, {"id": 855, "section": "第二部分 考试业务知识", "header": "3.1.54", "question": "对考试系统故障等原因出现误判的，安排考生重新参加考试，程序不正确的是_________。", "options": ["A、考试员应当在当日内", "B、通过考试监管系统报业务领导批准后", "C、保存误判的考试过程音视频资料", "D、考试员直接安排"], "answer": "D", "type": "choice"}, {"id": 856, "section": "第二部分 考试业务知识", "header": "3.1.55", "question": "持境外机动车驾驶证申请城市公交车准驾车型机动车驾驶证的，应当考试_________。", "options": ["A、科目一", "B、科目一和科目三", "C、科目一、科目二和科目三", "D、科目二和科目三"], "answer": "C", "type": "choice"}, {"id": 857, "section": "第二部分 考试业务知识", "header": "3.1.56", "question": "车辆管理所应当使用全国统一的考试预约系统，采用_________等方式供申请人预约考试。", "options": ["A、互联网", "B、电话", "C、服务窗口", "D、以上均需要"], "answer": "D", "type": "choice"}, {"id": 858, "section": "第二部分 考试业务知识", "header": "3.1.57", "question": "_________应当严格遵守考试工作纪律。", "options": ["A、仅考试员", "B、仅考试辅助人员", "C、仅考场工作人员", "D、以上人员都"], "answer": "D", "type": "choice"}, {"id": 859, "section": "第二部分 考试业务知识", "header": "3.1.58", "question": "车辆管理所应当在候考场所、办事大厅向群众直播考试视频，考生可以在考试结束后_________查询自己的考试视频资料。", "options": ["A、当场", "B、一日内", "C、三日内", "D、十日内"], "answer": "C", "type": "choice"}, {"id": 860, "section": "第二部分 考试业务知识", "header": "3.1.59", "question": "对申请人在考试过程中有贿赂、舞弊行为的，处理不正确的是_________。", "options": ["A、取消考试资格", "B、已经通过考试的其他科目成绩无效，公安机关交通管理部门处二千元以下罚款", "C、在一年内不得再次申领机动车驾驶证", "D、停考一年"], "answer": "D", "type": "choice"}, {"id": 861, "section": "第二部分 考试业务知识", "header": "3.1.60", "question": "车辆管理所公开考试计划后，除不可抗力原因外，不得取消、减少或者变更考试计划。需要追加考试计划的，_________通过互联网交通安全综合服务管理平台公布。", "options": ["A、不需要", "B、可以", "C、应当至少在考试前五日", "D、应当至少在考试前三日"], "answer": "C", "type": "choice"}, {"id": 862, "section": "第二部分 考试业务知识", "header": "3.1.61", "question": "车辆管理所使用互联网考试预约系统受理申请人考试预约申请，于考试前_________停止受理；对于考试计划未约满的，受理预约申请_________。", "options": ["A、第五日  可以延长至考试前第三日停止", "B、第五日  不再", "C、第七日  可以延长至考试前第三日停止", "D、第三日  可以延长至考试前第一日停止"], "answer": "A", "type": "choice"}, {"id": 863, "section": "第二部分 考试业务知识", "header": "3.1.62", "question": "车辆管理所核定考试能力、制定考试计划由_________。", "options": ["A、受理岗负责", "B、业务领导负责", "C、考试岗负责", "D、监督岗负责，并报经业务领导批准"], "answer": "D", "type": "choice"}, {"id": 864, "section": "第二部分 考试业务知识", "header": "3.1.63", "question": "考试期间，考试员应当维护考试秩序，以下行为不正确的是_________。", "options": ["A、禁止与考试无关的人员与车辆进入封闭的考试区域", "B、对考试秩序混乱的，应当报业务领导批准后，中止考试业务", "C、允许考生进入考试区域，熟悉考试流程和监督考试工作", "D、发现考生考试作弊的，应当中止考试，收集、固定相关证据，制作询问笔录"], "answer": "C", "type": "choice"}, {"id": 865, "section": "第二部分 考试业务知识", "header": "3.1.64", "question": "关于社会辅助考试人员承担工作，不正确的是_________。", "options": ["A、在专职考试员的监督管理下", "B、可以承担考生身份验证、考试引导、考场巡查、远程监控等考试组织监督工作", "C、可以承担与其驾驶证准驾车型相对应车型的科目三道路驾驶技能考试工作", "D、可以承担小型汽车、小型自动挡汽车、残疾人专用小型自动挡载客汽车科目三道路驾驶技能考试辅助评判工作"], "answer": "C", "type": "choice"}, {"id": 866, "section": "第二部分 考试业务知识", "header": "3.1.65", "question": "报考大型客车、重型牵引车、城市公交车、中型客车、大型货车、轻型牵引挂车准驾车型的，申请人应当在取得学习驾驶证明满_________后预约考试科目二。", "options": ["A、十日", "B、二十日", "C、三十日", "D、四十日"], "answer": "B", "type": "choice"}, {"id": 867, "section": "第二部分 考试业务知识", "header": "3.1.66", "question": "持境外机动车驾驶证申请机动车驾驶证的，申请准驾车型为大型客车、重型牵引挂车、城市公交车、中型客车、大型货车机动车驾驶证的，应当考试_________。", "options": ["A、仅科目一", "B、仅科目一、科目三", "C、仅科目三", "D、科目一、科目二和科目三"], "answer": "D", "type": "choice"}, {"id": 868, "section": "第二部分 考试业务知识", "header": "3.1.67", "question": "初次申请或者增加小型汽车、小型自动挡汽车、低速载货汽车、三轮汽车、残疾人专用小型自动挡载客汽车、轮式专用机械车、无轨电车、有轨电车准驾车型的，申请人应当在取得学习驾驶证明满_________后预约考试科目二。", "options": ["A、十日", "B、二十日", "C、三十日", "D、四十日"], "answer": "A", "type": "choice"}, {"id": 869, "section": "第二部分 考试业务知识", "header": "3.1.68", "question": "报考大型客车、重型牵引挂车、城市公交车、中型客车、大型货车准驾车型的，申请增加准驾车型的除外，申请人应当在_________取得学习驾驶证明满后预约考试科目三。", "options": ["A、二十日", "B、四十日", "C、六十日", "D、八十日"], "answer": "B", "type": "choice"}, {"id": 870, "section": "第二部分 考试业务知识", "header": "3.1.69", "question": "报考小型自动挡汽车、残疾人专用小型自动挡载客汽车准驾车型的，申请人应当在_________取得学习驾驶证明满后预约考试科目三。", "options": ["A、十日", "B、二十日", "C、三十日", "D、四十日"], "answer": "B", "type": "choice"}, {"id": 871, "section": "第二部分 考试业务知识", "header": "3.1.70", "question": "报考低速载货汽车、三轮汽车准驾车型的，申请人应当在_________取得学习驾驶证明满后预约考试科目三。", "options": ["A、二十日", "B、三十日", "C、四十日", "D、六十日"], "answer": "A", "type": "choice"}, {"id": 872, "section": "第二部分 考试业务知识", "header": "3.1.71", "question": "持军队、武装警察部队机动车驾驶证的人申请小型汽车准驾车型机动车驾驶证的，应当_________。", "options": ["A、考试科目一", "B、考试科目一和科目三", "C、考试科目一、科目二和科目三", "D、免予考试核发机动车驾驶证"], "answer": "D", "type": "choice"}, {"id": 873, "section": "第二部分 考试业务知识", "header": "3.1.72", "question": "境外人员持境外机动车驾驶证申请小型汽车机动车驾驶证的（属于外国驻华使馆、领馆人员及国际组织驻华代表机构人员申请的除外），应当_________。", "options": ["A、考试科目一", "B、考试科目一和科目三", "C、考试科目一、科目二和科目三", "D、免予考试核发机动车驾驶证"], "answer": "A", "type": "choice"}, {"id": 874, "section": "第二部分 考试业务知识", "header": "3.1.73", "question": "持军队、武装警察部队机动车驾驶证的人申请大型客车、重型牵引车、城市公交车、中型客车、大型货车准驾车型机动车驾驶证的，应当考试_____。", "options": ["A、科目一", "B、科目三", "C、科目一和科目三", "D、科目一、科目二和科目三"], "answer": "C", "type": "choice"}, {"id": 875, "section": "第二部分 考试业务知识", "header": "3.1.74", "question": "省级公安机关交通管理部门应当通过监管系统，____对机动车驾驶人考试情况进行监控、分析，及时查处、通报发现的问题。", "options": ["A、每日", "B、每周", "C、每月", "D、每年"], "answer": "C", "type": "choice"}, {"id": 876, "section": "第二部分 考试业务知识", "header": "3.1.75", "question": "考试时出现____，判定为不合格。", "options": ["A、驾驶姿势不正确的", "B、操纵转向盘手法不合理的", "C、转弯时，转、回方向过早、过晚，或者转向角度过大、过小的", "D、起步、转向、变更车道、超车、靠边停车前，开转向灯少于3s即转向的"], "answer": "D", "type": "choice"}, {"id": 877, "section": "第二部分 考试业务知识", "header": "3.1.76", "question": "倒入车库项目完成时间不得超过_____min，超过规定时间的，评判为_____。", "options": ["A、5  不合格", "B、3.5  扣10分", "C、3.5  不合格", "D、8  扣5分"], "answer": "C", "type": "choice"}, {"id": 878, "section": "第二部分 考试业务知识", "header": "3.1.77", "question": "侧方停车考试项目完成时间不得超过_____min。", "options": ["A、1.5", "B、2", "C、2.5", "D、3"], "answer": "A", "type": "choice"}, {"id": 879, "section": "第二部分 考试业务知识", "header": "3.1.78", "question": "科目二考试中属于不合格的情形是_____。", "options": ["A、坡道定点停车和起步车辆停止后，车身距离路边缘线50cm以上", "B、坡道定点停车和起步车辆停止后，车身距离路边缘线超出30cm、未超出50cm", "C、直角转弯时中途停车", "D、倒车入库时中途停车"], "answer": "A", "type": "choice"}, {"id": 880, "section": "第二部分 考试业务知识", "header": "3.1.79", "question": "以下关于考试监管系统，不符合标准的是_____。", "options": ["A、具备考试过程文本信息、考试过程音视频信息等考试监管信息防篡改存储功能", "B、考试过程音视频信息应通过网络或者存储介质在24h内上传到考试监管系统", "C、考试过程信息保存时间应不少于3年", "D、考试过程音视频信息保存时间应不少于3年"], "answer": "C", "type": "choice"}, {"id": 881, "section": "第二部分 考试业务知识", "header": "3.1.80", "question": "以下不符合《机动车驾驶人考试系统通用技术条件》（GA/T1028-2017）的是_____。", "options": ["A、统一采集备案考试车辆和考试项目模型", "B、严格落实考试车辆轨迹记录存储要求", "C、增加音视频查询回放功能", "D、考试系统信息上传考试监管系统后不用保存"], "answer": "D", "type": "choice"}, {"id": 882, "section": "第二部分 考试业务知识", "header": "3.1.81", "question": "以下不符合考试路段设置要求的是_____。", "options": ["A、在通行社会车辆的混合交通道路上", "B、有无信号控制交叉口", "C、汽车单向流量不少于30辆/小时 D有学校区域、公共汽车站、人行横道等或设置有模拟的学校区域、公共汽车站等标志"], "answer": "C", "type": "choice"}, {"id": 883, "section": "第二部分 考试业务知识", "header": "3.1.82", "question": "坡道定点停车和起步项目的坡度取值为_____。", "options": ["A、5%", "B、10%", "C、15%", "D、20%"], "answer": "B", "type": "choice"}, {"id": 884, "section": "第二部分 考试业务知识", "header": "3.1.83", "question": "科目一和科目三安全文明驾驶常识考试题库中地方试题占比为_____。", "options": ["A、5%", "B、10%", "C、15%", "D、20%"], "answer": "B", "type": "choice"}, {"id": 885, "section": "第二部分 考试业务知识", "header": "3.1.84", "question": "超车项目考试时出现_____，扣10分。", "options": ["A、超车前，不通过内、外后视镜观察后方和左侧交通情况并回头观察确认安全的", "B、超车时，未回头观察被超越车辆动态的", "C、超车后，驶回原车道前，不通过内、外后视镜观察后方和右侧交通情况并回头观察确认安全的", "D、当后车发出超车信号时，具备让车条件不减速靠右让行的"], "answer": "D", "type": "choice"}, {"id": 886, "section": "第二部分 考试业务知识", "header": "3.1.85", "question": "对_____内在本地初领或增驾后转出的驾驶证信息与实物档案、考试记录进行比对，严格排查只有电子信息无实物档案或者无考试记录的情形，深挖线索，严查违法违规问题。", "options": ["A、半年", "B、一年", "C、两年", "D、三年"], "answer": "B", "type": "choice"}, {"id": 887, "section": "第二部分 考试业务知识", "header": "3.1.86", "question": "考试员要按规定使用执法执勤记录仪，完整摄录考试过程，记录内容保存时间不得少于_____。", "options": ["A、1个月", "B、2个月", "C、3个月", "D、4个月"], "answer": "C", "type": "choice"}, {"id": 888, "section": "第二部分 考试业务知识", "header": "3.1.87", "question": "要实行考试系统运维审计，支队至少_________核查运维工作台账、考试系统操作日志、数据库审计信息等，及时发现是否存在入侵系统、篡改伪造数据、私自修改参数等问题。", "options": ["A、每日", "B、每周", "C、每月", "D、每季度"], "answer": "C", "type": "choice"}, {"id": 889, "section": "第二部分 考试业务知识", "header": "3.1.88", "question": "要加强考试系统与综合应用平台数据比对，支队_________核查驾驶人考试数据与综合应用平台驾驶证数据一致性，发现新增驾驶证无考试数据、涉嫌篡改数据的，要核查驾驶证实物档案、考试音视频记录等信息，及时发现是否存在伪造数据、替考作弊等问题。", "options": ["A、每日", "B、每周", "C、每月", "D、每季度"], "answer": "B", "type": "choice"}, {"id": 890, "section": "第二部分 考试业务知识", "header": "3.1.89", "question": "道路驾驶技能考试路段要设置在通行社会车辆的路段上，考试路段要满足线路_________的要求，每条线路里程不得低于_________，不得在封闭道路内开展道路驾驶技能考试。", "options": ["A、至少6条  5公里", "B、至少3条  5公里", "C、至少3条  3公里", "D、至少1条  3公里"], "answer": "C", "type": "choice"}, {"id": 891, "section": "第二部分 考试业务知识", "header": "3.1.90", "question": "根据车辆管理所等级评定方法和标准，    属于\"驾驶人考试组织\"内容的评定标准。", "options": ["A、检查是否允许考生免费、有序进入考场熟悉环境，并制定有关管理措施", "B、检查是否严格落实随机分配考试员、考试车辆、考试线路", "C、检查考试档案是否由车辆管理所内部转递和保管，推行档案电子化", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 892, "section": "第二部分 考试业务知识", "header": "3.1.91", "question": "机动车驾驶人初次取得汽车类准驾车型或者初次取得摩托车类准驾车型后的_____为实习期。", "options": ["A、3个月", "B、6个月", "C、12个月", "D、24个月"], "answer": "C", "type": "choice"}, {"id": 893, "section": "第二部分 考试业务知识", "header": "3.1.92", "question": "代替实际机动车驾驶人参加满分教育签注学习记录、满分学习考试或者接受交通安全教育扣减交通违法行为记分的，由公安机关交通管理部门_______。", "options": ["A、1年内不得再次申领驾驶证", "B、注销驾驶证", "C、处2000元以下罚款", "D、学习记录、考试成绩无效"], "answer": "C", "type": "choice"}, {"id": 894, "section": "第二部分 考试业务知识", "header": "3.1.93", "question": "机动车驾驶人处理完交通违法行为记录后累积记分未满12分，参加公安机关交通管理部门组织的交通安全教育并达到规定要求的，可以申请在机动车驾驶人现有累积记分分值中扣减记分。在一个记分周期内累计最高扣减___分。", "options": ["A、12分", "B、6分", "C、3分", "D、9分"], "answer": "B", "type": "choice"}, {"id": 895, "section": "第二部分 考试业务知识", "header": "3.1.94", "question": "驾驶机动车不按规定避让校车一次记几分？", "options": ["A、12分", "B、6分", "C、3分", "D、2分"], "answer": "C", "type": "choice"}, {"id": 896, "section": "第二部分 考试业务知识", "header": "3.1.95", "question": "省级、设区的市或者相当于同级的公安机关交通管理部门应当建立驾驶人考试监管平台，考试过程音视频资料采集和保存要求应当符合相关标准的规定，保存期限不得少于_____年。", "options": ["A、一", "B、二", "C、三", "D、五"], "answer": "C", "type": "choice"}, {"id": 897, "section": "第二部分 考试业务知识", "header": "3.1.96", "question": "对考试设备供货厂商提供不符合标准的考试设备、考试系统，或者修改计算机考试系统参数，影响考试结果的，以下处理方法错误的是______。", "options": ["A、不得继续采购涉事厂商考试设备、考试系统", "B、总队要取消涉事厂商在本省（区、市）范围内考试设备、考试系统供货资格，并纳入失信惩戒名单", "C、构成犯罪的，依法追究刑事责任", "D、报支队领导审批后可继续使用涉事厂商考试设备、考试系统"], "answer": "D", "type": "choice"}, {"id": 898, "section": "第二部分 考试业务知识", "header": "3.1.97", "question": "科目三道路驾驶技能考试使用计算机考试系统的，应当采取_____方式进行评判。", "options": ["A、人工随车评判", "B、计算机评判", "C、人工随车评判和计算机评判相结合", "D、人工评判和计算机评判相结合"], "answer": "C", "type": "choice"}, {"id": 899, "section": "第二部分 考试业务知识", "header": "3.1.98", "question": "凡是驾驶人取得驾驶证后_____并负主要以上责任的，倒查考试发证过程，发现考试员有参与伪造考试成绩、降低考试标准等违规问题的，取消其考试员资格，终身不得参与驾驶考试工作；构成犯罪的，依法追究刑事责任。", "options": ["A、一年内发生交通事故", "B、一年内发生交通死亡事故", "C、三年内发生交通死亡事故", "D、三年内发生交通事故"], "answer": "C", "type": "choice"}, {"id": 900, "section": "第二部分 考试业务知识", "header": "3.1.99", "question": "道路驾驶技能考试推行_____方式，确保考试严格公正。", "options": ["A、人工随车评判", "B、计算机评判", "C、人工随车评判和计算机评判相结合", "D、人工评判和计算机评判相结合"], "answer": "C", "type": "choice"}, {"id": 901, "section": "第二部分 考试业务知识", "header": "3.1.100", "question": "社会考场存在组织纵容考试作弊、篡改伪造考试数据等情况的，以下做法错误的是_____。", "options": ["A、支队要按照合同和相关规定立即终止购买服务，并通报财政部门", "B、考场及其责任人不得再次参与考场政府购买服务", "C、责令其自查自纠后，继续开展考试工作", "D、构成犯罪的，依法追究刑事责任"], "answer": "C", "type": "choice"}, {"id": 902, "section": "第二部分 考试业务知识", "header": "3.1.101", "question": "_____属于轻型牵引挂车的科目二考试项目。", "options": ["A、侧方停车", "B、窄路掉头", "C、曲线行驶", "D、倒车入库"], "answer": "C", "type": "choice"}, {"id": 903, "section": "第二部分 考试业务知识", "header": "3.1.102", "question": "直辖市、设区的市或者相当于同级的公安机关交通管理部门应当每月向 社会公布辖区内驾驶培训机构的_____，并通报培训主管部门。", "options": ["A、考试合格率", "B、三年内驾龄驾驶人交通违法率和交通肇事率等信息", "C、按照考试合格率、三年内驾龄驾驶人交通违法率和交通肇事率对驾驶培训机构培训质量公开排名", "D、以上均需要"], "answer": "D", "type": "choice"}, {"id": 904, "section": "第二部分 考试业务知识", "header": "3.1.103", "question": "交通警察有_____情形之一的，按照有关规定给予处分；构成犯罪的，依法追究刑事责任。", "options": ["A、减少考试项目、降低评判标准或者参与、协助、纵容考试作弊的", "B、违反规定侵入机动车驾驶证管理系统，泄漏、篡改、买卖系统数据，或者泄漏系统密码的", "C、参与或者变相参与驾驶培训机构、社会考场、考试设备生产销售企业经营活动的", "D、以上均是"], "answer": "D", "type": "choice"}, {"id": 905, "section": "第二部分 考试业务知识", "header": "3.1.104", "question": "某机动车驾驶人持有A2D驾驶证，因满分考试中需要接受驾驶技能考试时，应按照_____准驾车型考试。", "options": ["A、记分分值高的", "B、A2", "C、B1", "D、B2"], "answer": "B", "type": "choice"}, {"id": 906, "section": "第二部分 考试业务知识", "header": "3.1.105", "question": "某机动车驾驶人持有C1D驾驶证，因驾驶二轮摩托车违法，在一个记分周期内累积记分达到24分以上，应考试科目一，_____。", "options": ["A、无需接受道路驾驶技能考试", "B、并需接受D准驾车型的道路驾驶技能考试", "C、并需接受C1准驾车型的道路驾驶技能考试", "D、并需接受E准驾车型的道路驾驶技能考试"], "answer": "C", "type": "choice"}, {"id": 907, "section": "第二部分 考试业务知识", "header": "3.2.1", "question": "靠边停车需要下车的，在打开车门前不回头观察左后方交通情况，评判为不合格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 908, "section": "第二部分 考试业务知识", "header": "3.2.2", "question": "省级公安机关交通管理部门负责本省（自治区、直辖市）机动车驾驶人考试工作的指导、检查和监督，负责考试员的资格考核和考场的验收、检查、监督。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 909, "section": "第二部分 考试业务知识", "header": "3.2.3", "question": "小型汽车科目三道路驾驶技能考试里程不少于3公里。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 910, "section": "第二部分 考试业务知识", "header": "3.2.4", "question": "科目一考试满分为100分，成绩达到90分的为合格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 911, "section": "第二部分 考试业务知识", "header": "3.2.5", "question": "模拟雨（雾）天行驶时，应同时开启雾灯、示廓灯、前照灯、危险报警闪光灯。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 912, "section": "第二部分 考试业务知识", "header": "3.2.6", "question": "每个科目考试一次，考试不合格的，可以补考一次。不参加补考或者补考仍不合格的，本次考试终止。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 913, "section": "第二部分 考试业务知识", "header": "3.2.7", "question": "具备相应知识和技能的人，经相关业务知识考试合格后，可以由公安机关交通管理部门授权从事考试工作。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 914, "section": "第二部分 考试业务知识", "header": "3.2.8", "question": "车辆管理所对初次申请和增加大型客车、重型牵引车、城市公交车、中型客车、大型货车、小型汽车、小型自动挡汽车、低速载货汽车、三轮汽车、残疾人专用小型自动挡载客汽车、轻型牵引挂车准驾车型的考试预约，应当使用全国统一的互联网考试预约系统办理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 915, "section": "第二部分 考试业务知识", "header": "3.2.9", "question": "车辆管理所在条件具备的情况下，可以对考试过程进行全程录音、录像。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 916, "section": "第二部分 考试业务知识", "header": "3.2.10", "question": "科目三道路驾驶技能考试满分为100分，考试小型汽车、小型自动挡汽车准驾车型的，达到80分的为合格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 917, "section": "第二部分 考试业务知识", "header": "3.2.11", "question": "科目一考试内容包括：道路通行、交通信号、交通安全违法行为和交通事故处理、机动车驾驶证申领和使用、机动车登记等规定以及其他道路交通安全法律、法规和规章。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 918, "section": "第二部分 考试业务知识", "header": "3.2.12", "question": "对持军队、武装警察部队机动车驾驶证和境外机动车驾驶证申请驾驶证的考试预约，车辆管理所应当使用全国统一的公安交通管理综合应用平台办理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 919, "section": "第二部分 考试业务知识", "header": "3.2.13", "question": "考试员应当认真履行考试职责，严格按照规定考试，接受社会监督。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 920, "section": "第二部分 考试业务知识", "header": "3.2.14", "question": "起步、转向、变更车道、超车、靠边停车前不使用或错误使用转向灯的，扣10分。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 921, "section": "第二部分 考试业务知识", "header": "3.2.15", "question": "车辆管理所应当严肃考试纪律，规范考场秩序，对考场秩序混乱的，应当中止考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 922, "section": "第二部分 考试业务知识", "header": "3.2.16", "question": "车辆管理所应当根据考试场地、考试设备、考试车辆、考试员数量等实际情况，核定每个考场、每个考试员每日最大考试量。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 923, "section": "第二部分 考试业务知识", "header": "3.2.17", "question": "倒车入库考试过程中，车辆进退途中不得停车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 924, "section": "第二部分 考试业务知识", "header": "3.2.18", "question": "坡道定点停车和起步考试要求起步时间不得超过30s。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 925, "section": "第二部分 考试业务知识", "header": "3.2.19", "question": "侧方停车考试要求车辆在库前方一次倒车入库，中途不得停车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 926, "section": "第二部分 考试业务知识", "header": "3.2.20", "question": "窄路掉头考试要求考试时间不超过8min。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 927, "section": "第二部分 考试业务知识", "header": "3.2.21", "question": "直角转弯考试过程中，中途可以停车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 928, "section": "第二部分 考试业务知识", "header": "3.2.22", "question": "模拟隧道行驶考试，驶抵隧道时未开启前照灯的，扣10分。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 929, "section": "第二部分 考试业务知识", "header": "3.2.23", "question": "科目二考试不合格，当场补考时，未扣分的已考试项目不再补考。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 930, "section": "第二部分 考试业务知识", "header": "3.2.24", "question": "考试车辆应当符合相关标准要求，设置考试用车标志，只用于科目二考试的，可不用办理注册登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 931, "section": "第二部分 考试业务知识", "header": "3.2.25", "question": "考试车辆应当设置考试用车标志，进行夜间考试的车辆，应当安装考试车辆灯箱，可以粘贴车身反光标识。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 932, "section": "第二部分 考试业务知识", "header": "3.2.26", "question": "车辆管理所考试计划可以选择在互联网交通安全综合服务管理平台或者业务大厅公开，供申请人查询。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 933, "section": "第二部分 考试业务知识", "header": "3.2.27", "question": "考生对考试结果有异议的，考试员应当告知考生找业务领导处理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 934, "section": "第二部分 考试业务知识", "header": "3.2.28", "question": "对申请大型客车、重型牵引车、城市公交车、中型客车、大型货车、轻型牵引挂车准驾车型科目二考试的，考试不合格当场补考时，已考试项目不再补考。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 935, "section": "第二部分 考试业务知识", "header": "3.2.29", "question": "科目三安全文明驾驶常识考试不合格的，已通过的道路驾驶技能考试成绩作废。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 936, "section": "第二部分 考试业务知识", "header": "3.2.30", "question": "科目二第五次预约考试仍不合格的，已考试合格的其他科目成绩仍有效。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 937, "section": "第二部分 考试业务知识", "header": "3.2.31", "question": "科目三道路驾驶技能考试第五次预约考试仍不合格的，已考试合格的其他科目成绩作废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 938, "section": "第二部分 考试业务知识", "header": "3.2.32", "question": "科目三安全文明驾驶常识考试内容包括：安全文明驾驶操作要求、恶劣气象和复杂道路条件下的安全驾驶知识、爆胎等紧急情况下的临危处置方法防范次生事故处置知识、伤员急救知识等。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 939, "section": "第二部分 考试业务知识", "header": "3.2.33", "question": "科目三安全文明驾驶常识考试满分为100分，成绩达到80分的为合格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 940, "section": "第二部分 考试业务知识", "header": "3.2.34", "question": "科目三道路驾驶技能考试不合格的，可以先参加科目三安全文明驾驶常识考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 941, "section": "第二部分 考试业务知识", "header": "3.2.35", "question": "车辆管理所存在为未经考试或者考试不合格人员核发机动车驾驶证等严重违规办理机动车驾驶证业务情形的，上级公安机关交通管理部门可以暂停该车辆管理所办理相关业务或者指派其他车辆管理所人员接管业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 942, "section": "第二部分 考试业务知识", "header": "3.2.36", "question": "车辆管理所应当根据驾驶培训主管部门提供的信息对驾驶培训机构教练员、教练车、训练场地等情况进行备案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 943, "section": "第二部分 考试业务知识", "header": "3.2.37", "question": "对三年内驾龄驾驶人发生一次死亡3人以上交通事故且负主要以上责任的，省级公安机关交通管理部门应当倒查车辆管理所考试、发证情况，向社会公布倒查结果。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 944, "section": "第二部分 考试业务知识", "header": "3.2.38", "question": "《机动车驾驶人考试内容和方法》(GA1026)规定了机动车驾驶人考试内容、操作要求和评判。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 945, "section": "第二部分 考试业务知识", "header": "3.2.39", "question": "《机动车驾驶人考试内容和方法》(GA1026)适用于申领机动车驾驶证考试，但不适用于满分学习考试和恢复驾驶资格考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 946, "section": "第二部分 考试业务知识", "header": "3.2.40", "question": "对大中型客货车准驾车型科目二考试，省级公安机关交通管理部门可以根据实际增加考试内容。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 947, "section": "第二部分 考试业务知识", "header": "3.2.41", "question": "小型汽车、小型自动挡汽车、残疾人专用小型自动挡载客汽车和低速载货汽车考试内容全国统一，各地不可以增加科目二、科目三道路驾驶技能考试内容。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 948, "section": "第二部分 考试业务知识", "header": "3.2.42", "question": "科目二考试满分为100分，成绩达到90分的为合格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 949, "section": "第二部分 考试业务知识", "header": "3.2.43", "question": "申请人应当在学习驾驶证明有效期内完成科目二和科目三考试。未在有效期内完成考试，有正当理由的，已考试合格的科目成绩可以申请保留。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 950, "section": "第二部分 考试业务知识", "header": "3.2.44", "question": "考试员在考试中应当严格执行考试程序，按照考试项目和考试标准评定考试成绩。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 951, "section": "第二部分 考试业务知识", "header": "3.2.45", "question": "考试员考试后可以不当场公布考试成绩，但对考试不合格的，应当讲评原因。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 952, "section": "第二部分 考试业务知识", "header": "3.2.46", "question": "直行通过路口、路口左转弯、路口右转弯时，不主动避让优先通行的车辆、行人，非机动车的，评判为不合格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 953, "section": "第二部分 考试业务知识", "header": "3.2.47", "question": "交通警察有为不符合机动车驾驶许可条件、未经考试、考试不合格人员签注合格考试成绩或者核发机动车驾驶证的,按照有关规定给予纪律处分，终生不得参与驾驶考试工作；构成犯罪的，依法追究刑事责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 954, "section": "第二部分 考试业务知识", "header": "3.2.48", "question": "对申请大型客车、重型牵引车、城市公交车、中型客车、大型货车准驾车型科目三道路驾驶技能考试补考仍未合格的，重新预约考试，只参加评判不合格项目考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 955, "section": "第二部分 考试业务知识", "header": "3.2.49", "question": "直辖市、设区的市或者相当于同级的公安机关交通管理部门发现驾驶培训机构及其教练员存在缩短培训学时、减少培训项目以及贿赂考试员、以承诺考试合格等名义向学员索取财物、参与违规办理驾驶证或者考试舞弊行为的，应当通报培训主管部门，并向社会公布。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 956, "section": "第二部分 考试业务知识", "header": "3.2.50", "question": "对三年内驾龄驾驶人发生一次死亡1至2人的交通事故且负主要以上责任的，公安机关交通管理部门不需要组织责任倒查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 957, "section": "第二部分 考试业务知识", "header": "3.2.51", "question": "交通警察有利用职务上的便利索取、收受他人财物或者牟取其他利益的，按照有关规定给予纪律处分；构成犯罪的，应当依法追究刑事责任，但退回财物的除外。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 958, "section": "第二部分 考试业务知识", "header": "3.2.52", "question": "车辆管理所应当使用符合标准的考试场地、考试路段、考试车辆、考试系统和考试设施进行考试，应当按规定使用全国统一的考试预约、监管系统。未按规定使用的，不得组织考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 959, "section": "第二部分 考试业务知识", "header": "3.2.53", "question": "侧方停车项目完成时间超过规定时间的，评判为不合格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 960, "section": "第二部分 考试业务知识", "header": "3.2.54", "question": "科目一和科目三安全文明驾驶常识考试场地，及低速载货汽车、三轮汽车、摩托车全部科目考场，不需要进行验收。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 961, "section": "第二部分 考试业务知识", "header": "3.2.55", "question": "科目三道路驾驶技能考试使用计算机考试系统的，应当采取计算机考试系统进行评判，不能进行人工随车评判。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 962, "section": "第二部分 考试业务知识", "header": "3.2.56", "question": "直辖市、设区的市或者相当于同级的公安机关交通管理部门应当统一管理考场、考试设施、考试系统和考试车，不得交由公安机关交通管理部门以外的任何单位、个人管理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 963, "section": "第二部分 考试业务知识", "header": "3.2.57", "question": "考试过程中，应在考场入口处设置\"正在考试\"的公告标识，在候考场所实时播放考试视频，接受考生监督，但无需接受社会群众监督。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 964, "section": "第二部分 考试业务知识", "header": "3.2.58", "question": "科目三道路驾驶技能考试路段线应当满足交通流量、考试项目和里程等要求，条件具备的，可以设置考试路段线标志和考试项目的标志、标线。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 965, "section": "第二部分 考试业务知识", "header": "3.2.59", "question": "用于大型客车、重型牵引车、城市公交车、中型客车、大型货车、小型汽车、小型自动挡汽车、残疾人专用小型自动挡载客汽车考试的车辆应当按照相关标准要求安装音视频监控系统和安装卫星定位系统；用于科目三道路驾驶技能考试的，还应当按照相关标准要求安装副制动装置和辅助后视镜。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 966, "section": "第二部分 考试业务知识", "header": "3.2.60", "question": "报考摩托车准驾车型的，可以使用由计算机考试系统生成的纸质试卷，进行科目一和科目三安全文明驾驶常识考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 967, "section": "第二部分 考试业务知识", "header": "3.2.61", "question": "科目三道路驾驶技能考试使用计算机考试系统的，考试员不需要同车监督。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 968, "section": "第二部分 考试业务知识", "header": "3.2.62", "question": "报考摩托车准驾车型的，科目一和科目三安全文明驾驶常识考试可以合并进行，科目二和科目三道路驾驶技能考试可以合并进行。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 969, "section": "第二部分 考试业务知识", "header": "3.2.63", "question": "为提高考试效率，考试后可不断开考试场地计算机管理系统与车辆管理所的专用网络联接。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 970, "section": "第二部分 考试业务知识", "header": "3.2.64", "question": "各科目考试结束后，受理岗检查整理考试音视频监控资料，并按规定保存，但考生对考试结果无异议的，可以不保存。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 971, "section": "第二部分 考试业务知识", "header": "3.2.65", "question": "考试员分为民警考试员和非民警考试员。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 972, "section": "第二部分 考试业务知识", "header": "3.2.66", "question": "初级考试员可以承担全部准驾车型的科目一、科目二、科目三安全文明驾驶常识考试工作，可以承担与其机动车驾驶证准驾车型相对应全部车型的科目三道路驾驶技能考试工作。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 973, "section": "第二部分 考试业务知识", "header": "3.2.67", "question": "车辆管理所应当会同培训主管部门根据驾驶员培训教学大纲要求制定核定培训能力的方法，按照驾驶培训机构教练员、教练车、训练场地、考试质量等情况核定受理考试人数。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 974, "section": "第二部分 考试业务知识", "header": "3.2.68", "question": "考场工作人员参与考试作弊的，车辆管理所应当暂停考试业务，责令整改；经整改仍不符合要求或者再次发生违规情形的，取消考场资格，属于社会考场的，依法解除购买服务合同。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 975, "section": "第二部分 考试业务知识", "header": "3.2.69", "question": "科目三安全文明驾驶常识考试题型为判断题、单项选择题。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 976, "section": "第二部分 考试业务知识", "header": "3.2.70", "question": "考试员资格培训和考试的内容包括道路交通安全法律、法规和相关知识、廉政警示教育、计算机评判系统操作、驾驶技能、考试评判能力。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 977, "section": "第二部分 考试业务知识", "header": "3.2.71", "question": "社会辅助考试人员可以独立承担小型汽车、小型自动挡汽车、残疾人专用小型自动挡载客汽车科目三道路驾驶技能考试辅助评判工作。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 978, "section": "第二部分 考试业务知识", "header": "3.2.72", "question": "考场由省级公安机关交通管理部门按照相关标准和要求组织验收。验收合格并出具验收合格报告的，方能用于考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 979, "section": "第二部分 考试业务知识", "header": "3.2.73", "question": "公安机关交通管理部门不得无偿使用社会考场，不得参与社会考场经营活动。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 980, "section": "第二部分 考试业务知识", "header": "3.2.74", "question": "公安机关交通管理部门应当按照依法、公开、公正的原则，对考场实行验收、监管和评价，按照相关标准向考场收取验收、评价等费用。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 981, "section": "第二部分 考试业务知识", "header": "3.2.75", "question": "小型汽车、小型自动挡汽车、低速载货汽车、残疾人专用小型自动挡载客汽车考试里程不少于3公里，不进行夜间考试的，应当进行模拟夜间灯光考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 982, "section": "第二部分 考试业务知识", "header": "3.2.76", "question": "有条件的地方，申请人可以同时预约科目二、科目三道路驾驶技能考试，预约成功后可以连续进行考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 983, "section": "第二部分 考试业务知识", "header": "3.2.77", "question": "申请人取得学习驾驶证明前，可以在场地上学习驾驶，但在道路上学习驾驶，应当按规定取得学习驾驶证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 984, "section": "第二部分 考试业务知识", "header": "3.2.78", "question": "学习驾驶证明可以采用纸质或者电子形式，纸质学习驾驶证明和电子学习驾驶证明具有同等效力。申请人可以通过互联网交通安全综合服务管理平台打印或者下载学习驾驶证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 985, "section": "第二部分 考试业务知识", "header": "3.2.79", "question": "2022年4月1日起，《机动车驾驶证申领和使用规定》（公安部令第162号）实施。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 986, "section": "第二部分 考试业务知识", "header": "3.2.80", "question": "已持有小型汽车准驾车型申请增加轻便摩托车准驾车型驾驶证的，只需要考试科目二和科目三。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 987, "section": "第二部分 考试业务知识", "header": "3.2.81", "question": "申请人为自学直考人员的，在道路上学习驾驶时，应当在自学用车上按规定放置、粘贴学车专用标识，自学用车不得搭载随车指导人员以外的其他人员。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 988, "section": "第二部分 考试业务知识", "header": "3.2.82", "question": "车辆管理所应当在考试前24小时内，使用全国统一的计算机系统随机选配考试员，随机安排考生分组，随机选取考试路线。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 989, "section": "第二部分 考试业务知识", "header": "3.2.83", "question": "公安机关交通管理部门应当加强对辖区考场的监督管理，定期开展考试场地、考试车辆、考试设备和考场管理情况的监督检查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 990, "section": "第二部分 考试业务知识", "header": "3.2.84", "question": "车辆管理所应当在办事大厅、候考场所和互联网公开各考场的考试能力、预约计划、预约人数和约考结果等情况，公布考场布局、考试路线和流程。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 991, "section": "第二部分 考试业务知识", "header": "3.2.85", "question": "车辆管理所应当对考试过程进行录音、录像，并实时监控考试过程，没有使用录音、录像设备的，应当经过业务领导批准后，才能组织考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 992, "section": "第二部分 考试业务知识", "header": "3.2.86", "question": "考试过程中，考试员应当使用执法记录仪记录监考过程，但在安装有音视频监控系统的车辆或者场地监考时除外。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 993, "section": "第二部分 考试业务知识", "header": "3.2.87", "question": "考试员在考试前应当自我介绍，讲解考试要求，核实申请人身份。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 994, "section": "第二部分 考试业务知识", "header": "3.2.88", "question": "车辆管理所办理机动车驾驶人考试业务，应当遵循严格、公开、公正的原则。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 995, "section": "第二部分 考试业务知识", "header": "3.2.89", "question": "车辆管理所应当按照要求核定考场、考试员每日最大考试量，确定考试能力。考场和考试员最大考试量应当逐级报省级公安机关交通管理部门备案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 996, "section": "第二部分 考试业务知识", "header": "3.2.90", "question": "车辆管理所在制定考试计划时，应当分时段安排考试场次。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 997, "section": "第二部分 考试业务知识", "header": "3.2.91", "question": "允许摩托车准驾车型申请人一次预约所有科目考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 998, "section": "第二部分 考试业务知识", "header": "3.2.92", "question": "申请人使用互联网考试预约系统进行预约时，预约成功后申请取消考试预约的，申请人应到业务大厅窗口办理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 999, "section": "第二部分 考试业务知识", "header": "3.2.93", "question": "车辆管理所使用公安交通管理综合应用平台办理考试预约业务时，应当审核申请人提交的身份证明，确认身份证明有效。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1000, "section": "第二部分 考试业务知识", "header": "3.2.94", "question": "考试区监控范围覆盖全部区域，理论考场能清晰反映每个考生情况，考试车内监控清晰反映考生情况。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1001, "section": "第二部分 考试业务知识", "header": "3.2.95", "question": "因系统故障、停电、天气等特殊原因，不能按照考试计划组织考试的，车辆管理所应当另行安排考试，并及时通过电话、手机短信、互联网等方式通知申请人。对无法参加另行安排考试的，车辆管理所应当根据申请人提出的考试预约申请及时安排考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1002, "section": "第二部分 考试业务知识", "header": "3.2.96", "question": "车辆管理所优先安排考试的相关信息不需要公开。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1003, "section": "第二部分 考试业务知识", "header": "3.2.97", "question": "车辆管理所应当实行考场开放，公布考场布局、考试路线、考试流程，允许考生在考试前免费进入考场熟悉考试环境。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1004, "section": "第二部分 考试业务知识", "header": "3.2.98", "question": "对申请大型客车、重型牵引车、城市公交车、中型客车、大型货车准驾车型科目三道路驾驶技能考试的，夜间考试不合格当场补考时，白天考试成绩不予保留。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1005, "section": "第二部分 考试业务知识", "header": "3.2.99", "question": "进行夜间考试时，考试车辆应当开启车辆灯箱。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1006, "section": "第二部分 考试业务知识", "header": "3.2.100", "question": "驾驶技能考试期间，除参加考试的考生和考试员外，其他人员不得乘坐考试车辆。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1007, "section": "第二部分 考试业务知识", "header": "3.2.101", "question": "考试员在每场考试开始前，应当将个人通信工具上交、统一保存。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1008, "section": "第二部分 考试业务知识", "header": "3.2.102", "question": "各科目考试结束后，对于异地考试的，由考试地车辆管理所在考试合格后三日内，以挂号邮件、特快专递、内部传送等形式，将考试成绩表转递给机动车驾驶证申请地车辆管理所。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1009, "section": "第二部分 考试业务知识", "header": "3.2.103", "question": "对考生故意调整、遮挡监控设备造成成绩表打印的照片不清晰、不完整或者无照片的，核实后应当按考试不合格处理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1010, "section": "第二部分 考试业务知识", "header": "3.2.104", "question": "车辆管理所应当设立考试档案室，负责考试过程档案保管和调用。考试档案应当实行车辆管理所内部或者考生本人转递和保管，不得交由其他社会单位、组织代为转递和保管。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1011, "section": "第二部分 考试业务知识", "header": "3.2.105", "question": "推行考试过程档案电子化，允许考试过程中的档案采用电子形式转递，所有科目考试结束后，考试成绩表等档案资料应当全部打印，交由考生和考试员签字确认。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1012, "section": "第二部分 考试业务知识", "header": "3.2.106", "question": "设区的市或者相当于同级的公安机关交通管理部门、县级公安机关交通管理部门应当每月组织考试员进行一次廉政教育、业务知识、实战技能集中培训，每周进行考试工作总结、点评。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1013, "section": "第二部分 考试业务知识", "header": "3.2.107", "question": "公安机关交通管理部门应当建立专职考试员轮岗交流制度，对连续承担考试工作超过三年的，应当与其他岗位交流。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1014, "section": "第二部分 考试业务知识", "header": "3.2.108", "question": "考试前，考试员应当组织监督考场工作人员对考试场地、考试车辆、考试系统、音视频监控系统等设施设备进行检查测试，清除与考试无关物品、标记，确保考场及其设施符合标准规定。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1015, "section": "第二部分 考试业务知识", "header": "3.2.109", "question": "公安机关交通管理部门应当建立健全考场管理服务监督和评价机制，定期对考试场地、考试车辆、考试设施和考试系统组织检查，定期对考场管理服务水平、考生满意度等方面进行考核评价，并向社会公布监督评价结果。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1016, "section": "第二部分 考试业务知识", "header": "3.2.110", "question": "科目二、科目三道路驾驶技能考试均合格后，申请人可以当日参加科目三安全文明驾驶常识考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1017, "section": "第二部分 考试业务知识", "header": "3.2.111", "question": "受理岗办理初次申领机动车驾驶证科目二或者科目三考试预约时，应当审核申请考试的时限和考试的次数。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1018, "section": "第二部分 考试业务知识", "header": "3.2.112", "question": "持军队、武装警察部队机动车驾驶证申请除大型客车、重型牵引挂车、中型客车、大型货车准驾车型以外机动车驾驶证的，免予考试核发机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1019, "section": "第二部分 考试业务知识", "header": "3.2.113", "question": "机动车驾驶证考试顺序按照科目一、科目二、科目三依次进行，前一科目考试合格后，方准参加后一科目的考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1020, "section": "第二部分 考试业务知识", "header": "3.2.114", "question": "考试内容和合格标准全国统一，根据不同准驾车型规定相应的考试项目。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1021, "section": "第二部分 考试业务知识", "header": "3.2.115", "question": "变更车道前，正确开启转向灯，通过内、外后视镜观察，并向变更车道方向侧头观察后方道路交通情况，确认安全后变更车道，变更车道完毕关闭转向灯。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1022, "section": "第二部分 考试业务知识", "header": "3.2.116", "question": "考试监管系统操作用户应有明确的分级管理权限限制，系统管理员、系统操作员、考试员应给予不同的管理权限。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1023, "section": "第二部分 考试业务知识", "header": "3.2.117", "question": "考试系统与考试监管模块系统时间不一致的，报经考试监督岗同意后，才能允许考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1024, "section": "第二部分 考试业务知识", "header": "3.2.118", "question": "小型车侧方停车项目车位长为1.5倍车长加1.0m。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1025, "section": "第二部分 考试业务知识", "header": "3.2.119", "question": "要本着方便群众的原则，细化考试场次安排，科目二和科目三道路驾驶技能考试每半天至少安排两个场次，方便考生合理选择、分时段候考。对于未按照预约场次考试的考生，可以允许在预约当天考试结束前参加考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1026, "section": "第二部分 考试业务知识", "header": "3.2.120", "question": "要严格执行排考计划，不得随意调换考试员，可以按驾校分组、分配考试车辆和路线，但严禁驾校工作人员参与考试组织安排。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1027, "section": "第二部分 考试业务知识", "header": "3.2.121", "question": "实行小型汽车、小型自动挡汽车驾驶证自学直考的地方，申请人可以使用任意机动车，在具备安全驾驶经历等条件的人员随车指导下，按照公安机关交通管理部门指定的路线、时间学习驾驶技能。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1028, "section": "第二部分 考试业务知识", "header": "3.2.122", "question": "考试系统使用人员要设置独立用户账号，提高考试系统用户密码设置强度并定期更换，不得设置公共账号，对离岗离职人员用户账号要及时停用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1029, "section": "第二部分 考试业务知识", "header": "3.2.123", "question": "考试场地要加装无线信号屏蔽器，严密防范通过无线通信方式组织作弊。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1030, "section": "第二部分 考试业务知识", "header": "3.2.124", "question": "在科目二考试中，允许对考试车辆的油门进行固定，提高考生考试安全系数。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1031, "section": "第二部分 考试业务知识", "header": "3.2.125", "question": "大型客车、重型牵引挂车、城市公交车、中型客车、大型货车、小型汽车、小型自动挡汽车、低速载货汽车和残疾人专用小型自动挡载客汽车科目三道路驾驶技能内容包括考试上车准备、起步、直线行驶、加减挡位操作、变更车道、靠边停车、直行通过路口、路口左转弯、路口右转弯、通过人行横道线、通过学校区域、通过公共汽车站、会车、超车、掉头、夜间行驶。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1032, "section": "第二部分 考试业务知识", "header": "3.2.126", "question": "公安机关交通管理部门可以在运输企业驾驶人、警风警纪监督员、社会志愿者等群体中聘用社会辅助考试人员，并负责管理和支付薪酬。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1033, "section": "第二部分 考试业务知识", "header": "3.2.127", "question": "社会辅助考试人员在考试员的监督管理下，可以承担考生身份验证、考试引导、考场巡查、远程监控及小型汽车评判等工作。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1034, "section": "第二部分 考试业务知识", "header": "3.2.128", "question": "驾驶培训机构人员不得担任社会辅助考试人员。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1035, "section": "第二部分 考试业务知识", "header": "3.2.129", "question": "公安机关可以无偿使用社会考场。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1036, "section": "第二部分 考试业务知识", "header": "3.2.130", "question": "公安机关交通管理部门聘用社会辅助考试人员所需经费，可以借助社会力量由人员所在的企业提供保障。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1037, "section": "第二部分 考试业务知识", "header": "3.2.131", "question": "车辆管理所受理恢复驾驶资格业务后，应当按照预约时间安排科目一考试。申请人应当在机动车驾驶证注销后二年内完成考试，逾期未完成考试的，终止恢复驾驶资格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1038, "section": "第二部分 考试业务知识", "header": "3.2.132", "question": "考试车辆应当按照相关标准要求安装副制动装置、辅助后视镜和音视频监控系统。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1039, "section": "第二部分 考试业务知识", "header": "3.2.133", "question": "车辆管理所应当提供互联网、电话、“12123”语音服务热线、业务窗口等多种方式，供申请人预约考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1040, "section": "第二部分 考试业务知识", "header": "3.2.134", "question": "车辆管理所应当为残疾人申请机动车驾驶证提供方便，在办公、考试场所设置无障碍通道，优先安排考试，提供科目一专用考试机位。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1041, "section": "第二部分 考试业务知识", "header": "3.2.135", "question": "车辆管理所在办理机动车驾驶证业务时，经核查发现记满12分的，应当按规定扣留机动车驾驶证，并书面告知其应当在十五日内接受道路交通安全法律、法规和相关知识的教育和考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1042, "section": "第二部分 考试业务知识", "header": "3.2.136", "question": "考试员分为专职考试员、辅助考试员，其中专职考试员只能用由公安民警担任。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1043, "section": "第二部分 考试业务知识", "header": "3.2.137", "question": "公安机关交通管理部门应当对考试员实行分级管理，其中省级公安机关交通管理部门负责中级和初级考试员的培训、考试和资格证书的核发。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1044, "section": "第二部分 考试业务知识", "header": "3.2.138", "question": "对大型客车、重型牵引挂车、城市公交车、中型客车、大型货车准驾车型，省级公安机关交通管理部门应当根据实际增加山区、隧道、陡坡等复杂道路驾驶考试内容。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1045, "section": "第二部分 考试业务知识", "header": "3.2.139", "question": "申请人申请大型客车、重型牵引挂车、城市公交车、中型客车、大型货车、轻型牵引挂车驾驶证，因当地尚未设立科目二考场的，可以选择省（自治区）内其他考场参加考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1046, "section": "第二部分 考试业务知识", "header": "3.2.140", "question": "代替他人参加机动车驾驶人考试的，车辆管理所应当注销其机动车驾驶 证，一年后才可以申请机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1047, "section": "第三部分 查验业务知识", "header": "", "question": "对登记后上道路行驶的机动车，应当依照法律、行政法规的规定，根据车辆用途、载客载货数量、_______等不同情况，定期进行安全技术检验。", "options": ["A、使用次数", "B、使用年限", "C、行驶里程", "D、维修次数"], "answer": "B", "type": "choice"}, {"id": 1048, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验机构不按照国家安全技术标准进行检验，出具虚假检验结果的，处_______检验费用罚款。", "options": ["A、5倍以上10倍以下", "B、5倍以上20倍以下", "C、1倍以上20倍以下", "D、1倍以上5倍以下"], "answer": "A", "type": "choice"}, {"id": 1049, "section": "第三部分 查验业务知识", "header": "", "question": "应当按照国家机动车安全技术检验标准对机动车进行检验，对检验结果承担法律责任_______。", "options": ["A、公安机关交通管理部门", "B、机动车安全技术检验机构", "C、市场监督管理部门", "D、车辆维修保养企业"], "answer": "B", "type": "choice"}, {"id": 1050, "section": "第三部分 查验业务知识", "header": "", "question": "营运载客汽车5年以内每年检验_______次。", "options": ["A、4", "B、3", "C、2", "D、1"], "answer": "D", "type": "choice"}, {"id": 1051, "section": "第三部分 查验业务知识", "header": "", "question": "营运载客汽车超过５年的，每_______个月检验１次。", "options": ["A、3", "B、2", "C、12", "D、6"], "answer": "D", "type": "choice"}, {"id": 1052, "section": "第三部分 查验业务知识", "header": "", "question": "载货汽车和大型、中型非营运载客汽车10年以内每年检验_______次。", "options": ["A、4", "B、3", "C、2", "D、1"], "answer": "D", "type": "choice"}, {"id": 1053, "section": "第三部分 查验业务知识", "header": "", "question": "载货汽车和大型、中型非营运载客汽车超过10年的，每_______个月检验１次。", "options": ["A、12", "B、3", "C、4", "D、6"], "answer": "D", "type": "choice"}, {"id": 1054, "section": "第三部分 查验业务知识", "header": "", "question": "小型、微型非营运载客汽车超过15年的，每_______个月检验１次。", "options": ["A、2", "B、3", "C、4", "D、6"], "answer": "D", "type": "choice"}, {"id": 1055, "section": "第三部分 查验业务知识", "header": "", "question": "机动车生产企业经国家机动车产品主管部门许可生产的机动车型，不执行机动车国家安全技术标准或者不严格进行机动车成品质量检验，致使质量不合格的机动车出厂销售的，由_______的有关规定给予处罚。", "options": ["A、公安机关交通管理部门按《中华人民共和国道路交通安全法》", "B、市场监督管理部门依照《中华人民共和国产品质量法》", "C、价格主管部门依照《中华人民共和国价格法》", "D、市场监督管理部门吊销营业执照"], "answer": "B", "type": "choice"}, {"id": 1056, "section": "第三部分 查验业务知识", "header": "", "question": "公安机关交通管理部门、机动车安全技术检验机构不得要求机动车到指定的场所进行维修、保养。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1057, "section": "第三部分 查验业务知识", "header": "", "question": "公安机关交通管理部门应当依法对机动车安全技术检验机构出具虚假检验结果情况进行监督管理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1058, "section": "第三部分 查验业务知识", "header": "", "question": "公路监督检查的专用车辆，应当依照公路法的规定，设置统一的标志和示警灯。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1059, "section": "第三部分 查验业务知识", "header": "", "question": "机动车喷涂、粘贴标识或者车身广告的，不得影响安全驾驶。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1060, "section": "第三部分 查验业务知识", "header": "", "question": "警车、消防车、救护车、工程救险车应当按照规定喷涂标志图案，安装警报器、标志灯具。其他机动车经过车管所同意可以喷涂、安装、使用上述车辆专用的或者与其相类似的标志图案、警报器或者标志灯具。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1061, "section": "第三部分 查验业务知识", "header": "", "question": "任何单位或者个人不得拼装机动车或者擅自改变机动车已登记的结构、构造或者特征。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1062, "section": "第三部分 查验业务知识", "header": "", "question": "达到报废标准的机动车，进行安全技术检验合格后，在确保安全的情况下允许上道路行驶。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1063, "section": "第三部分 查验业务知识", "header": "", "question": "已注册登记的机动车进行安全技术检验时，机动车行驶证记载的登记内容与该机动车的有关情况不符，或者未按照规定提供机动车交强险凭证和车船税纳税或免税证明的，不予通过检验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1064, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验项目由国务院公安部门规定。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1065, "section": "第三部分 查验业务知识", "header": "", "question": "国家对机动车实行登记制度。机动车经公安机关交通管理部门登记后，方可上道路行驶。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1066, "section": "第三部分 查验业务知识", "header": "", "question": "国家机动车产品主管部门未按照机动车国家安全技术标准严格审查，许可不合格机动车型投入生产的，对负有责任的主管人员和其他责任人员给予降级或者撤职的行政处分。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1067, "section": "第三部分 查验业务知识", "header": "", "question": "_______不需要到车辆管理所申请变更登记。", "options": ["A、改变车身颜色", "B、小型客车加装出入口踏步件", "C、因质量问题，制造厂更换整车", "D、变更机动车使用性质"], "answer": "B", "type": "choice"}, {"id": 1068, "section": "第三部分 查验业务知识", "header": "", "question": "办理_______业务时，需要提交安全技术检验合格证明。", "options": ["A、变更车身颜色", "B、更换车身或车架", "C、变更使用性质", "D、机动车所有人的住所迁出车辆管理所管辖区域"], "answer": "B", "type": "choice"}, {"id": 1069, "section": "第三部分 查验业务知识", "header": "", "question": "办理_______业务时，需要提交安全技术检验合格证明。", "options": ["A、变更车身颜色", "B、变更使用性质", "C、更换发动机", "D、机动车所有人的住所迁入车辆管理所管辖区"], "answer": "C", "type": "choice"}, {"id": 1070, "section": "第三部分 查验业务知识", "header": "", "question": "对于机动车转出后尚未办理转入前，因交通事故等原因更换了发动机、车身或者车架的,应当_______。", "options": ["A、由转出地车管所办理变更登记", "B、不予办理转入", "C、由转入地车管所办理转入时一并办理变更登记", "D、只办理转入"], "answer": "C", "type": "choice"}, {"id": 1071, "section": "第三部分 查验业务知识", "header": "", "question": "以下变更登记中，不需要查验机动车的是_______。", "options": ["A、变更车身颜色", "B、更换车身或车架", "C、变更使用性质", "D、办理共同所有人姓名变更登记，变更后机动车所有人住所在车辆管理所管辖区域内的"], "answer": "D", "type": "choice"}, {"id": 1072, "section": "第三部分 查验业务知识", "header": "", "question": "办理_______业务时，不需要查验机动车。", "options": ["A、注册登记", "B、变更颜色", "C、变更使用性质", "D、抵押登记"], "answer": "D", "type": "choice"}, {"id": 1073, "section": "第三部分 查验业务知识", "header": "", "question": "机动车在被盗期间车辆识别代号被改动的，车辆管理所应当凭有关技术鉴定证明或者公安机关的发还证明_______。", "options": ["A、按照改动后的车辆识别代号办理变更备案", "B、按照登记的原车辆识别代号打刻后办理变更备案", "C、重新编制车辆识别代号办理变更", "D、不再办理变更"], "answer": "B", "type": "choice"}, {"id": 1074, "section": "第三部分 查验业务知识", "header": "", "question": "办理核发检验合格标志的业务时，不审查_______。", "options": ["A、机动车所有人身份证明", "B、行驶证", "C、机动车交通事故责任强制保险凭证", "D、本年度的车船税纳税或者免税证明"], "answer": "A", "type": "choice"}, {"id": 1075, "section": "第三部分 查验业务知识", "header": "", "question": "公安机关交通管理部门收到教育行政部门送来的校车使用许可征求意见材料后，应当在_______内通知申请人交验机动车。", "options": ["A、1日", "B、2日", "C、5日", "D、10日"], "answer": "A", "type": "choice"}, {"id": 1076, "section": "第三部分 查验业务知识", "header": "", "question": "关于申请注册登记时免予安全技术检验的机动车应进行安全技术检验，表述错误的是______。", "options": ["A、国产机动车出厂后两年内未申请注册登记的", "B、经海关进口的机动车进口后两年内未申请注册登记的", "C、机动车出厂后两年内未申请注册登记的", "D、申请注册登记前发生交通事故的"], "answer": "C", "type": "choice"}, {"id": 1077, "section": "第三部分 查验业务知识", "header": ""
