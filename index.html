tion": "第四部分 驾驶证业务知识", "header": "3.2.53", "question": "对初次申领机动车驾驶证的驾驶人在实习期内记满12分的，由计算机管理系统自动注销机动车驾驶证。未收回机动车驾驶证的，档案管理岗每月从计算机管理系统下载并打印注销信息，由公安机关交通管理部门按照规定公告作废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1936, "section": "第四部分 驾驶证业务知识", "header": "3.2.54", "question": "在户籍地以外居住的内地居民，计算机管理系统中的\"住址\"，按照公安机关核发的居住证明记载的地址录入。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1937, "section": "第四部分 驾驶证业务知识", "header": "3.2.55", "question": "办理机动车驾驶证注销业务时，属于被吊销的，机动车驾驶证的注销日期应按照《公安交通管理转递通知书》签注的生效日期录入。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1938, "section": "第四部分 驾驶证业务知识", "header": "3.2.56", "question": "转入地车辆管理所退档时，在退办凭证上写明退档原因，直接交机动车所有人。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1939, "section": "第四部分 驾驶证业务知识", "header": "4.1.1", "question": "对临时入境人员申请临时驾驶________许可的，持入出境身份证件、境外机动车驾驶证即可申请，免予身体条件检查、提交身体条件证明。 ①小型汽车②摩托车③大中型客车", "options": ["A、①", "B、②", "C、①②", "D、①③"], "answer": "C", "type": "choice"}, {"id": 1940, "section": "第四部分 驾驶证业务知识", "header": "4.1.2", "question": "小型汽车驾驶证全国\"一证通考\"自________起在全国全面推行。", "options": ["A、2019年5月1日", "B、2019年6月1日", "C、2019年9月1日", "D、2019年10月1日"], "answer": "B", "type": "choice"}, {"id": 1941, "section": "第四部分 驾驶证业务知识", "header": "4.1.3", "question": "普通二轮摩托车准驾车型代号为________。", "options": ["A、D", "B、M", "C、E", "D、F"], "answer": "C", "type": "choice"}, {"id": 1942, "section": "第四部分 驾驶证业务知识", "header": "4.1.4", "question": "低速载货汽车准驾车型代号为________。", "options": ["A、C1", "B、C2", "C、C3", "D、C4"], "answer": "C", "type": "choice"}, {"id": 1943, "section": "第四部分 驾驶证业务知识", "header": "4.1.5", "question": "申请人在学车专用标识签注的指导人员随车指导下，使用符合规定的机动车学习驾驶中有道路交通安全违法行为或者发生交通事故的，________承担责任。", "options": ["A、不", "B、申请人", "C、随车指导人员", "D、申请人和随车指导人员"], "answer": "C", "type": "choice"}, {"id": 1944, "section": "第四部分 驾驶证业务知识", "header": "4.1.6", "question": "对申请材料不齐全或者不符合法定形式的，应当一次___告知申请人需要补正的全部内容。", "options": ["A、书面", "B、电子", "C、书面或者电子", "D、口头"], "answer": "C", "type": "choice"}, {"id": 1945, "section": "第四部分 驾驶证业务知识", "header": "4.1.7", "question": "办理持境外机动车驾驶证申领机动车驾驶证业务时，机动车驾驶证的初次领证日期应当按照________录入。", "options": ["A、受理申请日期", "B、核发驾驶证日期", "C、科目考试合格日期", "D、领取境外机动车驾驶证的日期"], "answer": "B", "type": "choice"}, {"id": 1946, "section": "第四部分 驾驶证业务知识", "header": "4.1.8", "question": "办理自愿降级换证业务时，机动车驾驶证的有效期起始日期应当按照________录入。", "options": ["A、受理申请日期", "B、核发驾驶证日期", "C、原驾驶证有效期起始日期", "D、原驾驶证有效期截止日期"], "answer": "C", "type": "choice"}, {"id": 1947, "section": "第四部分 驾驶证业务知识", "header": "4.1.9", "question": "为了规范________，根据《中华人民共和国道路交通安全法》及其实施条例、《中华人民共和国行政许可法》，制定《机动车驾驶证申领和使用》。", "options": ["A、机动车驾驶证申领和使用", "B、保障道路交通安全", "C、保护公民、法人和其他组织的合法权益", "D、以上均是"], "answer": "D", "type": "choice"}, {"id": 1948, "section": "第四部分 驾驶证业务知识", "header": "4.1.10", "question": "申请普通三轮摩托车、普通二轮摩托车、低速载货汽车、三轮汽车或者轮式自行机械车准驾车型时，年龄在59周岁以上的，学习驾驶证明有效期截止日期按照申请人满________生日录入。", "options": ["A、62周岁", "B、61周岁", "C、60周岁", "D、59周岁"], "answer": "B", "type": "choice"}, {"id": 1949, "section": "第四部分 驾驶证业务知识", "header": "4.1.11", "question": "延期办理驾驶证期满换证、审验、提交身体条件证明期限________。", "options": ["A、最长不超过一年", "B、最长不超过二年", "C、最长不超过三年", "D、无期限"], "answer": "D", "type": "choice"}, {"id": 1950, "section": "第四部分 驾驶证业务知识", "header": "4.1.12", "question": "公安机关交通管理部门应当________向辖区内交通运输主管部门、运输企业通报机动车驾驶人的道路交通安全违法行为、记分和交通事故等情况。", "options": ["A、每周", "B、每月", "C、每半年", "D、每年"], "answer": "B", "type": "choice"}, {"id": 1951, "section": "第四部分 驾驶证业务知识", "header": "4.1.13", "question": "道路交通安全违法行为累积记分周期（即记分周期）为________，满分为12分，从机动车驾驶证初次领取之日起计算。", "options": ["A、6个月", "B、12个月", "C、6年", "D、10年"], "answer": "B", "type": "choice"}, {"id": 1952, "section": "第四部分 驾驶证业务知识", "header": "4.1.14", "question": "临时机动车驾驶许可工本费标准为每本________。", "options": ["A、5元", "B、10元", "C、15元", "D、20元"], "answer": "B", "type": "choice"}, {"id": 1953, "section": "第四部分 驾驶证业务知识", "header": "4.1.15", "question": "车辆管理所核发的学习驾驶证明应加盖________。", "options": ["A、行政印章", "B、业务专用章", "C、证件印章", "D、业务手续专用名章"], "answer": "B", "type": "choice"}, {"id": 1954, "section": "第四部分 驾驶证业务知识", "header": "4.1.16", "question": "补领机动车驾驶证的收费标准是________。", "options": ["A、10元/本", "B、15元/本", "C、20元/本", "D、30元/本"], "answer": "A", "type": "choice"}, {"id": 1955, "section": "第四部分 驾驶证业务知识", "header": "4.1.17", "question": "在互联网网站公布的机动车驾驶证作废公告，信息保留时间不得少于_____。", "options": ["A、30日", "B、60日", "C、6个月", "D、1年"], "answer": "C", "type": "choice"}, {"id": 1956, "section": "第四部分 驾驶证业务知识", "header": "4.1.18", "question": "车辆管理所办理机动车驾驶证业务使用的印章分为业务专用章、证件专用章、个人名章，印章的规格_____统一。", "options": ["A、全省", "B、全国", "C、全市", "D、全所"], "answer": "B", "type": "choice"}, {"id": 1957, "section": "第四部分 驾驶证业务知识", "header": "4.1.19", "question": "销毁机动车驾驶证档案时，车辆管理所应当对需要销毁的档案登记造册，_____。", "options": ["A、可直接销毁", "B、并报告所领导后方可销毁", "C、并报告所属直辖市、设区的市或者相当于同级公安机关交通管理部门后，方可销毁。", "D、并书面报告所属直辖市、设区的市或者相当于同级公安机关交通管理部门，经批准后方可销毁"], "answer": "D", "type": "choice"}, {"id": 1958, "section": "第四部分 驾驶证业务知识", "header": "4.1.20", "question": "持A1准驾车型的，准予驾驶_____准驾车型。", "options": ["A、A2", "B、A3", "C、N", "D、P"], "answer": "B", "type": "choice"}, {"id": 1959, "section": "第四部分 驾驶证业务知识", "header": "4.1.21", "question": "持A2准驾车型的，准予驾驶_____准驾车型。", "options": ["A、A1", "B、A3", "C、E", "D、B1"], "answer": "D", "type": "choice"}, {"id": 1960, "section": "第四部分 驾驶证业务知识", "header": "4.1.22", "question": "持A3准驾车型的，准予驾驶_____准驾车型。", "options": ["A、B1", "B、B2", "C、M", "D、C1"], "answer": "D", "type": "choice"}, {"id": 1961, "section": "第四部分 驾驶证业务知识", "header": "4.1.23", "question": "持B2准驾车型的，不准驾驶_____准驾车型。", "options": ["A、C1", "B、C2", "C、B1", "D、M"], "answer": "C", "type": "choice"}, {"id": 1962, "section": "第四部分 驾驶证业务知识", "header": "4.1.24", "question": "机动车驾驶证主页和副页上的签注内容应使用专用打字机打印；对于打印汉字库中没有的汉字，_____。", "options": ["A、可留空", "B、可用黑色墨水笔手工填写", "C、可用蓝色墨水笔手工填写", "D、可用红色墨水笔手工填写"], "answer": "B", "type": "choice"}, {"id": 1963, "section": "第四部分 驾驶证业务知识", "header": "4.1.25", "question": "办理增加准驾车型申领业务时，机动车驾驶证的有效期起始日期应当按照_____签注。", "options": ["A、受理申请日期", "B、核发驾驶证日期", "C、原机动车驾驶证有效期起始日期", "D、科目三考试合格日期"], "answer": "C", "type": "choice"}, {"id": 1964, "section": "第四部分 驾驶证业务知识", "header": "4.1.26", "question": "下面关于查阅机动车驾驶证档案的规定，不符合工作规范要求的是_____。", "options": ["A、由档案管理人员报经业务领导批准后查阅", "B、应当在档案查阅室进行，档案管理人员应当在场", "C、需要出具证明或者复印档案资料的，由档案管理人员直接办理", "D、已入库的机动车驾驶证档案原则上不得出库。"], "answer": "C", "type": "choice"}, {"id": 1965, "section": "第四部分 驾驶证业务知识", "header": "4.1.27", "question": "省级公安机关交通管理部门应当通过监管系统，____对机动车驾驶人考试进行监控、分析，及时查处、通报发现的问题。", "options": ["A、每日", "B、每周", "C、每月", "D、每年"], "answer": "C", "type": "choice"}, {"id": 1966, "section": "第四部分 驾驶证业务知识", "header": "4.1.28", "question": "机动车驾驶人有____，由公安机关交通管理部门处二百元以上五百元以下罚款。", "options": ["A、驾驶机动车未按规定粘贴、悬挂实习标志或者残疾人机动车专用标志的", "B、伪造、变造或者使用伪造、变造的机动车驾驶证的", "C、逾期不参加审验仍驾驶机动车的", "D、机动车驾驶人补领机动车驾驶证后，继续使用原机动车驾驶证的"], "answer": "C", "type": "choice"}, {"id": 1967, "section": "第四部分 驾驶证业务知识", "header": "4.1.29", "question": "机动车驾驶人可以委托代理人代理_____业务。", "options": ["A、初次申领和增加准驾车型申领", "B、持军队、武装警察部队机动车驾驶证申领", "C、持境外机动车驾驶证申领", "D、换证、补证、提交身体条件证明、提交审验材料、延期办理和注销"], "answer": "D", "type": "choice"}, {"id": 1968, "section": "第四部分 驾驶证业务知识", "header": "4.1.30", "question": "《机动车驾驶证申领和使用规定》（公安部令第162号）自_____起施行。", "options": ["A、2022年1月1日", "B、2022年3月1日", "C、2022年4月1日", "D、2022年5月1日"], "answer": "C", "type": "choice"}, {"id": 1969, "section": "第四部分 驾驶证业务知识", "header": "4.1.31", "question": "县级公安机关交通管理部门车辆管理所办理机动车驾驶证业务的范围和办理条件由_____确定。", "options": ["A、公安部交通管理局", "B、省级公安机关交通管理部门", "C、设区的市或者相当于同级的公安机关交通管理部门", "D、县级公安机关"], "answer": "B", "type": "choice"}, {"id": 1970, "section": "第四部分 驾驶证业务知识", "header": "4.1.32", "question": "车辆管理所办理机动车驾驶证业务时，应当于业务办结后_____内在计算机管理系统中归档，并在_____内将信息上传到全国交通管理信息系统。", "options": ["A、一个工作日  24小时", "B、两个工作日  24小时", "C、两个工作日  36小时", "D、三个工作日  48小时"], "answer": "C", "type": "choice"}, {"id": 1971, "section": "第四部分 驾驶证业务知识", "header": "4.1.33", "question": "取得校车驾驶资格，应当取得相应准驾车型驾驶证并具有_____以上驾驶经历，", "options": ["A、一年", "B、两年", "C、三年", "D、五年"], "answer": "C", "type": "choice"}, {"id": 1972, "section": "第四部分 驾驶证业务知识", "header": "4.1.34", "question": "取得校车驾驶资格，应当最近连续_____记分周期内没有被记满12分记录。", "options": ["A、一个", "B、两个", "C、三个", "D、五个"], "answer": "C", "type": "choice"}, {"id": 1973, "section": "第四部分 驾驶证业务知识", "header": "4.1.35", "question": "小型汽车准驾车型驾驶证准予驾驶_____的客车。", "options": ["A、所有7座以下", "B、所有9座以下", "C、车辆类型规格为小型、微型", "D、所有悬挂小型汽车号牌"], "answer": "C", "type": "choice"}, {"id": 1974, "section": "第四部分 驾驶证业务知识", "header": "4.1.36", "question": "对持有外国人永久居留身份证的办理机动车驾驶证业务时，综合应用平台内\"身份证明名称\"应选择_____。", "options": ["A、境外人员身份证明", "B、外交人员身份证明", "C、外国人永久居留身份证", "D、居民身份证"], "answer": "C", "type": "choice"}, {"id": 1975, "section": "第四部分 驾驶证业务知识", "header": "4.2.1", "question": "车辆管理所在受理机动车驾驶证申请时，对不符合申请条件或者受理申请后经审查不符合法律、法规和规章规定的，应当出具《不予受理/许可申请决定书》，告知申请人不予受理、不予许可的理由。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1976, "section": "第四部分 驾驶证业务知识", "header": "4.2.2", "question": "车辆管理所应当将法律、行政法规和《机动车驾驶证申领和使用规定》的有关办理机动车驾驶证的事项、条件、依据、程序、期限以及收费标准、需要提交的全部材料的目录和申请表示范文本等在办公场所公示。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1977, "section": "第四部分 驾驶证业务知识", "header": "4.2.3", "question": "互联网交通安全综合服务管理平台信息管理系统数据库标准和软件全省统一。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1978, "section": "第四部分 驾驶证业务知识", "header": "4.2.4", "question": "申请人使用互联网交通安全综合服务管理平台办理机动车驾驶证业务的，经过身份验证后，可以通过网上提交申请。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1979, "section": "第四部分 驾驶证业务知识", "header": "4.2.5", "question": "属于机动车驾驶证被吊销的，机动车驾驶证的注销日期应按照《公安交通管理转递通知书》签注的生效日期录入。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1980, "section": "第四部分 驾驶证业务知识", "header": "4.2.6", "question": "中型客车准驾车型驾驶证可以驾驶10人以上、19人以下的城市公共汽车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1981, "section": "第四部分 驾驶证业务知识", "header": "4.2.7", "question": "销毁机动车驾驶证档案应当在指定的地点，监销人和销毁人应当共同在销毁记录上签字。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1982, "section": "第四部分 驾驶证业务知识", "header": "4.2.8", "question": "属于机动车驾驶证被撤销的，机动车驾驶证的注销日期应按照车辆管理所录入注销信息的日期录入。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1983, "section": "第四部分 驾驶证业务知识", "header": "4.2.9", "question": "记载销毁机动车驾驶证档案情况的登记簿和销毁记录保留两年后销毁。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1984, "section": "第四部分 驾驶证业务知识", "header": "4.2.10", "question": "持A1准驾车型驾驶证的，准予驾驶A2准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1985, "section": "第四部分 驾驶证业务知识", "header": "4.2.11", "question": "持A3准驾车型驾驶证的，准予驾驶B1准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1986, "section": "第四部分 驾驶证业务知识", "header": "4.2.12", "question": "持B1准驾车型驾驶证的，准予驾驶B2准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1987, "section": "第四部分 驾驶证业务知识", "header": "4.2.13", "question": "持C1准驾车型驾驶证的，准予驾驶所有9座以下的客车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1988, "section": "第四部分 驾驶证业务知识", "header": "4.2.14", "question": "实行小型汽车、小型自动挡汽车驾驶证自学直考的地方，申请人可以使用加装安全辅助装置的自备机动车，在具备安全驾驶经历等条件的人员随车指导下，按照公安机关交通管理部门指定的路线、时间学习驾驶技能，按照规定申请相应准驾车型的驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1989, "section": "第四部分 驾驶证业务知识", "header": "4.2.15", "question": "持D准驾车型记录的，准予驾驶E、F准驾车型。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1990, "section": "第四部分 驾驶证业务知识", "header": "4.2.16", "question": "中型客车的准驾车型代号为B1。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1991, "section": "第四部分 驾驶证业务知识", "header": "4.2.17", "question": "中华人民共和国机动车驾驶证由证夹、主页、副页三部分组成。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1992, "section": "第四部分 驾驶证业务知识", "header": "4.2.18", "question": "机动车驾驶证证件专用章为红色，使用红色紫外荧光防伪油墨印刷。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1993, "section": "第四部分 驾驶证业务知识", "header": "4.2.19", "question": "机动车驾驶证的塑封套可使用普通的塑封膜。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1994, "section": "第四部分 驾驶证业务知识", "header": "4.2.20", "question": "车辆管理所办理机动车驾驶证业务，应当依法受理申请人的申请，审核申请人提交的资料，对符合条件的，按照规定的标准、程序和期限办理机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1995, "section": "第四部分 驾驶证业务知识", "header": "4.2.21", "question": "车辆管理所应当使用机动车驾驶证计算机管理系统核发、打印机动车驾驶证，不使用计算机管理系统核发、打印的机动车驾驶证仅在本地范围内短期有效。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1996, "section": "第四部分 驾驶证业务知识", "header": "4.2.22", "question": "《机动车驾驶证申领和使用规定》中所称\"以上\"、\"以下\"均不包含本数在内。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1997, "section": "第四部分 驾驶证业务知识", "header": "4.2.23", "question": "《机动车驾驶证申领和使用规定》中所称\"一日\"、\"三日\"、\"五日\"，是指工作日，不包括节假日。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1998, "section": "第四部分 驾驶证业务知识", "header": "4.2.24", "question": "《机动车驾驶证申领和使用规定》中所称\"日\"、是指工作日，不包括节假日。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1999, "section": "第四部分 驾驶证业务知识", "header": "4.2.25", "question": "国家之间对机动车驾驶证有互相认可协议的，按照协议办理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2000, "section": "第四部分 驾驶证业务知识", "header": "4.2.26", "question": "国家之间签订有关协定涉及机动车驾驶证的，按照协定执行。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2001, "section": "第四部分 驾驶证业务知识", "header": "4.2.27", "question": "机动车驾驶人在实习期内驾驶机动车的，应当在车身后部粘贴或者悬挂统一式样的实习标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2002, "section": "第四部分 驾驶证业务知识", "header": "4.2.28", "question": "申请机动车驾驶证时，申请人提交的证明、凭证齐全、符合法定形式的，车辆管理所应当受理，并按规定审核申请人的机动车驾驶证申请条件。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2003, "section": "第四部分 驾驶证业务知识", "header": "4.2.29", "question": "某机动车驾驶人持有C1E驾驶证，则表明此驾驶人是初次申领C1准驾车型，再通过增加取得E准驾车型的。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2004, "section": "第四部分 驾驶证业务知识", "header": "4.2.30", "question": "某机动车驾驶人原持有D驾驶证，通过增加取得B2准驾资格，车辆管理所应当在机动车驾驶证\"准驾车型\"栏内签注\"DB2\"。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2005, "section": "第四部分 驾驶证业务知识", "header": "4.2.31", "question": "省级、设区的市或者相当于同级的公安机关交通管理部门应当在互联网上发布信息，便于群众查阅办理机动车驾驶证的有关规定，查询驾驶证使用状态、交通违法及记分等情况，下载、使用有关表格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2006, "section": "第四部分 驾驶证业务知识", "header": "4.2.32", "question": "车辆管理所及其工作人员不得泄露机动车驾驶证档案中的个人信息。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2007, "section": "第四部分 驾驶证业务知识", "header": "4.2.33", "question": "实习标志、残疾人机动车专用标志式样，应当在车辆管理所业务办公大厅公布。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2008, "section": "第四部分 驾驶证业务知识", "header": "4.2.34", "question": "持A3驾驶证的机动车驾驶人，在实习期内可以驾驶公共汽车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2009, "section": "第四部分 驾驶证业务知识", "header": "4.2.35", "question": "临时机动车驾驶许可应当随身携带，并与所持境外机动车驾驶证及其中文翻译文本同时使用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2010, "section": "第四部分 驾驶证业务知识", "header": "4.2.36", "question": "车辆管理所应当通过机动车驾驶证业务监管系统每月对机动车驾驶人考试、机动车驾驶证业务进行监控、分析。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2011, "section": "第四部分 驾驶证业务知识", "header": "4.2.37", "question": "公安机关交通管理部门应当按照就近办理、便捷办理的原则，推进在驾驶人考场、政务服务大厅等地设置服务站点，方便申请人办理机动车驾驶证业务，并在办公场所或互联网公示辖区内的业务办理网点、地址、联系电话、办公时间和业务范围。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2012, "section": "第四部分 驾驶证业务知识", "header": "4.2.38", "question": "车辆管理所应当使用全国统一的计算机管理系统办理机动车驾驶证业 务、核发机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2013, "section": "第四部分 驾驶证业务知识", "header": "4.2.39", "question": "机动车驾驶人可以委托代理人代理换证、补证、提交身体条件证明和延期办理业务，但申请注销业务的除外。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2014, "section": "第四部分 驾驶证业务知识", "header": "4.2.40", "question": "计算机管理系统的数据库标准和软件全国统一，能够完整、准确地记录 和存储机动车驾驶证业务办理、驾驶人考试等全过程和经办人员信息， 并能够实时将有关信息传送到全国公安交通管理信息系统。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2015, "section": "第四部分 驾驶证业务知识", "header": "4.2.41", "question": "机动车驾驶证被依法扣押、扣留或者暂扣期间，机动车驾驶人不得申请补发。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2016, "section": "第四部分 驾驶证业务知识", "header": "4.2.42", "question": "车辆管理所办理机动车驾驶证业务，对申请材料不齐全或者不符合法定形式的，应当一次书面或者电子告知申请人需要补正的全部内容。对不符合条件的，应当书面或者电子告知理由。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2017, "section": "第四部分 驾驶证业务知识", "header": "4.2.43", "question": "逾期不参加审验的机动车驾驶人，由公安机关交通管理部门处二百元以上五百元以下罚款。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2018, "section": "第四部分 驾驶证业务知识", "header": "4.2.44", "question": "机动车驾驶人身体条件发生变化不适合驾驶机动车，仍驾驶机动车的，由公安机关交通管理部门处二百元以上五百元以下罚款。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2019, "section": "第四部分 驾驶证业务知识", "header": "4.2.45", "question": "持有大型客车、重型牵引挂车、城市公交车、中型客车、大型货车驾驶证的驾驶人，未按照规定申报从业单位等信息变更的，由公安机关交通管理部门处二十元以上二百元以下罚款。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2020, "section": "第四部分 驾驶证业务知识", "header": "4.2.46", "question": "驾驶人在实习期内单独驾驶机动车上高速公路行驶的，由公安机关交通管理部门处警告或二十元以上二百元以下罚款。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2021, "section": "第四部分 驾驶证业务知识", "header": "4.2.47", "question": "车辆管理所办理互联网换证、补证、审验、延期业务的，不再制作、审查、收存《机动车驾驶证申请表》、《机动车驾驶人身体情况申报表》，不再采集身份证明影像化资料，但仍需收回原机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2022, "section": "第四部分 驾驶证业务知识", "header": "4.2.48", "question": "对内地居民持境外机动车驾驶证申请机动车驾驶证的，车辆管理所受理时应当核查申请人的出入境记录。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2023, "section": "第四部分 驾驶证业务知识", "header": "4.2.49", "question": "年龄在60周岁以上的，不得驾驶大型客车、重型牵引挂车、城市公交车、轮式专用机械车、无轨电车和有轨电车；但只要身体条件许可，仍可驾驶中型客车和大型货车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2024, "section": "第四部分 驾驶证业务知识", "header": "4.2.50", "question": "驾驶机动车，应当依法取得机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2025, "section": "第四部分 驾驶证业务知识", "header": "4.2.51", "question": "申请办理机动车驾驶证业务，应当如实向车辆管理所提交规定的材料，如实申告规定的事项，对其申请材料实质内容的真实性负责。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2026, "section": "第四部分 驾驶证业务知识", "header": "4.2.52", "question": "机动车驾驶证件是准予机动车驾驶人在道路上驾驶机动车的法定证件，包括机动车驾驶证和临时机动车驾驶许可。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2027, "section": "第四部分 驾驶证业务知识", "header": "4.2.53", "question": "车辆管理所在受理增加准驾车型申请至核发机动车驾驶证期间，发现申请人在一个记分周期内记满12分，机动车驾驶证转出及被注销、吊销、撤销，或者申请大型客车、重型牵引挂车、中型客车和大型货车准驾车型，具有规定不得申请大型客车、重型牵引挂车、中型客车、大型货车情形之一的，可以继续预约、考试或者核发机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2028, "section": "第四部分 驾驶证业务知识", "header": "4.2.54", "question": "车辆管理所对申请人的申请条件及提交的材料、申告的事项实质内容进行调查时，应当询问申请人并制作询问笔录，向证明、凭证的核发机关核查。经调查，申请人不符合申请条件的，不予办理；有违法行为的，依法予以处理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2029, "section": "第四部分 驾驶证业务知识", "header": "4.2.55", "question": "未在学习驾驶证明有效期内完成考试的，已考试合格的科目成绩作废；但有正当理由的，经业务领导批准后可以保留。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2030, "section": "第四部分 驾驶证业务知识", "header": "4.2.56", "question": "年龄在70周岁以上的，不得驾驶低速载货汽车、三轮汽车、轻型牵引挂车、普通三轮摩托车、普通二轮摩托车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2031, "section": "第四部分 驾驶证业务知识", "header": "4.2.57", "question": "机动车驾驶人准予驾驶的车型顺序，代表如在同一汽车类驾驶证或者摩 托车类驾驶证内，顺序在前的准驾车型准予驾驶顺序在后的准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2032, "section": "第四部分 驾驶证业务知识", "header": "4.2.58", "question": "机动车驾驶人身体条件发生变化，不适合驾驶机动车的，应当在三十日内到机动车驾驶证核发地车辆管理所申请降低准驾车型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2033, "section": "第四部分 驾驶证业务知识", "header": "4.2.59", "question": "机动车驾驶人应当按照法律、行政法规的规定，定期到公安机关交通管理部门接受审验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2034, "section": "第四部分 驾驶证业务知识", "header": "4.2.60", "question": "机动车驾驶人因服兵役、出国（境）等原因，无法在规定时间内办理驾驶证期满换证、审验、提交身体条件证明的，可以在驾驶证有效期内或者有效期届满一年内向机动车驾驶证核发地车辆管理所申请延期办理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2035, "section": "第四部分 驾驶证业务知识", "header": "4.2.61", "question": "机动车驾驶人在实习期内不得单独驾驶营运客车，应当由持相应或者更高准驾车型驾驶证三年以上的驾驶人陪同。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2036, "section": "第四部分 驾驶证业务知识", "header": "4.2.62", "question": "机动车驾驶人在实习期内不得驾驶执行任务的警车、消防车、救护车、工程救险车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2037, "section": "第四部分 驾驶证业务知识", "header": "4.2.63", "question": "有听力障碍的机动车驾驶人驾驶机动车时，应当佩戴助听设备。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2038, "section": "第四部分 驾驶证业务知识", "header": "4.2.64", "question": "机动车驾驶人联系电话、联系地址等信息发生变化的，不需要向车辆管理所备案。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2039, "section": "第四部分 驾驶证业务知识", "header": "4.2.65", "question": "持有大型客车、重型牵引挂车、城市公交车、中型客车、大型货车驾驶证的驾驶人从业单位等信息发生变化的，从业单位有要求的，应当在信息变更后三十日内，向驾驶证核发地车辆管理所备案。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2040, "section": "第四部分 驾驶证业务知识", "header": "4.2.66", "question": "持有大型客车、重型牵引挂车、城市公交车、中型客车、大型货车驾驶证的驾驶人，联系电话、联系地址等信息发生变化的，应当在信息变更后三十日内，向驾驶证核发地车辆管理所备案；持有其他驾驶证的驾驶人，可在有需要或者方便时备案。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2041, "section": "第四部分 驾驶证业务知识", "header": "4.2.67", "question": "校车驾驶人应当依法取得校车驾驶资格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2042, "section": "第四部分 驾驶证业务知识", "header": "4.2.68", "question": "有致人死亡或者重伤的交通事故责任记录的，终生不能取得校车驾驶资格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2043, "section": "第四部分 驾驶证业务知识", "header": "4.2.69", "question": "有酒后驾驶或者醉酒驾驶机动车记录的，终生不能取得校车驾驶资格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2044, "section": "第四部分 驾驶证业务知识", "header": "4.2.70", "question": "取得校车驾驶资格，应当在最近三年内无驾驶客运车辆超员、超速等严重交通违法行为记录。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2045, "section": "第四部分 驾驶证业务知识", "header": "4.2.71", "question": "申请人可以通过互联网交通安全综合服务管理平台打印或者下载学习驾驶证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2046, "section": "第四部分 驾驶证业务知识", "header": "4.2.72", "question": "申请人在道路上学习驾驶，应当随身携带学习驾驶证明，使用教练车或者学车专用标识签注的自学用车，在教练员或者学车专用标识签注的指导人员随车指导下，按照公安机关交通管理部门指定的路线、时间进行。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2047, "section": "第四部分 驾驶证业务知识", "header": "4.2.73", "question": "取得校车驾驶资格，申请人应当无犯罪记录。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2048, "section": "第四部分 驾驶证业务知识", "header": "4.2.74", "question": "取得校车驾驶资格，申请人应当身心健康，无传染性疾病，无癫痫病、精神病等可能危及行车安全的疾病病史，无酗酒、吸毒行为记录。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2049, "section": "第四部分 驾驶证业务知识", "header": "4.2.75", "question": "隐瞒有关情况或者提供虚假材料申领机动车驾驶证的，申请人在三年内不得再次申领机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2050, "section": "第四部分 驾驶证业务知识", "header": "4.2.76", "question": "申请人在考试过程中有贿赂、舞弊行为的，取消考试资格，已经通过考试的其他科目成绩仍然有效。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2051, "section": "第四部分 驾驶证业务知识", "header": "4.2.77", "question": "机动车驾驶人申请取得校车驾驶资格，应当向县级或者设区的市级教育行政部门提出申请。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2052, "section": "第四部分 驾驶证业务知识", "header": "4.2.78", "question": "车辆管理所应当建立机动车驾驶证档案。机动车驾驶证档案包括实物档案和电子档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2053, "section": "第四部分 驾驶证业务知识", "header": "4.2.79", "question": "机动车驾驶证实物档案应当保存机动车驾驶人提交的资料。保存的资料应当装订成册，并填写档案资料目录，置于资料首页，案卷编号为档案编号。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2054, "section": "第四部分 驾驶证业务知识", "header": "4.2.80", "question": "考试音视频监控资料不属于机动车驾驶证电子档案。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2055, "section": "第四部分 驾驶证业务知识", "header": "4.2.81", "question": "补建的机动车驾驶证档案与原机动车驾驶证档案有同等效力，但档案资料内无省级公安机关交通管理部门批准补建档案的文件和核对公函的除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2056, "section": "第四部分 驾驶证业务知识", "header": "4.2.82", "question": "车辆管理所在嫌疑情况调查处理完毕后，应当将核查、鉴定、检测证明，调查报告、询问笔录、法律文书等材料整理、装订后建立档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2057, "section": "第四部分 驾驶证业务知识", "header": "4.2.83", "question": "车辆管理所民警和文职、聘用人员办理机动车驾驶证业务时，应当使用本人的用户名、密码或者数字身份证书登录计算机管理系统，并定期更换密码；但经过业务领导同意的除外。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2058, "section": "第四部分 驾驶证业务知识", "header": "4.2.84", "question": "办理机动车驾驶证业务，驾驶证管理系统内的\"姓名\"应当按照提交的身份证明及其相应项目载明的内容录入；境外人员姓名按照申请表中翻译后的中文姓名录入。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2059, "section": "第四部分 驾驶证业务知识", "header": "4.2.85", "question": "申请人为自学直考人员的，在道路上学习驾驶时，应当在自学用车上按规定放置、粘贴学车专用标识，自学用车不得搭载随车指导人员以外的其他人员。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2060, "section": "第四部分 驾驶证业务知识", "header": "4.2.86", "question": "机动车驾驶人只能向驾驶证核发地车辆管理所申请补换领驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2061, "section": "第四部分 驾驶证业务知识", "header": "4.2.87", "question": "机动车驾驶证记载和签注内容不包括准予驾驶机动车听力辅助条件。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2062, "section": "第四部分 驾驶证业务知识", "header": "4.2.88", "question": "延期办理驾驶证期满换证、审验、提交身体条件证明期间，机动车驾驶人不得驾驶机动车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2063, "section": "第四部分 驾驶证业务知识", "header": "4.2.89", "question": "为加强对于驾驶证转入时合并办理补证业务的监管，转入地车管所受理此类业务，必须查询到转出地车管所纸质档案相符核对结果信息，才可以核发驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2064, "section": "第四部分 驾驶证业务知识", "header": "4.2.90", "question": "对临时入境人员申请小型汽车、摩托车临时驾驶许可的，持入出境身份证件、境外机动车驾驶证即可申请，应当进行身体条件检查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2065, "section": "第四部分 驾驶证业务知识", "header": "4.2.91", "question": "有视力矫正的机动车驾驶人驾驶机动车时，应当佩戴眼镜。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2066, "section": "第四部分 驾驶证业务知识", "header": "4.2.92", "question": "道路运输企业应当定期将聘用的机动车驾驶人向所在地公安机关交通管理部门备案，督促及时处理道路交通安全违法行为、交通事故和参加机动车驾驶证审验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2067, "section": "第四部分 驾驶证业务知识", "header": "4.2.93", "question": "公安机关交通管理部门应当会同卫生健康行政部门在办公场所和互联网公示辖区内可以出具有关身体条件证明的医疗机构名称、地址及联系方式。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2068, "section": "第四部分 驾驶证业务知识", "header": "4.2.94", "question": "临时入境人员在中国境内短期停留的，临时驾驶许可最长有效期为3个月。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2069, "section": "第四部分 驾驶证业务知识", "header": "4.2.95", "question": "办理除残疾人专用小型自动挡载客汽车外其他机动车驾驶证业务时，提交的身体条件证明应当由县级、部队团级以上医疗机构，或者经地市级以上卫生健康行政部门认定的具有健康体检资质的二级以上医院、乡镇卫生院、社区卫生服务中心、健康体检中心等医疗机构出具。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2070, "section": "第四部分 驾驶证业务知识", "header": "4.2.96", "question": "公安机关交通管理部门应当与教育行政部门和学校建立校车驾驶人的信息交换机制，每月通报校车驾驶人的交通违法、交通事故和审验等情况。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2071, "section": "第四部分 驾驶证业务知识", "header": "4.2.97", "question": "个人用户申请变更考试地业务受理成功的，由转入地或转出地公安机关交通管理部门互联网服务平台提供驾驶人考试预约服务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2072, "section": "第四部分 驾驶证业务知识", "header": "4.2.98", "question": "公安机关交通管理部门及其交通警察、警务辅助人员办理机动车驾驶证业务、开展机动车驾驶人考试工作，应当接受监察机关、公安机关督察审计部门等依法实施的监督。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2073, "section": "第四部分 驾驶证业务知识", "header": "4.2.99", "question": "科目三安全文明驾驶常识第五次预约考试仍不合格的，在学习驾驶证明有效期内，已通过的道路驾驶技能考试成绩继续有效。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2074, "section": "第四部分 驾驶证业务知识", "header": "4.2.100", "question": "公安机关交通管理部门及其交通警察、警务辅助人员办理机动车驾驶证业务、开展机动车驾驶人考试工作，应当自觉接受社会和公民的监督。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2075, "section": "第四部分 驾驶证业务知识", "header": "4.2.101", "question": "机动车驾驶证、临时机动车驾驶许可和学习驾驶证明的式样由公安部统一制定并监制。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2076, "section": "第四部分 驾驶证业务知识", "header": "4.2.102", "question": "年龄在70周岁以上能够通过记忆力、判断力、反应力等能力测试的，可以申请小型汽车、小型自动挡汽车、轻便摩托车准驾车型的机动车驾驶证，不可以申请残疾人专用小型自动挡载客汽车准驾车型的机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2077, "section": "第四部分 驾驶证业务知识", "header": "4.2.103", "question": "年龄在70周岁以上的机动车驾驶人发生责任交通事故造成人员重伤或者死亡的，应当在本记分周期结束后三十日内到公安机关交通管理部门接受审验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2078, "section": "第四部分 驾驶证业务知识", "header": "4.2.104", "question": "机动车驾驶证、临时机动车驾驶许可和学习驾驶证明的制作应当按照中华人民共和国公共安全行业标准《中华人民共和国机动车驾驶证件》执行。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2079, "section": "第四部分 驾驶证业务知识", "header": "4.2.105", "question": "汽车类驾驶证是指大型客车、重型牵引挂车、城市公交车、中型客车、 大型货车、小型汽车、小型自动挡汽车、低速载货汽车、三轮汽车、 残疾人专用小型自动挡汽车、轻型牵引挂车、轮式专用机械车、无轨 电车、有轨电车准驾车型驾驶证。摩托车类驾驶证是指普通三轮摩托 车、普通二轮摩托车、轻便摩托车准驾车型驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2080, "section": "第五部分 机动车业务知识", "header": "1.1.1", "question": "统一社会信用代码为91330000550549129P，则主体标识码（原组织机构代码）为________。", "options": ["A、550549129", "B、913300005", "C、50549129P", "D、330000550"], "answer": "A", "type": "choice"}, {"id": 2081, "section": "第五部分 机动车业务知识", "header": "1.1.2", "question": "已破产无有效营业执照的企业，其机动车需要办理变更登记、转让登记、解除抵押登记、注销登记、解除质押备案和补、换领机动车登记证书、号牌、行驶证的，身份证明是________。", "options": ["A、市场监督管理部门出具的准予注销登记通知书", "B、依法成立的财产清算机构或者人民法院依法指定的破产管理人出具的有关证明", "C、上级主管部门出具的有关证明", "D、税务部门出具的有关证明"], "answer": "B", "type": "choice"}, {"id": 2082, "section": "第五部分 机动车业务知识", "header": "1.1.3", "question": "已撤销的机关、事业单位、社会团体，其机动车需要办理变更登记、转让登记、解除抵押登记、注销登记、解除质押备案和补、换领机动车登记证书、号牌、行驶证的，身份证明是________。", "options": ["A、市场监督管理部门出具的准予注销登记通知书", "B、依法成立的财产清算机构出具的有关证明", "C、上级主管部门出具的有关证明", "D、税务部门出具的有关证明"], "answer": "C", "type": "choice"}, {"id": 2083, "section": "第五部分 机动车业务知识", "header": "1.1.4", "question": "已注销的企业，其机动车需要办理变更登记、转让登记、解除抵押登记、注销登记、解除质押备案和补、换领机动车登记证书、号牌、行驶证的，身份证明是________。", "options": ["A、市场监督管理部门出具的准予注销登记通知书", "B、依法成立的财产清算机构出具的有关证明", "C、上级主管部门出具的有关证明", "D、税务部门出具的有关证明"], "answer": "A", "type": "choice"}, {"id": 2084, "section": "第五部分 机动车业务知识", "header": "1.1.5", "question": "外国驻华使馆、领馆和外国驻华办事机构、国际组织驻华代表机构的身份证明是________。", "options": ["A、国家外事部门出具的证明", "B、省级外事部门出具的证明", "C、统一社会信用代码证书", "D、该使馆、领馆或者该办事机构、代表机构出具的证明"], "answer": "D", "type": "choice"}, {"id": 2085, "section": "第五部分 机动车业务知识", "header": "1.1.6", "question": "外国驻华使馆、领馆人员、国际组织驻华代表机构人员的身份证明是________。", "options": ["A、《居民身份证》", "B、入境的身份证明和居留证明", "C、外交部核发的有效身份证件", "D、该使馆、领馆或者该办事机构、代表机构出具的证明"], "answer": "C", "type": "choice"}, {"id": 2086, "section": "第五部分 机动车业务知识", "header": "1.1.7", "question": "办理机动车注册登记，收存的来历证明可以是复印件的是________。", "options": ["A、全国统一的机动车销售发票", "B、协助执行通知书", "C、调拨证明", "D、货物进口证明书"], "answer": "C", "type": "choice"}, {"id": 2087, "section": "第五部分 机动车业务知识", "header": "1.1.8", "question": "机关、企业、事业单位和社会团体统一采购并调拨到下属单位未注册登记的机动车，其来历证明是________。", "options": ["A、机动车销售统一发票", "B、该部门出具的调拨证明", "C、机动车销售统一发票和该部门出具的调拨证明", "D、资产主管部门的批准文件"], "answer": "C", "type": "choice"}, {"id": 2088, "section": "第五部分 机动车业务知识", "header": "1.1.9", "question": "资产重组或者资产整体买卖中包含的机动车，其来历证明是________。", "options": ["A、机动车销售统一发票", "B、资产主管部门的批准文件", "C、二手车交易发票", "D、调拨证明"], "answer": "B", "type": "choice"}, {"id": 2089, "section": "第五部分 机动车业务知识", "header": "1.1.10", "question": "办理机动车转让登记，收存的机动车所有权转让的证明、凭证可以是复印件的是________。", "options": ["A、二手车销售发票", "B、《协助执行通知书》", "C、调拨证明", "D、《民事调解书》"], "answer": "D", "type": "choice"}, {"id": 2090, "section": "第五部分 机动车业务知识", "header": "1.1.11", "question": "经公安机关破案发还的被盗抢且已向原机动车所有人理赔完毕的机动车，其来历证明是________。", "options": ["A、权益转让证明书", "B、二手车交易发票", "C、公证书", "D、《民事调解书》"], "answer": "A", "type": "choice"}, {"id": 2091, "section": "第五部分 机动车业务知识", "header": "1.1.12", "question": "继承、赠予、中奖、协议离婚和协议抵偿债务的机动车，其来历证明是________。", "options": ["A、继承、赠予、中奖、协议离婚、协议抵偿债务的相关文书", "B、公证机关出具的《公证书》", "C、继承、赠予、中奖、协议离婚、协议抵偿债务的相关文书或公证机关出具的《公证书》", "D、继承、赠予、中奖、协议离婚、协议抵偿债务的相关文书和公证机关出具的《公证书》"], "answer": "D", "type": "choice"}, {"id": 2092, "section": "第五部分 机动车业务知识", "header": "1.1.13", "question": "机动车在被盗抢骗期间车辆识别代号被改变的，应当________凭有关技术鉴定证明办理变更备案。", "options": ["A、按照改动后的车辆识别代号", "B、打刻原车辆识别代号后", "C、重新编制车辆识别代号", "D、不再"], "answer": "B", "type": "choice"}, {"id": 2093, "section": "第五部分 机动车业务知识", "header": "1.1.14", "question": "办理更换发动机变更登记，登记审核受理岗不审查________。", "options": ["A、机动车所有人身份证明", "B、登记证书", "C、行驶证", "D、发动机销售单位或维修厂开具的发票"], "answer": "D", "type": "choice"}, {"id": 2094, "section": "第五部分 机动车业务知识", "header": "1.1.15", "question": "办理机动车补、换领号牌、行驶证，登记审核受理岗审查________。", "options": ["A、机动车所有人身份证明", "B、机动车查验记录表", "C、遗失证明", "D、登记证书"], "answer": "A", "type": "choice"}, {"id": 2095, "section": "第五部分 机动车业务知识", "header": "1.1.16", "question": "属于购买后尚未注册登记的机动车申请临时行驶车号牌的，受理岗不审查________。", "options": ["A、机动车所有人身份证明", "B、机动车来历证明", "C、机动车交通事故责任强制保险凭证", "D、机动车安全技术检验合格证明"], "answer": "D", "type": "choice"}, {"id": 2096, "section": "第五部分 机动车业务知识", "header": "1.1.17", "question": "不属于进口机动车的进口凭证是________。", "options": ["A、货物进口证明书", "B、进口机动车辆随车检验单", "C、没收走私汽车、摩托车证明书", "D、海关监管车辆进（出）境领（销）牌照通知书"], "answer": "B", "type": "choice"}, {"id": 2097, "section": "第五部分 机动车业务知识", "header": "1.1.18", "question": "进口汽车的进口凭证，是________的货物进口证明书。", "options": ["A、监管地海关出具", "B、国家限定口岸海关签发的", "C、各口岸海关签发的", "D、国家授权的执法部门签发"], "answer": "B", "type": "choice"}, {"id": 2098, "section": "第五部分 机动车业务知识", "header": "1.1.19", "question": "办理解除抵押登记，受理岗不审查________。", "options": ["A、《机动车抵押登记/质押备案申请表》", "B、机动车所有人的身份证明和抵押权人的身份证明", "C、登记证书", "D、行驶证"], "answer": "D", "type": "choice"}, {"id": 2099, "section": "第五部分 机动车业务知识", "header": "1.1.20", "question": "在国外购买的机动车，其来历证明是________。", "options": ["A、机动车销售统一发票", "B、该车销售单位开具的销售发票", "C、该车销售单位开具的销售发票及其翻译文本", "D、销售发票翻译文本"], "answer": "C", "type": "choice"}, {"id": 2100, "section": "第五部分 机动车业务知识", "header": "1.1.21", "question": "机动车所有人查询本人的机动车档案的，车辆管理所审查其________。", "options": ["A、登记证书", "B、身份证明", "C、行驶证", "D、驾驶证"], "answer": "B", "type": "choice"}, {"id": 2101, "section": "第五部分 机动车业务知识", "header": "1.1.22", "question": "机动车档案从办理注销登记之日起保存________后销毁。", "options": ["A、1年", "B、2年", "C、3年", "D、4年"], "answer": "B", "type": "choice"}, {"id": 2102, "section": "第五部分 机动车业务知识", "header": "1.1.23", "question": "属于撤销机动车登记的，机动车档案保存________后销毁。", "options": ["A、1年", "B、2年", "C、3年", "D、4年"], "answer": "C", "type": "choice"}, {"id": 2103, "section": "第五部分 机动车业务知识", "header": "1.1.24", "question": "办理机动车临时行驶车号牌，车辆管理所应留存相关资料并保存________。", "options": ["A、1年", "B、2年", "C、3年", "D、长期"], "answer": "B", "type": "choice"}, {"id": 2104, "section": "第五部分 机动车业务知识", "header": "1.1.25", "question": "校车标牌档案从机动车不再作为校车使用之日起保存________后销毁。", "options": ["A、1年", "B、2年", "C、3年", "D、至机动车办理注销登记"], "answer": "C", "type": "choice"}, {"id": 2105, "section": "第五部分 机动车业务知识", "header": "1.1.26", "question": "办理转让登记，收存的机动车所有权转让的证明、凭证必须为原件的是________。", "options": ["A、《调解书》", "B、《协助执行通知书》", "C、《判决书》", "D、《裁定书》"], "answer": "B", "type": "choice"}, {"id": 2106, "section": "第五部分 机动车业务知识", "header": "1.1.27", "question": "________办理注册登记，受理岗不审查相关主管部门出具的车辆使用性质证明。", "options": ["A、救护车", "B、消防车", "C、工程救险车", "D、载货汽车"], "answer": "D", "type": "choice"}, {"id": 2107, "section": "第五部分 机动车业务知识", "header": "1.1.28", "question": "办理机动车临时行驶车号牌，属于未销售的机动车，受理岗不审查________。", "options": ["A、机动车所有人的身份证明", "B、机动车交通事故责任强制保险凭证", "C、合格证或者进口凭证", "D、机动车来历证明"], "answer": "D", "type": "choice"}, {"id": 2108, "section": "第五部分 机动车业务知识", "header": "1.1.29", "question": "办理注册登记，属于加装肢体残疾人操纵辅助装置的，应当收存________。", "options": ["A、机动车安全技术检验合格证明原件", "B、操纵辅助装置加装证明复印件", "C、操纵辅助装置加装合格证明复印件", "D、操纵辅助装置加装合格证明原件"], "answer": "C", "type": "choice"}, {"id": 2109, "section": "第五部分 机动车业务知识", "header": "1.1.30", "question": "办理因质量问题更换整车的变更登记，应当交还机动车所有人的是原机动车的________。", "options": ["A、车辆购置税完税证明或者免税凭证副联", "B、交通事故责任强制保险凭证", "C、合格证或者进口凭证", "D、来历证明"], "answer": "C", "type": "choice"}, {"id": 2110, "section": "第五部分 机动车业务知识", "header": "1.1.31", "question": "办理共同所有人姓名变更登记，变更后机动车所有人住所在车辆管理所管辖区域内的，应当收存________。", "options": ["A、登记证书复印件", "B、证明夫妻关系的《居民户口簿》或者《结婚证》的复印件；", "C、机动车查验记录表原件", "D、行驶证原件"], "answer": "B", "type": "choice"}, {"id": 2111, "section": "第五部分 机动车业务知识", "header": "1.1.32", "question": "办理抵押登记，应当收存________。", "options": ["A、主合同复印件", "B、抵押合同原件或者复印件", "C、登记证书复印件", "D、行驶证原件"], "answer": "B", "type": "choice"}, {"id": 2112, "section": "第五部分 机动车业务知识", "header": "1.1.33", "question": "下列情形中，属于不予办理抵押登记的是________。", "options": ["A、机动车交通事故责任强制保险不在有效期内", "B、机动车超过检验有效期", "C、机动车的道路交通安全违法行为未处理完毕", "D、机动车被监察机关、人民法院、人民检察院、行政执法部门依法查封、扣押"], "answer": "D", "type": "choice"}, {"id": 2113, "section": "第五部分 机动车业务知识", "header": "1.1.34", "question": "办理机动车报废解体注销登记，不收存________。", "options": ["A、登记证书原件", "B、行驶证原件", "C、机动车所有人身份证明复印件", "D、《报废机动车回收证明》副本"], "answer": "C", "type": "choice"}, {"id": 2114, "section": "第五部分 机动车业务知识", "header": "1.1.35", "question": "车辆管理所办理机动车登记，应当遵循依法、公开、________、便民的原则。", "options": ["A、公平", "B、公正", "C、透明", "D、严格"], "answer": "B", "type": "choice"}, {"id": 2115, "section": "第五部分 机动车业务知识", "header": "1.1.36", "question": "办理核发校车标牌，不存入校车标牌档案的资料是________。", "options": ["A、《校车标牌领取表》原件", "B、校车使用许可复印件", "C、校车运行方案复印件", "D、机动车所有人身份证明复印件"], "answer": "D", "type": "choice"}, {"id": 2116, "section": "第五部分 机动车业务知识", "header": "1.1.37", "question": "企业的身份证明是________。", "options": ["A、组织机构代码证书", "B、营业执照", "C、营业执照以及加盖单位公章的委托书和被委托人的身份证明", "D、主管部门出具的证明"], "answer": "C", "type": "choice"}, {"id": 2117, "section": "第五部分 机动车业务知识", "header": "1.1.38", "question": "________机动车，机动车所有人可以向车辆所在地申请检验合格标志。", "options": ["A、所有的", "B、除危险化学品运输车以外的", "C、除大型载客汽车、校车以外的", "D、除距使用年限不足1年的机动车以外的"], "answer": "C", "type": "choice"}, {"id": 2118, "section": "第五部分 机动车业务知识", "header": "1.1.39", "question": "统一社会信用代码共为________位。", "options": ["A、9", "B、15", "C、17", "D、18"], "answer": "D", "type": "choice"}, {"id": 2119, "section": "第五部分 机动车业务知识", "header": "1.1.40", "question": "办理临时行驶车号牌，属于购买后尚未注册登记的机动车的，不审查________。", "options": ["A、机动车所有人身份证明", "B、机动车来历证明", "C、机动车交通事故责任强制保险凭证", "D、机动车安全技术检验合格证明"], "answer": "D", "type": "choice"}, {"id": 2120, "section": "第五部分 机动车业务知识", "header": "1.1.41", "question": "机动车________不予办理转让登记。", "options": ["A、在抵押登记期间", "B、属于海关监管的，已解除监管或者批准转让的", "C、被监察机关、人民法院、人民检察院、行政执法部门依法查封、扣押的", "D、在质押备案期间"], "answer": "C", "type": "choice"}, {"id": 2121, "section": "第五部分 机动车业务知识", "header": "1.1.42", "question": "以下变更登记业务中办理时限为三日的是________。", "options": ["A、申请机动车转入", "B、共同所有人姓名变更", "C、同一机动车所有人名下机动车的号牌号码互换", "D、因质量问题更换整车"], "answer": "D", "type": "choice"}, {"id": 2122, "section": "第五部分 机动车业务知识", "header": "1.1.43", "question": "办理机动车变更备案业务的办理时限是_______。", "options": ["A、当日", "B、1日", "C、2日", "D、3日"], "answer": "B", "type": "choice"}, {"id": 2123, "section": "第五部分 机动车业务知识", "header": "1.1.44", "question": "已注册登记的小型、微型自动挡载客汽车________肢体残疾人操纵辅助装置的，机动车所有人应当在信息或者事项变更后三十日内，向登记地车辆管理所申请变更备案。", "options": ["A、加装", "B、拆除", "C、更换", "D、以上均需要"], "answer": "D", "type": "choice"}, {"id": 2124, "section": "第五部分 机动车业务知识", "header": "1.1.45", "question": "机动车所有人发现登记内容有错误的，应当及时要求车辆管理所更正。车辆管理所应当自受理之日起________内予以确认。", "options": ["A、一日", "B、二日", "C、三日", "D、五日"], "answer": "D", "type": "choice"}, {"id": 2125, "section": "第五部分 机动车业务知识", "header": "1.1.46", "question": "________申请注册登记前不需要进行安全技术检验。", "options": ["A、进口的机动车", "B、海关监管的机动车", "C、海关进口的机动车", "D、进口的汽车"], "answer": "C", "type": "choice"}, {"id": 2126, "section": "第五部分 机动车业务知识", "header": "1.1.47", "question": "办理机动车业务时，可作为居民的身份证明的是________。", "options": ["A、临时居民身份证", "B、居民身份证补换领凭证", "C、公安机关的户籍证明", "D、居民户口薄"], "answer": "A", "type": "choice"}, {"id": 2127, "section": "第五部分 机动车业务知识", "header": "1.1.48", "question": "《机动车登记规定》中外国人的身份证明，是其所持有的有效护照或者其他国际旅行证件、________签证或者停留、居留许可，以及公安机关出具的住宿登记证明。", "options": ["A、有效", "B、停居留期为三个月以上的有效", "C、停居留期为六个月以上的有效", "D、停居留期为一年以上的有效"], "answer": "B", "type": "choice"}, {"id": 2128, "section": "第五部分 机动车业务知识", "header": "1.1.49", "question": "二手车拍卖企业拍卖的已注册登记机动车，其来历证明是_____。", "options": ["A、拍卖的相关文书", "B、拍卖收据", "C、二手车交易发票", "D、拍卖确认书"], "answer": "C", "type": "choice"}, {"id": 2129, "section": "第五部分 机动车业务知识", "header": "1.1.50", "question": "车辆管理所办理辖区内转让登记的业务时限是_____。", "options": ["A、当日", "B、1日", "C、2日", "D、3日"], "answer": "B", "type": "choice"}, {"id": 2130, "section": "第五部分 机动车业务知识", "header": "1.1.51", "question": "机动车号牌灭失、丢失或者损毁的，机动车所有人向登记地车辆管理所申请补领、换领时，车辆管理所应当自受理之日_____起内补发、换发号牌，", "options": ["A、一日", "B、三日", "C、十五日", "D、三十日"], "answer": "C", "type": "choice"}, {"id": 2131, "section": "第五部分 机动车业务知识", "header": "1.1.52", "question": "机动车检验合格标志灭失、丢失或者损毁，机动车所有人需要补领、换领的，可以持_____向车辆管理所申请补领或者换领。", "options": ["A、机动车所有人身份证明", "B、行驶证", "C、机动车所有人身份证明或者行驶证", "D、机动车所有人身份证明和行驶证"], "answer": "C", "type": "choice"}, {"id": 2132, "section": "第五部分 机动车业务知识", "header": "1.1.53", "question": "撤销机动车驾驶许可的，档案资料保留_____后销毁。", "options": ["A、一年", "B、两年", "C、三年", "D、四年"], "answer": "C", "type": "choice"}, {"id": 2133, "section": "第五部分 机动车业务知识", "header": "1.1.54", "question": "机动车所有人查询本人的机动车档案的，车辆管理所应当审查_____。", "options": ["A、申请报告", "B、身份证明", "C、行驶证", "D、机动车登记证书"], "answer": "B", "type": "choice"}, {"id": 2134, "section": "第五部分 机动车业务知识", "header": "1.2.1", "question": "未注册登记的机动车所有权转让的，属于经人民法院调解、裁定、判决所有权转让的，办理注册登记时，应当审查机动车的所有权转让凭证和原始来历证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2135, "section": "第五部分 机动车业务知识", "header": "1.2.2", "question": "办理注册登记，在机动车交通事故责任强制保险凭证上签注已纳税信息的，收存机动车交通事故责任强制保险凭证原件；属于按照《车船税法》规定予以免征车船税的，不收存车船税纳税或者免税证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2136, "section": "第五部分 机动车业务知识", "header": "1.2.3", "question": "统一社会信用代码在全国范围内是唯一的。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2137, "section": "第五部分 机动车业务知识", "header": "1.2.4", "question": "办理注册登记，车船税纳税或者免税证明复印件应存入机动车档案。其中，在机动车交通责任事故强制保险凭证上签注已纳税信息的，收存机动车交通事故责任强制保险凭证原件。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2138, "section": "第五部分 机动车业务知识", "header": "1.2.5", "question": "办理核发机动车检验合格标志时收存的资料应当保存一年。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2139, "section": "第五部分 机动车业务知识", "header": "1.2.6", "question": "《机动车登记规定》中，在户籍地以外居住的内地居民的住所是公安机关核发的居住证明或者居住登记证明记载的住址。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2140, "section": "第五部分 机动车业务知识", "header": "1.2.7", "question": "办理加装肢体残疾人操纵辅助装置的小型自动挡载客汽车注册登记，受理岗应当审查操纵辅助装置加装合格证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2141, "section": "第五部分 机动车业务知识", "header": "1.2.8", "question": "对机动车所有人因死亡、出境、重病、伤残或者不可抗力等原因不能到场申请补领机动车登记证书的，可以凭相关证明委托代理人代理申请，或者由继承人申请。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2142, "section": "第五部分 机动车业务知识", "header": "1.2.9", "question": "自2015年8月1日起，第三版和第四版《货物进口证明书》将并行签发。在办理进口车注册登记业务时，要按照不同版本的《货物进口证明书》，在公安交通管理综合应用平台选择相应证明书编号的起始字符录入证明书信息。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2143, "section": "第五部分 机动车业务知识", "header": "1.2.10", "question": "机动车所有人可以持登记地以外机动车回收企业出具的报废机动车回收证明，向登记地车辆管理所申请注销登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2144, "section": "第五部分 机动车业务知识", "header": "1.2.11", "question": "机动车所有人在办理完毕机动车档案转出但尚未办理机动车转入前将机动车档案损毁或者丢失的，不可以向转出地车辆管理所申请补建机动车档案。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2145, "section": "第五部分 机动车业务知识", "header": "1.2.12", "question": "公安机关交通管理部门审查校车使用许可申请材料时，应当通过全国交通管理信息系统核查比对行驶证记载信息、校车驾驶人驾驶资格以及校车安全技术检验情况，确认是否一致。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2146, "section": "第五部分 机动车业务知识", "header": "1.2.13", "question": "人民法院调解、裁定或者判决转让的机动车，其来历证明是人民法院出具的已经生效的《调解书》、《裁定书》或者《判决书》。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2147, "section": "第五部分 机动车业务知识", "header": "1.2.14", "question": "转入地车辆管理所办理机动车退档时，只需要在退办凭证上写明退档原因，直接交机动车所有人即可。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2148, "section": "第五部分 机动车业务知识", "header": "1.2.15", "question": "办理使用性质变更为\"预约出租客运\"的变更登记，受理岗审查《机动车查验记录表》。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2149, "section": "第五部分 机动车业务知识", "header": "1.2.16", "question": "同一机动车所有人名下机动车的号牌号码需要互换，申请前，应当将两车的道路交通安全违法行为和交通事故处理完毕。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2150, "section": "第五部分 机动车业务知识", "header": "1.2.17", "question": "办理临时入境机动车号牌、行驶证时，受理岗应当审查中国海关等部门出具的准许机动车入境的凭证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2151, "section": "第五部分 机动车业务知识", "header": "1.2.18", "question": "办理抵押登记，受理岗应当审查并收存公证书。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2152, "section": "第五部分 机动车业务知识", "header": "1.2.19", "question": "已注册登记的载货汽车、挂车加装车用起重尾板的，机动车所有人应当在变更后三十日内，向登记地车辆管理所申请变更备案；拆除起重尾板的，不需要再申请变更备案。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2153, "section": "第五部分 机动车业务知识", "header": "1.2.20", "question": "办理机动车登记时，应当通过自动读取、高拍扫描或者免费复印等方式留存机动车所有人的身份证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2154, "section": "第五部分 机动车业务知识", "header": "1.2.21", "question": "办理注销登记时，应当审查机动车所有人的身份证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2155, "section": "第五部分 机动车业务知识", "header": "1.2.22", "question": "办理转让登记时，应当审查原机动车所有人的身份证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2156, "section": "第五部分 机动车业务知识", "header": "1.2.23", "question": "机关、企业、事业单位和社会团体已注册登记并调拨到下属单位的机动车，其来历证明是该单位出具的调拨证明。被上级单位调回或者调拨到其他下属单位的机动车，其来历证明是上级单位出具的调拨证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2157, "section": "第五部分 机动车业务知识", "header": "1.2.24", "question": "办理转让登记时，属于现机动车所有人住所在车辆管理所管辖区域内的，应当将原行驶证收存在机动车档案内。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2158, "section": "第五部分 机动车业务知识", "header": "1.2.25", "question": "办理转让登记时，属于现机动车所有人住所不在车辆管理所管辖区域内的，应当将行驶证原件收存在机动车档案内。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2159, "section": "第五部分 机动车业务知识", "header": "1.2.26", "question": "办理改变机动车车身颜色变更登记时，应当将原行驶证收存在机动车档案内。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2160, "section": "第五部分 机动车业务知识", "header": "1.2.27", "question": "办理更换发动机变更登记时，应当将原行驶证收存在机动车档案内。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2161, "section": "第五部分 机动车业务知识", "header": "1.2.28", "question": "办理换领登记证书时，属于登记证书签注满后申请换领的，应将原登记证书原件收存在机动车档案内。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2162, "section": "第五部分 机动车业务知识", "header": "1.2.29", "question": "办理机动车登记事项更正时，应当将原行驶证收存在机动车档案内。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2163, "section": "第五部分 机动车业务知识", "header": "1.2.30", "question": "办理注销登记时，属于机动车登记被撤销的，应当将登记证书原件、行驶证原件和《公安交通管理撤销决定书》原件存入机动车档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2164, "section": "第五部分 机动车业务知识", "header": "1.2.31", "question": "办理因质量问题更换整车的变更登记时，需要收回原登记证书并销毁，重新制作、核发登记证书。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2165, "section": "第五部分 机动车业务知识", "header": "1.2.32", "question": "机动车所有人提交的证明、凭证无效的，可以凭有关单位情况说明和责任承诺办理机动车登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2166, "section": "第五部分 机动车业务知识", "header": "1.2.33", "question": "机动车来历证明被涂改或者机动车来历证明记载的机动车所有人与身份证明不符的，不予办理注册登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2167, "section": "第五部分 机动车业务知识", "header": "1.2.34", "question": "机动车被监察机关、人民法院、人民检察院、行政执法部门依法查封、扣押的，不予办理注册登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2168, "section": "第五部分 机动车业务知识", "header": "1.2.35", "question": "机动车属于被盗抢骗的，不予办理注册登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2169, "section": "第五部分 机动车业务知识", "header": "1.2.36", "question": "机动车被监察机关、人民法院、人民检察院、行政执法部门依法查封、扣押的，不予办理变更登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2170, "section": "第五部分 机动车业务知识", "header": "1.2.37", "question": "被监察机关、人民法院、人民检察院、行政执法部门依法没收并拍卖，或者被仲裁机构依法仲裁裁决，或者被监察机关依法处理，或者被人民法院调解、裁定、判决机动车所有权转让时，原机动车所有人未向现机动车所有人提供机动车登记证书、号牌或者行驶证的，现机动车所有人在办理转让登记时，应当提交监察机关或者人民法院出具的未得到机动车登记证书、号牌或者行驶证的协助执行通知书，或者人民检察院、行政执法部门出具的未得到机动车登记证书、号牌或者行驶证的证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2171, "section": "第五部分 机动车业务知识", "header": "1.2.38", "question": "办理抵押登记时,登记审核受理岗应当审查依法订立的抵押合同,不需要审查主合同。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2172, "section": "第五部分 机动车业务知识", "header": "1.2.39", "question": "机动车被监察机关、人民法院、人民检察院、行政执法部门依法查封、扣押的，不予办理解除抵押登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2173, "section": "第五部分 机动车业务知识", "header": "1.2.40", "question": "属于海关监管的机动车，海关未解除监管或者批准转让的，不予办理抵押登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2174, "section": "第五部分 机动车业务知识", "header": "1.2.41", "question": "机动车达到国家规定的强制报废标准或者属于被盗抢骗的，可以办理抵押登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2175, "section": "第五部分 机动车业务知识", "header": "1.2.42", "question": "办理注销登记时，对因机动车质量问题退车的，应当审查机动车所有人身份证明和机动车制造厂或者经销商出具的退车证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2176, "section": "第五部分 机动车业务知识", "header": "1.2.43", "question": "办理注销登记时，对机动车灭失的，应当审查机动车所有人身份证明和机动车灭失证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2177, "section": "第五部分 机动车业务知识", "header": "1.2.44", "question": "仲裁机构仲裁裁决转让的机动车，其来历证明是仲裁裁决书。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2178, "section": "第五部分 机动车业务知识", "header": "1.2.45", "question": "临时行驶车号牌有效期不得超过机动车交通事故责任强制保险有效期。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2179, "section": "第五部分 机动车业务知识", "header": "1.2.46", "question": "《机动车登记规定》中，军人（含武警）的身份证明，是《居民身份证》或者《临时居民身份证》。在未办理《居民身份证》前，是指军队有关部门核发的《军官证》、《文职干部证》、《士兵证》、《离休证》、《退休证》等有效军人身份证件，以及其所在的团级以上单位出具的本人住所证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2180, "section": "第五部分 机动车业务知识", "header": "1.2.47", "question": "新车出口销售需要临时上道路行驶的，车辆管理所核发临时行驶车号牌不得超过三次。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2181, "section": "第五部分 机动车业务知识", "header": "1.2.48", "question": "使用进口整车改装的机动车，其出厂合格证明是机动车改装厂出具的《机动车整车出厂合格证》。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2182, "section": "第五部分 机动车业务知识", "header": "1.2.49", "question": "使用进口底盘改装的机动车，其出厂合格证明是进口机动车底盘的进口凭证和机动车改装厂出具的《机动车整车出厂合格证》。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2183, "section": "第五部分 机动车业务知识", "header": "1.2.50", "question": "使用国产整车改装的机动车，其出厂合格证明是改装前机动车生产厂出具的《机动车整车出厂合格证》和改装的机动车生产厂出具的《机动车整车出厂合格证》。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2184, "section": "第五部分 机动车业务知识", "header": "1.2.51", "question": "办理警车注册登记时，受理岗应当审查并收存《警车号牌审批表》原件。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2185, "section": "第五部分 机动车业务知识", "header": "1.2.52", "question": "办理解除抵押登记，受理岗应当审查并收存抵押权人出具的还款证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2186, "section": "第五部分 机动车业务知识", "header": "1.2.53", "question": "办理进口机动车的注册登记，通过全国进口机动车计算机核查系统比对的，收存《全国进口机动车计算机核查系统核对无误证明书》。通过发证机关查询的，收存发证机关出具的鉴定证明或者传真查询证明原件。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2187, "section": "第五部分 机动车业务知识", "header": "1.2.54", "question": "办理注册登记时，属于救护车、消防车、工程救险车的，应收存车辆使用性质证明复印件。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2188, "section": "第五部分 机动车业务知识", "header": "1.2.55", "question": "办理因质量问题更换整车的变更登记时，应收存更换后的合格证或者进口凭证原件，原机动车的合格证或者进口凭证复印件。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2189, "section": "第五部分 机动车业务知识", "header": "1.2.56", "question": "办理变更备案，属于机动车所有人住所在车辆管理所管辖区域内迁移、机动车所有人姓名（单位名称）、机动车所有人身份证明名称或者号码变更的，受理岗应审查相关事项变更的证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2190, "section": "第五部分 机动车业务知识", "header": "1.2.57", "question": "在海关签发旧版证明书过渡期内，对持海关部门签发的进口摩托车第三版《货物进口证明书》（普通）申请注册登记的，不需要与全国进口机动车计算机核查系统比对。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2191, "section": "第五部分 机动车业务知识", "header": "1.2.58", "question": "办理注册登记时，消费者丢失机动车销售统一发票，无法办理机动车注册登记的，可用机动车销售统一发票存根联复印件加盖销售单位发票专用章或财务专用章代替。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2192, "section": "第五部分 机动车业务知识", "header": "1.2.59", "question": "办理核发检验合格标志、委托核发检验合格标志和补领、换领检验合格标志，不审查机动车所有人身份证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2193, "section": "第五部分 机动车业务知识", "header": "1.2.60", "question": "公安机关交通管理部门应当将教育行政部门征求意见材料、审查资料以及回复意见等材料复印件存入校车标牌档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2194, "section": "第五部分 机动车业务知识", "header": "1.2.61", "question": "车辆管理所办理人民法院、人民检察院、公安机关或者其他行政执法部门依法要求查封、扣押机动车的，应当审查提交的公函或者经办人的工作证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2195, "section": "第五部分 机动车业务知识", "header": "1.2.62", "question": "对持加载统一社会信用代码的登记证（照）办理机动车登记的，在按规定办理登记业务的同时，要一并办理机动车所有人身份证明类型和号码变更备案，签注登记证书，号牌、行驶证不变。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2196, "section": "第五部分 机动车业务知识", "header": "1.2.63", "question": "调查嫌疑车辆的时间不计入机动车登记时限。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2197, "section": "第五部分 机动车业务知识", "header": "2.1.1", "question": "专用校车应当自注册登记之日起每________进行一次安全技术检验。", "options": ["A、三个月", "B、半年", "C、一年", "D、二年"], "answer": "B", "type": "choice"}, {"id": 2198, "section": "第五部分 机动车业务知识", "header": "2.1.2", "question": "校车标牌分前后两块，分别放置于前风窗玻璃________和后风窗玻璃________。", "options": ["A、右下角、右下角", "B、左下角、左下角", "C、右下角、适当位置", "D、适当位置、适当位置"], "answer": "C", "type": "choice"}, {"id": 2199, "section": "第五部分 机动车业务知识", "header": "2.1.3", "question": "学校或者校车服务提供者应当在校车检验有效期满前______内向公安机关交通管理部门申请检验合格标志。", "options": ["A、半个月", "B、一个月", "C、二个月", "D、三个月"], "answer": "B", "type": "choice"}, {"id": 2200, "section": "第五部分 机动车业务知识", "header": "2.1.4", "question": "申请注册登记的，车辆管理所应当自受理申请之日起________内，查验机动车，采集、核对车辆识别代号拓印膜或者电子资料，审查提交的证明、凭证，核发机动车登记证书、号牌、行驶证和检验合格标志。", "options": ["A、1日", "B、2日", "C、3日", "D、7日"], "answer": "B", "type": "choice"}, {"id": 2201, "section": "第五部分 机动车业务知识", "header": "2.1.5", "question": "申请机动车转入的，车辆管理所应当自受理之日起________内，机动车采集、核对车辆识别代号拓印膜或者电子资料，审查相关证明、凭证和机动车电子档案资料，在机动车登记证书上签注转入信息，收回号牌、行驶证，确定新的机动车号牌号码，核发号牌、行驶证和检验合格标志。", "options": ["A、1日", "B、2日", "C、3日", "D、5日"], "answer": "C", "type": "choice"}, {"id": 2202, "section": "第五部分 机动车业务知识", "header": "2.1.6", "question": "申请补领机动车登记证书的，车辆管理所应当自受理之日________起内，审查提交的证明、凭证，补发机动车登记证书。", "options": ["A、1日", "B、2日", "C、3日", "D、5日"], "answer": "A", "type": "choice"}, {"id": 2203, "section": "第五部分 机动车业务知识", "header": "2.1.7", "question": "机动车所有人可以委托代理人代理申请各项机动车登记业务，但________除外。", "options": ["A、共同所有人变更", "B、申请补领机动车登记证书", "C、机动车灭失注销", "D、以上均是"], "answer": "D", "type": "choice"}, {"id": 2204, "section": "第五部分 机动车业务知识", "header": "2.1.8", "question": "机动车所有人向报废机动车回收企业交售机动车的，报废机动车回收企业应当确认机动车，向机动车所有人出具报废机动车回收证明，________内将申请表、机动车登记证书、号牌、行驶证和《报废机动车回收证明》副本提交车辆管理所。", "options": ["A、3日", "B、5日", "C、7日", "D、30日"], "answer": "C", "type": "choice"}, {"id": 2205, "section": "第五部分 机动车业务知识", "header": "2.1.9", "question": "机动车所有人不需要办理变更登记的是________。", "options": ["A、改变车身颜色的", "B、更换发动机的", "C、更换车身或者车架的", "D、小型、微型载客汽车加装出入口踏步件"], "answer": "D", "type": "choice"}, {"id": 2206, "section": "第五部分 机动车业务知识", "header": "2.1.10", "question": "以下不属于登记证书、号牌、行驶证作废公告内容的是________。", "options": ["A、机动车号牌号码", "B、机动车的号牌种类", "C、机动车所有人姓名（单位名称）", "D、车辆识别代号"], "answer": "C", "type": "choice"}, {"id": 2207, "section": "第五部分 机动车业务知识", "header": "2.1.11", "question": "办理机动车注销登记，车辆管理所应当自受理之日起________内，审查提交的证明、凭证，属于机动车因故不在我国境内使用的还应当核查机动车出境记录，收回机动车登记证书、号牌、行驶证，出具注销证明。", "options": ["A、1日", "B、2日", "C、3日", "D、7日"], "answer": "A", "type": "choice"}, {"id": 2208, "section": "第五部分 机动车业务知识", "header": "2.1.12", "question": "属于未销售、购买、调拨、赠予等方式获得机动车后尚未注册登记或者新车出口销售的机动车，需要临时上道路行驶的，车辆管理所核发有效期不超过________的临时行驶车号牌。", "options": ["A、七日", "B、十五日", "C、三十日", "D、九十日"], "answer": "C", "type": "choice"}, {"id": 2209, "section": "第五部分 机动车业务知识", "header": "2.1.13", "question": "办理机动车变更登记时，受理岗不审查《机动车查验记录表》的是________。", "options": ["A、因质量问题更换整车", "B、改变机动车使用性质（除变更为\"预约出租客运\"）", "C、在车辆管理所管辖区域内共同所有人姓名变更", "D、更换发动机"], "answer": "C", "type": "choice"}, {"id": 2210, "section": "第五部分 机动车业务知识", "header": "2.1.14", "question": "已注册登记的机动车所有权发生转让的，现机动车所有人应当自机动车交付之日起________内向登记地车辆管理所申请转让登记。", "options": ["A、三日", "B、十五日", "C、三十日", "D、一年"], "answer": "C", "type": "choice"}, {"id": 2211, "section": "第五部分 机动车业务知识", "header": "2.1.15", "question": "办理转让登记，现机动车所有人住所在车辆管理所管辖区域内的，车辆管理所应当自受理申请之日起________内，确认机动车，核对车辆识别代号拓印膜，审查提交的证明、凭证，收回号牌、行驶证，确定新的机动车号牌号码，在机动车登记证书上签注转让事项，重新核发号牌、行驶证和检验合格标志。", "options": ["A、一日", "B、二日", "C、三日", "D、五日"], "answer": "A", "type": "choice"}, {"id": 2212, "section": "第五部分 机动车业务知识", "header": "2.1.16", "question": "改变车身颜色、更换发动机、更换车身或者车架的，机动车所有人应当在变更后________内向车辆管理所申请变更登记。", "options": ["A、三日", "B、七日", "C、十日", "D、十五日"], "answer": "C", "type": "choice"}, {"id": 2213, "section": "第五部分 机动车业务知识", "header": "2.1.17", "question": "办理补领或者换领校车标牌，公安机关交通管理部门应当自受理之日起________内审核，补发或者换发校车标牌。", "options": ["A、当日", "B、一日", "C、两日", "D、三日"], "answer": "D", "type": "choice"}, {"id": 2214, "section": "第五部分 机动车业务知识", "header": "2.1.18", "question": "车辆管理所接到原查封单位的公函，通知解封机动车档案的，应当________予以解封，恢复办理该机动车的各项登记，将解封信息录入计算机登记系统，公函存入机动车档案。", "options": ["A、立即", "B、在1日内", "C、在2日内", "D、在3日内"], "answer": "A", "type": "choice"}, {"id": 2215, "section": "第五部分 机动车业务知识", "header": "2.1.19", "question": "需要签注机动车登记证书登记栏信息的业务是________。", "options": ["A、补领行驶证", "B、补领号牌", "C、补发校车标牌", "D、补领登记证书"], "answer": "D", "type": "choice"}, {"id": 2216, "section": "第五部分 机动车业务知识", "header": "2.1.20", "question": "办理临时入境机动车号牌、行驶证业务时，公安机关交通管理部门应当在收到申请材料之日起________内审查提交的证明、凭证，查验机动车。", "options": ["A、1日", "B、2日", "C、3日", "D、5日"], "answer": "C", "type": "choice"}, {"id": 2217, "section": "第五部分 机动车业务知识", "header": "2.1.21", "question": "车辆管理所应当________下载本地超过期限未办理转入的机动车信息，定期通过短信或者电话等方式督促机动车所有人及时办理机动车转入业务。", "options": ["A、每月", "B、每季", "C、每周", "D、每日"], "answer": "D", "type": "choice"}, {"id": 2218, "section": "第五部分 机动车业务知识", "header": "2.1.22", "question": "________报废的应当在车辆管理所的监督下解体。", "options": ["A、营转非车辆", "B、出租转非车辆", "C、使用性质为\"货运\"的货车", "D、使用性质为\"非营运\"的轻型、微型货车"], "answer": "C", "type": "choice"}, {"id": 2219, "section": "第五部分 机动车业务知识", "header": "2.1.23", "question": "某辆机动车（非校车）检验有效至XXXX年9月，该机动车所有人可在XXXX年________起向车辆管理所申请检验合格标志。", "options": ["A、6月", "B、7月", "C、8月", "D、9月"], "answer": "B", "type": "choice"}, {"id": 2220, "section": "第五部分 机动车业务知识", "header": "2.1.24", "question": "有下列情形的，转入地车辆管理所可以退档________。", "options": ["A、机动车转出后登记证书丢失、灭失的", "B、签注的转入地车辆管理所名称不准确，但属同一省、自治区管辖范围内的", "C、机动车因不符合转入地依据法律制定的地方性排放标准的", "D、档案资料齐全但存在登记事项有误、档案资料填写、打印有误或者不规范、技术参数不全等情况的"], "answer": "C", "type": "choice"}, {"id": 2221, "section": "第五部分 机动车业务知识", "header": "2.1.25", "question": "县级公安机关交通管理部门车辆管理所办理机动车登记业务的具体业务范围和办理条件由________确定。", "options": ["A、公安部", "B、公安部交通管理局", "C、省级公安机关交通管理部门", "D、设区的市级公安机关交通管理部门"], "answer": "C", "type": "choice"}, {"id": 2222, "section": "第五部分 机动车业务知识", "header": "2.1.26", "question": "已注册登记的机动车有________，机动车所有人应当向登记地车辆管理所申请变更登记。", "options": ["A、小型、微型载客汽车加装出入口踏步件", "B、货运机动车加装防风罩、水箱、工具箱、备胎架等", "C、因质量问题更换整车的", "D、增加机动车车内装饰"], "answer": "C", "type": "choice"}, {"id": 2223, "section": "第五部分 机动车业务知识", "header": "2.1.27", "question": "机动车所有人________申请变更登记前，应当将涉及该车的道路交通安全违法行为和交通事故处理完毕。", "options": ["A、因质量问题更换整车", "B、使用性质改变", "C、机动车所有人的住所迁出或者迁入车辆管理所管辖区域", "D、更换车身或者车架"], "answer": "C", "type": "choice"}, {"id": 2224, "section": "第五部分 机动车业务知识", "header": "2.1.28", "question": "机动车所有人的住所迁出车辆管理所管辖区域的，转出地车辆管理所应当自受理之日起________内，查验机动车，在机动车登记证书上签注变更事项，制作上传机动车电子档案资料。", "options": ["A、1日", "B、2日", "C、3日", "D、5日"], "answer": "C", "type": "choice"}, {"id": 2225, "section": "第五部分 机动车业务知识", "header": "2.1.29", "question": "下列关于销毁机动车档案的要求，错误的是________。", "options": ["A、对需要销毁的机动车档案登记造册", "B、书面报告车辆管理所领导批准后即可", "C、在指定的地点", "D、监销人和销毁人共同在销毁记录上签字。"], "answer": "B", "type": "choice"}, {"id": 2226, "section": "第五部分 机动车业务知识", "header": "2.1.30", "question": "办理共同所有人姓名变更登记，以下属于不能直接证明共同所有关系的是________。", "options": ["A、提交共同所有的公证证明", "B、属于夫妻双方共同所有的，提供《结婚证》", "C、属于夫妻双方共同所有的，提供证明夫妻关系的《居民户口簿》", "D、共同所有人到场证明并提供变更前和变更后机动车所有人的身份证明"], "answer": "D", "type": "choice"}, {"id": 2227, "section": "第五部分 机动车业务知识", "header": "2.1.31", "question": "对悬挂境外机动车号牌注册登记_____，持境外主管部门核发的机动车登记证明、机动车入境凭证、不少于临时入境期限的中国机动车交通事故责任强制保险凭证，交验机动车后，即可申请临时入境机动车牌证，免予到检验机构进行安全技术检验。", "options": ["A、6年以内的7座以下（不含7座）非营运小型微型载客汽车", "B、6年以内的7座以下（不含7座）非营运小型微型载客汽车、摩托车", "C、6年以内的7座以下（含7座）非营运小型微型载客汽车", "D、6年以内的7座以下（含7座）非营运小型微型载客汽车、摩托车"], "answer": "B", "type": "choice"}, {"id": 2228, "section": "第五部分 机动车业务知识", "header": "2.1.32", "question": "申请抵押登记的，车辆管理所应当自受理之日起________内，审查提交的证明、凭证，在机动车登记证书上签注抵押登记的内容和日期。", "options": ["A、1日", "B、2日", "C、3日", "D、5日"], "answer": "A", "type": "choice"}, {"id": 2229, "section": "第五部分 机动车业务知识", "header": "2.1.33", "question": "申请解除抵押登记的，车辆管理所应当自受理之日起________内，审查提交的证明、凭证，在机动车登记证书上签注解除抵押登记的内容和日期。", "options": ["A、当日", "B、1日", "C、2日", "D、3日"], "answer": "B", "type": "choice"}, {"id": 2230, "section": "第五部分 机动车业务知识", "header": "2.1.34", "question": "以下不属于申请注销登记的情形的是________。", "options": ["A、机动车灭失的", "B、机动车被盗抢骗的", "C、机动车因故不在我国境内使用的", "D、因质量问题退车的"], "answer": "B", "type": "choice"}, {"id": 2231, "section": "第五部分 机动车业务知识", "header": "2.1.35", "question": "以下属于可以申请注销登记的情形的是________。", "options": ["A、机动车被监察机关、人民法院、人民检察院、行政执法部门依法查封、扣押的", "B、海关监管的机动车", "C、机动车属于被盗抢骗的", "D、机动车在抵押登记、质押备案期间的"], "answer": "B", "type": "choice"}, {"id": 2232, "section": "第五部分 机动车业务知识", "header": "2.1.36", "question": "特型机动车临时行驶车号牌（棕黄底纹、黑字黑框线、黑\"超\"字）的最长有效期不超过________。", "options": ["A、15日", "B、30日", "C、60日", "D、90日"], "answer": "D", "type": "choice"}, {"id": 2233, "section": "第五部分 机动车业务知识", "header": "2.1.37", "question": "试验用机动车临时行驶车号牌（棕黄底纹、黑字黑框线、黑\"试\"字）的最长有效期不超过________。", "options": ["A、一年", "B、一个月", "C、三个月", "D、六个月"], "answer": "D", "type": "choice"}, {"id": 2234, "section": "第五部分 机动车业务知识", "header": "2.1.38", "question": "特型机动车临时行驶车号牌（棕黄底纹、黑字黑框线、黑\"超\"字）适用范围是________。", "options": ["A、新车出口销售的机动车", "B、购买、调拨、赠予等方式获得机动车后尚未注册登记的机动车", "C、进行科研、定型试验的机动车", "D、因轴荷、总质量、外廓尺寸超出国家标准不予办理注册登记的特型机动车"], "answer": "D", "type": "choice"}, {"id": 2235, "section": "第五部分 机动车业务知识", "header": "2.1.39", "question": "对未销售的或者购买、调拨、赠予等方式获得机动车后尚未注册登记的，机动车所有人需要多次申领临时行驶车号牌的，车辆管理所核发临时行驶车号牌不得超过________。", "options": ["A、2次", "B、3次", "C、5次", "D、1次"], "answer": "B", "type": "choice"}, {"id": 2236, "section": "第五部分 机动车业务知识", "header": "2.1.40", "question": "办理进口机动车注册登记，属于________，全国进口机动车计算机核查系统不进行比对。", "options": ["A、海关签发汽车用《货物进口证明书》的汽车整车和汽车底盘的", "B、海关总署签发《没收走私汽车、摩托车证明书》的汽车的", "C、海关监管的机动车的", "D、海关总署签发《没收走私汽车、摩托车证明书》的摩托车的"], "answer": "C", "type": "choice"}, {"id": 2237, "section": "第五部分 机动车业务知识", "header": "2.1.41", "question": "办理进口机动车注册登记，属于________，与全国进口机动车计算机核查系统比对。", "options": ["A、海关签发第四版车辆用《货物进口证明书》的进口摩托车的", "B、海关签发第三版《货物进口证明书》（普通）的进口摩托车的", "C、海关签发\"一批一证\"的挂车、半挂车、轮式专用机械的", "D、国家规定的以其他方式进口的机动车的"], "answer": "A", "type": "choice"}, {"id": 2238, "section": "第五部分 机动车业务知识", "header": "2.1.42", "question": "转出地和转入地车辆管理所对转出车辆有不同意见的，车辆管理所所属公安机关交通管理部门应当报请________协调。", "options": ["A、公安部交通管理局", "B、省级公安机关交通管理部门", "C、设区的市级公安机关交通管理部门", "D、业务领导"], "answer": "B", "type": "choice"}, {"id": 2239, "section": "第五部分 机动车业务知识", "header": "2.1.43", "question": "车辆管理所应当________公告一次登记证书、号牌、行驶证作废的信息。", "options": ["A、每月", "B、每季度", "C、每6个月", "D、每年"], "answer": "B", "type": "choice"}, {"id": 2240, "section": "第五部分 机动车业务知识", "header": "2.1.44", "question": "补建机动车档案，应经_____书面批准。", "options": ["A、公安部交管局", "B、省级公安机关交通管理部门", "C、设区的市级公安机关交通管理部门", "D、车辆管理所"], "answer": "B", "type": "choice"}, {"id": 2241, "section": "第五部分 机动车业务知识", "header": "2.1.45", "question": "机动车档案从办理注销登记之日起保存_____后销毁。", "options": ["A、1年", "B、2年", "C、3年", "D、4年"], "answer": "B", "type": "choice"}, {"id": 2242, "section": "第五部分 机动车业务知识", "header": "2.1.46", "question": "校车标牌档案应当从机动车不再作为校车使用之日起保存_____后销毁。", "options": ["A、一年", "B、二年", "C、三年", "D、至机动车注销登记后"], "answer": "C", "type": "choice"}, {"id": 2243, "section": "第五部分 机动车业务知识", "header": "2.1.47", "question": "办理校车报废解体注销登记的，受理岗不审查_____。", "options": ["A、《报废机动车回收证明》", "B、校车标牌", "C、所有人身份证明", "D、机动车查验记录表"], "answer": "C", "type": "choice"}, {"id": 2244, "section": "第五部分 机动车业务知识", "header": "2.2.1", "question": "补发、换发号牌期间应当核发有效期不超过十五日的临时行驶车号牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2245, "section": "第五部分 机动车业务知识", "header": "2.2.2", "question": "机动车所有人为单位的内设机构，本身不具备领取统一社会信用代码证书条件的，可以使用上级单位的统一社会信用代码证书作为机动车所有人的身份证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2246, "section": "第五部分 机动车业务知识", "header": "2.2.3", "question": "对于机动车转出后因交通事故等原因更换了发动机、车身或者车架、改变车身颜色的，机动车所有人必须到转出地车辆管理所办理变更登记后，再办理转入。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2247, "section": "第五部分 机动车业务知识", "header": "2.2.4", "question": "公安机关交通管理部门在办理校车标牌丢失、灭失补领、校车报废、转让、迁出业务时，校车标牌在有效期内未收回的，应当公告校车标牌作废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2248, "section": "第五部分 机动车业务知识", "header": "2.2.5", "question": "办理机动车转入，车辆管理所应重新制作、核发机动车登记证书。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2249, "section": "第五部分 机动车业务知识", "header": "2.2.6", "question": "办理转让登记时，现机动车所有人为单位且住所不在车辆管理所管辖区内的，可以提交《组织机构代码证书》（加载社会统一信用代码的证照）的复印件、加盖单位公章的委托书和被委托人的身份证明作为其机动车所有人身份证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2250, "section": "第五部分 机动车业务知识", "header": "2.2.7", "question": "办理改变机动车车身颜色变更登记，不需要在机动车登记证书上签注。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2251, "section": "第五部分 机动车业务知识", "header": "2.2.8", "question": "办理机动车所有人的住所迁出车辆管理所管辖区域变更登记,需要在机动车登记证书上签注。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2252, "section": "第五部分 机动车业务知识", "header": "2.2.9", "question": "公安机关交通管理部门应当建立校车标牌档案，确定档案编号。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2253, "section": "第五部分 机动车业务知识", "header": "2.2.10", "question": "机动车在人民法院民事执行查封、扣押期间，其他人民法院依法要求查封、扣押的，应当告知待机动车解除查封、扣押后轮候办理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2254, "section": "第五部分 机动车业务知识", "header": "2.2.11", "question": "校车标牌有效期的截止日期应当与校车安全技术检验有效期的截止日期一致，但不得超过校车使用许可有效期。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2255, "section": "第五部分 机动车业务知识", "header": "2.2.12", "question": "省级公安机关交通管理部门审核补建的进口机动车档案时，属于全国进口机动车计算机核查系统内的机动车，应当与计算机核查系统比对，经核查无记录的，不得出具核对公函。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2256, "section": "第五部分 机动车业务知识", "header": "2.2.13", "question": "机动车所有人为两人以上，需要将登记的所有人姓名变更为其他所有人姓名的，变更双方应当共同到车辆管理所办理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2257, "section": "第五部分 机动车业务知识", "header": "2.2.14", "question": "车辆管理所移交嫌疑车辆时，应当填写嫌疑车辆移交清单，注明移交车辆的特征和有关资料，并附嫌疑车辆查验记录和询问记录，办理交接手续。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2258, "section": "第五部分 机动车业务知识", "header": "2.2.15", "question": "载客汽车应当核发1张临时行驶车号牌。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2259, "section": "第五部分 机动车业务知识", "header": "2.2.16", "question": "载货汽车应当核发1张临时行驶车号牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2260, "section": "第五部分 机动车业务知识", "header": "2.2.17", "question": "办理机动车登记事项更正，应当在机动车登记证书登记栏内进行签注。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2261, "section": "第五部分 机动车业务知识", "header": "2.2.18", "question": "办理注销登记时，对未收回登记证书、号牌、行驶证的，受理岗应当要求所有人登报申明作废，并在计算机登记系统中注明情况。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2262, "section": "第五部分 机动车业务知识", "header": "2.2.19", "question": "海关进口机动车的注册登记日期是其通过进口车核查的日期。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2263, "section": "第五部分 机动车业务知识", "header": "2.2.20", "question": "补建机动车档案应当按照计算机登记系统的信息补建，打印该机动车在计算机系统内的所有记录信息，并补充机动车所有人身份证明复印件。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2264, "section": "第五部分 机动车业务知识", "header": "2.2.21", "question": "记载销毁机动车档案情况的登记簿和销毁记录应当存档备查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2265, "section": "第五部分 机动车业务知识", "header": "2.2.22", "question": "查阅机动车档案应当在档案查阅室进行，档案管理人员应当在场。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2266, "section": "第五部分 机动车业务知识", "header": "2.2.23", "question": "在办理登记过程中，发现与进口机动车核查系统比对信息重复核对的，应当填写重复核对报告表，按规定上报。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2267, "section": "第五部分 机动车业务知识", "header": "2.2.24", "question": "排除嫌疑的机动车，办案单位应当出具公函，车辆管理所应当以书面形式记载调查情况，留存有关证据、询问记录和办案单位出具的公函，并保存两年。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2268, "section": "第五部分 机动车业务知识", "header": "2.2.25", "question": "临时入境机动车号牌和行驶证有效期不得延期。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2269, "section": "第五部分 机动车业务知识", "header": "2.2.26", "question": "警车的登记信息不进入全国公安交通管理信息系统。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2270, "section": "第五部分 机动车业务知识", "header": "2.2.27", "question": "机动车所有人的住所迁出车辆管理所管辖区域的，机动车所有人应当在90日内到住所地车辆管理所申请机动车转入。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2271, "section": "第五部分 机动车业务知识", "header": "2.2.28", "question": "保险机构因办案需要查阅机动车档案的，档案管理人员应审查其提交的档案查询公函和经办人工作证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2272, "section": "第五部分 机动车业务知识", "header": "2.2.29", "question": "办理注销登记，属于因机动车质量问题退车的，受理岗对符合规定的，出具《机动车注销证明》交机动车所有人，收存的档案资料不予退还。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2273, "section": "第五部分 机动车业务知识", "header": "2.2.30", "question": "报废的危险化学品运输车应当在车辆管理所的监督下解体。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2274, "section": "第五部分 机动车业务知识", "header": "2.2.31", "question": "直辖市公安机关交通管理部门车辆管理所、设区的市或者相当于同级的公安机关交通管理部门车辆管理所负责办理本行政区域内机动车登记业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2275, "section": "第五部分 机动车业务知识", "header": "2.2.32", "question": "初次申领机动车号牌、行驶证的，机动车所有人应当向户籍地的车辆管理所申请注册登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2276, "section": "第五部分 机动车业务知识", "header": "2.2.33", "question": "机动车所有人为两人以上，需要将登记的所有人姓名变更为其他所有人姓名的，可以向登记地车辆管理所申请变更登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2277, "section": "第五部分 机动车业务知识", "header": "2.2.34", "question": "登记地车辆管理所每个工作日通过计算机登记系统查询机动车异地报废解体信息，打印异地报废解体证明，办理注销登记，将异地报废解体证明存入机动车档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2278, "section": "第五部分 机动车业务知识", "header": "2.2.35", "question": "机动车在转入时已超过检验有效期的，应当按规定进行安全技术检验并提交机动车安全技术检验合格证明和交通事故责任强制保险凭证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2279, "section": "第五部分 机动车业务知识", "header": "2.2.36", "question": "改变发动机型号的，一律不予办理变更登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2280, "section": "第五部分 机动车业务知识", "header": "2.2.37", "question": "机动车所有人申请转让登记前，应当将涉及该车的道路交通安全违法行为和交通事故处理完毕。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2281, "section": "第五部分 机动车业务知识", "header": "2.2.38", "question": "申请抵押登记的，应当由机动车所有人和抵押权人共同到场申请。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2282, "section": "第五部分 机动车业务知识", "header": "2.2.39", "question": "申请解除抵押登记的，应当由机动车所有人和抵押权人共同申请。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2283, "section": "第五部分 机动车业务知识", "header": "2.2.40", "question": "申请解除抵押登记,属于人民法院调解、裁定、判决解除抵押的，机动车所有人或者抵押权人应当确认申请信息，提交机动车登记证书、人民法院出具的已经生效的《调解书》、《裁定书》或者《判决书》，以及相应的《协助执行通知书》。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2284, "section": "第五部分 机动车业务知识", "header": "2.2.41", "question": "已注册登记的机动车，机动车登记被依法撤销的或者达到国家强制报废标准的机动车被依法收缴并强制报废的，登记地车辆管理所应当办理注销。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2285, "section": "第五部分 机动车业务知识", "header": "2.2.42", "question": "属于机动车因故不在我国境内使用或者因质量问题退车的，机动车所有人申请注销登记前，应当将涉及该车的道路交通安全违法行为和交通事故处理完毕。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2286, "section": "第五部分 机动车业务知识", "header": "2.2.43", "question": "机动车报废或者灭失的，机动车所有人申请注销登记前，应当将涉及该车的道路交通安全违法行为和交通事故处理完毕。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2287, "section": "第五部分 机动车业务知识", "header": "2.2.44", "question": "机动车所有人办理注销登记时未交回机动车登记证书、号牌、行驶证的，车辆管理所应当公告机动车登记证书、号牌、行驶证作废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2288, "section": "第五部分 机动车业务知识", "header": "2.2.45", "question": "申请办理机动车质押备案或者解除质押备案的，由机动车所有人和典当行共同申请。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2289, "section": "第五部分 机动车业务知识", "header": "2.2.46", "question": "机动车进行维修后需要临时上道路行驶的，机动车所有人应当向车辆管理所申领临时行驶车号牌。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2290, "section": "第五部分 机动车业务知识", "header": "2.2.47", "question": "因号牌制作的原因，无法在规定时限内核发号牌的，车辆管理所应当核发有效期不超过十五日的临时行驶车号牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2291, "section": "第五部分 机动车业务知识", "header": "2.2.48", "question": "已注册登记的机动车被盗抢骗的，车辆管理所应当根据刑侦部门提供的情况，在计算机登记系统内记录，停止办理该车的各项登记和业务。被盗抢骗机动车发还后，车辆管理所应当恢复办理该车的各项登记和业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2292, "section": "第五部分 机动车业务知识", "header": "2.2.49", "question": "由代理人代理申请机动车登记和相关业务的，车辆管理所应当审查代理人的身份证明，代理人为单位的还应当审查经办人的身份证明；将代理人和经办人的身份证明复印件、机动车所有人的书面委托存入机动车档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2293, "section": "第五部分 机动车业务知识", "header": "2.2.50", "question": "申请办理机动车登记业务的，应当如实向车辆管理所提交规定的材料、交验机动车，如实申告规定的事项，并由车辆管理所对申请材料实质内容的真实性以及机动车的合法性负责。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2294, "section": "第五部分 机动车业务知识", "header": "2.2.51", "question": "《机动车查验记录表》应由查验岗内部传递至受理岗。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2295, "section": "第五部分 机动车业务知识", "header": "2.2.52", "question": "车辆管理所开展嫌疑调查时，可以通知申请人协助调查，询问嫌疑情况，记录调查内容，并可以采取检验鉴定、实地检查等方式进行核查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2296, "section": "第五部分 机动车业务知识", "header": "2.2.53", "question": "办理因质量问题更换整车的变更登记，注册登记日期不需要调整。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2297, "section": "第五部分 机动车业务知识", "header": "2.2.54", "question": "办理机动车转出，档案管理岗应当整理档案资料，装订成册，注明联系电话、传真电话和联系人姓名，并加盖车辆管理所业务专用章；密封机动车档案，并在密封袋上注明\"请妥善保管，并于即日起三十日内到转入地车辆管理所申请办理机动车转入，不得拆封。\"", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2298, "section": "第五部分 机动车业务知识", "header": "2.2.55", "question": "办理机动车转出，档案管理岗对机动车档案资料齐全但登记事项有误、档案资料填写、打印有误或者不规范、技术参数不全等情况，不需要书面注明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2299, "section": "第五部分 机动车业务知识", "header": "2.2.56", "question": "2004年4月30日以前注册的机动车档案资料不齐全，经核实不属于被盗抢、走私、非法拼（组）装等嫌疑车辆的，转入地车辆管理所应当办理转入，不得退档。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2300, "section": "第五部分 机动车业务知识", "header": "2.2.57", "question": "转入地车辆管理所认为需要核实档案资料的，应当由机动车所有人或代理人与转出地车辆管理所协调。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2301, "section": "第五部分 机动车业务知识", "header": "2.2.58", "question": "对机动车转出后登记证书丢失、灭失的，转入地车辆管理所不得退档，并在办理转入时同时补发登记证书。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2302, "section": "第五部分 机动车业务知识", "header": "2.2.59", "question": "对机动车转出后因交通事故等原因更换发动机、车身或者车架、改变车身颜色的，转入地车辆管理所不得退档，并在办理转入时一并办理变更登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2303, "section": "第五部分 机动车业务知识", "header": "2.2.60", "question": "对档案资料齐全但存在登记事项有误、档案资料填写、打印有误或者不规范、技术参数不全等情况的，转入地车辆管理所办理转入时不需要更正、补齐。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2304, "section": "第五部分 机动车业务知识", "header": "2.2.61", "question": "办理已注册登记机动车加装、拆除肢体残疾人操纵辅助装置变更备案，受理岗经审查符合规定的，录入备案信息，收回并重新核发行驶证，并签注登记证书交机动车所有人。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2305, "section": "第五部分 机动车业务知识", "header": "2.2.62", "question": "办理转让登记时，需要审查原机动车所有人和现机动车所有人的身份证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2306, "section": "第五部分 机动车业务知识", "header": "2.2.63", "question": "办理注册登记时，属于进口机动车的，应当与全国进口机动车计算机核查系统比对。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2307, "section": "第五部分 机动车业务知识", "header": "2.2.64", "question": "车辆管理所应当每季度公告一次机动车登记证书、号牌、行驶证作废的信息。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2308, "section": "第五部分 机动车业务知识", "header": "2.2.65", "question": "车辆管理所办理机动车登记业务时，业务受理、资料审查、机动车查验工作，应当由民警承担或者由文职、聘用人员按规定在民警监督下执行。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2309, "section": "第五部分 机动车业务知识", "header": "2.2.66", "question": "车辆管理所应当优化机动车登记流程，做好机动车查验、资料审核、牌证发放等流程衔接，方便群众办理机动车登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2310, "section": "第五部分 机动车业务知识", "header": "2.2.67", "question": "车辆管理所办理机动车登记业务时，对已实行机动车档案资料电子化转 递的，不得以没有原实物档案资料为由退档。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2311, "section": "第五部分 机动车业务知识", "header": "3.1.1", "question": "车辆管理所在办理机动车登记及相关业务过程中发现存在________情形的，应当及时开展调查。", "options": ["A、机动车涉嫌走私、被盗抢骗、非法生产销售、拼（组）装、非法改装的", "B、涉嫌提交虚假申请材料的", "C、涉嫌使用伪造、变造机动车牌证的", "D、以上均是"], "answer": "D", "type": "choice"}, {"id": 2312, "section": "第五部分 机动车业务知识", "header": "3.1.2", "question": "没收的走私机动车的注册登记日期的年份按照________录入。", "options": ["A、申请注册登记的年份", "B、《没收走私汽车、摩托车证明书》的签发年份", "C、机动车出厂的年份", "D、开具机动车销售发票的年份"], "answer": "C", "type": "choice"}, {"id": 2313, "section": "第五部分 机动车业务知识", "header": "3.1.3", "question": "机动车注册登记日期（海关监管或者没收的机动车除外）按照________录入。", "options": ["A、受理日期", "B、机动车出厂日期", "C、确定号牌号码的日期", "D、制证日期"], "answer": "C", "type": "choice"}, {"id": 2314, "section": "第五部分 机动车业务知识", "header": "3.1.4", "question": "依法扣留、没收并拍卖的国产机动车，其注册登记日期的年份按照________录入。", "options": ["A、确定号牌号码的年份", "B、机动车出厂的年份", "C、合格证的发证年份", "D、开具机动车销售发票的年份"], "answer": "B", "type": "choice"}, {"id": 2315, "section": "第五部分 机动车业务知识", "header": "3.1.5", "question": "一辆2017年12月1日出厂的海关监管车辆，在2019年3月1日查验合格，于2019年3月3日确定号牌号码，2019年3月5日打印行驶证和登记证书，该车辆的注册登记日期为（     ）。", "options": ["A、2019年3月1日", "B、2019年3月3日", "C、2019年3月5日", "D、2017年3月3日"], "answer": "D", "type": "choice"}, {"id": 2316, "section": "第五部分 机动车业务知识", "header": "3.1.6", "question": "________、检验合格标志的式样由公安部统一制定并监制。", "options": ["A、行驶证", "B、机动车登记证书", "C、号牌", "D、以上均是"], "answer": "D", "type": "choice"}, {"id": 2317, "section": "第五部分 机动车业务知识", "header": "3.1.7", "question": "一辆2010年12月1日出厂，2012年10月21日注册的非营运小型轿车，2018年12月25日、2019年8月15日取得安全技术检验合格证明，如该车未发生过造成人员伤亡的交通事故或者因非法改装被处罚，下列说法正确的是（   ）。", "options": ["A、该车2020年10月需上线检测", "B、该车2020年10月需申领免检标识", "C、该车2021年10月需上线检测", "D、该车2022年10月不需上线检测，也不需申领免检标识。"], "answer": "C", "type": "choice"}, {"id": 2318, "section": "第五部分 机动车业务知识", "header": "3.1.8", "question": "车辆管理所应当在机动车强制报废期满的________，通过信函、手机短信或者向社会公告等方式告知机动车所有人。", "options": ["A、1个月前", "B、2个月前", "C、１个月后", "D、２个月后"], "answer": "B", "type": "choice"}, {"id": 2319, "section": "第五部分 机动车业务知识", "header": "3.1.9", "question": "补建机动车档案，应经________书面批准。", "options": ["A、公安部交管局", "B、省级公安机关交通管理部门", "C、设区的市级公安机关交通管理部门", "D、县级公安机关交通管理部门"], "answer": "B", "type": "choice"}, {"id": 2320, "section": "第五部分 机动车业务知识", "header": "3.1.10", "question": "用于出具退办凭证的印章是________。", "options": ["A、业务专用章", "B、行政印章", "C、证件专用章", "D、业务手续专用名章"], "answer": "A", "type": "choice"}, {"id": 2321, "section": "第五部分 机动车业务知识", "header": "3.1.11", "question": "2020年11月1日后，未发生过造成人员伤亡的交通事故或者因非法改装被处罚，________可享受六年内免检政策。", "options": ["A、7座以下（含7座）的非营运小型载客汽车", "B、9座以下（含9座）的非营运小型载客汽车", "C、自车辆出厂之日起，未超过5年办理注册登记手续的摩托车", "D、以上都不正确"], "answer": "C", "type": "choice"}, {"id": 2322, "section": "第五部分 机动车业务知识", "header": "3.1.12", "question": "车辆管理所在办理机动车登记及相关业务过程中发现存在________情形的，应当及时开展调查。", "options": ["A、涉嫌以欺骗、贿赂等不正当手段取得机动车登记的", "B、存在短期内频繁补换领牌证、转让登记、转出转入等异常情形的", "C、发现申请人通过互联网办理机动车登记及相关业务存在违法违规嫌疑的", "D、以上均是"], "answer": "D", "type": "choice"}, {"id": 2323, "section": "第五部分 机动车业务知识", "header": "3.1.13", "question": "可以不适用《道路车辆 车辆识别代号(VIN)》（GB16735）的车辆是________。", "options": ["A、摩托车", "B、轻便摩托车", "C、轮式专用机械车", "D、挂车"], "answer": "C", "type": "choice"}, {"id": 2324, "section": "第五部分 机动车业务知识", "header": "3.1.14", "question": "________办理报废解体注销登记时，应当审查和收存粘贴有客车车身切割解体前、解体后以及包含车辆识别代号部件照片的机动车查验记录表。", "options": ["A、校车", "B、出租转非小型客车", "C、营转非小型客车", "D、非营运中型客车"], "answer": "A", "type": "choice"}, {"id": 2325, "section": "第五部分 机动车业务知识", "header": "3.1.15", "question": "机动车登记编号序号使用规则：已使用的序号总量与序号理论容量的比例超过________后，经省级公安机关交通管理部门批准并报
