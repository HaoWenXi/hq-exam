1087, "section": "第三部分 查验业务知识", "header": "", "question": "工信部联通装〔2022〕3号文件中小微型载客汽车的车辆长度应小于等于     mm", "options": ["A.5995", "B.5500", "C.6000", "D.4500"], "answer": "B", "type": "choice"}, {"id": 1088, "section": "第三部分 查验业务知识", "header": "", "question": "工信部联通装〔2022〕3号文件中“小微型载客汽车”是指车顶外覆盖件（覆盖在车身骨架表面上的车顶结构件，不包括行李架、天线等车顶结构件上的附件）最大离地高度大于或等于    mm车长小于    mm且乘坐人数小于或等于      人，单层地板，一厢或两厢式结构，安装座椅的载客汽车。", "options": ["A.1850  6000  9", "B.2100  5000  7", "C.1800  5500  9", "D.1850  5500  7"], "answer": "A", "type": "choice"}, {"id": 1089, "section": "第三部分 查验业务知识", "header": "", "question": "小微型载客汽车总长度大于等于5000mm时，车辆行李区纵向长度应小于等于      mm。", "options": ["A.总车长的30%", "B.1500", "C.1300", "D.1350"], "answer": "B", "type": "choice"}, {"id": 1090, "section": "第三部分 查验业务知识", "header": "", "question": "对“大吨小标”货车和非法改装客车造成一次死亡    人以上交通事故的，依法追究违规生产、销售企业和相关责任人的法律责任；构成犯罪的，追究刑事责任。", "options": ["A.7人", "B.5人", "C.3人", "D.10人"], "answer": "C", "type": "choice"}, {"id": 1091, "section": "第三部分 查验业务知识", "header": "", "question": "对不符合工信部联通装〔2022〕3号文件“技术规范”要求的在产产品，       起，生产企业应立即停止生产。", "options": ["A.2022年5月1日", "B.2022年9月1日", "C.2022年4月1日", "D.2022年3月1日"], "answer": "D", "type": "choice"}, {"id": 1092, "section": "第三部分 查验业务知识", "header": "", "question": "为了方便群众，机动车所有人提交的证明、凭证与机动车不符的，可以先行办理登记，后补齐相关证明、凭证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1093, "section": "第三部分 查验业务知识", "header": "", "question": "机动车的有关技术数据与国家机动车产品主管部门公告的数据不符，机动车生产厂家出具了证明的，应当办理注册登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1094, "section": "第三部分 查验业务知识", "header": "", "question": "办理因质量问题更换整车变更登记的，不需要再进行安全技术检验。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1095, "section": "第三部分 查验业务知识", "header": "", "question": "机动车的车辆识别代号或者有关技术参数不符合国家安全技术标准的，不予办理注册登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1096, "section": "第三部分 查验业务知识", "header": "", "question": "货运机动车加装防风罩、水箱、工具箱和备胎架后，应当向车辆管理所申请变更登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1097, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验机构已出具安全技术检验合格证明的机动车，车辆管理所办理机动车登记业务时，可以不再查验机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1098, "section": "第三部分 查验业务知识", "header": "", "question": "机动车变更燃料种类，应当向车辆管理所申请变更登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1099, "section": "第三部分 查验业务知识", "header": "", "question": "全挂汽车列车和半挂汽车列车，应当对牵引车和挂车分别核发号牌、行驶证和机动车登记证书。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1100, "section": "第三部分 查验业务知识", "header": "", "question": "属于国家机动车产品主管部门认定免于检验的车型，在办理更换车身或者车架业务时，可以不审查安全技术检验合格证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1101, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号、发动机号码有凿改、挖补痕迹或者擅自另外打刻的，应当进入嫌疑车辆调查程序。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1102, "section": "第三部分 查验业务知识", "header": "", "question": "转入查验时，车辆识别代号、发动机号码与合格证、进口凭证、行驶证、登记证书或者机动车档案记载不一致的，应当书面退办。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1103, "section": "第三部分 查验业务知识", "header": "", "question": "办理加装肢体残疾人操纵辅助装置的小型自动挡载客汽车注册登记，查验岗应当审查操纵辅助装置产品型号和编号是否与加装合格证明相符。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1104, "section": "第三部分 查验业务知识", "header": "", "question": "进口的小型客车申请注册登记前，均不需要进行安全技术检验。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1105, "section": "第三部分 查验业务知识", "header": "", "question": "专用校车办理注册登记前，应当按照专用校车国家安全技术标准进行安全技术检验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1106, "section": "第三部分 查验业务知识", "header": "", "question": "机动车的有关技术数据不符合国家安全技术标准的，但与国务院机动车产品主管部门公告的数据相符的，可以办理注册登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1107, "section": "第三部分 查验业务知识", "header": "", "question": "改变机动车的品牌、型号和发动机型号的，但经国务院机动车产品主管部门许可选装的发动机除外，不予办理变更登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1108, "section": "第三部分 查验业务知识", "header": "", "question": "申请注册登记的，不属于经海关进口的机动车和国务院机动车产品主管部门规定免予安全技术检验的机动车，应当提交机动车安全技术检验合格证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1109, "section": "第三部分 查验业务知识", "header": "", "question": "除法律、法规和国家强制性标准另有规定的外，改变已登记的机动车外形和有关技术参数的，不予办理变更登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1110, "section": "第三部分 查验业务知识", "header": "", "question": "机动车与该车档案记载内容不一致的，可以凭机动车所有人相关情况说明办理转移登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1111, "section": "第三部分 查验业务知识", "header": "", "question": "补领机动车登记证书的，应当核对车辆识别代号拓印膜。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1112, "section": "第三部分 查验业务知识", "header": "", "question": "交通警察违反规定为被盗抢、走私、非法拼（组）装、达到国家强制报废标准的机动车办理登记的，按照国家有关规定给予处分，经教育不改又不宜给予开除处分的，按照《公安机关组织管理条例》规定予以辞退；对聘用人员予以解聘。构成犯罪的，依法追究刑事责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1113, "section": "第三部分 查验业务知识", "header": "", "question": "进口整车改装的机动车，其出厂合格证明是进口机动车的进口凭证和机动车改装厂出具的《机动车整车出厂合格证》。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1114, "section": "第三部分 查验业务知识", "header": "", "question": "进口底盘改装的机动车，其出厂合格证明是机动车改装厂出具的《机动车整车出厂合格证》。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1115, "section": "第三部分 查验业务知识", "header": "", "question": "使用非本厂生产的国产底盘改装的机动车，其出厂合格证明是机动车底盘生产厂出具的《机动车底盘出厂合格证》和机动车改装厂出具的《机动车整车出厂合格证》。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1116, "section": "第三部分 查验业务知识", "header": "", "question": "计算机软件打印生成的《机动车查验记录表》，可以不密封交机动车所有人自行携带。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1117, "section": "第三部分 查验业务知识", "header": "", "question": "已注册登记机动车加装肢体残疾人操纵辅助装置的，查验岗应当查验机动车，审查机动车安全技术检验合格证明、操纵辅助装置产品型号和编号是否与加装合格证明相符；在检验有效期内的车辆，不审查机动车安全技术检验合格证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1118, "section": "第三部分 查验业务知识", "header": "", "question": "交通警察不按照规定确认机动车和审查证明、凭证的，按照国家有关规定予以处分；对聘用人员予以解聘。构成犯罪的，依法追究刑事责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1119, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所应当配置机动车查验智能终端，实现远程比对《公告》数据、采集机动车照片、制作机动车查验记录表，提高机动车查验工作效率。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1120, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所应当建立机动车安全技术检验监管网络平台，按照有关标准与机动车安全技术检验机构联网，实现对检验过程的视频监控和检验合格数据自动比对。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1121, "section": "第三部分 查验业务知识", "header": "", "question": "机动车在被盗抢期间，发动机号码、车辆识别代号或者车身颜色被改变的，申请办理变更备案时，由查验员确认该机动车与被盗抢的机动车为同一辆车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1122, "section": "第三部分 查验业务知识", "header": "", "question": "小型、微型载客汽车因改变车身颜色申请变更登记，车辆不在登记地的，可以向车辆所在地车辆管理所提出申请。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1123, "section": "第三部分 查验业务知识", "header": "", "question": "机动车所有人申请转出、转入前，应当将涉及该车的道路交通安全违法行为和交通事故处理完毕。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1124, "section": "第三部分 查验业务知识", "header": "", "question": "对二手车出口企业收购机动车用于出口的，简化办理转移登记手续，可以直接申领临时行驶车号牌，无需核发正式号牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1125, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记6年以内的摩托车免予到检验机构检验，需要定期检验时，机动车所有人可以直接到公安交管部门申领检验标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1126, "section": "第三部分 查验业务知识", "header": "", "question": "对跨省异地申领6年内免检车辆检验标志的摩托车，要审核行驶证、车船税和交强险，核发检验合格标志，行驶证副页上应签注检验有效期。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1127, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所应当对机动车查验过程进行全程录像，并实时监控查验过程，没有使用录像设备的，不得进行查验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1128, "section": "第三部分 查验业务知识", "header": "", "question": "清障车可以使用双层结构、厢式结构。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1129, "section": "第三部分 查验业务知识", "header": "", "question": "工信部联通装〔2022〕3号文件中，小微型载客汽车仅设置两排座椅时，第二排座椅的座椅骨架应不能被翻转，但座椅靠背可以折叠放置到座椅骨架（或座垫）上。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1130, "section": "第三部分 查验业务知识", "header": "", "question": "工信部联通装〔2022〕3号文件中对小微型载客汽车的技术规范要求包括进口车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1131, "section": "第三部分 查验业务知识", "header": "", "question": "信部联通装〔2022〕3号文件中，小微型载客汽车驾驶员之后的座椅布置不应为单排单人座椅，但车门位置处不具备设置单排双人座椅或两个并排的单人座椅时除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1132, "section": "第三部分 查验业务知识", "header": "", "question": "工信部联通装〔2022〕3号文件中，小微型载客汽车的最后一排座椅可以设置为单个的单人座椅。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1133, "section": "第三部分 查验业务知识", "header": "", "question": "各地公安交通管理部门要严格轻型货车登记查验，重点核对轻型货车检验合格报告记载的整备质量与《公告》和合格证记载的整备质量是否一致。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1134, "section": "第三部分 查验业务知识", "header": "", "question": "初级查验员不可以对_______进行查验。", "options": ["A、小型和微型载客汽车", "B、轻型和微型载货汽车", "C、低速汽车（包括三轮汽车和低速货车）和摩托车", "D、轻型挂车"], "answer": "D", "type": "choice"}, {"id": 1135, "section": "第三部分 查验业务知识", "header": "", "question": "查验员资格证书有效期为_______年，有效期内应每_______年审验一次。", "options": ["A、一，半", "B、二，一", "C、三，一", "D、六，二"], "answer": "C", "type": "choice"}, {"id": 1136, "section": "第三部分 查验业务知识", "header": "", "question": "公安机关交通管理部门车辆管理所查验机动车应在专门查验区进行，但特殊情况下不能在专门查验区进行查验并经_______备案的除外。", "options": ["A、县级公安机关", "B、地市级公安机关", "C、地市级公安机关交通管理部门", "D、省级公安机关交通管理部门"], "answer": "D", "type": "choice"}, {"id": 1137, "section": "第三部分 查验业务知识", "header": "", "question": "不属于专门查验区必须要求的是_______。", "options": ["A、施划有标志标线", "B、安装有视频监控系统", "C、配备机动车外廓尺寸自动测量装置", "D、配备有查验工具柜（箱）"], "answer": "C", "type": "choice"}, {"id": 1138, "section": "第三部分 查验业务知识", "header": "", "question": "不属于公安机关交通管理部门车辆管理所的查验员必须配备的是_______。", "options": ["A、照相机", "B、查验工具包", "C、便携式智能查验终端", "D、执法记录仪"], "answer": "A", "type": "choice"}, {"id": 1139, "section": "第三部分 查验业务知识", "header": "", "question": "查验中发现机动车存在被盗抢嫌疑、走私嫌疑、非法改装、拼装等情形时，处理不正确的是_______。", "options": ["A、直接予以退办", "B、属于被盗抢嫌疑和走私嫌疑的，进入嫌疑车辆调查程序", "C、属于非法改装的，应责令机动车车主将机动车恢复原状", "D、属于拼装的，应按照相关规定移交有关部门予以拆解、报废"], "answer": "A", "type": "choice"}, {"id": 1140, "section": "第三部分 查验业务知识", "header": "", "question": "不能直接认定检验机构出具虚假检验结果的情形是_______。", "options": ["A、为未经检验的机动车出具检验合格证明", "B、用其他车辆替代检验", "C、利用计算机软件等手段篡改或者伪造检验数据和结果", "D、盗抢、报废、拼装、套牌等车辆予以通过检验"], "answer": "D", "type": "choice"}, {"id": 1141, "section": "第三部分 查验业务知识", "header": "", "question": "公安机关交通管理部门车辆管理所对机动车安全技术检验机构的安全技术检验行为进行监督的方式不包括_______。", "options": ["A、派驻民警现场监督", "B、计算机联网核查机动车安全技术检验数据", "C、审核机动车安全技术检验机构上传的检验照片或视频", "D、查阅原始检验记录和报告"], "answer": "A", "type": "choice"}, {"id": 1142, "section": "第三部分 查验业务知识", "header": "", "question": "查验申请注册登记的机动车时，不属于违规机动车产品通报情形的是_______。", "options": ["A、发现机动车不符合GB1589、GB7258等机动车国家安全技术标准", "B、发现机动车与《公告》、机动车整车出厂合格证明的数据不一致", "C、发现检验机构出具虚假检验结果", "D、发现《公告》、机动车整车出厂合格证明的技术参数不符合GB1589、GB7258等机动车国家安全技术标准"], "answer": "C", "type": "choice"}, {"id": 1143, "section": "第三部分 查验业务知识", "header": "", "question": "按《机动车查验工具配置要求》，查验箱可选择配置_______。", "options": ["A、紫外荧光灯", "B、VIN码信息读取仪器", "C、油漆层微量厚度检验仪", "D、手套"], "answer": "C", "type": "choice"}, {"id": 1144, "section": "第三部分 查验业务知识", "header": "", "question": "对申请核发机动车检验合格标志的摩托车和所有_______，在机动车安全技术检验监管系统无检验异常情况预警和报警提示时，可先行核发机动车检验合格标志。", "options": ["A、小型、微型载客汽车", "B、非营运小型、微型载客汽车", "C、7座以下的非营运小型、微型载客汽车", "D、非营运小型、微型载客汽车（面包车除外）"], "answer": "D", "type": "choice"}, {"id": 1145, "section": "第三部分 查验业务知识", "header": "", "question": "关于先行核发机动车检验合格标志的，不正确的是_______。", "options": ["A、应在检验照片（或视频）上传后的24小时内将检验照片（或视频）比对完毕", "B、比对结果表明检验项目不符合GB7258及其他相关规定的，应要求机动车安全技术检验机构通知送检的机动车重新进行检验", "C、比对结果表明检验项目不符合GB7258及其他相关规定的，按规定对机动车安全技术检验机构予以处罚", "D、应经本地公安机关交通管理部门批准后实施。"], "answer": "D", "type": "choice"}, {"id": 1146, "section": "第三部分 查验业务知识", "header": "", "question": "校车是用于有组织地接送3周岁以上学龄前幼儿或接受义务教育的学生上下学的_______座以上的载客汽车。", "options": ["A、5", "B、7", "C、9", "D、19"], "answer": "B", "type": "choice"}, {"id": 1147, "section": "第三部分 查验业务知识", "header": "", "question": "_______不属于工业和信息化部实施《公告》管理的车辆产品。", "options": ["A、三轮汽车", "B、半挂车", "C、轮式专用机械车", "D、摩托车"], "answer": "C", "type": "choice"}, {"id": 1148, "section": "第三部分 查验业务知识", "header": "", "question": "办理注册登记时，对进口改装的机动车，\"国产/进口\"录入_______。", "options": ["A、国产", "B、海关进口", "C、无", "D、进口改装"], "answer": "D", "type": "choice"}, {"id": 1149, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站社会辅助查验员应当具备_______查验员资格，在车辆管理所监督下开展机动车查验工作。", "options": ["A、初级或者中级", "B、初级", "C、中级", "D、中级以上"], "answer": "A", "type": "choice"}, {"id": 1150, "section": "第三部分 查验业务知识", "header": "", "question": "机动车使用年限起始日期按照注册登记日期计算，但自出厂之日起超过_______未办理注册登记手续的，按照出厂日期计算。", "options": ["A、1年", "B、2年", "C、3年", "D、4年"], "answer": "B", "type": "choice"}, {"id": 1151, "section": "第三部分 查验业务知识", "header": "", "question": "距《机动车强制报废标准规定》要求使用年限_______的机动车，不得变更使用性质、转移所有权或者转出登记地所属地市级行政区域。", "options": ["A、2年以内（含2年）", "B、1年以内（含1年）", "C、6个月以内（含6个月）", "D、2个月以内（含2个月）"], "answer": "B", "type": "choice"}, {"id": 1152, "section": "第三部分 查验业务知识", "header": "", "question": "小、微型非营运载客汽车和大型非营运轿车转为营运载客汽车的，_______。", "options": ["A、按营运载客汽车的规定报废", "B、使用15年", "C、按相关公式核算累计使用年限，且不得超过15年。", "D、使用20年"], "answer": "C", "type": "choice"}, {"id": 1153, "section": "第三部分 查验业务知识", "header": "", "question": "车辆尾部标志板安装离地高度应不小于       （下边缘），不大于 （上边缘）。", "options": ["A、400mm   2300mm", "B、450mm   2300mm", "C、350mm   2400mm", "D、250mm   2100mm"], "answer": "D", "type": "choice"}, {"id": 1154, "section": "第三部分 查验业务知识", "header": "", "question": "货运车辆示廓灯光色应遵循      的安装要求。", "options": ["A、前红后白", "B、前白后红", "C、前黄后白", "D、前白后黄"], "answer": "B", "type": "choice"}, {"id": 1155, "section": "第三部分 查验业务知识", "header": "", "question": "货车货箱（自卸车、装载质量 1000kg 以下的货车除外）前部应安装比驾驶室高至少      的安全架。", "options": ["A、100mm", "B、70mm", "C、75mm", "D、120mm"], "answer": "B", "type": "choice"}, {"id": 1156, "section": "第三部分 查验业务知识", "header": "", "question": "对设计和制造上具有行动不便乘客（如轮椅乘坐者）乘坐设施的乘用车，设置有后向座椅时，在与相向座椅的座间距大于等于      。", "options": ["A、1200mm", "B、1000mm", "C、650mm", "D、1150mm"], "answer": "D", "type": "choice"}, {"id": 1157, "section": "第三部分 查验业务知识", "header": "", "question": "轮胎规格“9.00R20”参数中，“9.00”是指      。", "options": ["A、轮辋名义直径", "B、轮胎名义宽度", "C、负荷指数", "D、轮胎名义高宽比"], "answer": "B", "type": "choice"}, {"id": 1158, "section": "第三部分 查验业务知识", "header": "", "question": "轻便摩托车若使用内燃机，其发动机气缸总排量为_______ml。", "options": ["A、小于50", "B、小于等于50", "C、小于35", "D、小于等于35"], "answer": "B", "type": "choice"}, {"id": 1159, "section": "第三部分 查验业务知识", "header": "", "question": "查验员在办理两轮电动摩托车注册登记查验时，对《机动车整车出厂合格证》标注的车速为52km/h，功率排量为1.2kw，其他数据均与《公告》一致的情况下，该车车辆类型的规格术语应定为       。", "options": ["A、轻便", "B、普通", "C、参数违规，退办", "D、微型"], "answer": "B", "type": "choice"}, {"id": 1160, "section": "第三部分 查验业务知识", "header": "", "question": "侧面防护装置可以是一个连续平面，或由一根或多根横杆构成，或者是平面与横杆的组合体， 当采用横杆结构时，横杆间距不大于        。", "options": ["A、300 mm", "B、250 mm", "C、450 mm", "D、350 mm"], "answer": "A", "type": "choice"}, {"id": 1161, "section": "第三部分 查验业务知识", "header": "", "question": "对进口机动车查验时，转向灯的光色应为    ，后雾灯的光色应为      。 红色     琥珀色", "options": ["B、琥珀色   白色", "C、琥珀色   红色", "D、红色     白色"], "answer": "C", "type": "choice"}, {"id": 1162, "section": "第三部分 查验业务知识", "header": "", "question": "危险货物运输货车应装备单燃油箱，且单燃油箱的容积应小于等于     。", "options": ["A、400L", "B、600L", "C、300L", "D、500L"], "answer": "A", "type": "choice"}, {"id": 1163, "section": "第三部分 查验业务知识", "header": "", "question": "灭火器应便于使用且有效，其压力表指针应指向       。", "options": ["A、红色区域", "B、绿色区域", "C、黄色区域", "D、白色区域"], "answer": "B", "type": "choice"}, {"id": 1164, "section": "第三部分 查验业务知识", "header": "", "question": "客车（专用校车除外）座椅在车辆横向上不应采用“      ”布置（最后一排座椅除外）。", "options": ["A、2+2", "B、2+3", "C、1+1", "D、1+2"], "answer": "B", "type": "choice"}, {"id": 1165, "section": "第三部分 查验业务知识", "header": "", "question": "免拓印是指原需申请人自行拓印车辆识别代号的，由车辆管理所、机动车登记服务站等免费拓印；对于群众主动提交拓印膜不符合要求的，应予重新免费拓印。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1166, "section": "第三部分 查验业务知识", "header": "", "question": "要加强对轻型货车的查验，查验员对发现货车栏板、货箱、轮胎、轮毂等外观与《公告》明显不符、整备质量存在严重违规嫌疑的，立即启动嫌疑机动车调查程序，按规定开展现场调查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1167, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站查验岗应当使用机动车查验监管系统记录受理、查验全过程信息，按规定采集、上传机动车查验结果、照片及视频，免费拓印车辆识别代号，制作并内部转递电子化机动车查验记录表。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1168, "section": "第三部分 查验业务知识", "header": "", "question": "推行机动车销售企业快捷代办的登记服务站代办进口车预登记的，可以由社会查验员查验车辆，由民警查验员通过查验监管系统复核确认。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1169, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站办理对机动车查验相关技术标准规定的需由民警查验员现场查验的业务，车辆管理所应当派民警查验员到机动车登记服务站监督并由机动车登记服务站辅助查验员进行查验。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1170, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站的查验音视频资料应当保存2年以上，业务大厅、专用库房等相关场所的视频资料应当保存1年以上。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1171, "section": "第三部分 查验业务知识", "header": "", "question": "对贴有车身保护膜、装有轮毂保护装置等外观防护的小微型载客汽车开展预查验时，应当严格查验实车，采集实车照片，查验记录表可以使用与车辆外观特征一致的同型号车辆标准照片，行驶证的照片使用实车照片。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1172, "section": "第三部分 查验业务知识", "header": "", "question": "对预查验车辆加装、选装符合规定部件，导致车身外观特征发生改变的，制作行驶证时，应当重新核对车辆识别代号、采集车辆标准照片。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1173, "section": "第三部分 查验业务知识", "header": "", "question": "办理机动车业务时，查验员依据道路交通安全法律法规和相关标准确认机动车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1174, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB 7258—2017国家标准及相关规定，旅居车应配备处于有效期内的灭火器，灭火器在车上应安装牢靠并便于使用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1175, "section": "第三部分 查验业务知识", "header": "", "question": "对申请注册登记的机动车，查验时应当制作或核对机动车标准照片，确定车辆类型、车身颜色及核定载人数。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1176, "section": "第三部分 查验业务知识", "header": "", "question": "对因更换发动机申请变更登记的机动车，查验项目为：发动机号码、车辆号牌，审核安全技术检验合格证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1177, "section": "第三部分 查验业务知识", "header": "", "question": "与车辆结构或安全装置相关的查验项目，查验时应按照机动车出厂时所执行版本的机动车国家安全技术标准确认是否符合规定，但法律法规和强制性国家标准另有规定的除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1178, "section": "第三部分 查验业务知识", "header": "", "question": "办理校车使用许可相关业务查验机动车时，查验结果填写在《机动车查验记录表》时，应在备注栏内注明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1179, "section": "第三部分 查验业务知识", "header": "", "question": "查验车辆识别代号时，对办理机动车注册登记、转入、转移登记、变更迁出、更换车身或者车架、更换整车、补领机动车登记证书等业务及重新打刻车辆识别代号变更备案的，应当采集、核对车辆识别代号拓印膜或者电子资料。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1180, "section": "第三部分 查验业务知识", "header": "", "question": "检验监督人员核对机动车安全技术检验合格证明时，应审查安全技术检验合格证明上是否有本市行政辖区内具有资质机动车安全技术检验机构的签章和授权签字人签字，确认安全技术检验的项目是否齐全及检验结论是否为合格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1181, "section": "第三部分 查验业务知识", "header": "", "question": "装备的汽车安全带应齐全且能正常使用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1182, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，只对驾驶人座椅和前排乘员座椅，查验装置的汽车安全带是否均为三点式（或四点式）汽车安全带。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1183, "section": "第三部分 查验业务知识", "header": "", "question": "对申请残疾人专用汽车拆除肢体残疾人操纵辅助装置变更备案的，应查验确认是否已拆除操纵辅助装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1184, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，对教练车应查验是否在车身两侧及后部喷涂了\"教练车\"等字样。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1185, "section": "第三部分 查验业务知识", "header": "", "question": "省、自治区、直辖市和设区的市公安机关交通管理部门，对在辖区内首次注册登记的新车型进行技术参数确认时，应制订实施专门的工作制度并配备相应的人员。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1186, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，对残疾人专用汽车（即残疾人专用自动挡载客汽车），应查验是否设置了残疾人机动车专用标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1187, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，对警车、消防车、救护车和工程救险车，应查验车辆外观制式、标志灯具和车用电子警报器。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1188, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，对残疾人专用汽车，应当查验操纵辅助装置加装合格证明及操纵辅助装置的产品型号和产品编号。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1189, "section": "第三部分 查验业务知识", "header": "", "question": "从事检验审核的工作人员应具备相应机动车车型的查验员资格，其负责人应为民警查验员。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1190, "section": "第三部分 查验业务知识", "header": "", "question": "查验区配备1个查验工具箱后，查验员可视查验工作量按需随身携带查验包。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1191, "section": "第三部分 查验业务知识", "header": "", "question": "安全技术检验合格证明应由本省行政辖区内具备资质的机动车安全技术检验机构出具，其内容应该包括人工检验项目及整车检验结论。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1192, "section": "第三部分 查验业务知识", "header": "", "question": "安全技术检验合格证明内容应包括人工检验项目（车辆外观检查、底盘动态检验和车辆底盘检查等）的检查结果、仪器设备检验项目（制动、灯光等）的检验结果（无法进行仪器设备检验的除外）、路试数据和判定结果（如进行）及整车检验结论，且所有检验项目及整车检验结论均应为合格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1193, "section": "第三部分 查验业务知识", "header": "", "question": "查验申请注册登记的机动车时，发现机动车不符合GB1589、GB7258等机动车国家安全技术标准或与《公告》、机动车整车出厂合格证明的数据不一致时，或发现《公告》、机动车整车出厂合格证明的技术参数不符合GB1589、GB7258等机动车国家安全技术标准时，车辆管理所只需书面告知机动车车主查验不合格的原因即可。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1194, "section": "第三部分 查验业务知识", "header": "", "question": "报废机动车监督解体照片拍摄要求：解体过程照片或视频必须与原车特征有关联性，包含车辆识别代号部件的照片能体现切割痕迹。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1195, "section": "第三部分 查验业务知识", "header": "", "question": "对总质量大于等于4500kg的货车（半挂牵引车除外）和货车底盘改装的专项作业车，车长大于8.0m的挂车，注册登记时应查验车辆尾部标志板。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1196, "section": "第三部分 查验业务知识", "header": "", "question": "对客车、危险货物运输货车、半挂牵引车和总质量大于等于12000kg的其他货车，注册登记时应查验行驶记录装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1197, "section": "第三部分 查验业务知识", "header": "", "question": "燃气汽车（包括气体燃料汽车，两用燃料汽车和双燃料汽车）应按规定在车辆前端或者后端醒目位置分别设置标注其使用的气体燃料类型的识别标志。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1198, "section": "第三部分 查验业务知识", "header": "", "question": "专门查验区的视线应良好，其场地应平坦、硬实，长度、宽度和高度应能满足查验车型的实际需要。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1199, "section": "第三部分 查验业务知识", "header": "", "question": "按《机动车查验工具配置要求》，查验箱应配置手锤、长卷尺、平面放大镜、内窥镜、铅锤、砂纸、除锈剂、脱漆剂、手套等工具、物品。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1200, "section": "第三部分 查验业务知识", "header": "", "question": "按《机动车查验工具配置要求》，查验箱应配置轮胎气压表、透光率计、紫外荧光灯、VIN码信息读取仪器、车身反光标识查验仪器等仪器设备。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1201, "section": "第三部分 查验业务知识", "header": "", "question": "按《机动车查验工具配置要求》，查验包应配置机动车查验检验智能终端、螺丝刀、金属卷尺、强光手电等常用查验工具。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1202, "section": "第三部分 查验业务知识", "header": "", "question": "查验员在查验机动车时，应佩戴全省统一式样的证卡，按照规定使用便携式查验智能终端和查验工具，依法依规履行相关法律法规、技术标准赋予的职责。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1203, "section": "第三部分 查验业务知识", "header": "", "question": "查验员应按照规定的项目查验机动车，按照相关法律法规和GB1589、GB7258等机动车国家安全技术标准确认所查验项目是否符合规定。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1204, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站查验机动车时应通过视频录像或拍摄照片等方式记录查验过程，并通过计算机网络实时向公安机关交通管理部门上传关键项目查验照片（或视频）和查验结果。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1205, "section": "第三部分 查验业务知识", "header": "", "question": "确定车辆类型时，机动车实车车长符合GB1589等机动车国家安全技术标准的规定且实车车长与《公告》、机动车整车出厂合格证明记载的名义车长的偏差在允许范围内时，按照实车车长核定车辆类型。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1206, "section": "第三部分 查验业务知识", "header": "", "question": "查验车辆识别代号时，应实车查看车辆识别代号的号码（为提高查验效率，可以只查看尾六位），核对是否与机动车整车出厂合格证明、货物进口证明书或者机动车行驶证等凭证一致，确认车辆识别代号有无被凿改等嫌疑。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1207, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验发动机（驱动电机）号码时，应实车查看打刻（或铸出）的发动机（型号和出厂编号），核对是否与机动车整车出厂合格证明、货物进口证明书等凭证一致，确认发动机号码有无被凿改等嫌疑。如打刻（或铸出）的发动机型号和出厂编号不易见，只查看发动机易见部位或覆盖件上能永久保持的标有发动机型号和出厂编号的标识。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1208, "section": "第三部分 查验业务知识", "header": "", "question": "更换发动机时不属于打刻原发动机号码的，应在《机动车查验记录表》的备注栏内记录新的发动机型号和出厂编号。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1209, "section": "第三部分 查验业务知识", "header": "", "question": "机动车查验所使用的量具应按照规定进行计量检定或校准。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1210, "section": "第三部分 查验业务知识", "header": "", "question": "查验车辆外廓尺寸、轴距等尺寸参数时，应采用机动车安全技术检验机构或其他具备资质的机构按照规定测得的相关尺寸参数数值，确认是否在允许的误差范围内。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1211, "section": "第三部分 查验业务知识", "header": "", "question": "查验整备质量时，应采用机动车安全技术检验机构或其他具备资质的机构按照规定测得的整备质量数值，并与《公告》、机动车整车出厂合格证明等凭证、技术资料记载的数值进行比对，确认是否在允许的误差范围内。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1212, "section": "第三部分 查验业务知识", "header": "", "question": "查验安全装置时，应实车操作检查，确认机动车是否具有限速功能或限速装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1213, "section": "第三部分 查验业务知识", "header": "", "question": "查验安全装置时，应实车操作检查，确认机动车是否安装了辅助制动装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1214, "section": "第三部分 查验业务知识", "header": "", "question": "查验安全装置时，应实车查看机动车前轮（实车无法查看时只查看车辆相关凭证和技术资料），确认机动车前轮是否安装了盘式制动器。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1215, "section": "第三部分 查验业务知识", "header": "", "question": "查验安全装置时，应实车查看半挂车，确认机动车是否安装了防抱制动装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1216, "section": "第三部分 查验业务知识", "header": "", "question": "查验安全装置时，应打开发动机舱盖并目视检查，确认客车是否安装了发动机舱自动灭火装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1217, "section": "第三部分 查验业务知识", "header": "", "question": "《机动车查验记录表》的填写要求，对申请变更车身颜色的机动车进行查验时，查验员应在\"备注\"栏中签注确定的\"车身颜色\"。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1218, "section": "第三部分 查验业务知识", "header": "", "question": "使用便携式查验智能终端时，《机动车查验记录表》应通过计算机软件打印生成。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1219, "section": "第三部分 查验业务知识", "header": "", "question": "审核机动车安全技术检验机构上传的检验照片（或视频）时，工作人员只需要确认检验照片（或视频）的数量是否符合机动车安全技术检验机构需上传检验照片要求的规定。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1220, "section": "第三部分 查验业务知识", "header": "", "question": "工作人员目测能确认检验照片（或视频）所反映检验项目不符合GB7258及其他相关规定的，比对结果为不合格，经调查核实机动车安全技术检验机构存在不按机动车国家安全技术标准和国家安全技术检验标准检验，出具虚假检验报告等情形的，应按规定对机动车安全技术检验机构予以处罚。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1221, "section": "第三部分 查验业务知识", "header": "", "question": "教育行政部门征求申请校车使用许可审查意见阶段查验机动车时，对专用校车应查验车辆识别代号、车辆号牌、校车标志灯和停车指示标志、具有行驶记录功能的卫星定位装置、应急锤、干粉灭火器、急救箱、安全技术检验合格证明、车身外观标识、照管人员座椅和汽车安全带、车内外录像监控系统、辅助倒车装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1222, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验监管系统出现检验异常情况预警报警提示时，应及时分析原因，告知机动车安全技术检验机构预警报警提示信息的具体内容并要求机动车安全技术检验机构查清核实；属于机动车安全技术检验机构不按机动车国家安全技术标准和国家机动车安全技术检验标准检验、出具虚假检验报告等情形的，应按规定对机动车安全技术检验机构予以处罚。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1223, "section": "第三部分 查验业务知识", "header": "", "question": "设区的市公安机关交通管理部门车辆管理所应定期分析本地机动车安全技术检验情况，每季度将参检率、检验合格率、异地检验率等数据及机动车安全技术检验机构违规信息上报省级公安机关交通管理部门。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1224, "section": "第三部分 查验业务知识", "header": "", "question": "汽车、摩托车、半挂车、2012年9月1日起出厂的中置轴挂车和2014年9月1日起出厂的牵引杆挂车应具有唯一的车辆识别代号，且应至少有一个车辆识别代号打刻在车架（无车架的机动车为车身主要承载且不能拆卸的部件）能防止锈蚀、磨损的部位上。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1225, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB 7258—2017，纯电动汽车、插电式混合动力汽车、燃料电池汽车和电动摩托车，应在驱动电机壳体上打刻电机型号和编号；除轮边电机、轮毂电机外的其他驱动电机，如打刻的电机型号和编号被覆盖，应留出观察口或在覆盖件上增加永久保持的电机型号和编号的标识。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1226, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，机动车整车出厂合格证明（对国产机动车）、进口车辆中英文对照表（对进口机动车）等凭证和技术资料上记载的\"车辆品牌\"和\"车辆型号\"与整车产品标牌上标明的车辆品牌、型号应相符。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1227, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，按照机动车整车出厂合格证明（对国产机动车）、海关货物进口证明书（对进口机动车）等凭证核定车身颜色。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1228, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，按照GB7258核定载客人数/驾驶室乘坐人数。对实行《公告》管理的国产机动车，载货汽车和专项作业车核定的驾驶室乘坐人数可小于《公告》机动车整车出厂合格证明标明的数值，但载客汽车核定的乘坐人数与机动车整车出厂合格证明标明的数值应一致且符合《公告》管理的相关规定。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1229, "section": "第三部分 查验业务知识", "header": "", "question": "不允许使用可拆卸号牌架和可翻转号牌架。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1230, "section": "第三部分 查验业务知识", "header": "", "question": "2012年9月1日起出厂的厢式货车和封闭式货车，驾驶室（区）两旁应设置车窗，货厢部位不得设置车窗[但驾驶室（区）内用于观察货物状态的观察窗除外]。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1231, "section": "第三部分 查验业务知识", "header": "", "question": "汽车及汽车列车、挂车的实际外廓尺寸不得超出GB1589规定的限值，摩托车的实际外廓尺寸不得超出GB7258规定的限值。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1232, "section": "第三部分 查验业务知识", "header": "", "question": "测量外廓尺寸参数时，无须考虑允许自行加装的部件及变更使用性质拆除标志灯具对测量结果的影响。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1233, "section": "第三部分 查验业务知识", "header": "", "question": "判定车辆外廓尺寸参数是否在公差允许范围内时，不考虑测量误差。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1234, "section": "第三部分 查验业务知识", "header": "", "question": "判定整备质量误差是否符合管理规定时，应考虑测量误差。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1235, "section": "第三部分 查验业务知识", "header": "", "question": "同一轴上的轮胎规格相同，即可判定轮胎规格查验项目为合格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1236, "section": "第三部分 查验业务知识", "header": "", "question": "道路运输爆炸品和剧毒化学品车辆，以及常压罐式危险货物运输车辆应在车辆的后部和两侧粘贴能标示车辆轮廓的、宽度为150mm±20mm的橙色反光带。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1237, "section": "第三部分 查验业务知识", "header": "", "question": "2012年9月1日起出厂，总质量大于3500kg的厢式货车和厢式挂车，装备的车身反光标识应为由红白相间的反射器单元组成的反射器型车身反光标识。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1238, "section": "第三部分 查验业务知识", "header": "", "question": "对于采用主副簧钢板弹簧结构的车辆，该轴钢板弹簧片数为\"主簧片数\"与\"副簧片数\"之和，左右两侧不一致的，以少的一侧为准。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1239, "section": "第三部分 查验业务知识", "header": "", "question": "机动车核定载客人数不包括驾驶人。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1240, "section": "第三部分 查验业务知识", "header": "", "question": "进口机动车取车辆识别代号前8位作为车辆的型号。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1241, "section": "第三部分 查验业务知识", "header": "", "question": "国产小型载客汽车不录入准牵引总质量。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1242, "section": "第三部分 查验业务知识", "header": "", "question": "进口机动车的\"车辆品牌\"按照进口凭证录入。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1243, "section": "第三部分 查验业务知识", "header": "", "question": "对2008年8月1日后签发的\"发动机号\"栏目为空的《货物进口证明书》（进口时不含发动机的汽车除外），公安机关交通管理部门不予办理注册登记，由签发地海关予以换发。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1244, "section": "第三部分 查验业务知识", "header": "", "question": "自2008年3月1日起，进口机动车的车辆识别代号（VIN）必须符合国家强制性标准《道路车辆车辆识别代号（VIN）》（GB16735-2004）的要求。对VIN不符合上述标准的进口机动车，公安机关不予办理注册登记手续，国家特殊需要并经批准的，以及常驻我国的境外人员、我国驻外使领馆人员自带的除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1245, "section": "第三部分 查验业务知识", "header": "", "question": "机动车相片应当能够清晰辨认车身颜色及外观特征。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1246, "section": "第三部分 查验业务知识", "header": "", "question": "机动车拍摄相片时，不悬挂机动车号牌，但已注册登记的机动车需要重新制作行驶证拍摄相片时，可以悬挂机动车号牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1247, "section": "第三部分 查验业务知识", "header": "", "question": "办理注册登记时，国产机动车的\"出厂日期\"按照机动车出厂合格证记载的车辆制造日期录入。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1248, "section": "第三部分 查验业务知识", "header": "", "question": "在办理进口汽车注册登记时，要严格执行《机动车运行安全技术条件》（GB7258）等国家安全技术标准，重点查验进口汽车车辆识别代号、产品标牌、里程表、外部灯具和信号装置等，对不符合国家标准的，一律不得办理注册登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1249, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验机构要严格检查液体危险货物罐车是否安装紧急切断装置，自2015年1月1日起，对未按规定安装的，不得出具安全技术检验合格证明。市场监管部门、公安部门要监督机动车安全技术检验机构严格落实液体危险货物罐车安全技术检验项目和要求。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1250, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所在办理大客车\"营转非\"业务时，要严格查验车辆，确保车辆座位、安全带、轮胎、灯光、应急出口等配置符合安全标准，必须消除车辆外观营运标识，粘贴和喷涂统一的专用标识。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1251, "section": "第三部分 查验业务知识", "header": "", "question": "公安交通管理部门在办理小微型面包车注册登记业务时，要严格车辆查验，对主要特征和技术参数不符合国家标准，或与《公告》数据不一致的，不予办理车辆注册登记，不予核发检验合格标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1252, "section": "第三部分 查验业务知识", "header": "", "question": "在办理摩托车注册登记时，要严格查验是否按规定配备安全头盔，对未按规定配备的，一律不予办理车辆注册登记，并告知机动车所有人可要求厂家或销售商配备安全头盔。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1253, "section": "第三部分 查验业务知识", "header": "", "question": "办理重中型货车和挂车注册登记时，对撤销《公告》后生产、销售的车辆，一律不予办理注册登记。但对《公告》有效期内已生产、销售的车辆，申请注册登记的，按规定予以办理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1254, "section": "第三部分 查验业务知识", "header": "", "question": "检验监管系统用户应实行分级管理，系统管理员、监督人员、机动车安全技术检验机构人员应授予不同的权限。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1255, "section": "第三部分 查验业务知识", "header": "", "question": "办理注册登记时，摩托车可不录入轮胎规格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1256, "section": "第三部分 查验业务知识", "header": "", "question": "办理注册登记时，前后轮胎规格不一致的，应分别录入，用“/”隔开。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1257, "section": "第三部分 查验业务知识", "header": "", "question": "自2011年1月1日起，汽车（不含三轮汽车和低速货车）、半挂车产品出厂配发整车出厂合格证时要随车同时配发实车车辆识别代号的拓印膜（2份）、实车拍摄的机动车外部彩色相片。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1258, "section": "第三部分 查验业务知识", "header": "", "question": "公安机关交通管理部门办理注册登记时，对涉嫌违规的机动车，要按照《公告》批准的技术参数和有关国家标准，严格查验，重点核查。对确属不符合标准和规定的，不予办理注册登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1259, "section": "第三部分 查验业务知识", "header": "", "question": "小微型面包整车长度应≤4500mm，宽度应≤1680mm，对超过以上尺寸的，应核定为\"普通客车\"。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1260, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，所有货车和货车底盘改装的专项作业车、带驾驶室的正三轮摩托车及总质量大于750kg的挂车，查验整备质量。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1261, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，所有货车（多用途货车、基于多用途货车改装的教练车除外）、货车底盘改装的专项作业车和挂车（旅居挂车除外）查验车身反光标识。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1262, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，对公路客车、旅游客车、校车和危险货物运输货车及车长大于9m的其他客车、旅居车，查验是否具有限速功能或装备限速装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1263, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，对客车、货车（三轮汽车除外）、专项作业车（五轴及五轴以上专项作业车除外）、乘用车及总质量大于3500kg的挂车，查验防抱制动装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1264, "section": "第三部分 查验业务知识", "header": "", "question": "对进口机动车，查验外部照明和信号装置的配置和光色、车速里程表指示、排气管布置和中文警告性文字。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1265, "section": "第三部分 查验业务知识", "header": "", "question": "对申请变更为\"预约出租客运\"或者\"预约出租转非\"的，需按照规定查验机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1266, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，应对所有的插电式混合动力汽车、纯电动汽车（换电式除外），查验是否具有外接充电接口。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1267, "section": "第三部分 查验业务知识", "header": "", "question": "对转入的机动车进行查验时，对属于卧铺客车、公路客车、旅游客车、专用校车和设有乘客站立区的客车的，还应查验车内外录像监控装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1268, "section": "第三部分 查验业务知识", "header": "", "question": "对申请换发新能源汽车专用号牌业务的，不需查验机动车，登记审核岗审核申请人提交的资料，符合规定的予以办理换发新能源汽车号牌。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1269, "section": "第三部分 查验业务知识", "header": "", "question": "查验员应按照规定的项目查验机动车，按照相关法律法规和GB7258、GB1589等机动车国家安全技术标准确认所查验项目是否符合规定，使用机动车查验智能终端记录机动车查验结果、采集查验照片和视频，录入机动车查验监管系统，制作《机动车查验记录表》或《校车查验记录表》。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1270, "section": "第三部分 查验业务知识", "header": "", "question": "查验过程中，民警查验员应按照规定使用执法记录仪，非民警查验员应按照规定使用与执法记录仪功能相同的视音频记录装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1271, "section": "第三部分 查验业务知识", "header": "", "question": "确定车身颜色时，应根据实车核定；车身颜色随观察位置的不同及光线的明暗会发生变化的，查验不合格，不得办理登记业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1272, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，确定核定载人数时，对客车、发动机中置且宽高比小于等于0.9的乘用车、车高大于或等于1850mm的小型普通客车，应实车查看座位数、座间距及座椅布置情况，对驾驶室前排核定乘坐3人的汽车，应实车测量驾驶室（区）内部宽度。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1273, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，还应按车辆产品使用说明书（或其他经主管部门认可的技术资料，如车辆产品一致性证书）的标示确定打刻的车辆识别代号的位置是否符合规定，若符合规定的，可不使用机动车查验智能终端对货箱或常压罐体上打刻的车辆识别代号进行拍照。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1274, "section": "第三部分 查验业务知识", "header": "", "question": "因更换发动机申请变更登记的，安全技术检验合格证明未记载发动机型号和出厂编号的，由查验员在《机动车查验记录表》上记录相关信息。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1275, "section": "第三部分 查验业务知识", "header": "", "question": "非注册登记查验时，对发动机标识缺失或发动机标识的内容与打刻（或铸出）的发动机型号和出厂编号不一致的，视为查验不合格，不得予以办理登记业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1276, "section": "第三部分 查验业务知识", "header": "", "question": "查验员查验遇到公安交通管理综合应用平台提示的涉嫌违规机动车产品时，应查验实车是否存在提示的违规情形并拍照留存。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1277, "section": "第三部分 查验业务知识", "header": "", "question": "对初次注册登记查验确认为违规机动车产品的机动车再次进行注册登记查验时，应确认机动车生产厂家是否已对先前查验不合格的项目进行了整改并出具了与整改日期相适应的整改合格说明，确认的结果应通过视频录像或拍摄照片留存。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1278, "section": "第三部分 查验业务知识", "header": "", "question": "摩托车和非营运小型、微型载客汽车以及经省级公安机关交通管理部门备案的其他类型机动车，实行先行核发机动车检验合格标志后监督检查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1279, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号的第10位为年份位，应当为制造车辆的历法年份，但数字0和字母I、O、Q、U、Z不能使用。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1280, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（或产品识别代码、整车型号和出厂编号）一经打刻不应更改、变动，但按GB16735的规定重新标示或变更的除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1281, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，发现打刻的车辆识别代号及其附近可视区域存在局部打磨、涂漆等加工处理痕迹时，无论加工处理痕迹是否影响管理部门对车辆识别代号的识别和认定，应认定为不符合GB7258国家标准的要求。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1282, "section": "第三部分 查验业务知识", "header": "", "question": "在用车更换发动机的，更换的发动机型号应与登记的发动机型号一致，但对国产车也可以为《公告》对应车型许可选装的其他发动机型号；其他情况下，实车的发动机标识缺失的，确认无私自更换发动机情形的，记录相关信息后视为合格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1283, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，按照实车核定车身颜色，核定的车身颜色与机动车整车出厂合格证明、海关《货物进口证明书》等凭证、技术资料记载的内容不一致的，或者车身颜色随观察位置不同及光线明暗会发生变化的，经确认未变更车身颜色的，记录相关情况后办理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1284, "section": "第三部分 查验业务知识", "header": "", "question": "对进口机动车，核定的乘坐人数应与《货物进口证明书》及其他经主管部门认可的技术资料（如：车辆产品一致性证书）一致。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1285, "section": "第三部分 查验业务知识", "header": "", "question": "在用车查验时，总质量大于或等于12000kg的自卸车除了在车厢后部喷涂或粘贴/放置放大的号牌号码，还应在车厢左右两侧喷涂放大的号牌号码。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1286, "section": "第三部分 查验业务知识", "header": "", "question": "对平板式、骨架式结构的货车、专项作业车、牵引车等无载货部位或载货部位受结构限制确实无法满足放大号喷涂要求的，不查验放大的号牌号码；但这类车辆上道路行驶时，应按规定放置放大的号牌号码板。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1287, "section": "第三部分 查验业务知识", "header": "", "question": "小型、微型载客汽车在不改变车辆车身主体结构且保证安全的情况下可以加装车顶行李架、换装不同式样散热器面罩和(或)保险杠、更换轮毂；但更换轮毂的，不得改变轮胎规格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1288, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，乘用车未按规定配备机动车用三角警告牌和/或反光背心的，告知机动车所有人或申请人（或被委托人的经办人）道路交通安全法律法规和技术标准相关规定和使用要求，记录相关情况后视为合格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1289, "section": "第三部分 查验业务知识", "header": "", "question": "发现安全技术检验合格证明（或测试报告）记载的测试结果与实车外廓尺寸等参数明显不一致的，不予采信测试结果，按规定予以处罚并通报相关行业主管部门。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1290, "section": "第三部分 查验业务知识", "header": "", "question": "2020年1月1日起出厂的罐式液体危险货物运输车辆，后下部防护应位于车辆最后端。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1291, "section": "第三部分 查验业务知识", "header": "", "question": "2019年1月1日起出厂的公路客车、旅游客车和未设置乘客站立区的公共汽车，车长大于9m时车身左右两侧应至少各配置2个外推式应急窗并应在车身左侧设置1个应急门。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1292, "section": "第三部分 查验业务知识", "header": "", "question": "2020年1月1日起出厂的危险货物运输半挂车、三轴栏板式和仓栅式半挂车，其所有车轮均应装备盘式制动器。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1293, "section": "第三部分 查验业务知识", "header": "", "question": "组织上门查验机动车的，应当通过机动车查验监管系统受理查验业务后，安排2名以上具有相应车型查验资格的查验员查验机动车，其中至少1名为中级查验员。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1294, "section": "第三部分 查验业务知识", "header": "", "question": "根据《机动车查验工作规范（试行）》，查验不合格的，查验业务岗应当向机动车所有人或者代理人出具书面告知，一次性书面告知查验不合格原因，在机动车查验监管系统中记录机动车基本信息、查验不合格原因及相关证明图片（视频）资料。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1295, "section": "第三部分 查验业务知识", "header": "", "question": "对摩托车和非营运小型、微型载客汽车（面包车除外）以及经省级公安机关交通管理部门备案的其他类型机动车，经检验机构检验合格后，先行远程核发机动车检验合格标志，在检验照片（视频）上传后的36小时内审查完毕。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1296, "section": "第三部分 查验业务知识", "header": "", "question": "民警查验员在查验工作中发现机动车被盗抢、走私嫌疑的，还应当先行采取必要的处置措施防止嫌疑机动车驶离，并要求机动车所有人或者代理人配合调查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1297, "section": "第三部分 查验业务知识", "header": "", "question": "公安机关交通管理部门接到机动车被盗抢、走私嫌疑报告后，应当立即指派至少1名民警依法开展现场调查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1298, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所应当指导、监督机动车安全技术检验机构、机动车登记服务站按照相关规范采集、报送嫌疑违规机动车产品信息。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1299, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站应当配备与机动车查验工作相适应的社会辅助查验员，社会辅助查验员可以兼任登记审核岗。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1300, "section": "第三部分 查验业务知识", "header": "", "question": "社会辅助中级查验员可以承担社会辅助初级查验员查验工作，以及除危险货物运输车辆、校车外的所有车型的转移登记、变更迁出、补领机动车登记证书等业务的查验工作。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1301, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站应当为社会辅助查验员配备查验工具、查验智能终端、便携式视音频记录装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1302, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站应当优化机动车登记工作流程，做好机动车查验、登记审核、牌证发放等工作流程衔接，积极推行一次受理、全程代办服务模式，方便群众坐等即可办结业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1303, "section": "第三部分 查验业务知识", "header": "", "question": "办理危险货物运输车注册登记时，查验岗应当审查外部标识等是否符合有关规范和标准；办理专用校车注册登记时，查验岗应当审查校车标志灯、停车指示标志及专用校车车身外观标识等是否符合有关规范和标准。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1304, "section": "第三部分 查验业务知识", "header": "", "question": "办理消防车、救护车、工程救险车注册登记时，查验岗应当审查标志图案、标志灯具和警报器等是否符合有关规范和标准。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1305, "section": "第三部分 查验业务知识", "header": "", "question": "校车、大型客车、中型以上货车及其他营运车辆在机动车回收企业解体时，车辆管理所应当派民警现场监督，不能采用远程视频监督方式。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1306, "section": "第三部分 查验业务知识", "header": "", "question": "机动车达到强制报废标准的，其所有人应当将机动车交售给金属回收公司进行拆解。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1307, "section": "第三部分 查验业务知识", "header": "", "question": "报废的机动车由报废机动车回收拆解企业按规定进行登记、拆解、销毁等处理，并将报废机动车登记证书、号牌、行驶证交公安机关交通管理部门注销。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1308, "section": "第三部分 查验业务知识", "header": "", "question": "机动车经修理和调整仍不符合机动车安全技术国家标准对在用车有关要求的，应当强制报废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1309, "section": "第三部分 查验业务知识", "header": "", "question": "机动车经修理和调整或者采用控制技术后，向大气排放污染物或者噪声仍不符合国家标准对在用车有关要求的，应当引导报废。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1310, "section": "第三部分 查验业务知识", "header": "", "question": "不同类型的营运载客汽车相互转换，按照使用年限较宽的规定报废。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1311, "section": "第三部分 查验业务知识", "header": "", "question": "小、微型出租客运汽车和摩托车需要转出登记所属地省、自治区、直辖市范围的，按照使用年限较严的规定报废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1312, "section": "第三部分 查验业务知识", "header": "", "question": "危险品运输载货汽车、半挂车与其他载货汽车、半挂车相互转换的，按照危险品运输载货车、半挂车的规定报废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1313, "section": "第三部分 查验业务知识", "header": "", "question": "达到一定行驶里程的机动车应当强制报废。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1314, "section": "第三部分 查验业务知识", "header": "", "question": "机动车查验工具的配置应遵循规范、实用的原则，根据机动车查验的业务种类、车辆类型等合理配置，满足机动车查验工作需要。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1315, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB 7258—2017国家标准规定，轻便摩托车乘坐人数可以核定为2人。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1316, "section": "第三部分 查验业务知识", "header": "", "question": "对半挂牵引车查验时，应查验其驾驶室后围板上方是否加装“后示廓灯”以体现车辆“后部”轮廓。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1317, "section": "第三部分 查验业务知识", "header": "", "question": "采用自动离合、手动换挡的乘用车可以加装驾驶操纵辅助装置成为残疾人专用汽车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1318, "section": "第三部分 查验业务知识", "header": "", "question": "专门为出口而设计和制造的机动车应符合GB 7258—2017国家标准的规定，其方向盘不得设置于右侧。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1319, "section": "第三部分 查验业务知识", "header": "", "question": "由非封闭式货车改装、虽装置有专用设备或器具、但不属于专项作业车的汽车，按照GB 7258—2017的规定属于货车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1320, "section": "第三部分 查验业务知识", "header": "", "question": "核定乘坐人数大于或等于 10 人的商务车属于 GB7258—2017国家标准 定义的客车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1321, "section": "第三部分 查验业务知识", "header": "", "question": "所有客车发动机舱应安装自动灭火装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1322, "section": "第三部分 查验业务知识", "header": "", "question": "专用客车可以不安装行驶记录仪。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1323, "section": "第三部分 查验业务知识", "header": "", "question": "在用车更换发动机进行安全技术检验时，安全技术检验合格证明上不需要记载有更换后的发动机型号和出厂编号。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1324, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，对客车、货车（三轮汽车除外）、专项作业车（五轴及五轴以上专项作业车除外）、乘用车及总质量大于3500kg的挂车，查验防抱制动装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1325, "section": "第三部分 查验业务知识", "header": "", "question": "对实车技术参数违反机动车国家安全标准的机动车产品，无论其《公告》是否有效，均应“取证、退办、报违规”，不得办理登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1326, "section": "第三部分 查验业务知识", "header": "", "question": "对发生过造成人员伤亡交通事故的送检机动车，人工检验时应重点检查损伤部位和损伤情况，属于使用年限在10年以内的非营运小型、微型载客汽车的，增加底盘动态检验、车辆底盘部件检查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1327, "section": "第三部分 查验业务知识", "header": "", "question": "以下内容属于《机动车查验工作规程》GA801-2019要求汽车注册登记时新增的查验项目是_______。", "options": ["A、灭火器", "B、三角警告牌", "C、汽车乘员反光背心", "D、安全手锤"], "answer": "C", "type": "choice"}, {"id": 1328, "section": "第三部分 查验业务知识", "header": "", "question": "对查验不合格的，机动车登记服务站应当向机动车所有人或者代理人_______查验不合格原因。", "options": ["A、一次性头口告知", "B、书面告知", "C、一次性书面告知", "D、无需告知"], "answer": "C", "type": "choice"}, {"id": 1329, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，外廓尺寸参数公差允许范围对汽车（三轮汽车除外）为_______。", "options": ["A、±1%或±50mm", "B、±2%或±50mm", "C、±3%或±50mm", "D、±3%或±100mm"], "answer": "A", "type": "choice"}, {"id": 1330, "section": "第三部分 查验业务知识", "header": "", "question": "_______应在靠近风窗玻璃立柱的位置设置能永久保持的、从车外能清晰识读的车辆识别代号标识。", "options": ["A、仅2013年3月1日起出厂的乘用车", "B、仅总质量小于等于4500kg的货车（低速汽车除外）", "C、2013年3月1日起出厂的乘用车和总质量小于等于3500kg的货车（低速汽车除外）", "D、所有小型、微型载客汽车和轻型、微型载货汽车"], "answer": "C", "type": "choice"}, {"id": 1331, "section": "第三部分 查验业务知识", "header": "", "question": "不属于机动车车身基本色调的是_______。", "options": ["A、棕", "B、紫", "C、银", "D、粉"], "answer": "C", "type": "choice"}, {"id": 1332, "section": "第三部分 查验业务知识", "header": "", "question": "机动车影像应占机动车标准照片的_______。", "options": ["A、二分之一", "B、三分之二", "C、五分之三", "D、五分之四"], "answer": "B", "type": "choice"}, {"id": 1333, "section": "第三部分 查验业务知识", "header": "", "question": "机动车车身基本色调共有_______种。", "options": ["A、8", "B、9", "C、10", "D、11"], "answer": "C", "type": "choice"}, {"id": 1334, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验机构上传的检验项目照片，车辆左前方斜视45°拍照，不需要清晰显示的是_______。", "options": ["A、检验员外貌", "B、车辆前外观", "C、前号牌", "D、轮胎"], "answer": "A", "type": "choice"}, {"id": 1335, "section": "第三部分 查验业务知识", "header": "", "question": "监销报废解体的机动车时，应查验被报废解体机动车的车辆识别代号，确认车辆发动机、_______、变速器、前后桥、车架（车身）等五大总成。", "options": ["A、离合器", "B、车轮", "C、刹车系统", "D、方向机"], "answer": "D", "type": "choice"}, {"id": 1336, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，不查验外廓尺寸、轴数、轴距和轮胎规格的是_______。", "options": ["A、总质量大于等于4500kg的（即中型和重型）货车", "B、总质量大于等于4500kg的货车底盘改装的专项作业车", "C、客车", "D、危险货物运输车"], "answer": "C", "type": "choice"}, {"id": 1337, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，不查验车身反光标识的是_______。", "options": ["A、多用途货车及基于多用途货车改装的教练车", "B、货车底盘改装的专项作业车", "C、挂车（旅居挂车除外）", "D、所有货车（多用途货车、基于多用途货车改装的教练车除外）"], "answer": "A", "type": "choice"}, {"id": 1338, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，对除半挂牵引车外的总质量大于_______的货车、货车底盘改装的专项作业车和挂车，查验侧面及后下部防护装置。", "options": ["A、1800kg", "B、3500kg", "C、4500kg", "D、12000kg"], "answer": "B", "type": "choice"}, {"id": 1339, "section": "第三部分 查验业务知识", "header": "", "question": "《机动车查验记录表》填写要求不符合要求的是_______。", "options": ["A、所列查验项目查验合格的，在对应的判定栏内签注\"√\"", "B、查验不合格的，在对应的判定栏内签注\"×\"，必要时还应在备注栏简要说明不合格的情形", "C、对按照规定不须查验的项目，在对应的判定栏内签注\"-\"", "D、按照规定查验的项目具有不合格情形时，可不填写《机动车查验记录表》"], "answer": "D", "type": "choice"}, {"id": 1340, "section": "第三部分 查验业务知识", "header": "", "question": "对申请注册登记的机动车进行查验时，《机动车查验记录表》判定栏内不需要签注查验确定的相应内容的是_______。", "options": ["A、车辆识别代号", "B、车身颜色", "C、核定载人数", "D、车辆类型"], "answer": "A", "type": "choice"}, {"id": 1341, "section": "第三部分 查验业务知识", "header": "", "question": "小型载客汽车的车长为_______米。", "options": ["A、大于6", "B、小于6", "C、小于等于6", "D、小于等于5.8"], "answer": "B", "type": "choice"}, {"id": 1342, "section": "第三部分 查验业务知识", "header": "", "question": "小型载客汽车的载客人数为_______人。", "options": ["A、小于等于9", "B、小于9", "C、小于8", "D、小于等于8"], "answer": "A", "type": "choice"}, {"id": 1343, "section": "第三部分 查验业务知识", "header": "", "question": "中型载客汽车的车长为_______米。", "options": ["A、大于6", "B、小于6", "C、小于等于6", "D、大于等于6"], "answer": "B", "type": "choice"}, {"id": 1344, "section": "第三部分 查验业务知识", "header": "", "question": "中型载客汽车的载客人数为_______人。", "options": ["A、大于等于10且小于等于19", "B、大于等于9且小于等于20", "C、小于等于9", "D、大于等于6且小于等于15"], "answer": "A", "type": "choice"}, {"id": 1345, "section": "第三部分 查验业务知识", "header": "", "question": "车长大于等于_______米的客车为大型载客汽车。", "options": ["A、9", "B、7", "C、6", "D、5.8"], "answer": "C", "type": "choice"}, {"id": 1346, "section": "第三部分 查验业务知识", "header": "", "question": "乘坐人数大于等于_______人的客车为大型载客汽车。", "options": ["A、20", "B、19", "C、9", "D、21"], "answer": "A", "type": "choice"}, {"id": 1347, "section": "第三部分 查验业务知识", "header": "", "question": "轻型载货汽车的总质量为_______kg。", "options": ["A、大于4500", "B、小于4500", "C、小于等于4500", "D、小于等于4000"], "answer": "B", "type": "choice"}, {"id": 1348, "section": "第三部分 查验业务知识", "header": "", "question": "总质量为4200kg中型载货汽车的车长为_______米。", "options": ["A、大于6", "B、小于6", "C、大于等于6", "D、小于等于6"], "answer": "C", "type": "choice"}, {"id": 1349, "section": "第三部分 查验业务知识", "header": "", "question": "总质量为_______kg且小于12000kg，或者车长大于或者等于6000mm，且不包括重型载货汽车和低速汽车的，属于中型载货汽车。", "options": ["A、大于等于3500", "B、大于4500", "C、大于等于4500", "D、大于等于5000"], "answer": "C", "type": "choice"}, {"id": 1350, "section": "第三部分 查验业务知识", "header": "", "question": "普通摩托车的最大设计车速为_______km/h。", "options": ["A、大于等于50", "B、大于50", "C、小于50", "D、小于等于50"], "answer": "B", "type": "choice"}, {"id": 1351, "section": "第三部分 查验业务知识", "header": "", "question": "不具有载货结构，或者虽具有载货结构但核定载质量（或托举质量）小于_______kg的专项作业车，核定为无载货功能的专项作业车（非载货专项作业车）。", "options": ["A、100", "B、1000", "C、1800", "D、3500"], "answer": "B", "type": "choice"}, {"id": 1352, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，下列不需查验车辆尾部标志板的是_______。", "options": ["A、总质量大于或等于12000kg的货车", "B、半挂牵引车", "C、总质量大于或等于12000kg的货车底盘改装的专项作业车", "D、车长大于8.0m的挂车"], "answer": "B", "type": "choice"}, {"id": 1353, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，对_______、危险货物运输货车、半挂牵引车和总质量大于或等于12000kg的其他货车，查验行驶记录装置。", "options": ["A、公路客车", "B、所有客车", "C、旅居车", "D、旅游客车"], "answer": "B", "type": "choice"}, {"id": 1354, "section": "第三部分 查验业务知识", "header": "", "question": "以下车辆在注册登记时不需要查验是否喷涂了总质量（或最大允许牵引质量）、栏板高度、罐体容积和允许装运货物的种类或名称的是_______。", "options": ["A、大于等于4500kg的货车（货车类教练车除外）", "B、多用途货车", "C、专项作业车（消防车除外）", "D、所有货车"], "answer": "B", "type": "choice"}, {"id": 1355, "section": "第三部分 查验业务知识", "header": "", "question": "注册查验时，对_______，查验是否喷涂了该车提供给乘员（包括驾驶人）的座位数。", "options": ["A、专用校车", "B、设有乘客站立区的客车", "C、小型面包车", "D、小型普通客车"], "answer": "C", "type": "choice"}, {"id": 1356, "section": "第三部分 查验业务知识", "header": "", "question": "注册查验时，对总质量_______kg的危险货物运输货车，查验辅助制动装置。", "options": ["A、大于等于3500", "B、大于3500", "C、大于等于4500", "D、大于4500"], "answer": "B", "type": "choice"}, {"id": 1357, "section": "第三部分 查验业务知识", "header": "", "question": "对专用校车、车长大于9m的其他客车和_______，以及危险货物运输半挂车、三轴的栏板式和仓栅式半挂车的所有车轮，查验是否装备了盘式制动器。", "options": ["A、所有危险货物运输货车的转向轮", "B、所有危险货物运输货车的后轮", "C、所有危险货物运输货车的所有轮", "D、所有危险货物运输货车的前轮"], "answer": "D", "type": "choice"}, {"id": 1358, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时，以下车型需要查验发动机舱自动灭火装置的是：_______。", "options": ["A、纯电动客车", "B、燃油客车", "C、燃料电池客车", "D、混合动力小轿车"], "answer": "B", "type": "choice"}, {"id": 1359, "section": "第三部分 查验业务知识", "header": "", "question": "乘用车出厂后对车身外部进行加装车顶行李架后，车辆高度增加值小于或等于_______mm。", "options": ["A、300", "B、150", "C、100", "D、200"], "answer": "A", "type": "choice"}, {"id": 1360, "section": "第三部分 查验业务知识", "header": "", "question": "2020年1月1日起出厂的所有车辆，空载状态下在其全部宽度范围内的后下部防护的下边缘离地高度不应大于_______。", "options": ["A、450mm", "B、400mm", "C、500mm", "D、550mm"], "answer": "C", "type": "choice"}, {"id": 1361, "section": "第三部分 查验业务知识", "header": "", "question": "轻便摩托车若使用内燃机，其发动机气缸总排量为_______ml。", "options": ["A、小于50", "B、小于等于50", "C、小于35", "D、小于等于35"], "answer": "B", "type": "choice"}, {"id": 1362, "section": "第三部分 查验业务知识", "header": "", "question": "关于车辆识别代号打刻，查验不合格的是_______。", "options": ["A、同一辆车上既打刻车辆识别代号，又打刻整车型号和出厂编号", "B、同一辆车上标识的所有车辆识别代号内容相同（按照GB16735重新标示或变更的除外）", "C、打刻的车辆识别代号易见且易于拓印", "D、没有明显的更改、变动、凿改、挖补、打磨痕迹或垫片、擅自另外打刻等异常情形"], "answer": "A", "type": "choice"}, {"id": 1363, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记查验时，关于号牌板（架），查验不合格的是_______。", "options": ["A、前号牌板（架）（摩托车除外）设于前面中部或右侧（按机动车前进方向）", "B、后号牌板（架）设于后面中部或左侧（按机动车前进方向）", "C、号牌板（架）能安装符合GA36要求的机动车号牌", "D、2016年3月1日后出厂的机动车号牌板（架）上只设有2个号牌安装孔"], "answer": "D", "type": "choice"}, {"id": 1364, "section": "第三部分 查验业务知识", "header": "", "question": "关于车辆号牌，查验不合格的是_______。", "options": ["A、安装在号牌板（架）处", "B、号牌安装正置、横向水平、纵向基本垂直", "C、未使用专用固封装置固封", "D、无变形、遮盖和破损、涂改"], "answer": "C", "type": "choice"}, {"id": 1365, "section": "第三部分 查验业务知识", "header": "", "question": "关于车辆外观形状，查验不合格的是_______。", "options": ["A、机动车配备的后视镜和下视镜完好", "B、所有车窗玻璃完好且未粘贴镜面反光遮阳膜", "C、前风窗玻璃及风窗以外玻璃用于驾驶人视区部位张贴有不透明或镜面反光材料之色纸或隔热纸", "D、车辆上装备的商标、厂标等整车标志与车辆品牌/型号相适应"], "answer": "C", "type": "choice"}, {"id": 1366, "section": "第三部分 查验业务知识", "header": "", "question": "总质量大于等于12000kg的混凝土搅拌运输车的车辆类型是_______。", "options": ["A、中型罐式货车", "B、重型特殊结构货车", "C、重型专项作业车", "D、中型专项作业车"], "answer": "B", "type": "choice"}, {"id": 1367, "section": "第三部分 查验业务知识", "header": "", "question": "总质量大于等于12000kg的汽车起重机的车辆类型是_______。", "options": ["A、重型特殊结构货车", "B、中型专项作业车", "C、重型专项作业车", "D、轮式自行机械"], "answer": "C", "type": "choice"}, {"id": 1368, "section": "第三部分 查验业务知识", "header": "", "question": "载货部位的结构为封闭厢体且与驾驶室联成一体，车身结构为一厢式或两厢式的载货汽车应核定为______。", "options": ["A、特殊结构货车", "B、厢式货车", "C、封闭式货车", "D、专项作业车"], "answer": "C", "type": "choice"}, {"id": 1369, "section": "第三部分 查验业务知识", "header": "", "question": "核定车辆类型时，邮政车、冷藏车、保温车等以载运货物为主要目的专用汽车，以及非客车整车或底盘改装的运钞车，根据其载货部位的结构特征确定为相对应的_______。", "options": ["A、载货汽车", "B、载客汽车", "C、专用客车", "D、特殊结构货车"], "answer": "A", "type": "choice"}, {"id": 1370, "section": "第三部分 查验业务知识", "header": "", "question": "平头或短头车身结构，单层地板，发动机中置，宽高比小于等于0.90，乘坐人数小于等于9人，安装座椅的载客汽车，核定为_______。", "options": ["A、普通客车", "B、轿车", "C、面包车", "D、专用客车"], "answer": "C", "type": "choice"}, {"id": 1371, "section": "第三部分 查验业务知识", "header": "", "question": "车身结构为一厢式或者两厢式，所有车轮能够同时驱动，接近角、离去角、纵向通过角、最小离地间隙等技术参数按照高通过性设计的载客汽车，核定为_______。", "options": ["A、专用校车", "B、专用客车", "C、越野客车", "D、无轨电车"], "answer": "C", "type": "choice"}, {"id": 1372, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记时不录入总质量的是_______。", "options": ["A、半挂牵引车", "B、载客汽车", "C、载货汽车", "D、摩托车。"], "answer": "A", "type": "choice"}, {"id": 1373, "section": "第三部分 查验业务知识", "header": "", "question": "车身或者后厢后部喷涂或放置、悬挂的放大牌号尺寸为小型汽车号牌登记编号字体的______倍。", "options": ["A、1.5", "B、2.0", "C、2.5", "D、3.0"], "answer": "C", "type": "choice"}, {"id": 1374, "section": "第三部分 查验业务知识", "header": "", "question": "汽车的标准照片应当从_______45度角拍摄（按机动车前进方向）。", "options": ["A、车后方右侧", "B、车后方左侧", "C、车前方右侧", "D、车前方左侧"], "answer": "D", "type": "choice"}, {"id": 1375, "section": "第三部分 查验业务知识", "header": "", "question": "摩托车和挂车的标准照片应当从_______45度角拍摄（按机动车前进方向）。", "options": ["A、车前方左侧", "B、车前方右侧", "C、车后方右侧", "D、车后方左侧"], "answer": "D", "type": "choice"}, {"id": 1376, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（VIN）共_______位字码。", "options": ["A、15", "B、16", "C、17", "D、18"], "answer": "C", "type": "choice"}, {"id": 1377, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（VIN）的第_______位字码为校验位。", "options": ["A、7", "B、8", "C、9", "D、10"], "answer": "C", "type": "choice"}, {"id": 1378, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（VIN）的第_______位字码为年份代码位。", "options": ["A、8", "B、9", "C、10", "D、11"], "answer": "C", "type": "choice"}, {"id": 1379, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（VIN）的年份代码使用每_______循环一次。", "options": ["A、15", "B、20", "C、30", "D、50"], "answer": "C", "type": "choice"}, {"id": 1380, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（VIN）第一位为\"W\"，代表制造国为_______。", "options": ["A、中国", "B、德国", "C、美国", "D、英国"], "answer": "B", "type": "choice"}, {"id": 1381, "section": "第三部分 查验业务知识", "header": "", "question": "摩托车打刻的车辆识别代号字高应不小于_______mm，深度应不小于_______mm。", "options": ["A、7，0.3", "B、7，0.2", "C、5，0.3", "D、5，0.2"], "answer": "D", "type": "choice"}, {"id": 1382, "section": "第三部分 查验业务知识", "header": "", "question": "_______不适用《道路车辆车辆识别代号》（GB16735）。", "options": ["A、汽车", "B、挂车", "C、摩托车", "D、轮式专用机械车"], "answer": "D", "type": "choice"}, {"id": 1383, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（VIN）的第十一位代表_______。", "options": ["A、校验位", "B、年份代码", "C、装配厂", "D、生产顺序号"], "answer": "C", "type": "choice"}, {"id": 1384, "section": "第三部分 查验业务知识", "header": "", "question": "GB1589-2016标准的名称为_______。", "options": ["A、《道路车辆外廓尺寸、轴荷及质量限值》", "B、《机动车运行安全技术条件》", "C、《汽车、挂车及汽车列车外廓尺寸、轴荷及质量限值》", "D、《机动车安全技术检验项目和方法》"], "answer": "C", "type": "choice"}, {"id": 1385, "section": "第三部分 查验业务知识", "header": "", "question": "最大允许总质量超过_______吨的油田专用作业车不应予以注册登记，不应核发正式机动车号牌。", "options": ["A、40", "B、43", "C、49", "D、55"], "answer": "D", "type": "choice"}, {"id": 1386, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB1589-2016，低平板专用半挂车的车辆长度限值为_______米。", "options": ["A、13", "B、13.75", "C、16", "D、17.5"], "answer": "B", "type": "choice"}, {"id": 1387, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB1589-2016，汽车间接视野装置单侧外伸量不应超过车辆宽度_______毫米。", "options": ["A、50", "B、200", "C、250", "D、300"], "answer": "C", "type": "choice"}, {"id": 1388, "section": "第三部分 查验业务知识", "header": "", "question": "冷藏车宽度最大限值为_______毫米。", "options": ["A、2500", "B、2550", "C、2600", "D、3000"], "answer": "C", "type": "choice"}, {"id": 1389, "section": "第三部分 查验业务知识", "header": "", "question": "刮水器和洗涤器、锁止装置、铰链、手柄、控制器、开关、可拆卸的车辆用的挂接或拖曳装置等装置若不列入车辆长度测量范围，不需要满足的条件_______。", "options": ["A、不具有载货功能", "B、超出车辆前或后端不大于50mm", "C、边和角的圆角半径不小于5mm", "D、在《公告》备注栏内注明"], "answer": "D", "type": "choice"}, {"id": 1390, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB1589-2016，_______宽度最大限值为3米。", "options": ["A、仅低平板专用半挂车", "B、低平板专用半挂车、汽车起重机", "C、低平板专用半挂车、汽车起重机、油田专用作业车", "D、低平板专用半挂车、汽车起重机、油田专用作业车、消防车"], "answer": "B", "type": "choice"}, {"id": 1391, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB1589-2016，挂车及二轴货车的货箱栏板（含盖）高度不应超过_______mm。", "options": ["A、600", "B、800", "C、12000", "D、15000"], "answer": "A", "type": "choice"}, {"id": 1392, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB1589-2016，二轴自卸车、三轴及三轴以上货车货箱栏板（含盖）高度不应超过_______mm。", "options": ["A、600", "B、800", "C、12000", "D、15000"], "answer": "B", "type": "choice"}, {"id": 1393, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB1589-2016，三轴及三轴以上自卸车的货箱栏板（含盖）高度不得超过_______mm。", "options": ["A、1000", "B、1200", "C、1500", "D、1800"], "answer": "C", "type": "choice"}, {"id": 1394, "section": "第三部分 查验业务知识", "header": "", "question": "底盘动态检验制动系时，以不低于_______km／h的速度正直行驶，双手轻扶方向盘，急踩制动踏板后迅速放松。", "options": ["A、10", "B、20", "C、30", "D、40"], "answer": "B", "type": "choice"}, {"id": 1395, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记检验时，机动车的整备质量应与机动车产品公告、机动车出厂合格证相符，且误差满足：重中型货车、挂车、专项作业车不超过_______。 知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，限速功能或限速装置调定的最大车速对公路客车、旅游客车和车长大于9m的其他客车、车长大于或等于6m的旅居车不应大于        。", "options": ["A、80km/h", "B、90km/h", "C、100km/h", "D、110km/h"], "answer": "C", "type": "choice"}, {"id": 1469, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019查验合格要求规定，进口机动车转向灯的光色应为        。", "options": ["A、红色", "B、琥珀色", "C、黄色", "D、橙色"], "answer": "B", "type": "choice"}, {"id": 1470, "section": "第三部分 查验业务知识", "header": "", "question": "按照《机动车运行安全技术条件》GB7258-2017第1号修改单要求，下列        载货部位不应具有举升功能或采用自卸结构。", "options": ["A、特殊结构货车", "B、罐式货车", "C、平板式货车", "D、厢式货车"], "answer": "C", "type": "choice"}, {"id": 1471, "section": "第三部分 查验业务知识", "header": "", "question": "按照《机动车运行安全技术条件》GB7258-2017第1号修改单要求，自2019年8月1日起出厂的    应装备有装卸或举升机构, 能将专用货厢拖吊到车上, 或能升降专用货厢/车架以实现专用货厢的交换。", "options": ["A、随车起重运输车", "B、自装卸式垃圾车", "C、自卸式垃圾车", "D、车厢可卸式汽车"], "answer": "D", "type": "choice"}, {"id": 1472, "section": "第三部分 查验业务知识", "header": "", "question": "查验包配置的金属卷尺长度不小于       m，分辨力不小于1mm，主要用于测量部件尺寸参数。", "options": ["A、3", "B、4", "C、5", "D、6"], "answer": "A", "type": "choice"}, {"id": 1473, "section": "第三部分 查验业务知识", "header": "", "question": "按照《机动车登记服务站管理规定（试行）》要求，查验音视频资料应当保存       以上，业务大厅、专用库房等相关场所的视频资料应当保存半年以上。", "options": ["A、6个月", "B、1年", "C、2年", "D、永久"], "answer": "C", "type": "choice"}, {"id": 1474, "section": "第三部分 查验业务知识", "header": "", "question": "机动车登记服务站可以协助办理     注册登记。", "options": ["A、载货汽车", "B、大型客车", "C、校车", "D、危化品运输车"], "answer": "A", "type": "choice"}, {"id": 1475, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所组织上门查验机动车的，应当通过机动车查验监管系统受理查验业务后，安排    以上具有相应车型查验资格的查验员查验机动车。", "options": ["A、1名", "B、2名", "C、3名", "D、4名"], "answer": "B", "type": "choice"}, {"id": 1476, "section": "第三部分 查验业务知识", "header": "", "question": "车辆管理所应当每年组织初级、中级查验员参加不少于    学时业务知识、实战技能和廉政警示培训，并进行考核。", "options": ["A、10", "B、20", "C、30", "D、40"], "answer": "D", "type": "choice"}, {"id": 1477, "section": "第三部分 查验业务知识", "header": "", "question": "高级查验 安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》及《技术规范》规定：拖拽式轻型清障车的托牵质量应大于等于      kg； 平板式轻型清障车的额定载质量（最大托举质量与平板最大装载质量之和）应大于等于      kg。", "options": ["A、500、1000", "B、1000、1500", "C、1500、1000", "D、500、1500"], "answer": "B", "type": "choice"}, {"id": 1487, "section": "第三部分 查验业务知识", "header": "", "question": "《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》规定对车长大于或等于5米的小微型载客汽车，车辆行李区纵向长度应      。", "options": ["A、小于或等于1500mm", "B、小于1500mm", "C、小于或等于车长的30%", "D、小于车长的30%"], "answer": "A", "type": "choice"}, {"id": 1488, "section": "第三部分 查验业务知识", "header": "", "question": "《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》规定的小微型载客汽车,车辆驾驶员之后的座椅布置除规定的特殊条件外，不应为      。", "options": ["A、单排长条座椅", "B、组合座椅", "C、单排单人座椅", "D、多个单人座椅"], "answer": "C", "type": "choice"}, {"id": 1489, "section": "第三部分 查验业务知识", "header": "", "question": "《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》规定，对总质量      的仓栅式轻型货车后部载货车厢应采用多层仓栅式结构。", "options": ["A、大于或等于3500kg", "B、大于3500kg", "C、小于或等于3500kg", "D、小于4500kg"], "answer": "B", "type": "choice"}, {"id": 1490, "section": "第三部分 查验业务知识", "header": "", "question": "《工业和信息化部 公安部关于进一步加强轻型货车、小微型载客汽车生产和登记管理工作的通知》规定的小微型载客汽车,当长条座椅的座垫宽大于或等于      时核定2人，大于或等于1200mm（且小于1600mm）时核定 3 人", "options": ["A、700mm且小于1200mm", "B、800mm且小于1300mm", "C、700mm且小于1300mm", "D、800mm且小于1200mm"], "answer": "D", "type": "choice"}, {"id": 1491, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（VIN）是为了识别某一辆车，由车辆制造厂为该车辆指定的一组字码。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1492, "section": "第三部分 查验业务知识", "header": "", "question": "《机动车查验工作规程》适用于办理机动车业务时对机动车进行查验，不适用于公安机关交通管理部门对机动车安全技术检验进行监督。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1493, "section": "第三部分 查验业务知识", "header": "", "question": "在办理新能源汽车注册登记时，要严格执行《机动车运行安全技术条件》（GB7258）、《机动车查验工作规程》（GA801）等标准规定，在设立的专门查验区验车辆，重点查验车辆识别代号、电动机型号和出厂编号、车辆品牌和型号，重点核查是否有打磨、凿改痕迹，并按规定要求录像或拍摄照片。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1494, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（VIN）中年份位代码所表示的是车辆实际制造的历法年份。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1495, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号（VIN）足以保证30年之内在世界范围内制造的所有车辆的车辆识别代号具有唯一性。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1496, "section": "第三部分 查验业务知识", "header": "", "question": "同一辆车辆都必须具有唯一的车辆识别代号，并标示于车辆的指定位置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1497, "section": "第三部分 查验业务知识", "header": "", "question": "中间阶段制造厂和最后阶段制造厂进行改装产品生产时，可以更改车辆原有的车辆识别代号。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1498, "section": "第三部分 查验业务知识", "header": "", "question": "车辆识别代号标示在车辆或标牌上时，应标示在一行，不允许有空格，不允许使用分隔符。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1499, "section": "第三部分 查验业务知识", "header": "", "question": "GB1589-2016不适用于军队、武警、公安特警装备的专用车辆和在限定道路上运行的双铰接客车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1500, "section": "第三部分 查验业务知识", "header": "", "question": "总质量大于26000kg且小于等于55000kg的汽车起重机、混凝土泵车、消防车应当符合GB1589的规定。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1501, "section": "第三部分 查验业务知识", "header": "", "question": "测量车辆宽度时，外部标识、灯光和光信号装置、锁止装置、铰链、手柄、控制器、开关、排气尾管等装置符合规定时，不列入测量范围。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1502, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB1589-2016，运送45英尺集装箱的半挂车的车长限值为13950mm。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1503, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB1589-2016，除冷藏车宽度最大限值为2.6米外,其他汽车、挂车及汽车列车的宽度最大限值为2.55米。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1504, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB1589-2016，所有在道路上使用的汽车、挂车及汽车列车的高度最大限值均不得超过4米。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1505, "section": "第三部分 查验业务知识", "header": "", "question": "GB1589-2016中，乘用车列车是指乘用车和半挂车的组合。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1506, "section": "第三部分 查验业务知识", "header": "", "question": "GB1589-2016中，自卸式货车包括栏板式自卸货车、平板式自卸货车和厢式自卸货车等。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1507, "section": "第三部分 查验业务知识", "header": "", "question": "GB1589-2016规定：汽车尾部排气管既不在长度测量范围，也不在宽度测量范围，只要该排气管超出车辆后端不大于50mm、单侧超出车辆侧面不大于50mm、边和角的圆角半径不小于5mm。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1508, "section": "第三部分 查验业务知识", "header": "", "question": "GB1589-2016中的\"货车\"包括专项作业车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1509, "section": "第三部分 查验业务知识", "header": "", "question": "车辆唯一性检查只须对机动车的车辆识别代号（或整车出厂编号）、发动机号码（或电动机号码）进行检查，以确认送检机动车的唯一性。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1510, "section": "第三部分 查验业务知识", "header": "", "question": "对发生过造成人员伤亡交通事故的送检机动车，人工检验时应重点检查损伤部位和损伤情况，属于使用年限在10年以内的非营运小型、微型载客汽车的，增加底盘动态检验、车辆底盘部件检查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1511, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验机构对检验合格的车辆，应妥善保管车辆识别代号（或整车出厂编号）的拓印膜或照片，注册登记检验时保存拓印膜，在用机动车检验时，保存车辆识别代号照片。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1512, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验机构应通过拍照、摄像或保存数据等方式对不合格项取证留存备查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1513, "section": "第三部分 查验业务知识", "header": "", "question": "所有检验项目应一次检验完毕，出现不合格项时应继续进行其他项目的检验，但无法继续进行检验的项目除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1514, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验机构对检验不合格的车辆，应出具《机动车安全技术检验报告》，并注明所有不合格项目。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1515, "section": "第三部分 查验业务知识", "header": "", "question": "GB 38900—2020规定：非营运小型、微型载客汽车均不检验驻车制动。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1516, "section": "第三部分 查验业务知识", "header": "", "question": "三轴及三轴以上的载货汽车、采用并装双轴及并装三轴的挂车，自2017年3月1日起，对部分轴还应测试加载轴制动率和加载轴制动不平衡率。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1517, "section": "第三部分 查验业务知识", "header": "", "question": "对达不到基本要求的送检机动车，机动车安全技术检验机构应告知送检人整改，符合要求后再进行安全技术检验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1518, "section": "第三部分 查验业务知识", "header": "", "question": "机动车安全技术检验时，采用检验智能终端（PDA）等设备拍摄检验照片（或视频）时，其数量、内容和清晰度应能满足检验监管的要求。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1519, "section": "第三部分 查验业务知识", "header": "", "question": "在用机动车检验时，配备的汽车安全带应完好且能正常使用，不得出现\"座垫套覆盖遮挡安全带\"、\"安全带绑定在座位下面\"等情形。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1520, "section": "第三部分 查验业务知识", "header": "", "question": "注册登记检验时，发现送检机动车的车辆特征参数、安全装置不符合GB1589、GB7258等机动车国家安全技术标准、机动车产品公告、机动车出厂合格证时，应拍照、录像固定证据，详细登记送检机动车的车辆类型、品牌/型号、车辆识别代号（或整车型号和出厂编号）、发动机号码、整车生产厂家、生产日期等信息，通过机动车安全技术检验监管系统上报。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1521, "section": "第三部分 查验业务知识", "header": "", "question": "有轨电车不适用GB7258国家标准，所以有轨电车不能办理注册登记", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1522, "section": "第三部分 查验业务知识", "header": "", "question": "从2018年1月1日起，所有新注册登记的机动车均应符合GB7258-2017国家标准的规定。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1523, "section": "第三部分 查验业务知识", "header": "", "question": "申请注册登记的轮式专用机械车，除应符合GB7258规定的一般要求外，其外廓尺寸、轴荷及质量参数、转向系、制动系、外部照明和信号装置及电气设备、车身、安全防护装置等要求，按土方机械相关强制性标准实施。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1524, "section": "第三部分 查验业务知识", "header": "", "question": "专门为出口而设计和制造的机动车应符合GB7258-2017国家标准的规定，其方向盘不得设置于右侧。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1525, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB7258-2017，专用客车的座位数（包括驾驶人座位）应超过9个；所以，若申请注册登记的车长为6.5m的专用汽车核定乘坐人数为8人，查验时不能按照GA802-2019确定为大型专用客车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1526, "section": "第三部分 查验业务知识", "header": "", "question": "由非封闭式货车改装、虽装置有专用设备或器具、但不属于专项作业车的汽车，按照GB7258-2017的规定属于货车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1527, "section": "第三部分 查验业务知识", "header": "", "question": "机动车在车身前部外表面的易见部位上应至少装置一个能永久保持的、与车辆品牌相适应的商标或厂标。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1528, "section": "第三部分 查验业务知识", "header": "", "question": "专项作业车的产品标牌应标明其专用功能关键技术参数，即能表征其工程专项（卫生医疗）作业技术性能的参数。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1529, "section": "第三部分 查验业务知识", "header": "", "question": "2018年1月1日起，对符合GB7258国家标准规定的多用途货车，机动车登记时不再检查车身反光标识和外部的总质量、栏板高度等文字喷涂。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1530, "section": "第三部分 查验业务知识", "header": "", "question": "旅居挂车包括中置轴旅居挂车和旅居半挂车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1531, "section": "第三部分 查验业务知识", "header": "", "question": "车身外部设有广告屏（箱）的汽车和挂车，应保证广告屏（箱）在车辆行驶状态下处于关闭状态。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1532, "section": "第三部分 查验业务知识", "header": "", "question": "GB7258-2017涉及实施过渡期的要求，机动车生产厂家提前实施的应视为满足要求。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1533, "section": "第三部分 查验业务知识", "header": "", "question": "货车和挂车的载货部分不得设计成可伸缩的结构，但中置轴车辆运输列车的主车后部的延伸结构除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1534, "section": "第三部分 查验业务知识", "header": "", "question": "根据GB 7258-2017，旅居车应配备灭火器，灭火器在车上应安装牢靠并便于取用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1535, "section": "第三部分 查验业务知识", "header": "", "question": "用户不得对外部照明和信号装置进行改装，也不得加装强制性标准以外的外部照明和信号装置，如货车和挂车向前行驶时向后方照射的灯具。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1536, "section": "第三部分 查验业务知识", "header": "", "question": "2018年1月1日起出厂的乘用车、旅居车、未设置乘客站立区的客车、货车（三轮汽车除外）、专项作业车的所有座椅，以及设有乘客站立区的客车的驾驶人座椅和前排乘员座椅均应装备汽车安全带。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1537, "section": "第三部分 查验业务知识", "header": "", "question": "冷藏车应在外部两侧易见部位上喷涂或粘贴明显的\"冷藏车\"字样和冷藏车类别的英文字母。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1538, "section": "第三部分 查验业务知识", "header": "", "question": "专用校车应安装限速装置，且限速装置调定的最大车速不应大于100km/h。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1539, "section": "第三部分 查验业务知识", "header": "", "question": "GB7258-2017规定：车长大于9m的客车（对专用校车为车长大于8m）、总质量大于等于12000kg的货车和专项作业车、所有危险货物运输车，应装备缓速器或其他辅助制动装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1540, "section": "第三部分 查验业务知识", "header": "", "question": "2018年1月1日起出厂的客车、乘用车、总质量大于3500kg且小于12000kg的货车和专项作业车、总质量大于3500kg且小于等于10000kg的挂车，均应安装符合规定的防抱制动装置，且防抱制动装置的自检功能应正常。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1541, "section": "第三部分 查验业务知识", "header": "", "question": "插电式混合动力汽车、纯电动汽车（换电式除外）应具有外接充电接口。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1542, "section": "第三部分 查验业务知识", "header": "", "question": "由车辆制造厂为某个单独车型指定的年份，若实际生产周期不跨年，车型年份应与历法年份一致，若实际生产周期跨年，车型年份应包括且仅包括其指定年份代码对应的历法年份的6月1日。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1543, "section": "第三部分 查验业务知识", "header": "", "question": "平板式载货车辆的平板不应有插桩结构、凹槽、集装箱锁具等装置，但平板式载货车辆、仓栅式载货车辆的载货部位可有举升功能或采用自卸结构。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1544, "section": "第三部分 查验业务知识", "header": "", "question": "机动车标注的警告性文字应有中文。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1545, "section": "第三部分 查验业务知识", "header": "", "question": "《机动车查验工作规程》GA801-2019规定了机动车查验员资格管理、查验项目、查验要求和检验监督要求。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1546, "section": "第三部分 查验业务知识", "header": "", "question": "《机动车查验工作规程》GA801-2019适用于办理机动车业务时对机动车进行查验，也适用于公安机关交通管理部门对机动车安全技术检验进行监督。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1547, "section": "第三部分 查验业务知识", "header": "", "question": "《机动车查验工作规程》GA801-2019规定，对申请注册登记的机动车，应制作或核对机动车标准照片，确定车辆类型、车身颜色及核定载人数，并查验相关项目。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1548, "section": "第三部分 查验业务知识", "header": "", "question": "《机动车查验工作规程》GA801-2019规定，对所有货车、货车底盘改装的专项作业车和挂车（旅居挂车除外），查验车身反光标识。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1549, "section": "第三部分 查验业务知识", "header": "", "question": "《机动车查验工作规程》GA801-2019规定，对总质量大于或等于12000kg的（即重型）货车（半挂牵引车除外）和货车底盘改装的专项作业车，车长大于8.0m的挂车，查验车辆尾部标志板。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1550, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对除半挂牵引车外的总质量大于3500kg的货车、货车底盘改装的专项作业车和挂车，查验侧面及后下部防护。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1551, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对危险货物运输车辆、客车、旅居车，查验灭火器。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1552, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对载客汽车、危险货物运输货车、半挂牵引车和总质量大于或等于 12000kg的其他货车，查验行驶记录装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1553, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对车长大于或等于6m的客车，查验应急出口、应急锤和乘客门数量。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1554, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对客车（专用校车和设有乘客站立区的客车除外）、发动机中置且宽高比小于或等于0.8的乘用车，查验是否喷涂了该车提供给乘员（包括驾驶人）的座位数。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1555, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对教练车，查验是否在车身两侧及后部喷涂了“教练车”等字样；对残疾人专用汽车（即残疾人专用自动挡载客汽车），查验是否设置了残疾人机动车专用标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1556, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对残疾人专用汽车（包括小、微型手动挡、自动挡乘用车），查验操纵辅助装置加装合格证明及操纵辅助装置的产品型号和产品编号。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1557, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对车长大于8m的专用校车和车长大于9m的其他客车、总质量大于或等于12000kg的货车和专项作业车、总质量大于3500kg的危险货物运输货车，查验辅助制动装置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1558, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对专用校车、车长大于9m的其他客车和所有货车的前轮，以及危险货物运输半挂车、三轴的栏板式和仓栅式半挂车的所有车轮，查验是否装备了盘式制动器。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1559, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对客车、货车（三轮汽车除外）、专项作业车、发动机中置的乘用车及总质量大于 3500kg的挂车，查验防抱制动装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1560, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，客车均需要查验发动机舱自动灭火装置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1561, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对进口机动车，查验外部照明和信号装置的配置和光色、车速里程表指示、排气管布置和英文警告性文字。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1562, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对两轮普通摩托车，查验摩托车乘员头盔。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1563, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对申请变更为“预约出租客运”或者“预约出租转非”使用性质的，需按规定查验机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1564, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对因更换车身或者车架申请变更登记的客车，还应查验核定载人数；对重、中型货车和货车底盘改装的专项作业车，以及总质量大于3500kg的挂车，还应查验外廓尺寸、整备质量。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1565, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对因质量问题更换整车申请变更登记的，按注册登记规定的项目查验机动车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 1566, "section": "第三部分 查验业务知识", "header": "", "question": "依据《机动车查验工作规程》GA801-2019规定，对转入的机动车进行查验时，按注册登记规定的项目查验机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 1567, "
