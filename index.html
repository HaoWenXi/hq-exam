公安部交通管理局备案后，可依次启用下一种组合方式。", "options": ["A、50％", "B、60％", "C、70％", "D、80％"], "answer": "B", "type": "choice"}, {"id": 2326, "section": "第五部分 机动车业务知识", "header": "3.1.16", "question": "进口的________办理注册登记时，必须收存进口凭证原件。", "options": ["A、牵引车", "B、挂车", "C、半挂车", "D、轮式专用机械"], "answer": "A", "type": "choice"}, {"id": 2327, "section": "第五部分 机动车业务知识", "header": "3.1.17", "question": "关于机动车号牌监督管理，不正确的是________。", "options": ["A、省级公安机关交通管理部门对号牌成品、号牌半成品生产单位进行授权，并负责监督管理", "B、号牌成品可以跨省生产", "C、省级公安机关交通管理部门应使用信息系统对号牌生产进行监督管理", "D、公安机关交通管理部门在核发号牌前应采集生产序列号和机动车登记编号，并上传至全国机动车信息资源库。"], "answer": "B", "type": "choice"}, {"id": 2328, "section": "第五部分 机动车业务知识", "header": "3.1.18", "question": "临时入境机动车号牌为________号牌。", "options": ["A、铝质", "B、纸质", "C、铁质", "D、金属"], "answer": "B", "type": "choice"}, {"id": 2329, "section": "第五部分 机动车业务知识", "header": "3.1.19", "question": "临时入境机动车号牌和行驶证有效期应当与入境批准文件上签注的期限一致，但最长不得超过________。", "options": ["A、1个月", "B、3个月", "C、6个月", "D、12个月"], "answer": "B", "type": "choice"}, {"id": 2330, "section": "第五部分 机动车业务知识", "header": "3.1.20", "question": "临时入境的外国机动车，可以凭入境凭证行驶至《临时入境机动车和驾驶人管理规定》规定的临时入境机动车号牌和行驶证核发机关所在地，并于入境后________内申请临时入境机动车号牌和行驶证。", "options": ["A、1日", "B、2日", "C、3日", "D、10日"], "answer": "B", "type": "choice"}, {"id": 2331, "section": "第五部分 机动车业务知识", "header": "3.1.21", "question": "汽车号牌工本费为每副________。", "options": ["A、100元", "B、70元", "C、50元", "D、40元"], "answer": "A", "type": "choice"}, {"id": 2332, "section": "第五部分 机动车业务知识", "header": "3.1.22", "question": "校车标牌工本费为________。", "options": ["A、不收取", "B、5元", "C、10元", "D、15元"], "answer": "A", "type": "choice"}, {"id": 2333, "section": "第五部分 机动车业务知识", "header": "3.1.23", "question": "办理机动车转入时，应当在机动车登记证书内________签注信息。", "options": ["A、注册登记摘要信息栏", "B、转让登记摘要信息栏", "C、注册登记机动车信息栏", "D、登记栏"], "answer": "B", "type": "choice"}, {"id": 2334, "section": "第五部分 机动车业务知识", "header": "3.1.24", "question": "办理转让登记时，应当在机动车登记证书内________签注信息。", "options": ["A、注册登记摘要信息栏", "B、转让登记摘要信息栏", "C、注册登记机动车信息栏", "D、登记栏"], "answer": "D", "type": A", "type": "choice"}, {"id": 2345, "section": "第五部分 机动车业务知识", "header": "3.1.35", "question": "证件专用章应当用于________。", "options": ["A、出具退办凭证", "B、确认机动车档案资料内容", "C、密封机动车档案", "D、机动车临时行驶车号牌"], "answer": "D", "type": "choice"}, {"id": 2346, "section": "第五部分 机动车业务知识", "header": "3.1.36", "question": "机动车档案应当按照国际________标准纸尺寸对每次登记的资料装订成册。", "options": ["A、A2", "B、A3", "C、A4", "D、B5"], "answer": "C", "type": "choice"}, {"id": 2347, "section": "第五部分 机动车业务知识", "header": "3.1.37", "question": "有________情形之一的，由公安机关交通管理部门处警告或者二百元以下罚款：", "options": ["A、改变车身颜色、更换发动机、车身或者车架，未按照规定的时限办理变更登记的", "B、机动车所有权转让后，现机动车所有人未按照规定的时限办理转让登记的", "C、机动车所有人办理变更登记、转让登记，未按照规定的时限到住所地车辆管理所申请机动车转入的；", "D、以上均是"], "answer": "D", "type": "choice"}, {"id": 2348, "section": "第五部分 机动车业务知识", "header": "3.1.38", "question": "有下列____情形的，可以办理转让登记。", "options": ["A、机动车与该车档案记载内容不一致的", "B、属于海关监管的机动车，海关未解除监管或者批准转让的", "C、距机动车强制报废标准规定要求使用年限一年以内的机动车", "D、机动车在抵押登记、质押备案期间的"], "answer": "D", "type": "choice"}, {"id": 2349, "section": "第五部分 机动车业务知识", "header": "3.1.39", "question": "使用号牌架辅助安装号牌时，号牌架内侧边缘距离机动车登记编号字符边缘________，不应遮盖生产序列标识。", "options": ["A、可无距离", "B、大于5mm以上", "C、大于2mm以上", "D、小于5mm"], "answer": "B", "type": "choice"}, {"id": 2350, "section": "第五部分 机动车业务知识", "header": "3.1.40", "question": "大、中型非营运载客汽车（大型轿车除外）的使用年限是________。", "options": ["A、8年", "B、10年", "C、15年", "D、20年"], "answer": "D", "type": "choice"}, {"id": 2351, "section": "第五部分 机动车业务知识", "header": "3.1.41", "question": "微型载货汽车使用年限是________。", "options": ["A、8年", "B、10年", "C、12年", "D、15年"], "answer": "C", "type": "choice"}, {"id": 2352, "section": "第五部分 机动车业务知识", "header": "3.1.42", "question": "专用校车使用年限是________。", "options": ["A、8年", "B、10年", "C、15年", "D、20年"], "answer": "C", "type": "choice"}, {"id": 2353, "section": "第五部分 机动车业务知识", "header": "3.1.43", "question": "小型教练载客汽车使用年限是________。", "options": ["A、8年", "B、10年", "C、12年", "D、15年"], "answer": "B", "type": "choice"}, {"id": 2354, "section": "第五部分 机动车业务知识", "header": "3.1.44", "question": "危险品运输载货汽车使用年限是________。", "options": ["A、8年", "B、10年", "C、12年", "D、15年"], "answer": "B", "type": "choice"}, {"id": 2355, "section": "第五部分 机动车业务知识", "header": "3.1.45", "question": "车辆管理所应当按照________，将登记信息和经办人信息录入计算机登记系统，打印相关证、表。", "options": ["A、《机动车登记工作规范》", "B、机动车登记信息数据库规范和信息代码标准", "C、机动车登记信息采集和签注标准", "D、登记系统操作使用手册"], "answer": "C", "type": "choice"}, {"id": 2356, "section": "第五部分 机动车业务知识", "header": "3.1.46", "question": "机动车的使用性质按照________签注。", "options": ["A、《机动车登记工作规范》", "B、机动车使用性质标准", "C、机动车登记信息采集和签注标准", "D、《道路交通管理  机动车类型》"], "answer": "D", "type": "choice"}, {"id": 2357, "section": "第五部分 机动车业务知识", "header": "3.1.47", "question": "自2013年3月1日起，按照《机动车交通事故责任强制保险条例》， （     ）不投保机动车交通事故责任强制保险。", "options": ["A、机动车", "B、牵引车", "C、挂车", "D、牵引车和挂车"], "answer": "C", "type": "choice"}, {"id": 2358, "section": "第五部分 机动车业务知识", "header": "3.1.48", "question": "《中华人民共和国机动车号牌》（GA36-2007）实施前已核发小型汽车号牌的中型载客汽车，________换发大型汽车号牌。", "options": ["A、不需要", "B、在办理机动车登记业务时", "C、在办理转让登记和补、换领机动车号牌业务时", "D、在办理变更登记时"], "answer": "C", "type": "choice"}, {"id": 2359, "section": "第五部分 机动车业务知识", "header": "3.1.49", "question": "下列车辆中属于有使用年限限制的是________。", "options": ["A、小、微型非营运载客汽车", "B、大型非营运轿车", "C、轻型非载货专项作业车", "D、轮式专用机械车"], "answer": "C", "type": "choice"}, {"id": 2360, "section": "第五部分 机动车业务知识", "header": "3.1.50", "question": "按照《机动车强制报废标准规定》，距使用年限________以内的机动车，不得变更使用性质、转让所有权或者转出登记地所属地市级行政区域。", "options": ["A、2个月", "B、3个月", "C、6个月", "D、1年"], "answer": "D", "type": "choice"}, {"id": 2361, "section": "第五部分 机动车业务知识", "header": "3.1.51", "question": "金属材料号牌的使用寿命不得少于________。", "options": ["A、二年", "B、四年", "C、六年", "D、十年"], "answer": "B", "type": "choice"}, {"id": 2362, "section": "第五部分 机动车业务知识", "header": "3.1.52", "question": "下列对机动车档案的要求，错误的是________。", "options": ["A、按照工作规范规定的存档资料顺序装订", "B、对每次登记的资料装订成册", "C、档案资料目录置于资料首页", "D、存档资料较少时，可以不装订"], "answer": "D", "type": "choice"}, {"id": 2363, "section": "第五部分 机动车业务知识", "header": "3.1.53", "question": "车辆管理所办理机动车登记业务时，应当于业务办结后________内在计算机登记系统中归档，并在________内将登记信息上传到全国交通管理信息系统。", "options": ["A、一日，24小时", "B、二日，48小时", "C、三日，36小时", "D、三日，48小时"], "answer": "C", "type": "choice"}, {"id": 2364, "section": "第五部分 机动车业务知识", "header": "3.1.54", "question": "关于机动车行驶证，不正确的是________。", "options": ["A、证件专用章紫外灯照射下，呈现红色荧光", "B、使用专用纸张，有开窗式彩色金属线和荧光纤维", "C、证芯主页和副页正面左右两侧底纹颜色为天（铁）蓝色，中间底纹颜色为红色", "D、塑封套A页平安结中心几何图形颜色在蓝紫色和草绿色之间交互变化"], "answer": "C", "type": "choice"}, {"id": 2365, "section": "第五部分 机动车业务知识", "header": "3.1.55", "question": "________对车主名下登记车辆未按规定时限办理转入的，机动车登记系统自动预警提示，督促车主办理转入，限制车主办理。", "options": ["A、所有机动车业务和驾驶证业务", "B、所有机动车业务", "C、仅限新车注册登记和转让登记业务", "D、仅限新车注册登记业务"], "answer": "C", "type": "choice"}, {"id": 2366, "section": "第五部分 机动车业务知识", "header": "3.1.56", "question": "以下关于机动车登记系统签注内容，不正确的是________。", "options": ["A、在行驶证副页正面的一维条码左侧签注机动车燃料种类", "B、检验合格标志检验机构栏，对于实施安全技术检验的，签注检验机构名称", "C、检验合格标志检验机构栏，对于免于安全技术检验的，签注\"无（免于安全技术检验）\"", "D、登记证书签满换领，登记证书登记栏签注内容无历史签注信息"], "answer": "D", "type": "choice"}, {"id": 2367, "section": "第五部分 机动车业务知识", "header": "3.1.57", "question": "机动车登记证书内页第10页\"重要提示\"采用印钞专用胶凹版套印技术印制，以下关于凹印部分表述不正确的是________。", "options": ["A、用手触摸有明显的凹凸感", "B、用紫外光激发，其中有一半蓝色图案转变为荧光红色", "C、逆光倾斜45度，可见\"公安部\"潜影字样", "D、没有微缩文字"], "answer": "D", "type": "choice"}, {"id": 2368, "section": "第五部分 机动车业务知识", "header": "3.1.58", "question": "摩托车号牌工本费为每副________。", "options": ["A、100元", "B、70元", "C、50元", "D、35元"], "answer": "D", "type": "choice"}, {"id": 2369, "section": "第五部分 机动车业务知识", "header": "3.1.59", "question": "对持有外国人永久居留身份证的外国人办理机动车业务时，综合应用平台内\"身份证明名称\"应选择________。", "options": ["A、境外人员身份证明", "B、外交人员身份证明", "C、外国人永久居留身份证", "D、居民身份证"], "answer": "C", "type": "choice"}, {"id": 2370, "section": "第五部分 机动车业务知识", "header": "3.1.60", "question": "港澳台居民持《港澳台居民居住证》申请办理机动车登记的，可以按照《机动车登记规定》规定向居住地车辆管理所提出申请。综合应用平台内\"身份证明名称\"应选择________。", "options": ["A、境外人员身份证明", "B、居民临时身份证", "C、港澳台居民居住证", "D、居民暂住证明"], "answer": "C", "type": "choice"}, {"id": 2371, "section": "第五部分 机动车业务知识", "header": "3.1.61", "question": "新能源汽车专用号牌外廓尺寸为________。", "options": ["A、440mm×120mm", "B、440mm×140mm", "C、480mm×120mm", "D、480mm×140mm"], "answer": "D", "type": "choice"}, {"id": 2372, "section": "第五部分 机动车业务知识", "header": "3.1.62", "question": "以下关于新能源汽车专用号牌，不正确的是________。", "options": ["A、小型新能源汽车专用号牌为渐变绿色", "B、大型新能源汽车专用号牌为黄绿双拼色", "C、大型新能源汽车后号牌调整了下排2个安装孔位置，要提前配备打孔工具，确保规范安装固封装置，打孔可另行收费", "D、新能源汽车号牌工本费为每副100元"], "answer": "C", "type": "choice"}, {"id": 2373, "section": "第五部分 机动车业务知识", "header": "3.1.63", "question": "以下关于办理已登记的新能源汽车自愿变更号牌、补换领号牌业务，不正确的是________。", "options": ["A、要提示群众首先通过互联网预选号牌，采用计算机自动选号，并在网上预约办理业务时间", "B、对没有预约办理相关业务的，要提供现场互联网选号和预约服务", "C、对需要以邮寄方式发放的，可以核发1次临时行驶车号牌", "D、互联网预选号牌号码后到公安交管部门办理变更号牌业务的时限为3个工作日"], "answer": "D", "type": "choice"}, {"id": 2374, "section": "第五部分 机动车业务知识", "header": "3.1.64", "question": "以下关于新能源汽车专用号牌的编码规则，不正确的是________。", "options": ["A、小型新能源汽车专用号牌的第一位先启用字母D、F", "B、小型新能源汽车专用号牌的后五位必须使用数字", "C、大型新能源汽车专用号牌的第六位先启用字母D、F", "D、大型新能源汽车专用号牌的前五位必须使用数字"], "answer": "B", "type": "choice"}, {"id": 2375, "section": "第五部分 机动车业务知识", "header": "3.1.65", "question": "新能源汽车专用号牌中，字母\"F\"代表________。", "options": ["A、纯电动汽车", "B、插电式混合动力汽车", "C、燃料电池汽车", "D、非纯电动新能源汽车"], "answer": "D", "type": "choice"}, {"id": 2376, "section": "第五部分 机动车业务知识", "header": "3.1.66", "question": "网约车退出经营后，应到登记地公安机关交通管理部门办理变更，并在行驶证\"使用性质\"栏签注________，副页上签注\"达到60万公里强制报废\"。", "options": ["A、\"非营运\"", "B、\"出租转非\"", "C、\"营转非\"", "D、\"预约出租转非\""], "answer": "D", "type": "choice"}, {"id": 2377, "section": "第五部分 机动车业务知识", "header": "3.1.67", "question": "对网约车使用年限达到________的，系统提示\"该车作为网络预约出租汽车使用已满规定年限，应当办理相关变更手续\"；对已按规定办理使用性质变更业务的，予以办理其他车管业务。", "options": ["A、6年", "B、8年", "C、10年", "D、15年"], "answer": "B", "type": "choice"}, {"id": 2378, "section": "第五部分 机动车业务知识", "header": "3.1.68", "question": "小型非营运汽车号牌在公安网和互联网上供群众可选择的号码资源各不得少于________个。", "options": ["A、1千", "B、1万", "C、5千", "D、5万"], "answer": "D", "type": "choice"}, {"id": 2379, "section": "第五部分 机动车业务知识", "header": "3.1.69", "question": "在办理二手车海关出口通关手续_____个月后内，二手车出口企业应当凭____及法律法规规定的证明凭证向机动车登记地公安交管部门申请注销登记；", "options": ["A、2  出口检验单", "B、3  出口报关单", "C、3  销售发票", "D、2  出口报关单"], "answer": "D", "type": "choice"}, {"id": 2380, "section": "第五部分 机动车业务知识", "header": "3.1.70", "question": "在办理车辆转籍信息网上转递业务时，转出地车辆管理所自接到系统通知起_____内，按照规范规定，制作并转递机动车电子化档案资料：", "options": ["A、1日", "B、2日", "C、3日", "D、当天"], "answer": "B", "type": "choice"}, {"id": 2381, "section": "第五部分 机动车业务知识", "header": "3.1.71", "question": "在办理车辆转籍信息网上转递业务时，遇下列_____情形的不予办理转籍。", "options": ["A、机动车与该车档案记载内容不一致的", "B、机动车在抵押登记、质押备案期间的", "C、属于海关监管的机动车，海关未解除监管的", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 2382, "section": "第五部分 机动车业务知识", "header": "3.1.72", "question": "在办理车辆转籍信息网上转递业务时，转入地车辆管理所应当将_____实物资料存入机动车档案。", "options": ["A、原行驶证", "B、机动车所有人身份证明复印件", "C、机动车登记证书的复印件", "D、机动车临时号牌原件"], "answer": "A", "type": "choice"}, {"id": 2383, "section": "第五部分 机动车业务知识", "header": "3.1.73", "question": "按照《机动车跨辖区转让登记工作规范《试行）》规定，转出地车辆管理所档案管理岗应当自接到系统通知起   日内，制作机动车电子化档案资料并转递。", "options": ["A、1日", "B、2日", "C、3日", "D、当天"], "answer": "C", "type": "choice"}, {"id": 2384, "section": "第五部分 机动车业务知识", "header": "3.1.74", "question": "按照《机动车跨辖区转让登记工作规范《试行）》规定，下列   实物资料不存入转入地车辆管理所机动车档案。", "options": ["A、原行驶证", "B、《机动车注册、转让、注销登记/转入申请表》", "C、机动车查验记录表", "D、机动车所有权转让的证明、凭证"], "answer": "A", "type": "choice"}, {"id": 2385, "section": "第五部分 机动车业务知识", "header": "3.1.75", "question": "对已办理号牌号码互换的，______后可申请再次互换或者申请保留原车号牌号码。", "options": ["A、1年", "B、半年", "C、2年", "D、三个月"], "answer": "A", "type": "choice"}, {"id": 2386, "section": "第五部分 机动车业务知识", "header": "3.1.76", "question": "机动车所有人申请办理车辆号牌号码互换业务的条件包括_____。", "options": ["A、同一登记地", "B、非营运车辆", "C、同一号牌种类", "D、以上都包括"], "answer": "D", "type": "choice"}, {"id": 2387, "section": "第五部分 机动车业务知识", "header": "3.1.77", "question": "自2019年____月____日起，摩托车实行跨省（区、市）异地检验。申请人可以在机动车登记地以外的省（区、市）直接检验，申领检验合格标志，无需办理委托检验手续，实现全国范围\"通检\"。", "options": ["A、1月1日", "B、6月1日", "C、9月1日", "D、10月1日"], "answer": "B", "type": "choice"}, {"id": 2388, "section": "第五部分 机动车业务知识", "header": "3.1.78", "question": "根据《深化公安交管“放管服”改革10项便民利民服务措施实施细则》（公交管〔2019〕209 号）规定，自2019年6月1日起，原机动车注销、迁出或者转让后，保留原号的时限，由一年调整为____。", "options": ["A、半年", "B、两年", "C、三年", "D、无限制"], "answer": "B", "type": "choice"}, {"id": 2389, "section": "第五部分 机动车业务知识", "header": "3.1.79", "question": "按照《机动车登记规定》（公安部令第164号）规定，下列业务       ，机动车所有人免予提交公安机关核发的居住证明或者居住登记证明。", "options": ["A、户籍地以外办理两轮摩托车注册登记的", "B、户籍地以外办理重型货车抵押登记的", "C、户籍地以外办理小型汽车注册登记", "D、户籍地以外办理小型面包车转让登记"], "answer": "B", "type": "choice"}, {"id": 2390, "section": "第五部分 机动车业务知识", "header": "3.1.80", "question": "按照《机动车登记规定》（公安部令第164号）规定，对智能网联机动车进行道路测试、示范应用需要上道路行驶的，道路测试、示范应用单位应当向车辆管理所申领临时行驶车号牌，除需要提交道路测试、示范应用单位的身份证明外，还应当提交以下     证明、凭证：", "options": ["A、机动车交通事故责任强制保险凭证", "B、经主管部门确认的道路测试、示范应用凭证", "C、机动车安全技术检验合格证明 D 、以上都需要"], "answer": "D", "type": "choice"}, {"id": 2391, "section": "第五部分 机动车业务知识", "header": "3.1.81", "question": "按照《机动车登记规定》（公安部令第164号）规定，夫妻双方共同所有的机动车将登记的机动车所有人姓名变更为另一方姓名，        且经夫妻双方共同申请的，可以使用原机动车号牌号码。", "options": ["A、婚姻关系存续期满六个月", "B、婚姻关系存续期满一年", "C、婚姻关系存续期满二年", "D、变更姓名时，必须更换号牌号码"], "answer": "B", "type": "choice"}, {"id": 2392, "section": "第五部分 机动车业务知识", "header": "3.1.82", "question": "按照《机动车登记规定》（公安部令第164号）规定，机动车所有人申请机动车使用性质登记为       的，不审查相关道路运输许可，法律法规另有规定的除外。", "options": ["A、危险货物运输", "B、公路客运", "C、公交客运", "D、旅游客运"], "answer": "C", "type": "choice"}, {"id": 2393, "section": "第五部分 机动车业务知识", "header": "3.1.83", "question": "按照《机动车登记规定》（公安部令第164号）规定，县级公安机关交通管理部门车辆管理所可以办理本行政区域内下列      业务。", "options": ["A、轻型危险货物运输车注册登记", "B、校车注销登记", "C、大型旅居车登记", "D、进口机动车注册登记"], "answer": "D", "type": "choice"}, {"id": 2394, "section": "第五部分 机动车业务知识", "header": "3.1.84", "question": "已注册登记的机动车有下列      情形，机动车所有人应当在变更后十日内向车辆管理所申请变更登记。", "options": ["A、车辆识别代号因磨损、锈蚀、事故等原因辨认不清或者损坏的", "B、预约出租变更为预约出租转非的", "C、改变车身颜色的", "D、机动车所有人身份证明名称或者号码变更的"], "answer": "C", "type": "choice"}, {"id": 2395, "section": "第五部分 机动车业务知识", "header": "3.1.85", "question": "有下列     情形的，可以办理转让登记。", "options": ["A、机动车与该车档案记载内容不一致的", "B、属于海关监管的机动车，海关未解除监管或者批准转让的", "C、距机动车强制报废标准规定要求使用年限一年以内的机动车", "D、机动车在抵押登记、质押备案期间的"], "answer": "D", "type": "choice"}, {"id": 2396, "section": "第五部分 机动车业务知识", "header": "3.2.1", "question": "车辆管理所办理注册登记时，应当对牵引车和挂车分别核发机动车登记证书、号牌、行驶证和检验合格标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2397, "section": "第五部分 机动车业务知识", "header": "3.2.2", "question": "补领、换领机动车登记证书、行驶证的，原机动车登记证书、行驶证作废，不得继续使用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2398, "section": "第五部分 机动车业务知识", "header": "3.2.3", "question": "所有机动车办理注册登记前，均需要到机动车安全技术检验机构对机动车进行安全技术检验，并取得安全技术检验合格证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2399, "section": "第五部分 机动车业务知识", "header": "3.2.4", "question": "更换发动机的，机动车所有人应当在变更前向车辆管理所申请准予变更许可。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2400, "section": "第五部分 机动车业务知识", "header": "3.2.5", "question": "机动车抵押登记日期、抵押权人和抵押金额信息可以供公众查询。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2401, "section": "第五部分 机动车业务知识", "header": "3.2.6", "question": "机动车所有人可以委托代理人代理申请各项机动车登记和业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2402, "section": "第五部分 机动车业务知识", "header": "3.2.7", "question": "进口汽车的进口凭证，是各口岸海关签发的《货物进口证明书》。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2403, "section": "第五部分 机动车业务知识", "header": "3.2.8", "question": "在机动车抵押登记期间，应当由机动车所有人和抵押权人共同申请，才能补办机动车登记证书。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2404, "section": "第五部分 机动车业务知识", "header": "3.2.9", "question": "达到国家强制报废标准，机动车所有人逾期不办理注销登记的，车辆管理所应公告机动车登记证书、号牌和行驶证作废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2405, "section": "第五部分 机动车业务知识", "header": "3.2.10", "question": "核发校车标牌时，属于专用校车的，应当核对行驶证上记载的校车类型和核载人数。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2406, "section": "第五部分 机动车业务知识", "header": "3.2.11", "question": "机动车行驶证工本费为每本10元。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2407, "section": "第五部分 机动车业务知识", "header": "3.2.12", "question": "机动车抵押登记期间，不得申请转让登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2408, "section": "第五部分 机动车业务知识", "header": "3.2.13", "question": "办理查封、扣押机动车，人民法院、人民检察院、公安机关或者其他行政执法部门的公函不需要存入机动车档案，但应当留存备查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2409, "section": "第五部分 机动车业务知识", "header": "3.2.14", "question": "补建的机动车档案与原机动车档案有同等效力，但档案资料内无省级公安机关交通管理部门批准补建档案的文件和核对公函的除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2410, "section": "第五部分 机动车业务知识", "header": "3.2.15", "question": "对免予到机动车安全技术检验机构检验的机动车，机动车所有人申请检验合格标志时，应当提交机动车所有人身份证明或者行驶证、机动车交通事故责任强制保险凭证、车船税纳税或者免税证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2411, "section": "第五部分 机动车业务知识", "header": "3.2.16", "question": "海关监管的机动车办理注册登记时，应当审查来历证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2412, "section": "第五部分 机动车业务知识", "header": "3.2.17", "question": "机动车临时行驶车号牌工本费为每张10元。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2413, "section": "第五部分 机动车业务知识", "header": "3.2.18", "question": "行驶证工本费包括机动车行驶证所附照片的拍摄费用和照片塑封费用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2414, "section": "第五部分 机动车业务知识", "header": "3.2.19", "question": "机动车登记证书工本费的收费标准为每证10元。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2415, "section": "第五部分 机动车业务知识", "header": "3.2.20", "question": "机动车达到国家规定的强制报废标准的，不得办理注册登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2416, "section": "第五部分 机动车业务知识", "header": "3.2.21", "question": "领取警车牌证前，已有民用机动车牌证的，不需要将民用机动车牌证交回原发证机关。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2417, "section": "第五部分 机动车业务知识", "header": "3.2.22", "question": "签注机动车行驶证时，对于打印汉字库中没有的汉字，应使用空格代替，并用黑色墨水笔手工填写。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2418, "section": "第五部分 机动车业务知识", "header": "3.2.23", "question": "临时入境机动车号牌和行驶证工本费为每本15元。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2419, "section": "第五部分 机动车业务知识", "header": "3.2.24", "question": "机动车使用性质\"救护\"是指：急救、医疗机构和卫生防疫等部门用于抢救危重病人或处理紧急疫情的专用机动车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2420, "section": "第五部分 机动车业务知识", "header": "3.2.25", "question": "机动车使用性质\"工程抢险\"是指：防汛、水利、电力、矿山、城建、交通、铁道等部门用于抢修公用设施、抢救人民生命财产的专用机动车，但不包括现场指挥机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2421, "section": "第五部分 机动车业务知识", "header": "3.2.26", "question": "机动车使用性质\"营转非\"是指：原为出租客运机动车，现改为非营运机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2422, "section": "第五部分 机动车业务知识", "header": "3.2.27", "question": "机动车使用性质\"教练\"是指：专门从事驾驶技能培训的机动车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2423, "section": "第五部分 机动车业务知识", "header": "3.2.28", "question": "营运机动车是指：个人或者单位以获取利润为目的而使用的机动车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2424, "section": "第五部分 机动车业务知识", "header": "3.2.29", "question": "非营运机动车是指：个人或者单位不以获取利润为目的而使用的机动车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2425, "section": "第五部分 机动车业务知识", "header": "3.2.30", "question": "机动车使用性质\"公路客运\"是指：专门从事公路旅客运输的客车和乘用车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2426, "section": "第五部分 机动车业务知识", "header": "3.2.31", "question": "机动车使用性质\"公交客运\"是指：专门从事公共交通客运的机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2427, "section": "第五部分 机动车业务知识", "header": "3.2.32", "question": "机动车使用性质\"旅游客运\"是指：专门运载游客的客车和乘用车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2428, "section": "第五部分 机动车业务知识", "header": "3.2.33", "question": "机动车使用性质\"货运\"是指：从事货物运输的货车、挂车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2429, "section": "第五部分 机动车业务知识", "header": "3.2.34", "question": "除使用性质确定为\"非营运\"、\"营转非\"、\"出租转非\"、\"预约出租转非\"以外的机动车，为生产经营性车辆。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2430, "section": "第五部分 机动车业务知识", "header": "3.2.35", "question": "机动车使用性质\"消防\"是指：用于灭火的专用机动车和现场指挥机动车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2431, "section": "第五部分 机动车业务知识", "header": "3.2.36", "question": "未注册登记的进口机动车，未能提供进口凭证的，可以凭人民法院、人民检察院或者行政执法机关出具的证明办理注册登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2432, "section": "第五部分 机动车业务知识", "header": "3.2.37", "question": "临时行驶车号牌延期的，应在延期内容处加盖证件专用章和业务手续专用名章。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2433, "section": "第五部分 机动车业务知识", "header": "3.2.38", "question": "海关监管的机动车办理注册登记时，应与全国进口机动车计算机核查系统比对。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2434, "section": "第五部分 机动车业务知识", "header": "3.2.39", "question": "机动车所有人未按照《机动车登记规定》申请变更备案的，由公安机关交通管理部门处警告或者二百元以下罚款。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2435, "section": "第五部分 机动车业务知识", "header": "3.2.40", "question": "排量为150ml以下的摩托车申请注册登记时，应当提交车辆购置税的免税凭证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2436, "section": "第五部分 机动车业务知识", "header": "3.2.41", "question": "车辆管理所应当在机动车逾期未取得检验合格标志的一个月内，通过“交管12123”手机APP、手机短信或者电话等方式提示机动车所有人及时申领检验合格标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2437, "section": "第五部分 机动车业务知识", "header": "3.2.42", "question": "校车行驶线路、开行时间、停靠站点或者车辆、所有人发生变化的，经县级或者设区的市级人民政府批准后，应当按照规定重新领取校车标牌，但驾驶人发生变化的，不需要重新领取校车标牌。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2438, "section": "第五部分 机动车业务知识", "header": "3.2.43", "question": "警车达到国家规定的强制报废标准的，应当按照法律、法规规定报废。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2439, "section": "第五部分 机动车业务知识", "header": "3.2.44", "question": "行驶证证芯序列号由13位阿拉伯数字组成，用一维条码表示。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2440, "section": "第五部分 机动车业务知识", "header": "3.2.45", "question": "公交客运汽车的使用年限为15年。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2441, "section": "第五部分 机动车业务知识", "header": "3.2.46", "question": "大、中型营运载客汽车使用年限为15年。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2442, "section": "第五部分 机动车业务知识", "header": "3.2.47", "question": "车辆管理所实现与机动车制造厂新车出厂查验信息联网的，机动车所有人申请小型、微型载客汽车注册登记时，免予交验机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2443, "section": "第五部分 机动车业务知识", "header": "3.2.48", "question": "机动车影像应占机动车标准照片的三分之二。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2444, "section": "第五部分 机动车业务知识", "header": "3.2.49", "question": "机动车登记中收回的号牌，其机动车登记编号不可以重新使用。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2445, "section": "第五部分 机动车业务知识", "header": "3.2.50", "question": "以欺骗、贿赂等不正当手段取得机动车登记的，由公安机关交通管理部门收缴机动车登记证书、号牌、行驶证，撤销机动车登记，处二千元以下罚款；申请人在三年内不得再次申请机动车登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2446, "section": "第五部分 机动车业务知识", "header": "3.2.51", "question": "已实现车辆登记时网上核对纳税电子信息的，群众不需要再提交税收纸质凭证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2447, "section": "第五部分 机动车业务知识", "header": "3.2.52", "question": "机动车登记证书、号牌、行驶证、检验合格标志的制作应当符合有关标准。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2448, "section": "第五部分 机动车业务知识", "header": "3.2.53", "question": "除大型载客汽车、校车以外的机动车因故不能在登记地检验的，机动车所有人可以向车辆所在地车辆管理所申请检验合格标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2449, "section": "第五部分 机动车业务知识", "header": "3.2.54", "question": "《机动车登记规定》所称\"一日\"、\"二日\"、\"三日\"、\"五日\"、\"七日\"、\"十日\"、\"十五日\"，是指工作日，不包括节假日。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2450, "section": "第五部分 机动车业务知识", "header": "3.2.55", "question": "已实现与银保监部门、银行等金融机构联网的，实行机动车抵押信息网上转递，公安交管部门网上比对核查后，收存机动车抵押合同原件。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2451, "section": "第五部分 机动车业务知识", "header": "3.2.56", "question": "办理机动车登记，档案管理岗的具体事项主要是核对计算机登记系统的信息，整理资料，装订、归档。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2452, "section": "第五部分 机动车业务知识", "header": "3.2.57", "question": "机动车使用年限起始日期按照注册登记日期计算，但自出厂之日起超过2年未办理注册登记手续的，按照出厂日期计算。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2453, "section": "第五部分 机动车业务知识", "header": "3.2.58", "question": "在机动车质押备案期间申请转让登记的，应当由原机动车所有人、现机动车所有人和质权人共同申请，车辆管理所一并办理新的质押备案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2454, "section": "第五部分 机动车业务知识", "header": "3.2.59", "question": "不同类型的营运载客汽车相互转换，按照使用年限较宽的规定报废。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2455, "section": "第五部分 机动车业务知识", "header": "3.2.60", "question": "营运载客汽车与非营运载客汽车相互转换的，一律按照营运载客汽车的规定报废。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2456, "section": "第五部分 机动车业务知识", "header": "3.2.61", "question": "商业银行、汽车金融公司申请办理抵押登记业务的，其身份证明是营业执照或者加盖公章的营业执照复印件。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2457, "section": "第五部分 机动车业务知识", "header": "3.2.62", "question": "《中华人民共和国机动车号牌》（GA36-2014）修改了摩托车号牌数量，取消了前号牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2458, "section": "第五部分 机动车业务知识", "header": "3.2.63", "question": "临时行驶车号牌应放置在前挡风玻璃不影响驾驶人视线的位置。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2459, "section": "第五部分 机动车业务知识", "header": "3.2.64", "question": "办理因质量问题更换整车的变更登记，机动车登记证书的登记栏签注\"注册登记日期：\"和变更后的注册登记的具体日期。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2460, "section": "第五部分 机动车业务知识", "header": "3.2.65", "question": "商业银行、汽车金融机构作为抵押权人的，抵押合同不可以使用电子印章。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2461, "section": "第五部分 机动车业务知识", "header": "3.2.66", "question": "按照《深化公安交管“放管服”改革优化营商环境12项措施》规定，从2020年11月20日起，6年以内的7至9座非营运小微型等载客汽车（面包车除外）纳入免检范围。对非营运小微型载客汽车（面包车除外）超过6年不满10年的，由每年检验1次调整为每两年检验1次。车辆发生造成人员伤亡的交通事故或者非法改装被依法处罚的，仍按原规定周期检验。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2462, "section": "第五部分 机动车业务知识", "header": "3.2.67", "question": "机动车使用性质\"危化品运输\"是指专门用于运输剧毒化学品、爆炸品、放射性物品、腐蚀性物品等危险货物的货车、挂车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2463, "section": "第五部分 机动车业务知识", "header": "3.2.68", "question": "机动车档案是指实物档案，不包括电子档案。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2464, "section": "第五部分 机动车业务知识", "header": "3.2.69", "question": "实物档案应当按照机动车号牌种类、号牌号码或者档案编号顺序存放。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2465, "section": "第五部分 机动车业务知识", "header": "3.2.70", "question": "车辆管理所及其工作人员不得泄露机动车档案中的个人信息。任何单位和个人不得擅自涂改、故意损毁或者伪造机动车档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2466, "section": "第五部分 机动车业务知识", "header": "3.2.71", "question": "除机动车所有权转让到原登记车辆管理所辖区以外和机动车所有人住所迁出车辆管理所辖区以外的变更登记外，已入库的机动车档案原则上不得再出库。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2467, "section": "第五部分 机动车业务知识", "header": "3.2.72", "question": "车辆管理所办理机动车登记业务时，业务受理、资料审查、机动车查验工作，必须由民警承担，业务导办、数据录入、制发牌证、档案整理等工作可以由文职、聘用人员承担。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2468, "section": "第五部分 机动车业务知识", "header": "3.2.73", "question": "车辆管理所民警办理机动车登记业务时，应当使用本人的用户名、密码或者PKI/PMI登录计算机登记系统，并定期更换密码。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2469, "section": "第五部分 机动车业务知识", "header": "3.2.74", "question": "文职、聘用人员办理机动车登记业务时，可以使用监督民警的用户名、密码或者PKI/PMI登录计算机登记系统。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2470, "section": "第五部分 机动车业务知识", "header": "3.2.75", "question": "公安机关交通管理部门办理互联网交通管理业务，应当建立互联网交通管理业务办理中心和互联网交通管理业务受理窗口，设置受理岗、管理岗、档案岗。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2471, "section": "第五部分 机动车业务知识", "header": "3.2.76", "question": "互联网交通安全综合服务管理平台信息管理系统数据库标准和软件全省统一。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2472, "section": "第五部分 机动车业务知识", "header": "3.2.77", "question": "互联网交通管理业务注册用户只有个人用户，不包括单位用户。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2473, "section": "第五部分 机动车业务知识", "header": "3.2.78", "question": "互联网交通管理业务用户可以在网上或到公安机关交通管理部门指定窗口办理用户变更。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2474, "section": "第五部分 机动车业务知识", "header": "3.2.79", "question": "公安机关交通管理部门应当建立互联网交通管理业务窗口注册用户档案。窗口注册用户档案包括实物档案和电子档案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2475, "section": "第五部分 机动车业务知识", "header": "3.2.80", "question": "车辆管理所在办理大客车\"营转非\"业务时，要严格审核所有人身份证明、二手车交易发票、登记证书、行驶证等证明凭证，并向交通运输部门核查车辆办理道路运输证情况，道路运输证没有注销的，告知当事人注销后方可办理\"营转非\"业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2476, "section": "第五部分 机动车业务知识", "header": "3.2.81", "question": "办理重中型货车和挂车注册登记时，要严格按照《机动车登记规定》及其工作规范审核车辆出厂合格证、购车发票等证明凭证，核查比对《公告》批准的生产日期和技术参数，比对国产机动车出厂合格证核查系统信息。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2477, "section": "第五部分 机动车业务知识", "header": "3.2.82", "question": "落实免填表是指由窗口工作人员在综合应用平台中采集录入信息制作申请表，交申请人签字确认；对于群众主动提交申请表的，重新填写打印。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2478, "section": "第五部分 机动车业务知识", "header": "3.2.83", "question": "设区的市或者相当于同级的公安机关交通管理部门报经省级公安机关交通管理部门批准同意后，可启用新的发牌机关代号。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2479, "section": "第五部分 机动车业务知识", "header": "3.2.84", "question": "办理注册登记，机动车登记系统内\"进口凭证车身颜色\"按机动车查验记录表记载的\"车身颜色\"录入。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2480, "section": "第五部分 机动车业务知识", "header": "3.2.85", "question": "启动全国统一的机动车号牌选号系统后，临时行驶车号牌通过综合应用平台或互联网服务平台核发，也可使用外挂系统核发。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2481, "section": "第五部分 机动车业务知识", "header": "3.2.86", "question": "2018年1月1日起，核发临时行驶车号牌时，可使用高拍仪采集合格证（进口凭证）、机动车所有人身份证明等照片。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2482, "section": "第五部分 机动车业务知识", "header": "3.2.87", "question": "通过综合应用平台申请核发临时号牌时，系统将自动与部级资源库进行核查比对，同一机动车同一所有人（即同一车辆识别代号、所有人名称、所有人身份证明号码）在全国范围内核发临时号牌不得超过3次。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2483, "section": "第五部分 机动车业务知识", "header": "3.2.88", "question": "对同一机动车同一所有人核发跨辖区临时行驶车号牌超过1次、同一机动车不同所有人在全国范围内核发临时号牌超过3次等情况进行预警提示，并纳入异常业务监管和通报。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2484, "section": "第五部分 机动车业务知识", "header": "3.2.89", "question": "新能源汽车的使领馆汽车号牌、港澳入出境车号牌、警用汽车号牌、教练汽车号牌及纸质材料号牌（临时行驶车号牌、临时入境汽车号牌）式样及编码规则不变。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2485, "section": "第五部分 机动车业务知识", "header": "3.2.90", "question": "新能源汽车专用号牌序号中英文字母I、O和Q不能使用。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2486, "section": "第五部分 机动车业务知识", "header": "3.2.91", "question": "在最大限度方便群众当场领取号牌的同时，允许群众自主选择邮寄号牌或到临近的号牌制作点领取号牌，不得强制选择邮寄号牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2487, "section": "第五部分 机动车业务知识", "header": "3.2.92", "question": "二手车出口企业应当在机动车办理海关出口通关手续后二个月内申请注销登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2488, "section": "第六部分 监督岗位试题", "header": "1.1.1", "question": "机动车逾期未制证，是指选号后超过_____日未制证的。", "options": ["A、1", "B、2", "C、3", "D、4"], "answer": "B", "type": "choice"}, {"id": 2489, "section": "第六部分 监督岗位试题", "header": "1.1.2", "question": "加强业务规范管理，要求车管所按工作规范要求，及时办理业务。业务积压，是指流水状态正常且超过______未正常办结业务的。", "options": ["A、十天", "B、半个月", "C、二十天", "D、一个月"], "answer": "D", "type": "choice"}, {"id": 2490, "section": "第六部分 监督岗位试题", "header": "1.1.3", "question": "为检查各类机动车的定期检验率是否达到车管所等级评定要求，业务监管岗针对此种数据核查的标准是：大型公路客运、大型旅游客运、\"营转非\"大客车，校车、危险货物运输车，定期检验率未达到_____以上。", "options": ["A、80%", "B、85%", "C、90%", "D、99%"], "answer": "D", "type": "choice"}, {"id": 2491, "section": "第六部分 监督岗位试题", "header": "1.1.4", "question": "为检查各类机动车的定期检验率是否达到车辆管理所等级评定要求，业务监管岗针对此种数据核查的标准是：重型货车、重型挂车定期检验率必须达到_____以上。", "options": ["A、80%", "B、90%", "C、95%", "D、99%"], "answer": "C", "type": "choice"}, {"id": 2492, "section": "第六部分 监督岗位试题", "header": "1.1.5", "question": "为检查各类机动车的报废是否达到车辆管理所等级评定要求，业务监管岗针对此种数据核查的标准是：大型公路客运、大型旅游客运、\"营转非\"大客车，校车、危险货物运输车，报废率必须达到_____以上。", "options": ["A、80%", "B、85%", "C、90%", "D、99%"], "answer": "D", "type": "choice"}, {"id": 2493, "section": "第六部分 监督岗位试题", "header": "1.1.6", "question": "为检查各类机动车的报废率是否达到车管所等级评定要求，业务监管岗针对此种数据核查标准，其中重型货车和重型挂车报废率必须达到_____以上；", "options": ["A、85%", "B、90%", "C、95%", "D、100%"], "answer": "B", "type": "choice"}, {"id": 2494, "section": "第六部分 监督岗位试题", "header": "1.1.7", "question": "按照机动车工作规范规定，加强业务告知管理。指标\"逾期未检验告知\"，是指对逾期_____个月未检验的机动车，未按规定告知机动车所有人的。", "options": ["A、1", "B、2", "C、3", "D、4"], "answer": "B", "type": "choice"}, {"id": 2495, "section": "第六部分 监督岗位试题", "header": "1.1.8", "question": "下列_____不属于机动车登记业务监管的指标。", "options": ["A、注册登记VIN码核查重复", "B、选号后退办", "C、未在15个工作日内办理机动车注册登记", "D、补领号牌后退办"], "answer": "C", "type": "choice"}, {"id": 2496, "section": "第六部分 监督岗位试题", "header": "1.1.9", "question": "机动车和驾驶人业务2个工作日未及时归档率（积压率）要少于_____。", "options": ["A、1.5‰", "B、3‰", "C、1‰", "D、2‰"], "answer": "C", "type": "choice"}, {"id": 2497, "section": "第六部分 监督岗位试题", "header": "1.1.10", "question": "按照互联网交通安全综合服务管理平台建设应用指标体系要求，监督岗检查通过互联网平台办理补换领牌证的比率以及72小时内及时受理率满分要求分别大于_____和_____。", "options": ["A、15%  80%", "B、10%  90%", "C、15%  90%", "D、20%  80%"], "answer": "B", "type": "choice"}, {"id": 2498, "section": "第六部分 监督岗位试题", "header": "1.1.11", "question": "查验监督岗应当_______复核上一工作日全部进口机动车注册登记，以及校车、危险货物运输车辆、专项作业车、挂车、中型（含）以上载客汽车、中型（含）以上载货汽车所有登记业务的查验结果、照片及视频。", "options": ["A、下一个工作日", "B、每个工作日", "C、12小时内", "D、每日"], "answer": "D", "type": "choice"}, {"id": 2499, "section": "第六部分 监督岗位试题", "header": "1.1.12", "question": "查验监督岗应当使用机动车查验监管系统_____视频巡查各查验场所秩序、查验过程、查验工具设备使用等情况。", "options": ["A、每日", "B、36小时内", "C、48小时内", "D、每个工作日"], "answer": "A", "type": "choice"}, {"id": 2500, "section": "第六部分 监督岗位试题", "header": "1.1.13", "question": "车驾管业务监管中心应当落实定期分析研判、远程监控、日常检查、____、____和____等监管制度。", "options": ["A、档案抽查 电话回访 音视频抽查", "B、问卷调查 电话回访 音视频抽查", "C、暗访调查 电话回访 档案抽查", "D、暗访调查 现场检查 音视频抽查"], "answer": "A", "type": "choice"}, {"id": 2501, "section": "第六部分 监督岗位试题", "header": "1.1.14", "question": "对车辆转籍信息网上转递，车辆管理所应当安排监督人员对电子化档案资料、登记信息、业务档案等进行抽查，每____抽查不少于机动车转籍业务办理量的____。", "options": ["A、月  20%", "B、周  30%", "C、天  5%", "D、周  20%"], "answer": "D", "type": "choice"}, {"id": 2502, "section": "第六部分 监督岗位试题", "header": "1.1.15", "question": "关于监管机构设立要求的表述，下面____不正确。", "options": ["A、地市支队或车辆管理所应设立市级监管中心", "B、县级大队或车辆管理所应设立监督岗或监管中心", "C、地市支队、县大队要按车驾管业务需求设置监督岗位，民警及警务辅助人员配备合理", "D、无明确要求"], "answer": "D", "type": "choice"}, {"id": 2503, "section": "第六部分 监督岗位试题", "header": "1.1.16", "question": "地市支队车辆管理所要对本级及县级公安机关交通管理部门监督岗工作人员开展业务指导监督，并____开展培训和业务考核。", "options": ["A、每天", "B、每周", "C、每月", "D、每季度"], "answer": "C", "type": "choice"}, {"id": 2504, "section": "第六部分 监督岗位试题", "header": "1.1.17", "question": "车辆管理所对驾驶人考试、大中型客货车查验业务，随机抽取核查比例不少于业务量的____。", "options": ["A、1%", "B、2%", "C、3%", "D、5%"], "answer": "C", "type": "choice"}, {"id": 2505, "section": "第六部分 监督岗位试题", "header": "1.1.18", "question": "地市支队车辆管理所每周实地检查的网点数量要不少于辖区内业务网点总数的____。", "options": ["A、5%", "B、10%", "C、20%", "D、30%"], "answer": "A", "type": "choice"}, {"id": 2506, "section": "第六部分 监督岗位试题", "header": "1.1.19", "question": "地市支队车辆管理所对号牌制作点检查每____个月不少于1次。", "options": ["A、1", "B、2", "C、3", "D、4"], "answer": "C", "type": "choice"}, {"id": 2507, "section": "第六部分 监督岗位试题", "header": "1.1.20", "question": "下面____不符合业务监管制度要求：", "options": ["A、定期开展音视频回访、档案抽查、业务回访工作，每日随机抽取的比例分别不少于辖区内业务总量的1%", "B、对进口机动车注册登记、大中型客货车登记查验业务的抽取比例不少于业务量的10%", "C、对驾驶人考试、大中型客货车查验业务语音电话回访比例不少于业务量的2%", "D、对机动车登记服务站业务回访语音电话回访比例不少于业务量的10%"], "answer": "D", "type": "choice"}, {"id": 2508, "section": "第六部分 监督岗位试题", "header": "1.1.21", "question": "目前不能提供业务监管预警信息的系统是____。", "options": ["A、大数据研判平台        B、综合应用平台", "C、综合监管平台          D、部局资源库"], "answer": "D", "type": "choice"}, {"id": 2509, "section": "第六部分 监督岗位试题", "header": "1.1.22", "question": "对于异常业务数据分析结果，要验证分析结论是否正确，最重要的判断依据是____。", "options": ["A、分析过程的方法是正确的", "B、分析结论可以和其他业务数据相互印证", "C、分析结果符合主观感觉", "D、采用了较为先进的分析工具"], "answer": "B", "type": "choice"}, {"id": 2510, "section": "第六部分 监督岗位试题", "header": "1.1.23", "question": "大数据分析研判平台预警的核查整改方法不合适的是____。", "options": ["A、红色预警  总队组织核查", "B、橙色预警  支队组织核查", "C、黄色预警  业务部门自查", "D、预警均由业务部门自查"], "answer": "D", "type": "choice"}, {"id": 2511, "section": "第六部分 监督岗位试题", "header": "1.1.24", "question": "_____公安机关交通管理部门应当通过监管系统每月对机动车驾驶人考试情况进行监控、分析，及时查处、通报发现的问题。", "options": ["A.省级", "B.直辖市、设区的市", "C.市级", "D.县级"], "answer": "A", "type": "choice"}, {"id": 2512, "section": "第六部分 监督岗位试题", "header": "1.1.25", "question": "车辆管理所存在严重违规办理机动车登记情形的，_____公安机关交通管理部门可以暂停该车辆管理所办理相关业务或者指派其他车辆管理所人员接管业务。", "options": ["A.省级", "B.市级", "C.上级", "D.本级"], "answer": "C", "type": "choice"}, {"id": 2513, "section": "第六部分 监督岗位试题", "header": "1.1.26", "question": "_____等单位经公安机关交通管理部门委托可以设立机动车登记服务站，在公安机关交通管理部门监督管理下协助办理机动车登记及相关业务。", "options": ["A.机动车销售企业", "B.二手车交易市场", "C.机动车安全技术检验机构", "D.以上都是"], "answer": "D", "type": "choice"}, {"id": 2514, "section": "第六部分 监督岗位试题", "header": "1.1.27", "question": "机动车登记服务站存在违反规定办理机动车登记及相关业务、违反信息安全管理规定等情形，违规情形严重的，_____。", "options": ["A.书面函告", "B.限期整改", "C.暂停委托其业务办理", "D.终止委托其业务办理"], "answer": "D", "type": "choice"}, {"id": 2515, "section": "第六部分 监督岗位试题", "header": "1.1.28", "question": "对发现申请人通过机动车虚假交易、以合法形式掩盖非法目的等手段，在机动车登记业务中牟取不正当利益的，公安机关交通管理部门不予受理或者不予登记，处_____罚款；申请人在一年内不得再次申请机动车登记。", "options": ["A.二百元", "B.二百元以上五百元以下", "C.五百元", "D.五百元以下"], "answer": "D", "type": "choice"}, {"id": 2516, "section": "第六部分 监督岗位试题", "header": "1.1.29", "question": "直辖市、设区的市或者相当于同级的公安机关交通管理部门应当每月向社会公布车辆管理所考试员考试质量情况、_____内驾龄驾驶人交通违法率和交通肇事率等信息。", "options": ["A.一年", "B.二年", "C.三年", "D.五年"], "answer": "C", "type": "choice"}, {"id": 2517, "section": "第六部分 监督岗位试题", "header": "1.1.30", "question": "对三年内驾龄驾驶人发生一次死亡3人以上交通事故且负主要以上责任的，_____公安机关交通管理部门应当倒查车辆管理所考试、发证情况，向社会公布倒查结果。", "options": ["A.省级", "B.市级", "C.县级", "D.上级"], "answer": "A", "type": "choice"}, {"id": 2518, "section": "第六部分 监督岗位试题", "header": "1.1.31", "question": "代替实际机动车驾驶人参加审验教育的，由公安机关交通管理部门处_____罚款。", "options": ["A.一千元", "B.一千元以下", "C.二千元", "D.二千元以下"], "answer": "D", "type": "choice"}, {"id": 2519, "section": "第六部分 监督岗位试题", "header": "1.1.32", "question": "监管中心应当记录机动车和驾驶证业务监管全过程，对巡查检查、分析研判、抽查回访等发现的问题以及核查处理等记录，制作实物档案或者电子档案，保存时间不少于_____年。", "options": ["A、1", "B、2", "C、3", "D、4"], "answer": "C", "type": "choice"}, {"id": 2520, "section": "第六部分 监督岗位试题", "header": "1.1.33", "question": "省级监管中心应当每周开展音视频巡查，巡查地市级车辆管理所的比例不少于总数的_____、县级车辆管理所不少于总数的_____。", "options": ["A、20%  10%", "B、10%  20%", "C、10%  5%", "D、5%  10%"], "answer": "A", "type": "choice"}, {"id": 2521, "section": "第六部分 监督岗位试题", "header": "1.1.34", "question": "市级监管中心应当每周开展实地现场检查，检查的网点数量应当不少于辖区内业务网点总数的_____，其中对县级车辆管理所、机动车登记服务站、查验区域、驾驶人考场、满分审验教育点等重点业务场所检查数量均不少于_____个；对号牌制作点检查每3个月不少于_____次。", "options": ["A、5%  2  1", "B、10%  3  1", "C、15%  3  1", "D、20%  3  1"], "answer": "A", "type": "choice"}, {"id": 2522, "section": "第六部分 监督岗位试题", "header": "1.1.35", "question": "省级监管中心应当每月随机抽取业务办理过程音视频进行回放检查，检查地市级车辆管理所的比例不少于总数的_____。", "options": ["A、20%", "B、15%", "C、5%", "D、10%"], "answer": "D", "type": "choice"}, {"id": 2523, "section": "第六部分 监督岗位试题", "header": "1.1.36", "question": "市级监管中心应当每日随机抽取上一日业务档案进行检查，随机抽取的比例应当不少于辖区内业务总量的_____。", "options": ["A、4%", "B、3%", "C、2%", "D、1%"], "answer": "D", "type": "choice"}, {"id": 2524, "section": "第六部分 监督岗位试题", "header": "1.1.37", "question": "市级监管中心应当每日随机抽取上一日业务档案进行检查，对进口机动车注册登记、大中型客货车登记查验业务的抽取比例不少于业务量的_____。", "options": ["A、20%", "B、15%", "C、5%", "D、10%"], "answer": "D", "type": "choice"}, {"id": 2525, "section": "第六部分 监督岗位试题", "header": "1.1.38", "question": "市级监管中心应当每日随机抽取上一日业务进行回访，语音电话回访的比例应当不少于辖区内业务总量的_____。", "options": ["A、4%", "B、3%", "C、2%", "D、1%"], "answer": "D", "type": "choice"}, {"id": 2526, "section": "第六部分 监督岗位试题", "header": "1.1.39", "question": "市级监管中心应当每日随机抽取上一日业务进行回访，对驾驶人考试、大中型客货车查验业务语音电话回访比例不少于业务量的_____。", "options": ["A、4%", "B、3%", "C、2%", "D、1%"], "answer": "C", "type": "choice"}, {"id": 2527, "section": "第六部分 监督岗位试题", "header": "1.1.40", "question": "市级监管中心应当每日随机抽取上一日业务进行回访，对机动车登记服务站业务回访语音电话回访比例不少于业务量的_____。", "options": ["A、4%", "B、3%", "C、2%", "D、1%"], "answer": "D", "type": "choice"}, {"id": 2528, "section": "第六部分 监督岗位试题", "header": "1.1.41", "question": "监管中心开展涉嫌严重违法违规核查时，应当指派_____名以上民警开展核查，在_____日内核查完毕。", "options": ["A、1  15", "B、2  15", "C、2  20", "D、1  20"], "answer": "B", "type": "choice"}, {"id": 2529, "section": "第六部分 监督岗位试题", "header": "1.1.42", "question": "车辆管理所应当每日随机抽取检查当天业务办理过程音视频资料。其中，考试和审验教育业务不少于当天业务总量___;驾驶证业务不少于当天业务总量的___。", "options": ["A、5%  3%", "B、10%  5%", "C、5%  1%", "D、3%  3%"], "answer": "A", "type": "choice"}, {"id": 2530, "section": "第六部分 监督岗位试题", "header": "1.1.43", "question": "车辆管理所应当每日随机抽取检查当天驾驶证业务不少于当天业务总量的___%。", "options": ["A、5%", "B、10%", "C、1%", "D、3%"], "answer": "D", "type": "choice"}, {"id": 2531, "section": "第六部分 监督岗位试题", "header": "1.1.44", "question": "车辆管理所应当每日通过音视频巡查不少于本行政区域内业务网点总数_____%。", "options": ["A、5%", "B、10%", "C、20%", "D、30%"], "answer": "C", "type": "choice"}, {"id": 2532, "section": "第六部分 监督岗位试题", "header": "1.1.45", "question": "车辆管理所应当每日随机抽取机动车驾驶证业务进行电话回访，随机抽取的比例应当不少于当天本行政区域内业务总量的_____%。", "options": ["A、1%", "B、3%", "C、5%", "D、10%"], "answer": "A", "type": "choice"}, {"id": 2533, "section": "第六部分 监督岗位试题", "header": "1.1.46", "question": "车辆管理所应当建立考试质量和考试纪律抽查制度，每日抽查不少于_____的当天音视频电子信息档案和执法记录仪信息档案，发现存在违反考试纪律、考场秩序混乱以及视频、音频信息缺失或者不完整的，应当进行调查处理。", "options": ["A、5%", "B、10%", "C、1%", "D、3%"], "answer": "A", "type": "choice"}, {"id": 2534, "section": "第六部分 监督岗位试题", "header": "1.1.47", "question": "车辆管理所应当每日随机抽取业务档案和信息系统日志进行检查，其中对大中型客货车驾驶证业务随机抽取的比例应当不少于当天本行政区域内同类业务总量的____。", "options": ["A、5%", "B、10%", "C、15%", "D、20%"], "answer": "B", "type": "choice"}, {"id": 2535, "section": "第六部分 监督岗位试题", "header": "1.1.48", "question": "车辆管理所应当安排监督人员对电子化档案资料、登记信息、业务档案 等进行抽查，_____抽查不少于机动车跨辖区转移登记业务办理量的 _____。", "options": ["A、每日  5%", "B、每周  5%", "C、每月  10%", "D、每年  5%"], "answer": "B", "type": "choice"}, {"id": 2536, "section": "第六部分 监督岗位试题", "header": "1.1.49", "question": "社会考场存在组织纵容考试作弊、篡改伪造考试数据等情况的，以下做法错误的是_____。", "options": ["A、支队要按照合同和相关规定立即终止购买服务，并通报财政部门", "B、考场及其责任人不得再次参与考场政府购买服务", "C、责令其自查自纠后，继续开展考试工作", "D、构成犯罪的，依法追究刑事责任"], "answer": "C", "type": "choice"}, {"id": 2537, "section": "第六部分 监督岗位试题", "header": "1.1.50", "question": "公安机关交通管理部门应当成立12123语音服务中心，设置_____，负责 受理互联网交通管理业务，处理咨询投诉。", "options": ["A、座席岗", "B、班长岗", "C、管理岗", "D、以上都需要"], "answer": "D", "type": "choice"}, {"id": 2538, "section": "第六部分 监督岗位试题", "header": "1.1.51", "question": "机动车和驾驶证业务监督管理范围包括_____。", "options": ["A、公安机关交通管理部门车辆管理所办理的机动车和驾驶证业务", "B、机动车登记服务站、交通管理服务站等协助办理的业务", "C、申请人通过互联网平台办理的网上业务", "D、以上都需要"], "answer": "D", "type": "choice"}, {"id": 2539, "section": "第六部分 监督岗位试题", "header": "1.2.1", "question": "对制行驶证后退办进行业务监管，是为了防止废弃的机动车行驶证证芯流失，用于制作套证、假证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2540, "section": "第六部分 监督岗位试题", "header": "1.2.2", "question": "针对补领号牌后退办的监管业务，其处置方法是，核查退办原因及机动车号牌是否收回销毁。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2541, "section": "第六部分 监督岗位试题", "header": "1.2.3", "question": "为防止转入车辆更正机动车信息，使走私车、报废车、盗抢车等车辆档案合法化，或延长车辆强制报废期等。需核查机动车档案和机动车登记信息，其中检验有效期止不需要核实。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2542, "section": "第六部分 监督岗位试题", "header": "1.2.4", "question": "单独变更号牌号码，业务监管岗针对此种数据核查的标准是，是办理变更登记时，未变更使用性质或号牌种类而变更号牌号码的。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2543, "section": "第六部分 监督岗位试题", "header": "1.2.5", "question": "核查个人注册登记超过10辆以上机动车，是为了防止出让户口和身份证供他人注册登记车辆，从而躲避相关法律法规限制的\"背车\"行为。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2544, "section": "第六部分 监督岗位试题", "header": "1.2.6", "question": "针对档案补建业务，需核查机动车档案和机动车登记信息、流水日志信息，核实补建信息是否属实，业务流程是否规范。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2545, "section": "第六部分 监督岗位试题", "header": "1.2.7", "question": "为加强业务规范管理，进口车未通过核查，超过15天未再次核查的。处置方法是提醒业务人员及时与海关、公安部进行沟通。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2546, "section": "第六部分 监督岗位试题", "header": "1.2.8", "question": "逾期未强制报废告知，指对逾期2个月内需强制报废的机动车，未按规定告知机动车所有人的。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2547, "section": "第六部分 监督岗位试题", "header": "1.2.9", "question": "针对个人名下营转非大型客车数量较多的车辆管理所，应联合运管部门加强路面检查，是否粘贴\"营转非\"大客车专用标识，是否违规上路运营。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2548, "section": "第六部分 监督岗位试题", "header": "1.2.10", "question": "监管指标\"单位补换领号牌次数过高\"，是为防止运输企业套牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2549, "section": "第六部分 监督岗位试题", "header": "1.2.11", "question": "按照机动车工作规范规定，\"逾期未强制报废告知\"，是指对逾期3个月内需强制报废的机动车，未按规定告知机动车所有人的。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2550, "section": "第六部分 监督岗位试题", "header": "1.2.12", "question": "车辆管理所未按照自主预约要求进行考试预约，而是通过与驾校协商，由驾校统一组织预约。业务监管岗针对此种数据核查，可以分析某驾校当天约考人数超过前三天平均日考试人数的倍数为参考。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2551, "section": "第六部分 监督岗位试题", "header": "1.2.13", "question": "防止通过考试误判的方式，给考生增加考试次数。业务监管岗可以分析科目二每月误判处置数量超过考试总人数的比例为参考。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2552, "section": "第六部分 监督岗位试题", "header": "1.2.14", "question": "防止延迟上传考试过程信息，伪造考试过程记录。业务监管岗可以分析科目考试系统与考试监管软件系统时间差值达到一定时间为参考。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2553, "section": "第六部分 监督岗位试题", "header": "1.2.15", "question": "防止考试员对某些驾校的学员降低考试标准。业务监管可以分析同一考试员，某驾校月考试合格率是否明显超过该考试员月考试合格率。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2554, "section": "第六部分 监督岗位试题", "header": "1.2.16", "question": "防止存在摩托车考试把关不严的现象。业务监管岗可以分析某日考试员考试摩托车人数是否特别多，明显超过考试能力。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2555, "section": "第六部分 监督岗位试题", "header": "1.2.17", "question": "驾驶证逾期未制证，是安全文明驾驶常识考试合格后，1个工作日未制证的业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2556, "section": "第六部分 监督岗位试题", "header": "1.2.18", "question": "为防止考试系统通过参数屏蔽扣分项目，屏蔽科目二扣分项目的指标，业务监管岗针对此种数据核查的标准是：某考场科目二考试扣分项目一段时间内扣分的比例很低甚至为0。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2557, "section": "第六部分 监督岗位试题", "header": "1.2.19", "question": "为防止岗位间相互监督的缺失，需核查同一人完成全部岗位业务的情况，注册登记、转移登记、变更登记、抵押登记等业务归档时，需判断是否同一人操作的。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2558, "section": "第六部分 监督岗位试题", "header": "1.2.20", "question": "为防止转入车辆更正机动车信息，使走私车、报废车、盗抢车等车辆档案合法化，或延长车辆强制报废期等。需同时核查机动车档案和机动车登记信息中车辆品牌、初次登记日期、获得方式、检验有效期止等重要数据项。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2559, "section": "第六部分 监督岗位试题", "header": "1.2.21", "question": "补考合格率过高、考试员合格率过高、摩托车日考试人数异常、取消考试等也属于驾驶证管理业务监管的指标。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2560, "section": "第六部分 监督岗位试题", "header": "1.2.22", "question": "科目一同一考台连续考试合格或合格比例较高，核查的方式是查看考试视频监控、考试成绩单照片是否本人、客户端是否开启远程桌面等。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2561, "section": "第六部分 监督岗位试题", "header": "1.2.24", "question": "要加强考试系统权限管理，考试系统中管理员权限用户仅限监督岗的专职考试员，严禁考场、考试系统生产厂商等其他单位或个人具有参数维护、用户设置等权限。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2562, "section": "第六部分 监督岗位试题", "header": "1.2.25", "question": "要强化信息化手段监管，总队每月、支队每周、车管所每天开展驾驶人考试异常业务分析预警研判，对考场、考试车、考台、考试时段、考试员等对应合格率异常的，开展实地明查暗访、音视频抽查检查，及时发现整改问题，深入查究违法违规行为。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2563, "section": "第六部分 监督岗位试题", "header": "1.2.26", "question": "省级公安交管部门要每月分析异地考试数据，地市级公安交管部门要每周分析，对异常问题及时核查、严格问责，杜绝降低标准、违规考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2564, "section": "第六部分 监督岗位试题", "header": "1.2.27", "question": "要严格落实总队、支队和车管所三级监管职责，用足用好考试、检验等业务监管系统，实行网上巡查与现场检查相结合、常态检查与随机检查相结合，强化异常业务分析检查，及时发现问题，严肃查处追责，完善机制，堵塞漏洞。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2565, "section": "第六部分 监督岗位试题", "header": "1.2.28", "question": "车辆管理所开展机动车查验业务时，应当设置查验业务岗、查验监督岗。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2566, "section": "第六部分 监督岗位试题", "header": "1.2.29", "question": "公安机关交通管理部门应当建立机动车查验监督制度，通过远程监控、视频巡查、数据分析、日常检查等方式，加强对机动车查验工作的监督管理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2567, "section": "第六部分 监督岗位试题", "header": "1.2.30", "question": "车辆管理所应当组织对机动车登记服务站查验业务的日常检查，每月明查暗访次数应当不少于2次，每季度完成对辖区全部机动车登记服务站检查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2568, "section": "第六部分 监督岗位试题", "header": "1.2.31", "question": "各地公安交管部门要通过检验监管系统，重点比对轻型载货汽车轴荷总和检测数据与整备质量检测数据，重点核查同一检验机构、同一车型集中检验等检验数据，对轴荷明显超过整备质量等异常情形的，列入重点嫌疑车辆进行调查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2569, "section": "第六部分 监督岗位试题", "header": "1.2.32", "question": "各地公安交管部门要进一步规范轻型载货汽车注册登记管理，对发现货车栏板、货箱、轮胎、轮毂等外观与《公告》明显不符、整备质量存在严重违规嫌疑的，立即退办，不用启动嫌疑机动车调查程序。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2570, "section": "第六部分 监督岗位试题", "header": "1.2.33", "question": "防止非法中介和安检机构勾结，车辆替检或降低检验标准。业务监管岗可以分析每日检验车辆是否超过承检能力，品牌是否集中，外地车辆是否较多、来源地是否集中等。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2571, "section": "第六部分 监督岗位试题", "header": "1.2.34", "question": "监管\"单位或个人车辆补换领号牌次数过高\"，是为防止车辆号牌被盗。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2572, "section": "第六部分 监督岗位试题", "header": "1.2.35", "question": "监管“检验监管审核人员审核合格率异常”，是为了防止审核人员未按规范进行审核。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2573, "section": "第六部分 监督岗位试题", "header": "1.2.36", "question": "监管\"多次补领行驶证\"，是为了防止利用多次补领行驶证进行套牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2574, "section": "第六部分 监督岗位试题", "header": "1.2.37", "question": "为防止机动车在异地虚假报废，监管异地报废数量异常，可以分析异地报废车辆数量、来源地、本地是否有通行轨迹等。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2575, "section": "第六部分 监督岗位试题", "header": "1.2.38", "question": "监管\"转出未落户数量异常\"，是为了防止转出车辆不落户、不挂牌继续上路或非法解体、改装。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2576, "section": "第六部分 监督岗位试题", "header": "1.2.39", "question": "为防止安检机构违规检验，监管\"安检机构检验合格率异常\"，可以分析安检机构初检合格率、复检检验合格率特别高或特别低或相差较大，或与别的安检机构合格率相差较大。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2577, "section": "第六部分 监督岗位试题", "header": "1.2.40", "question": "监管\"外地人集中考试\"，为防止外地人异地考试。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2578, "section": "第六部分 监督岗位试题", "header": "1.2.41", "question": "为防止某类车辆集中注册或集中注销，可以分析保有量环比增加或减少比例较多的。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2579, "section": "第六部分 监督岗位试题", "header": "1.2.42", "question": "各级交通管理部门要使用全国统一的公安交通管理业务综合监管系统、公安交通管理大数据研判系统或符合规定的自行研发的监管系统。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2580, "section": "第六部分 监督岗位试题", "header": "1.2.43", "question": "地市车辆管理所要按照《机动车和驾驶证业务监督管理工作规范（试行）》，采用信息备案、巡查检查、分析研判、抽查回访等方式开展机动车和驾驶证业务监管，及时发现、预警、核查异常情况。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2581, "section": "第六部分 监督岗位试题", "header": "1.2.44", "question": "地市车辆管理所要使用监管系统对辖区内所有机动车查验区、驾驶人考场、登记服务站等网点及网点工作人员、场地、设备、牌证等基础信息按规范进行备案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2582, "section": "第六部分 监督岗位试题", "header": "1.2.45", "question": "地市车辆管理所要每周开展涉嫌严重违法违规业务风险隐患分析研判，健全完善监管工作机制。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2583, "section": "第六部分 监督岗位试题", "header": "1.2.46", "question": "地市车辆管理所要重点异常业务实行监督岗复核、车辆管理所班子集体研究审核制度，制定机动车和驾驶证业务违法违规责任追究制度，监管中心对查实的违法违规问题，按规定报告、通报相关管理部门，依法处理处罚。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2584, "section": "第六部分 监督岗位试题", "header": "1.2.47", "question": "地市车辆管理所要检查查验岗、考试岗、监督岗的资格管理、日常教育、业务培训等情况，组织20%的民警和20%的业务岗位警务辅助人员进行业务知识抽查考试，90分及格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2585, "section": "第六部分 监督岗位试题", "header": "1.2.48", "question": "部局定期对各地异常业务进行通报，通报的异常业务就是违规业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2586, "section": "第六部分 监督岗位试题", "header": "1.2.49", "question": "车辆管理所开展调查时，应当通知申请人协助调查，询问嫌疑情况，记录调查内容，并可以采取检验鉴定、实地检查等方式进行核查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2587, "section": "第六部分 监督岗位试题", "header": "1.2.50", "question": "公安机关交通管理部门应当建立业务监督管理中心，通过远程监控、数据分析、日常检查、档案抽查、业务回访等方式，对机动车登记及相关业务办理情况进行监督管理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2588, "section": "第六部分 监督岗位试题", "header": "1.2.51", "question": "金融机构经公安机关交通管理部门委托可以设立机动车登记服务站，在公安机关交通管理部门监督管理下协助办理机动车登记及相关业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2589, "section": "第六部分 监督岗位试题", "header": "1.2.52", "question": "登记服务站协助办理机动车登记的，可以提供办理保险和车辆购置税、机动车预查验、信息预录入等服务，便利机动车所有人一站式办理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2590, "section": "第六部分 监督岗位试题", "header": "1.2.53", "question": "车辆管理所应当对机动车查验过程进行全程录像，并实时监控查验过程，没有使用录像设备的，不得进行查验。机动车查验中，有条件的单位可以为查验员配备执勤执法记录仪记录查验过程。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2591, "section": "第六部分 监督岗位试题", "header": "1.2.54", "question": "组织、参与实施隐瞒有关情况或者提供虚假材料申领机动车驾驶证、在考试过程中贿赂、舞弊，或以欺骗、贿赂等不正当手段取得机动车驾驶证，牟取经济利益的，由公安机关交通管理部门处违法所得三倍以上五倍以下罚款，但最高不超过十万元。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2592, "section": "第六部分 监督岗位试题", "header": "1.2.55", "question": "车辆管理所存在为未经考试或者考试不合格人员核发机动车驾驶证等严重违规办理机动车驾驶证业务情形的，上级公安机关交通管理部门可以暂停该车辆管理所办理相关业务或者指派其他车辆管理所人员接管业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2593, "section": "第六部分 监督岗位试题", "header": "1.2.56", "question": "监管中心负责人，应当由民警担任，具有两年以上机动车或者驾驶人管理岗位工作经验，取得警务技术序列中级以上、中级以上查验员、考试员、法律职业或者计算机二级以上等资格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2594, "section": "第六部分 监督岗位试题", "header": "1.2.57", "question": "监管中心应当对互联网、自助服务终端等业务，分析机动车选号、临时行驶车号牌发放等数据，研判骗领机动车牌证等违法违规嫌疑。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2595, "section": "第六部分 监督岗位试题", "header": "1.2.58", "question": "监管中心应当对机动车和驾驶证业务档案进行抽查，检查档案资料是否齐全有效、电子档案资料是否清晰、业务办理是否及时、信息系统日志是否正常规范。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2596, "section": "第六部分 监督岗位试题", "header": "1.2.59", "question": "申请恢复驾驶资格，申请人应当向机动车驾驶证核发地车辆管理所申请。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2597, "section": "第六部分 监督岗位试题", "header": "1.2.60", "question": "车辆管理所发现申请人通过互联网办理驾驶证补证、换证等业务存在前款规定嫌疑情形的，可以转为现场办理，当场审查申请材料，及时开展调查。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2598, "section": "第六部分 监督岗位试题", "header": "1.2.61", "question": "证芯回收时，属于未使用的，录入证芯类型、起止编号、收回部门、收回时间以及经办人等信息；属于打坏、污损、遗失等原因需报废的，采集报废证芯电子影像，录入证芯类型、证芯编号、报废部门、报废原因以及经办人等信息。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2599, "section": "第六部分 监督岗位试题", "header": "1.2.62", "question": "机动车和驾驶证业务监督管理范围包括公安机关交通管理部门车辆管理所办理的机动车和驾驶证业务，机动车登记服务站、交通管理服务站等协助办理的业务，申请人通过互联网平台办理的网上业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2600, "section": "第六部分 监督岗位试题", "header": "1.2.63", "question": "公安机关交通管理部门应当使用全国统一的公安交通管理业务综合监管系统开展机动车和驾驶证业务监管，记录和存储事前事中事后监管信息，实现监督管理常态化、精准化、智能化。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2601, "section": "第六部分 监督岗位试题", "header": "1.2.64", "question": "机动车和驾驶证业务网点基础信息备案，对业务办理网点，录入所属公安机关交通管理部门、业务办理范围等基础信息；对业务协助办理网点，录入设立机构的名称、证书类型及编号、法定代表人、联系方式，以及协助办理业务范围、系统网络类型等基础信息，并采集设立机构的统一社会信用代码证书、企业资格证书、服务协议、责任书、验收合格报告等电子资料。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2602, "section": "第六部分 监督岗位试题", "header": "1.2.65", "question": "监管中心对音视频巡查发现工作人员不在岗、办公秩序混乱、非法中介扰民等现场秩序问题，立即通报相关业务部门，督促整改。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2603, "section": "第六部分 监督岗位试题", "header": "1.2.66", "question": "监管中心对音视频巡查发现涉嫌机动车查验替检、考试作弊、满分审验教育替学、为明显不合格机动车通过查验、为明显不合格考生通过考试、为未参加满分审验教育驾驶人违规办理业务等严重违法违规问题，立即通报相关业务部门，督促整改。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 2604, "section": "第六部分 监督岗位试题", "header": "1.2.67", "question": "监管中心对核查需要业务部门配合的，监管中心可以会同业务部门联合开展核查，不得直接转交业务部门核查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2605, "section": "第六部分 监督岗位试题", "header": "1.2.68", "question": "支队要每周进行分析核查。要加强对号牌制作单位和号牌制作点监督管理，定期现场检查和不定期抽查，对发现不应用号牌管理信息系统制作号牌、生产无生产序列标识号牌、篡改号牌管理信息系统数据等严重违规情形的，要立即停止其制作号牌，严格追究责任，构成犯罪的，一律追究刑事责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 2606, "section": "第六部分 监督岗位试题", "header": "2.1.1", "question": "下面______分析方法较适合当前基于公安交通管理综合应用平台的异常业务数据分析部门业务。", "options": ["A、逻辑树分析法", "B、5W2H分析法", "C、时间系列分析", "D、回归分析"], "answer": "B", "type": "choice"}, {"id": 2607, "section": "第六部分 监督岗位试题", "header": "2.1.2", "question": "下面______分析工具操作简单、绘图容易，易于获取安装。", "options": ["A、SPSS", "B、SAS", "C、Excel", "D、Matlab"], "answer": "C", "type": "choice"}, {"id": 2608, "section": "第六部分 监督岗位试题", "header": "2.1.3", "question": "对于异常业务数据分析结果，要验证分析结论是否正确，最重要的判断依据是______。", "options": ["A、分析过程的方法是正确的", "B、分析结论可以和其他业务数据相互印证", "C、分析结果符合主观感觉", "D、采用了较为先进的分析工具"], "answer": "B", "type": "choice"}, {"id": 2609, "section": "第六部分 监督岗位试题", "header": "2.1.4", "question": "异常业务分析报告中，最宜采用的表达形式是______。", "options": ["A、图形", "B、文字", "C、表格", "D、其他"], "answer": "A", "type": "choice"}, {"id": 2610, "section": "第六部分 监督岗位试题", "header": "2.1.5", "question": "在使用综合平台查询数据库进行异常业务数据分析，如果数据表以\"DRV\"三个字母开头，它应属于______的数据表。", "options": ["A、机动车业务", "B、驾驶证业务", "C、违法处理业务", "D、事故处理业务"], "answer": "B", "type": "choice"}, {"id": 2611, "section": "第六部分 监督岗位试题", "header": "2.1.6", "question": "对于以综合平台以代码形式记录的业务数据，应该从______中寻找代码的含义。", "options": ["A、综合平台代码表", "B、GA系列标准", "C、综合平台代码类别表", "D、其他"], "answer": "A", "type": "choice"}, {"id": 2612, "section": "第六部分 监督岗位试题", "header": "2.1.7", "question": "对于给定的100个不同业务部门按月汇总的业务数据量，要比较他们的业务量大小情况，应该使用下面的______指标。", "options": ["A、平均数", "B、中位数", "C、标准差", "D、最大值"], "answer": "A", "type": "choice"}, {"id": 2613, "section": "第六部分 监督岗位试题", "header": "2.1.8", "question": "对于给定的100个不同业务部门按月汇总的业务数据量，要比较他们的业务量的波动情况，应该使用下面的______指标。", "options": ["A、平均数", "B、中位数", "C、标准差", "D、最大值"], "answer": "C", "type": "choice"}, {"id": 2614, "section": "第六部分 监督岗位试题", "header": "2.1.9", "question": "对于平均值相同的多组数据，要度量组内数据的分布情况，应该使用下面的______指标。", "options": ["A、平均数", "B、中位数", "C、标准差", "D、最大值"], "answer": "B", "type": "choice"}, {"id": 2615, "section": "第六部分 监督岗位试题", "header": "2.1.10", "question": "将本月数据和上月数据进行对比，即计算\"（本月-上月）/上月\"的结果，一般称该指标为______。", "options": ["A、环比", "B、同比", "C、百分比", "D、百分点"], "answer": "A", "type": "choice"}, {"id": 2616, "section": "第六部分 监督岗位试题", "header": "2.1.11", "question": "将本月数据和去年同月份数据进行对比，即计算\"（本月-去年同月）/去年同月\"的结果，一般称该指标为______。", "options": ["A、环比", "B、同比", "C、百分比", "D、百分点"], "answer": "B", "type": "choice"}, {"id": 2617, "section": "第六部分 监督岗位试题", "header": "2.1.12", "question": "将某业务量数据使用SQL按月份进行计数，这个过程如果直接在数据表中进行统计，并使用了Group子句，这一过程一般叫______。", "options": ["A、汇总", "B、聚合", "C、计数", "D、计频"], "answer": "B", "type": "choice"}, {"id": 2618, "section": "第六部分 监督岗位试题", "header": "2.1.13", "question": "如果要表达不同准驾车型的驾驶人数量构成情况，最适合的图形是______。", "options": ["A、折线图", "B、饼图", "C、柱状图", "D、散点图"], "answer": "B", "type": "choice"}, {"id": 2619, "section": "第六部分 监督岗位试题", "header": "2.1.14", "question": "如果要表达不同准驾车型的驾驶人每月初学的数量情况，最适合的图形是______。", "options": ["A、折线图", "B、饼图", "C、直方图", "D、散点图"], "answer": "A", "type": "choice"}, {"id": 2620, "section": "第六部分 监督岗位试题", "header": "2.1.15", "question": "为压减网上流转环节，除\"批量修改或撤销非现场交通违法记录\"、\"修改业务数据校验位\"等高风险业务，以及访问公民隐私等敏感数据接口外，其他异常数据修改和接口审核备案为______负责。", "options": ["A、总队", "B、科研所", "C、公安部交管局", "D、车辆管理所"], "answer": "A", "type": "choice"}, {"id": 2621, "section": "第六部分 监督岗位试题", "header": "2.1.16", "question": "按照异常数据修改类型和分工，下列______属于由支队申请，支队自行审核修改。", "options": ["A、延长学习驾驶证明有效期", "B、互联网选号逾期未确认号牌", "C、撤销公务用车号段", "D、修改互联网选号次数"], "answer": "B", "type": "choice"}, {"id": 2622, "section": "第六部分 监督岗位试题", "header": "2.1.17", "question": "下面____不符合信息安全管理规定:", "options": ["A、落实计算机系统操作权限管理制度，对用户实行实名制管理，根据实际严格授权、规范管理、使用数字证书，离岗、离职用户及时进行调整，定期核对用户查询操作日志；", "B、落实驾驶人社会考场、机动车安全技术检验机构、机动车登记服务站、报废机动车回收拆检企业等交管信     function renderSections() {
        const sections = [...new Set(allQuestions.map(q => q.section))].filter(s => s !== "未分类");
        const list = document.getElementById('sectionList');
        sections.forEach(sec => {
            const btn = document.createElement('button');
            btn.className = 'btn-section';
            btn.innerText = `📖 ${sec}`;
            btn.onclick = () => startQuiz(sec);
            list.appendChild(btn);
        });
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz(sectionFilter) {
        let pool = sectionFilter === 'all' 
            ? [...allQuestions] 
            : allQuestions.filter(q => q.section === sectionFilter);
        
        if (pool.length === 0) {
            alert('该部分暂无题目');
            return;
        }

        currentQuizQuestions = shuffle(pool).slice(0, 100);
        currentIndex = 0;
        userAnswers = new Array(currentQuizQuestions.length).fill(null);
        seconds = 0;
        
        switchScreen('quizScreen');
        renderQuestion();
        startTimer();
    }

    function startSpecialQuiz() {
        const s6 = allQuestions.filter(q => q.section.includes("第六部分"));
        const s1 = allQuestions.filter(q => q.section.includes("第一部分"));
        const s4 = allQuestions.filter(q => q.section.includes("第四部分"));
        const s5 = allQuestions.filter(q => q.section.includes("第五部分"));

        if (s6.length < 10 || s1.length < 30 || s4.length < 30 || s5.length < 30) {
            alert("题库数量不足，无法生成专属题集");
            return;
        }

        const picked6 = shuffle([...s6]).slice(0, 10);
        const picked1 = shuffle([...s1]).slice(0, 30);
        const picked4 = shuffle([...s4]).slice(0, 30);
        const picked5 = shuffle([...s5]).slice(0, 30);

        currentQuizQuestions = shuffle([...picked6, ...picked1, ...picked4, ...picked5]);
        currentIndex = 0;
        userAnswers = new Array(currentQuizQuestions.length).fill(null);
        seconds = 0;
        
        switchScreen('quizScreen');
        renderQuestion();
        startTimer();
    }

    function startSpecialQuiz() {
        const s6 = allQuestions.filter(q => q.section.includes("第六部分"));
        const s1 = allQuestions.filter(q => q.section.includes("第一部分"));
        const s4 = allQuestions.filter(q => q.section.includes("第四部分"));
        const s5 = allQuestions.filter(q => q.section.includes("第五部分"));

        if (s6.length < 10 || s1.length < 30 || s4.length < 30 || s5.length < 30) {
            alert("题库数量不足，无法生成专属题集");
            return;
        }

        const picked6 = shuffle([...s6]).slice(0, 10);
        const picked1 = shuffle([...s1]).slice(0, 30);
        const picked4 = shuffle([...s4]).slice(0, 30);
        const picked5 = shuffle([...s5]).slice(0, 30);

        currentQuizQuestions = shuffle([...picked6, ...picked1, ...picked4, ...picked5]);
        currentIndex = 0;
        userAnswers = new Array(currentQuizQuestions.length).fill(null);
        seconds = 0;
        
        switchScreen('quizScreen');

    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60).toString().padStart(2, '0');
            const secs = (seconds % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `${mins}:${secs}`;
        }, 1000);
    }

    function renderQuestion() {
        const question = currentQuizQuestions[currentIndex];
        const userAnswer = userAnswers[currentIndex];
        
        document.getElementById('questionNum').innerText = `第 ${currentIndex + 1} / ${currentQuizQuestions.length} 题`;
        document.getElementById('progressBar').style.width = `${((currentIndex + 1) / currentQuizQuestions.length) * 100}%`;
        document.getElementById('questionMeta').innerText = `${question.section} | ${question.header}`;
        document.getElementById('questionText').innerText = question.question;
        
        const optionsList = document.getElementById('optionsList');
        optionsList.innerHTML = '';
        
        question.options.forEach((optText, idx) => {
            const div = document.createElement('div');
            div.className = 'option';
            div.innerText = optText;
            
            // If already answered
            if (userAnswer !== null) {
                div.classList.add('disabled');
                
                // Highlight logic
                const isThisSelected = (userAnswer.selectedIdx === idx);
                const isThisCorrect = isCorrectOption(optText, question);
                
                if (isThisCorrect) {
                    div.classList.add('correct');
                } else if (isThisSelected) {
                    div.classList.add('wrong');
                }
            } else {
                div.onclick = () => selectOption(idx, optText);
            }
            
            optionsList.appendChild(div);
        });

        // Feedback text
        const feedback = document.getElementById('feedback');
        if (userAnswer !== null) {
            if (userAnswer.isCorrect) {
                feedback.innerText = '回答正确！';
                feedback.style.color = 'var(--success-color)';
            } else {
                feedback.innerText = `回答错误！正确答案：${question.answer}`;
                feedback.style.color = 'var(--error-color)';
            }
        } else {
            feedback.innerText = '';
        }

        // Nav buttons
        document.getElementById('prevBtn').disabled = (currentIndex === 0);
        const nextBtn = document.getElementById('nextBtn');
        if (userAnswer !== null) {
            nextBtn.disabled = false;
            nextBtn.classList.add('active');
            nextBtn.innerText = (currentIndex === currentQuizQuestions.length - 1) ? '查看结果' : '下一题';
        } else {
            nextBtn.disabled = true;
            nextBtn.classList.remove('active');
            nextBtn.innerText = '下一题';
        }
    }

    function isCorrectOption(optText, question) {
        if (question.type === 'choice') {
            return optText.trim().startsWith(question.answer.toUpperCase());
        } else {
            return optText.trim() === question.answer.trim();
        }
    }

    function selectOption(idx, optText) {
        const question = currentQuizQuestions[currentIndex];
        const isCorrect = isCorrectOption(optText, question);
        
        userAnswers[currentIndex] = {
            selectedIdx: idx,
            isCorrect: isCorrect
        };
        
        renderQuestion();
    }

    function nextQuestion() {
        if (currentIndex < currentQuizQuestions.length - 1) {
            currentIndex++;
            renderQuestion();
        } else {
            finishQuiz();
        }
    }

    function prevQuestion() {
        if (currentIndex > 0) {
            currentIndex--;
            renderQuestion();
        }
    }

    // --- Search Functionality ---
    function openSearch() {
        switchScreen('searchScreen');
        renderSearchResults(allQuestions);
        document.getElementById('searchInput').value = '';
        document.getElementById('searchStats').innerText = `共加载 ${allQuestions.length} 道题目`;
    }

    function handleSearch() {
        const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!keyword) {
            renderSearchResults(allQuestions);
            document.getElementById('searchStats').innerText = `共加载 ${allQuestions.length} 道题目`;
            return;
        }

        const filtered = allQuestions.filter(q => 
            q.question.toLowerCase().includes(keyword) || 
            q.options.some(opt => opt.toLowerCase().includes(keyword))
        );
        
        renderSearchResults(filtered, keyword);
        document.getElementById('searchStats').innerText = `找到 ${filtered.length} 个匹配项`;
    }

    function renderSearchResults(questions, keyword = '') {
        const container = document.getElementById('searchResults');
        container.innerHTML = '';

        // Virtual scroll/Lazy load for 2000 items is better, but for simplicity let's limit 
        // to avoid browser hang if searching too broad. Showing first 300 for performance.
        const displayLimit = keyword ? questions.length : 100; 
        const displayList = questions.slice(0, displayLimit);

        displayList.forEach(q => {
            const div = document.createElement('div');
            div.className = 'search-item';
            
            let qText = q.question;
            if (keyword) {
                const reg = new RegExp(`(${keyword})`, 'gi');
                qText = qText.replace(reg, '<span class="highlight">$1</span>');
            }

            const optionsHtml = q.options.map(opt => {
                if (keyword) {
                    const reg = new RegExp(`(${keyword})`, 'gi');
                    return `<div>${opt.replace(reg, '<span class="highlight">$1</span>')}</div>`;
                }
                return `<div>${opt}</div>`;
            }).join('');

            div.innerHTML = `
                <div class="q-meta">${q.section} | ${q.header}</div>
                <div class="q-text">${qText}</div>
                <div class="q-options">${optionsHtml}</div>
                <div class="q-answer">正确答案：${q.answer}</div>
            `;
            container.appendChild(div);
        });

        if (questions.length > displayLimit) {
            const more = document.createElement('div');
            more.style.textAlign = 'center';
            more.style.padding = '20px';
            more.style.color = '#888';
            more.innerText = `还有 ${questions.length - displayLimit} 道题未显示，请输入更精确的关键字缩小范围。`;
            container.appendChild(more);
        }
    }

    function confirmEndExam() {
        console.log("Attempting to end exam...");
        const answeredCount = userAnswers.filter(a => a !== null).length;
        const total = currentQuizQuestions.length;
        
        // 兼容性处理：如果 confirm 不可用则直接交卷
        const msg = `你已完成了 ${answeredCount} / ${total} 题，确定要现在交卷吗？`;
        if (typeof confirm !== 'function' || confirm(msg)) {
            finishQuiz();
        }
    }

    function getScoreComment(score) {
        if (score === 100) return "👑 满分！简直是考神附体！";
        if (score >= 90) return "🌟 优秀！基础非常扎实，继续保持！";
        if (score >= 80) return "👍 良好！再加把劲，冲击满分！";
        if (score >= 60) return "👌 及格！建议针对错题加强复习。";
        return "😅 还需要努力哦！多刷几遍题库吧。";
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        switchScreen('resultScreen');
        const correctCount = userAnswers.filter(a => a && a.isCorrect).length;
        
        document.getElementById('totalScore').innerText = correctCount;
        document.getElementById('correctCount').innerText = correctCount;
        document.getElementById('scoreComment').innerText = getScoreComment(correctCount);
    }

    function restartSameQuiz() {
        currentIndex = 0;
        userAnswers = new Array(currentQuizQuestions.length).fill(null);
        seconds = 0;
        switchScreen('quizScreen');
        renderQuestion();
        // Reset timer
        clearInterval(timerInterval);
        startTimer();
    }

    loadData();
