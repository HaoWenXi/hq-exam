内的业务办理网点、地址、联系电话、办公时间和业务范围。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 328, "section": "第一部分 车驾管业务基础知识", "header": "2.2.136", "question": "车辆管理所应当使用互联网交通安全综合服务管理平台或者各地自建平台受理申请人网上提交的申请，验证申请人身份，按规定办理机动车登记业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 329, "section": "第一部分 车驾管业务基础知识", "header": "2.2.137", "question": "申请办理机动车驾驶证业务的，应当如实向车辆管理所提交规定的材料，如实申告规定的事项，并由车辆管理所对其申请材料实质内容的真实性负责。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 330, "section": "第一部分 车驾管业务基础知识", "header": "2.2.138", "question": "车辆管理所办理机动车登记业务和机动车驾驶证业务时，可以依据相 关法律法规认可、使用电子签名、电子印章、电子证照。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 331, "section": "第一部分 车驾管业务基础知识", "header": "2.2.139", "question": "申请注册登记的，机动车所有人应当提交车辆购置税、车船税完税证明或者免税凭证，但法律规定不属于征收范围的除外。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 332, "section": "第一部分 车驾管业务基础知识", "header": "2.2.140", "question": "车辆管理所办理消防车、救护车、工程救险车注册登记时，应当对车 辆的使用性质、标志图案、标志灯具和警报器进行审查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 333, "section": "第一部分 车驾管业务基础知识", "header": "2.2.141", "question": "申请机动车使用性质登记为危险货物运输、公路客运、旅游客运的，车辆管理所应当告知机动车所有人登记后应申请取得相关道路运输许可。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 334, "section": "第一部分 车驾管业务基础知识", "header": "2.2.142", "question": "申请危险货物运输车登记的，机动车所有人应当为单位。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 335, "section": "第一部分 车驾管业务基础知识", "header": "2.2.143", "question": "车辆管理所应当会同有关部门在具备条件的摩托车销售企业推行摩托 车带牌销售，方便机动车所有人购置车辆、投保保险、缴纳税款、注册登记一站式办理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 336, "section": "第一部分 车驾管业务基础知识", "header": "2.2.144", "question": "机动车未经国务院机动车产品主管部门许可生产或者未经国家进口机 动车主管部门许可进口的，不予办理注册登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 337, "section": "第一部分 车驾管业务基础知识", "header": "2.2.145", "question": "小型、微型载客汽车因改变车身颜色申请变更登记，车辆不在登记地 的，可以向车辆所在地车辆管理所提出申请。车辆所在地车辆管理所 应当按规定查验机动车，审查提交的证明、凭证，按规定核发行驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 338, "section": "第一部分 车驾管业务基础知识", "header": "2.2.146", "question": "机动车所有人的住所迁出车辆管理所管辖区域的，转出地车辆管理所 应当自受理之日起三日内，在机动车登记证书上签注变更事项，收回 号牌、行驶证，核发有效期为三十日的临时行驶车号牌，将机动车档 案交机动车所有人。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 339, "section": "第一部分 车驾管业务基础知识", "header": "2.2.147", "question": "属于小型、微型载客汽车或者摩托车机动车所有人的住所迁出车辆管 理所管辖区域的，应当向转入地车辆管理所申请变更登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 340, "section": "第一部分 车驾管业务基础知识", "header": "2.2.148", "question": "同一机动车三年内可以互换变更一次机动车号牌号码。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 341, "section": "第一部分 车驾管业务基础知识", "header": "2.2.149", "question": "小型、微型载客汽车加装车顶行李架，换装不同式样散热器面罩、保 险杠、轮毂的，不得改变车身主体结构且应保证安全，换装轮毂的不 得改变轮胎规格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 342, "section": "第一部分 车驾管业务基础知识", "header": "2.2.150", "question": "申请变更备案，属于小型、微型自动挡载客汽车加装、拆除、更换肢 体残疾人操纵辅助装置的，在安全技术检验有效期内，机动车所有人 不需要提交机动车安全技术检验合格证明。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 343, "section": "第一部分 车驾管业务基础知识", "header": "2.2.151", "question": "已注册登记的机动车所有权发生转让的，现机动车所有人应当自机动 车交付之日起三十日内向登记地车辆管理所申请转让登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 344, "section": "第一部分 车驾管业务基础知识", "header": "2.2.152", "question": "车辆管理所办理转让登记时，现机动车所有人住所不在车辆管理所管 辖区域内的，转出地车辆管理所应当自受理之日起三日内，查验机动 车，核对车辆识别代号拓印膜或者电子资料，审查提交的证明、凭证， 收回号牌、行驶证，在机动车登记证书上签注转让和变更事项，核发 有效期为三十日的临时行驶车号牌，制作上传机动车电子档案资料。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 345, "section": "第一部分 车驾管业务基础知识", "header": "2.2.153", "question": "小型、微型载客汽车或者摩托车在转入地交易的，现机动车所有人应 当向转入地车辆管理所申请转让登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 346, "section": "第一部分 车驾管业务基础知识", "header": "2.2.154", "question": "参加公安机关交通管理部门组织的交通安全公益活动的，满一小时为 一次，一次扣减1分。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 347, "section": "第一部分 车驾管业务基础知识", "header": "2.2.155", "question": "二手车出口企业收购机动车的，车辆管理所应当自受理之日起三日内， 查验机动车，核对车辆识别代号拓印膜或者电子资料，审查提交的证 明、凭证，在机动车登记证书上签注转让待出口事项，收回号牌、行 驶证，核发有效期不超过三十日的临时行驶车号牌。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 348, "section": "第一部分 车驾管业务基础知识", "header": "2.2.156", "question": "在机动车抵押登记期间，申请因质量问题更换整车变更登记、机动车 迁出迁入、共同所有人变更或者补领、换领机动车登记证书的，应当 由机动车所有人和抵押权人共同申请。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 349, "section": "第一部分 车驾管业务基础知识", "header": "2.2.157", "question": "机动车抵押、解除抵押信息实现与有关部门或者金融机构等联网核查 的，申请人免予提交相关证明、凭证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 350, "section": "第一部分 车驾管业务基础知识", "header": "2.2.158", "question": "申请人因机动车灭失办理注销登记的，应当书面承诺因自然灾害、失 火、交通事故等导致机动车灭失，并承担不实承诺的法律责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 351, "section": "第一部分 车驾管业务基础知识", "header": "2.2.159", "question": "机动车在抵押登记、质押备案期间的，不予办理注销登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 352, "section": "第一部分 车驾管业务基础知识", "header": "2.2.160", "question": "申请使用原机动车号牌号码应当将涉及原机动车的道路交通安全违法 行为和交通事故处理完毕。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 353, "section": "第一部分 车驾管业务基础知识", "header": "2.2.161", "question": "属于机动车进行科研、定型试验申领临时行驶车号牌时，机动车所有 人提交的安全技术检验证明可以由机动车制造厂出具。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 354, "section": "第一部分 车驾管业务基础知识", "header": "2.2.162", "question": "公安机关交通管理部门应当使用统一的号牌管理信息系统制作、发放、 收回、销毁机动车号牌和临时行驶车号牌。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 355, "section": "第一部分 车驾管业务基础知识", "header": "2.2.163", "question": "补领、换领机动车号牌后，原机动车号牌未灭失、丢失或者损毁的， 可以继续使用。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 356, "section": "第一部分 车驾管业务基础知识", "header": "2.2.164", "question": "申请补领机动车登记证书的，机动车所有人应当交验机动车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 357, "section": "第一部分 车驾管业务基础知识", "header": "2.2.165", "question": "公安机关交通管理部门应当实行机动车检验合格标志电子化，在核发 检验合格标志的同时，发放检验合格标志电子凭证。检验合格标志电 子凭证与纸质检验合格标志具有同等效力。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 358, "section": "第一部分 车驾管业务基础知识", "header": "2.2.166", "question": "专用校车应当自注册登记之日起每年进行一次安全技术检验", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 359, "section": "第一部分 车驾管业务基础知识", "header": "2.2.167", "question": "直辖市、设区的市公安机关交通管理部门应当加强对县级公安机关交 通管理部门办理机动车登记及相关业务的指导、培训和监督管理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 360, "section": "第一部分 车驾管业务基础知识", "header": "2.2.168", "question": "机动车销售企业、二手车交易市场、机动车安全技术检验机构、报废 机动车回收企业和邮政、金融机构、保险机构等单位，经公安机关交 通管理部门委托可以设立机动车登记服务站，在公安机关交通管理部 门监督管理下协助办理机动车登记及相关业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 361, "section": "第一部分 车驾管业务基础知识", "header": "2.2.169", "question": "公安机关交通管理部门应当建立机动车登记服务站监督管理制度，明 确设立条件、业务范围、办理要求、信息系统安全等规定，签订协议 及责任书，通过业务抽查、网上巡查、实地检查、业务回访等方式加 强对机动车登记服务站协助办理业务情况的监督管理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 362, "section": "第一部分 车驾管业务基础知识", "header": "2.2.170", "question": "公安机关交通管理部门在核发机动车检验合格标志时，发现机动车安 全技术检验机构存在为未经检验的机动车出具检验合格证明、伪造或 者篡改检验数据等出具虚假检验结果行为的，停止认可其出具的检验 合格证明，依法进行处罚，并通报市场监督管理部门；构成犯罪的， 依法追究相关责任人员刑事责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 363, "section": "第一部分 车驾管业务基础知识", "header": "2.2.171", "question": "车辆管理所应当对机动车查验过程进行全程录像，没有使用录像设备 的，查验员应当报请业务领导同意后，使用执勤执法记录仪记录查验 过程。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 364, "section": "第一部分 车驾管业务基础知识", "header": "2.2.172", "question": "车辆管理所发现申请人通过互联网办理机动车登记及相关业务存在违 法违规嫌疑情形的，应当转为现场办理，当场审查申请材料，及时开 展调查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 365, "section": "第一部分 车驾管业务基础知识", "header": "2.2.173", "question": "车辆管理所发现申请人通过互联网办理驾驶证补证、换证等业务存在 违法违规嫌疑情形的，应当将申请人列入黑名单，停止其再办理互联 网业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 366, "section": "第一部分 车驾管业务基础知识", "header": "2.2.174", "question": "公安机关交通管理部门及其交通警察、警务辅助人员办理机动车登记 工作，应当接受监察机关、公安机关督察审计部门等依法实施的监督， 并应当自觉接受社会和公民的监督。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 367, "section": "第一部分 车驾管业务基础知识", "header": "2.2.175", "question": "对发现申请人通过机动车虚假交易、以合法形式掩盖非法目的等手段， 在机动车登记业务中牟取不正当利益的，公安机关交通管理部门不予 受理或者不予登记，处五百元以下罚款；申请人在一年内不得再次申 请机动车登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 368, "section": "第一部分 车驾管业务基础知识", "header": "2.2.176", "question": "以欺骗、贿赂等不正当手段办理补、换领机动车登记证书、号牌、行 驶证和检验合格标志等业务的，由公安机关交通管理部门处警告或者 二百元以下罚款。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 369, "section": "第一部分 车驾管业务基础知识", "header": "2.2.177", "question": "对机动车所有人因死亡、出境、重病、伤残或者不可抗力等原因不能 到场申请机动车登记和业务的,可以凭相关证明委托代理人代理申请， 或者由继承人申请。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 370, "section": "第一部分 车驾管业务基础知识", "header": "2.2.178", "question": "公安机关交通管理部门应当实行机动车登记档案电子化，机动车电子 档案与纸质档案具有同等效力。车辆管理所对办理机动车登记时不需 要留存原件的证明、凭证，应当以电子文件形式归档。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 371, "section": "第一部分 车驾管业务基础知识", "header": "2.2.179", "question": "商业银行、汽车金融公司申请办理抵押登记业务的，其提交的营业执 照，可以是加盖公章的营业执照复印件；", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 372, "section": "第一部分 车驾管业务基础知识", "header": "2.2.180", "question": "属于在户籍地以外办理小型、微型非营运载客汽车注册登记的，机动 车所有人免予提交公安机关核发的居住证明或者居住登记证明。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 373, "section": "第一部分 车驾管业务基础知识", "header": "2.2.181", "question": "监察机关、人民法院、人民检察院或者行政执法机关依法扣留、没收 并拍卖的未注册登记的国产机动车，未能提供出厂合格证明的，可以凭 监察机关、人民法院、人民检察院或者行政执法机关出具的证明替代。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 374, "section": "第一部分 车驾管业务基础知识", "header": "2.2.182", "question": "县级公安机关交通管理部门车辆管理所可以办理本行政区域内除大型 客车、重型牵引挂车、城市公交车、中型客车、大型货车准驾车型以 外的其他机动车驾驶证业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 375, "section": "第一部分 车驾管业务基础知识", "header": "2.2.183", "question": "车辆管理所办理机动车驾驶证业务，应当遵循严格、公开、公正、便 民的原则。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 376, "section": "第一部分 车驾管业务基础知识", "header": "2.2.184", "question": "持有轻便摩托车F准驾车型的驾驶人准予驾驶轻便正三轮摩托车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 377, "section": "第一部分 车驾管业务基础知识", "header": "2.2.185", "question": "申请小型汽车、小型自动挡汽车、残疾人专用小型自动挡载客汽车、 轻便摩托车准驾车型的，年龄应在18周岁以上、70周岁以下。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 378, "section": "第一部分 车驾管业务基础知识", "header": "2.2.186", "question": "有听力障碍但佩戴助听设备能够达到两耳分别距音叉50厘米能辨别声 源方向的，可以申请除大型客车、重型牵引挂车、城市公交车、中型 客车、大型货车准驾车型以外的其他机动车驾驶证。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 379, "section": "第一部分 车驾管业务基础知识", "header": "2.2.187", "question": "年龄在70周岁以上能够通过记忆力、判断力、反应力等能力测试的， 可以申请小型汽车、小型自动挡汽车、残疾人专用小型自动挡载客汽 车、轻便摩托车准驾车型的机动车驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 380, "section": "第一部分 车驾管业务基础知识", "header": "2.2.188", "question": "三年内有代替他人参加机动车驾驶人考试行为的，不得申请机动车驾 驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 381, "section": "第一部分 车驾管业务基础知识", "header": "2.2.189", "question": "内地居民持有境外机动车驾驶证，符合《机动车驾驶证申领和使用规 定》的申请条件，且取得该驾驶证时在核发国家或者地区一年内累计 居留九十日以上的，可以申请对应准驾车型的机动车驾驶证；非内地 居民不受居留期限的限制。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 382, "section": "第一部分 车驾管业务基础知识", "header": "2.2.190", "question": "公安机关交通管理部门已经实现与医疗机构等单位联网核查的，申请 人免予提交身体条件证明等证明、凭证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 383, "section": "第一部分 车驾管业务基础知识", "header": "2.2.191", "question": "车辆管理所对申请人的申请条件及提交的材料、申告的事项有疑义的， 可以对实质内容进行调查核实。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 384, "section": "第一部分 车驾管业务基础知识", "header": "2.2.192", "question": "持有轻型牵引挂车准驾车型的机动车驾驶证准予驾驶总质量小于（不 包含等于）4500kg的轻型、微型挂车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 385, "section": "第一部分 车驾管业务基础知识", "header": "2.2.193", "question": "已持有大型客车、重型牵引挂车、城市公交车、中型客车、大型货车、 小型汽车、小型自动挡汽车准驾车型驾驶证的机动车驾驶人身体条件 发生变化，不符合所持机动车驾驶证准驾车型的条件，但符合残疾人 专用小型自动挡载客汽车准驾车型条件，申请变更的，应当考试科目 二和科目三。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 386, "section": "第一部分 车驾管业务基础知识", "header": "2.2.194", "question": "残疾人专用小型自动挡载客汽车科目二考试内容包括倒车入库、坡道 定点停车和起步、侧方停车、曲线行驶、直角转弯。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 387, "section": "第一部分 车驾管业务基础知识", "header": "2.2.195", "question": "不进行夜间考试的，应当进行模拟夜间灯光考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 388, "section": "第一部分 车驾管业务基础知识", "header": "2.2.196", "question": "车辆管理所应当根据驾驶培训主管部门提供的信息对驾驶培训机构教 练员、教练车、训练场地等情况进行备案。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 389, "section": "第一部分 车驾管业务基础知识", "header": "2.2.197", "question": "公安机关交通管理部门应当对社会考场的场地设施、考试系统、考试 工作等进行统一管理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 390, "section": "第一部分 车驾管业务基础知识", "header": "2.2.198", "question": "直辖市、设区的市或者相当于同级的公安机关交通管理部门发现驾驶 培训机构及其教练员存在缩短培训学时、减少培训项目以及贿赂考试 员、以承诺考试合格等名义向学员索取财物、参与违规办理驾驶证或 者考试舞弊行为的，应当停止该驾驶培训机构的学员报考，并列入黑 名单且向社会公布。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 391, "section": "第一部分 车驾管业务基础知识", "header": "2.2.199", "question": "申请人考试合格后，应当接受不少于半小时的交通安全文明驾驶常识 和交通事故案例警示教育，并参加领证宣誓仪式。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 392, "section": "第一部分 车驾管业务基础知识", "header": "3.1.1", "question": "开展机动车登记查验大检查,包括_____。", "options": ["A、检查查验工作规范化建设情况", "B、检查查验监管制度落实情况", "C、排查重点车辆登记查验情况", "D、以上都包括"], "answer": "D", "type": "choice"}, {"id": 393, "section": "第一部分 车驾管业务基础知识", "header": "3.1.2", "question": "开展机动车检验和驾驶培训隐患排查，包括_____。", "options": ["A、联合开展机动车检验大排查", "B、联合开展驾驶培训大排查", "C、联合开展重点车辆隐患大排查", "D、以上都包括"], "answer": "D", "type": "choice"}, {"id": 394, "section": "第一部分 车驾管业务基础知识", "header": "3.1.3", "question": "公安机关交通管理部门对检验机构监督的方式不包括_____。", "options": ["A、联网核查机动车安全技术检验数据", "B、现场抽查安全技术检验过程", "C、派驻民警现场管理", "D、核查阅原始检验记录和报告"], "answer": "C", "type": "choice"}, {"id": 395, "section": "第一部分 车驾管业务基础知识", "header": "3.1.4", "question": "在实行6年以内的6座以下非营运小微型客车免检基础上，进一步扩大 免检范围，将6年以内的7-9座非营运小微型客车纳入免检范围,但_____除外。", "options": ["A、对于车辆发生过造成人员伤亡的交通事故或者非法改装被依法处罚的", "B、面包车", "C、自车辆出厂之日起，超过4年未办理注册登记手续的", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 396, "section": "第一部分 车驾管业务基础知识", "header": "3.1.5", "question": "驾驶人通过“交管12123”APP可以查询、下载_____交通责任事故、准 驾车型变化、交通违法和记满分等记录，方便其在申请道路运输从业资 格证件、工作应聘等生产生活中出示、使用交通安全记录电子凭证。", "options": ["A、近一年", "B、近二年", "C、近三年", "D、初次领证以后"], "answer": "C", "type": "choice"}, {"id": 397, "section": "第一部分 车驾管业务基础知识", "header": "3.1.6", "question": "校车是指用于有组织地接送3周岁以上学龄前幼儿或接受义务教育的学生上下学的_____以上的载客汽车。", "options": ["A、5座", "B、7座", "C、9座", "D、19座"], "answer": "B", "type": "choice"}, {"id": 398, "section": "第一部分 车驾管业务基础知识", "header": "3.1.7", "question": "下列不属于《机动车强制报废标准规定》制定依据的是_____。", "options": ["A、《中华人民共和国道路交通安全法》及其实施条例", "B、《中华人民共和国公路法》", "C、《中华人民共和国大气污染防治法》", "D、《中华人民共和国噪声污染防治法》"], "answer": "B", "type": "choice"}, {"id": 399, "section": "第一部分 车驾管业务基础知识", "header": "3.1.8", "question": "国务院机动车产品主管部门是指_____。", "options": ["A、公安部", "B、发展和改革委员会", "C、工业和信息化部", "D、市场监督管理总局"], "answer": "C", "type": "choice"}, {"id": 400, "section": "第一部分 车驾管业务基础知识", "header": "3.1.9", "question": "车辆管理所等级评定是公安交管部门_____的重要载体。", "options": ["A、推进“放管服”改革", "B、做好交通事故预防“减量控大”工作", "C、加强车辆管理所规范化建设", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 401, "section": "第一部分 车驾管业务基础知识", "header": "3.1.10", "question": "公路客车、旅游客车和校车的_____不允许装用翻新的轮胎。", "options": ["A、前轮", "B、后轮", "C、所有车轮", "D、转向轮"], "answer": "C", "type": "choice"}, {"id": 402, "section": "第一部分 车驾管业务基础知识", "header": "3.1.11", "question": "以下不属于互联网交通安全综合服务管理平台组成部分的是_____。", "options": ["A、手机APP", "B、短信", "C、微信", "D、语音服务平台"], "answer": "C", "type": "choice"}, {"id": 403, "section": "第一部分 车驾管业务基础知识", "header": "3.1.12", "question": "评定为一等车辆管理所，考评分值必须达到_____分以上。", "options": ["A、80", "B、85", "C、90", "D、95"], "answer": "C", "type": "choice"}, {"id": 404, "section": "第一部分 车驾管业务基础知识", "header": "3.1.13", "question": "考评分值不足60分的，评定为_____车辆管理所。", "options": ["A、二等", "B、三等", "C、四等", "D、等外"], "answer": "D", "type": "choice"}, {"id": 405, "section": "第一部分 车驾管业务基础知识", "header": "3.1.14", "question": "对地市车辆管理所进行等级评定时，_____为该地市的县级车辆管理所的考评分值。", "options": ["A、辖区内所有县级车辆管理所所得分值的平均值", "B、辖区内县级车辆管理所的最高分值", "C、随机选定辖区内2个县级车辆管理所，所得分值的平均值，", "D、辖区内得分最高的2个县级车辆管理所，所得分值的平均值"], "answer": "C", "type": "choice"}, {"id": 406, "section": "第一部分 车驾管业务基础知识", "header": "3.1.15", "question": "地市车辆管理所等级评定的最终得分为县级车辆管理所与地市车辆管理所考评分值分别按_____的比例相加。", "options": ["A、30%和70%", "B、40%和60%", "C、50%和50%", "D、60%和40%"], "answer": "B", "type": "choice"}, {"id": 407, "section": "第一部分 车驾管业务基础知识", "header": "3.1.16", "question": "机动车驾驶证、临时机动车驾驶许可工本费为每本_____。", "options": ["A、免费", "B、10元", "C、15元", "D、20元"], "answer": "B", "type": "choice"}, {"id": 408, "section": "第一部分 车驾管业务基础知识", "header": "3.1.17", "question": "汽车、挂车、低速车和摩托车号牌工本费分别为每车_____。", "options": ["A、80元、35元、50元、40元", "B、100元、50元、40元、35元", "C、100元、50元、70元、40元", "D、100元、40元、35元、50元"], "answer": "B", "type": "choice"}, {"id": 409, "section": "第一部分 车驾管业务基础知识", "header": "3.1.18", "question": "网络预约出租汽车的安全技术检验，自注册登记之日起，_____。", "options": ["A、5年以内每年检验1次；超过5年的，每6个月检验1次", "B、10年以内每年检验1次；超过10年的，每6个月检验1次", "C、6年以内每2年检验1次；超过6年的，每年检验1次；超过15年的，每6个月检验1次", "D、每年检验1次"], "answer": "A", "type": "choice"}, {"id": 410, "section": "第一部分 车驾管业务基础知识", "header": "3.1.19", "question": "_____是我国机动车国家安全技术标准的重要组成部分，是进行注册登记检验和在用机动车检验、机动车查验等机动车运行安全管理及事故车检验的最基本的技术标准，同时也是我国机动车新车定型强制性检验、新车出厂检验及进口机动车检验的重要技术依据之一。", "options": ["A、《机动车查验工作规程》（GA801）", "B、《机动车安全技术检验项目和方法》（GB38900）", "C、《机动车运行安全技术条件》（GB7258）", "D、《汽车、挂车及汽车列车外廓尺寸、轴荷及质量限值》（GB1589）"], "answer": "C", "type": "choice"}, {"id": 411, "section": "第一部分 车驾管业务基础知识", "header": "3.1.20", "question": "新能源汽车专用号牌中，字母\"D\"代表_____。", "options": ["A、纯电动汽车", "B、插电式混合动力汽车", "C、燃料电池汽车", "D、非纯电动汽车"], "answer": "A", "type": "choice"}, {"id": 412, "section": "第一部分 车驾管业务基础知识", "header": "3.1.21", "question": "部局《关于开展车驾管业务监管工作大检查的通知》要求总队、支队建立_____落实专门机构或专人负责，对车驾管业务进行综合监管，", "options": ["A、车驾管业务监控中心", "B、车驾管业务监管中心", "C、车驾管数据分析中心", "D、车驾管业务研判中心"], "answer": "B", "type": "choice"}, {"id": 413, "section": "第一部分 车驾管业务基础知识", "header": "3.1.22", "question": "要严格按照法律法规、国家标准和《公告》办理机动车登记，对申请大型双层客车注册登记的，严格审查所有人是否具备从事_____资质。", "options": ["A、客运", "B、公交客运", "C、公路客运", "D、旅游客运"], "answer": "B", "type": "choice"}, {"id": 414, "section": "第一部分 车驾管业务基础知识", "header": "3.1.23", "question": "_____是道路运输车辆动态监控的责任主体。", "options": ["A、道路运输企业", "B、道路运输管理机构", "C、公安机关交通管理部门", "D、安全监管部门"], "answer": "A", "type": "choice"}, {"id": 415, "section": "第一部分 车驾管业务基础知识", "header": "3.1.24", "question": "《道路运输车辆动态监督管理办法》所称道路运输车辆，不包括_____。", "options": ["A、公路营运的载客汽车", "B、校车", "C、危险货物运输车辆", "D、重型载货汽车"], "answer": "B", "type": "choice"}, {"id": 416, "section": "第一部分 车驾管业务基础知识", "header": "3.1.25", "question": "道路旅客运输企业、道路危险货物运输企业和拥有_____及以上重型载货汽车或者重型牵引挂车的道路货物运输企业应当按照标准建设道路运输车辆动态监控平台，或使用符合条件的社会化卫星定位系统监控平台，对所属道路运输车辆和驾驶员运行过程进行实时监控和管理。", "options": ["A、50辆", "B、100辆", "C、150辆", "D、200辆"], "answer": "A", "type": "choice"}, {"id": 417, "section": "第一部分 车驾管业务基础知识", "header": "3.1.26", "question": "以下不属于《机动车查验工作规程》（GA801-2019）对乘用车允许的情形是______。", "options": ["A、加装车顶行李架", "B、加装尾翼", "C、换装散热器面罩和/或保险杠", "D、更换轮毂"], "answer": "B", "type": "choice"}, {"id": 418, "section": "第一部分 车驾管业务基础知识", "header": "3.1.27", "question": "关于一窗通办，下列________是不正确的:", "options": ["A、业务受理、缴费、证件制作在一个窗口完成；", "B、群众在一个窗口即可办结业务；", "C、对于现金缴费的，为保证规费资金安全，设立专门的缴费窗口排队缴费；", "D、对于证件制作量较大的地方，可以设立单独的领证窗口；"], "answer": "C", "type": "choice"}, {"id": 419, "section": "第一部分 车驾管业务基础知识", "header": "3.1.28", "question": "车辆管理所在拓展业务办理渠道中，下面______不正确：", "options": ["A、在汽车销售企业、二手车市场等社会机构设立登记服务站，拓展服务网点", "B、在邮政网点设立服务网点，推行邮政代办交管业务", "C、在车辆管理所设置自助服务区，引导群众通过自助设备办理业务", "D、推行补换牌证业务网上办理，服务网点窗口不予受理。"], "answer": "D", "type": "choice"}, {"id": 420, "section": "第一部分 车驾管业务基础知识", "header": "3.1.29", "question": "应该评定为等外车辆管理所的有以下情形_____。", "options": ["A、存在民警、警务辅助人员及工作人员因违规办理车驾管业务构成犯罪，被追究刑事责任的", "B、存在严重违规办理业务问题，造成社会影响恶劣，被媒体曝光的", "C、经对发生一次死亡5人以上较大道路交通事故进行深度调查，发现车辆管理所涉及违法办理机动车登记、驾驶人考试等业务", "D、以上都包括"], "answer": "D", "type": "choice"}, {"id": 421, "section": "第一部分 车驾管业务基础知识", "header": "3.1.30", "question": "以下不属于公安交管\"放管服\"措施的\"一证办\"业务的是_____。", "options": ["A、驾驶证遗失补证", "B、申请增加准驾车型", "C、换领机动车登记证书", "D、补领机动车登记证书"], "answer": "C", "type": "choice"}, {"id": 422, "section": "第一部分 车驾管业务基础知识", "header": "3.1.31", "question": "开展车驾管业务常态化练兵、_____是交警系统实战大练兵的重要内容，是认真落实道路交通事故预防“减量控大”要求、把好车辆和驾驶人准入关、加强车驾管队伍规范化专业化的重要措施。", "options": ["A、每日一考", "B、每周一考", "C、每月一考", "D、每年一考"], "answer": "C", "type": "choice"}, {"id": 423, "section": "第一部分 车驾管业务基础知识", "header": "3.1.32", "question": "车辆管理所等级评定工作应当采取暗访检查、_____等方式开展。", "options": ["A、数据检测", "B、档案抽查", "C、业务考试", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 424, "section": "第一部分 车驾管业务基础知识", "header": "3.1.33", "question": "公安机关交通管理部门有举办或者参与举办驾驶培训机构，或公安机关交通管理部门工作人员及其配偶、子女有经营或者参与经营驾驶培训机构，或_____，为等外车辆管理所。", "options": ["A、强制要求考生进行考前训练的", "B、人工指定或者按驾校分组、分配考试车辆和路线的", "C、存在参与组织考试舞弊或对考试舞弊行为不予制止的", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 425, "section": "第一部分 车驾管业务基础知识", "header": "3.1.34", "question": "_____，为等外车辆管理所。", "options": ["A、因信息安全管理不到位，造成交管信息泄露，导致严重后果的", "B、变相强制群众选择邮寄号牌、购买号牌板架的", "C、变相强制群众选择邮寄驾驶证、强制拍摄驾驶证照片并收取费用的，", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 426, "section": "第一部分 车驾管业务基础知识", "header": "3.1.35", "question": "车辆管理所等级评定的考评项目包括机动车规范化管理、驾驶人规范化管理、_____和其他工作。", "options": ["A、提升车驾管服务群众水平", "B、加强车驾管业务监督管理", "C、教育培训及警务保障", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 427, "section": "第一部分 车驾管业务基础知识", "header": "3.1.36", "question": "各地要进一步提高认识，高度重视车检机构信息安全工作，加强分析研 判，强化日常监管，及时化解风险隐患。严明制度规定。要进一步细化 适用于车检机构的网络安全、接口访问、数据使用等制度规定，特别要 明确_____，明确违规惩戒追责措施。", "options": ["A、严禁违规将检测线专网直连互联网", "B、严禁挪用共用授予车检业务系统的授权接口", "C、严禁非车辆安检需求下查询使用交管信息", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 428, "section": "第一部分 车驾管业务基础知识", "header": "3.1.37", "question": "_____以上老年人可使用亲友的“交管12123”APP账号，由亲友代办网 上机动车牌证、驾驶证业务。", "options": ["A、60周岁", "B、65周岁", "C、70周岁", "D、80周岁"], "answer": "A", "type": "choice"}, {"id": 429, "section": "第一部分 车驾管业务基础知识", "header": "3.1.38", "question": "在办理机动车登记、核发检验合格标志业务时，启用除_____以外车型的 机动车交强险信息在线核查，核查到交强险信息的，群众可以免予提交 交强险、车船税纸质凭证。", "options": ["A、摩托车", "B、低速载货汽车", "C、三轮汽车", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 430, "section": "第一部分 车驾管业务基础知识", "header": "3.1.39", "question": "从严强化机动车和驾驶人准入。深入推进机动车登记查验和驾驶人考试 集中整治，全面推广车驾管业务监管系统，_____。", "options": ["A、严格落实机动车查验规范标准，严禁为“大吨小标”、非法改装等隐患车辆办理登记", "B、配合交通运输部门加强驾驶培训机构监管，深入推进交通安全进驾校，依法严肃查处各类违法违规培训行为", "C、强化三轮摩托车“带牌销售”监管，规范县级车管所业务办理", "D、以上都是"], "answer": "D", "type": "choice"}, {"id": 431, "section": "第一部分 车驾管业务基础知识", "header": "3.2.1", "question": "公安机关交通管理部门在监督管理工作中发现检验机构数量不足造成群众验车不便的，要书面通报市场监督管理部门，并层报公安部。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 432, "section": "第一部分 车驾管业务基础知识", "header": "3.2.2", "question": "符合六年内免检政策的车辆，无需申请领取检验标志。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 433, "section": "第一部分 车驾管业务基础知识", "header": "3.2.3", "question": "要通过增设牌证办理点、简化办理程序、推行电动自行车\"带牌销售\"等方式，为群众办理电动自行车登记提供便利。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 434, "section": "第一部分 车驾管业务基础知识", "header": "3.2.4", "question": "车辆管理所在办理机动车登记业务过程中，应当对机动车档案资料实行 电子化管理，并加快推进已登记机动车档案资料的电子化管理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 435, "section": "第一部分 车驾管业务基础知识", "header": "3.2.5", "question": "公安机关交通管理部门、市场监管部门要每季度相互通报对检验机构检验工作的监督检查情况，密切协作配合，共同做好对检验机构的监管工作。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 436, "section": "第一部分 车驾管业务基础知识", "header": "3.2.6", "question": "公安交管部门要会同市场监管部门督促检验机构优化检验工作流程，推行预约检验服务模式。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 437, "section": "第一部分 车驾管业务基础知识", "header": "3.2.7", "question": "公安交管部门要商市场监管部门明确检验机构清理非法中介的管理职责，对秩序混乱、非法中介扰民问题突出的，要严格追究责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 438, "section": "第一部分 车驾管业务基础知识", "header": "3.2.8", "question": "公安交管部门要联合治安部门开展检验机构非法中介整治行动，发现违反治安管理行为的，要按照《治安管理处罚法》予以查处，构成犯罪的，要追究刑事责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 439, "section": "第一部分 车驾管业务基础知识", "header": "3.2.9", "question": "注册登记查验时，对发现的违规嫌疑机动车产品，车辆管理所应在告知提醒机动车所有人依法维权的同时做好取证工作，在计算机系统中详细记录相关信息及违规原因初步调查等信息，制作《违规嫌疑机动车产品通报表》，向当地市场监督管理部门、工业和信息化部门（国产机动车）、检验检疫部门（进口机动车）通报并通过网络逐级上报至省级公安机关交通管理部门。省级公安机关交通管理部门应定期组织审核后上报至公安部交通管理局。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 440, "section": "第一部分 车驾管业务基础知识", "header": "3.2.10", "question": "各地要严格落实《机动车查验工作规范》《机动车查验工作规程》（GA801） 等规定，认真核对安全技术检验合格报告与《公告》、合格证记载的整备 质量数值，规范轻型货车等重点车辆登记查验，严禁为“大吨小标”货 车办理登记。对外观与《公告》明显不符、整备质量存在严重违规嫌疑 的，要及时启动深度调查，落实违规机动车产品信息通报和上报要求； 对违法违规办理登记、检验的，要依法严格追究责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 441, "section": "第一部分 车驾管业务基础知识", "header": "3.2.11", "question": "全面推行汽车销售企业代办临牌和网上发放临牌，为企业申领牌证提供 高效便捷服务；对汽车销售企业通过互联网交通安全综合服务管理平台 申领未销售车辆临牌的，需要采集、审查机动车销售发票。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 442, "section": "第一部分 车驾管业务基础知识", "header": "3.2.12", "question": "临时行驶车号牌应粘贴在车内前风窗玻璃的左下角或右下角不影响驾驶人视线的位置。载客汽车的另一张应粘贴在车内后风窗玻璃左下角。没有风窗玻璃的机动车，临时行驶车号牌应随车携带。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 443, "section": "第一部分 车驾管业务基础知识", "header": "3.2.13", "question": "消费者丢失机动车销售统一发票，无法办理机动车注册登记的，应向销售方申请重新开具机动车销售统一发票。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 444, "section": "第一部分 车驾管业务基础知识", "header": "3.2.14", "question": "各地对专门用于试驾车辆，督促销售企业办理机动车登记、申领机动车 牌证，并在车辆两侧及后部粘贴或者喷涂试乘试驾车辆字样标识。对临 时用于试驾车辆，应当按照规定购买交通事故责任强制保险，申领临时 行驶车号牌，并粘贴试乘试驾车辆字样标识。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 445, "section": "第一部分 车驾管业务基础知识", "header": "3.2.15", "question": "根据公安部关于加强吸毒人员驾驶机动车管理的通知要求，对大中型客货车和出租车驾驶人因吸毒成瘾未戒除注销驾驶证的，要通报道路运输管理机构和运输企业，取消其营运资格。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 446, "section": "第一部分 车驾管业务基础知识", "header": "3.2.16", "question": "公安机关交通管理部门在协助监察机关办理机动车登记时，不对监察文书和协助执行通知书进行实体审查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 447, "section": "第一部分 车驾管业务基础知识", "header": "3.2.17", "question": "从事机动车安全技术检验审核的工作人员应具备相应机动车车型的查验员资格，其负责人应为民警查验员。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 448, "section": "第一部分 车驾管业务基础知识", "header": "3.2.18", "question": "车辆管理所在办理大客车\"营转非\"业务时，对符合办理条件的，必须消除车辆外观营运标识，粘贴和喷涂统一的专用标识。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 449, "section": "第一部分 车驾管业务基础知识", "header": "3.2.19", "question": "公安交通管理部门在办理小微型面包车注册登记业务时，要严格车辆查验，对主要特征和技术参数不符合国家标准，或与《公告》数据不一致的，应当由生产厂家出具责任承诺后，才可以办理注册登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 450, "section": "第一部分 车驾管业务基础知识", "header": "3.2.20", "question": "各地要加强三轮摩托车登记查验把关，严格比对《公告》，严格按规定查 验发动机型号、外廓尺寸、货箱、轮胎规格等重点项目，存在违规生产、 非法改装等问题的，一律不得办理注册登记。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 451, "section": "第一部分 车驾管业务基础知识", "header": "3.2.21", "question": "对超过6年不满10年的非营运小微型客车（面包车除外），检验周期由 每年检验1次放宽至每两年检验1次，享受免检政策的车辆应按规定购 买交强险、缴纳车船税，并申领检验标志。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 452, "section": "第一部分 车驾管业务基础知识", "header": "3.2.22", "question": "在办理摩托车注册登记时，要严格查验是否按规定配备安全头盔，对未按规定配备的，应当由机动车所有人做出承诺后，才可以办理注册登记。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 453, "section": "第一部分 车驾管业务基础知识", "header": "3.2.23", "question": "对临近60周岁（56周岁以上）人员申请考领AB类驾驶证的，需要书面 告知申请人达到60周岁的将注销相应准驾车型驾驶证，提示慎重考领增 驾，书面告知书经申请人签字后存档。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 454, "section": "第一部分 车驾管业务基础知识", "header": "3.2.24", "question": "车辆管理所办理机动车登记、核发驾驶证业务时，应当准确采集机动车和驾驶人信息，逐一核实机动车所有人和驾驶人电话号码、联系地址等信息，确保新录入基础数据信息准确有效。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 455, "section": "第一部分 车驾管业务基础知识", "header": "3.2.25", "question": "公安部《关于严格重中型货车和挂车注册登记的通知》要求：车辆管理所在办理重中型货车和挂车注册登记时，应当严格审核比对信息、严格查验机动车、严格危险货物运输车登记和严格责任追究。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 456, "section": "第一部分 车驾管业务基础知识", "header": "3.2.26", "question": "对车主名下登记车辆未按规定办理转入的，限制车主办理所有机动车业务和驾驶证业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 457, "section": "第一部分 车驾管业务基础知识", "header": "3.2.27", "question": "普通驾驶人不得驾驶残疾人专用的小型自动挡载客汽车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 458, "section": "第一部分 车驾管业务基础知识", "header": "3.2.28", "question": "公路客运、公交客运、出租客运、旅游客运、校车、货运和危险品运输 等道路运输企业注册为互联网交通安全综合服务管理平台用户后，可以 查询本企业名下机动车的状态、检验有效期及其交通违法、交通事故信 息，聘用驾驶人的驾驶证状态、累积记分、驾驶证有效期等信息，以及 推送给企业的交通安全风险预警提示、通报抄告、通知公告等信息。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 459, "section": "第一部分 车驾管业务基础知识", "header": "3.2.29", "question": "建立统一的考试预约服务平台，提供互联网、电话、窗口等多种报考方式，考生完成培训后可按规定自主选择考试时间和考试场地，改变完全由驾驶培训机构包办报考的做法，保障考生选择权。公安机关按照报考或约考时间先后顺序，公平合理安排考生考试。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 460, "section": "第一部分 车驾管业务基础知识", "header": "3.2.30", "question": "各地要严格落实重点车辆监销，依法监督车辆解体，规范办理注销登记，严禁不见人、不见车直接办理注销，严禁不核查证明凭证直接系统注销，杜绝弄虚作假，杜绝注销车辆仍上路行驶。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 461, "section": "第一部分 车驾管业务基础知识", "header": "3.2.31", "question": "对手续不齐全、未按规定监销等违规办理重点车辆注销的，要严肃追究违规办理人员和主管领导责任；对企业出具虚假灭失等证明材料的，要依法追究企业的安全主体责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 462, "section": "第一部分 车驾管业务基础知识", "header": "3.2.32", "question": "车辆管理所等级评定工作每两年进行一次，并实行动态评定。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 463, "section": "第一部分 车驾管业务基础知识", "header": "3.2.33", "question": "公安部交通管理局评定一等车辆管理所，对省级公安机关评定的车辆管理所等级进行抽查复核。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 464, "section": "第一部分 车驾管业务基础知识", "header": "3.2.34", "question": "为盗抢、走私、非法拼（组）装、报废以及未列入车辆产品《公告》（不实行公告管理的车辆除外）的机动车办理牌证的，评为等外车辆管理所。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 465, "section": "第一部分 车驾管业务基础知识", "header": "3.2.35", "question": "车辆管理所等级评定工作要求基层制作专门评定材料或者台账，材料或者台账可以是纸质的，也可以是电子的。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 466, "section": "第一部分 车驾管业务基础知识", "header": "3.2.36", "question": "机动车行驶证工本费为每本15元。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 467, "section": "第一部分 车驾管业务基础知识", "header": "3.2.37", "question": "机动车使用性质申请变更为\"预约出租客运\"，机动车所有人不需要交验车辆。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 468, "section": "第一部分 车驾管业务基础知识", "header": "3.2.38", "question": "新能源汽车主要包括纯电动汽车、混合动力汽车和燃料电池汽车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 469, "section": "第一部分 车驾管业务基础知识", "header": "3.2.39", "question": "公安交通管理部门和交通运输部门要建立完善机动车注册登记和营运资格信息共享机制，畅通部门间信息交换渠道，实现无缝衔接。两部门定期交换、比对车辆注册登记和营运资质信息，形成有效对接的联合监管体系。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 470, "section": "第一部分 车驾管业务基础知识", "header": "3.2.40", "question": "为积极支持道路交通安全协会、驾驶人协会等行业协会，充分发挥其在交通安全工作中的独特优势和作用，各地公安交管部门可以委托协会统一代办车驾管业务，协会可以收取服务费。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 471, "section": "第一部分 车驾管业务基础知识", "header": "3.2.41", "question": "为坚决杜绝公民个人信息泄露，各级公安交管部门要按照《公安机关内部人员泄露公民个人信息问题专项治理方案》要求，彻查严办内部人员泄露公民个人信息案件，加强对民警和辅警的警示教育，规范信息系统的授权和使用，强化防范措施，严格队伍管理。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 472, "section": "第一部分 车驾管业务基础知识", "header": "3.2.42", "question": "要按照\"人手一证、插证登录、证随人走、严禁混用\"的原则，规范使用数字证书，对数字证书混用、未及时带离数字证书等情形导致信息泄露等问题，要在严肃追究操作者责任的同时，追究数字证书持有人的责任。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 473, "section": "第一部分 车驾管业务基础知识", "header": "3.2.43", "question": "公安机关交通管理部门应当按照《机动车驾驶证业务工作规范》《机动车登记工作规范》规定的程序办理互联网交通管理业务。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 474, "section": "第一部分 车驾管业务基础知识", "header": "3.2.44", "question": "各地要进一步强化监管意识，将全面加强监管作为深化公安交管“放管服”改革的重要组成部分，坚持放管结合、放管并重，做到业务延伸下放到哪里，监督管理就跟进到哪里，确保放而不乱、放而有序。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 475, "section": "第一部分 车驾管业务基础知识", "header": "3.2.45", "question": "业务办理一窗式是指推行车驾管业务一窗受理、集成服务，推行缴费支付电子化，做到受理、审核\"一次排队、一次办结\"，缴费后到取证窗口排队领取证件。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 476, "section": "第一部分 车驾管业务基础知识", "header": "3.2.46", "question": "公安交管\"放管服\"措施中推行缴费支付电子化，是指服务窗口推广使用网银、支付宝、微信等支付方式。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 477, "section": "第一部分 车驾管业务基础知识", "header": "3.2.47", "question": "监察机关需要异地公安机关交通管理部门协助办理机动车注册、转移等登记的,应当出具委托函，委托机动车登记地监察机关办理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 478, "section": "第一部分 车驾管业务基础知识", "header": "3.2.48", "question": "要优化预查验工作流程，鼓励有条件的销售企业实行\"多点查验\"，在车辆售前停放场所设立多个查验区，减少未销售车辆移动距离。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 479, "section": "第一部分 车驾管业务基础知识", "header": "3.2.49", "question": "民警、警务辅助人员抽查考试及格率在60%以下的，为等外车辆管理所。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 480, "section": "第一部分 车驾管业务基础知识", "header": "3.2.50", "question": "为不符合驾驶许可条件的人员发证或者不考试发证、考试不合格发证、 买卖驾驶证的，为等外车辆管理所。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 481, "section": "第一部分 车驾管业务基础知识", "header": "3.2.51", "question": "机动车销售统一发票打印内容出现压线或者出格的，若内容清晰完整， 无需退还重新开具。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 482, "section": "第一部分 车驾管业务基础知识", "header": "3.2.52", "question": "各地公安交管部门要积极配合市场监督管理部门，督促机动车安全技术 检验机构加强对新注册常压液体危险货物罐车和在用罐车的安全技术检 验，严禁为不符合要求的罐车出具安全技术检验合格证明。在办理罐车 注册登记环节，要认真核对工信部《道路机动车辆生产企业及产品公告》， 对车辆不符合国家安全技术标准的，不予办理注册登记；对未取得安全 技术检验合格证明的，不予核发检验合格标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 483, "section": "第一部分 车驾管业务基础知识", "header": "3.2.53", "question": "地市级车辆管理所要在业务大厅开设老年人办理业务绿色通道或者专门 窗口，有条件的县级车辆管理所、机动车登记服务站、交通违法处理窗 口等要提供老人办理业务绿色通道，减少老年人办事等候时间。要优化 业务导办服务，配备老花镜、轮椅等便民设施，鼓励提供免费代办服务， 最大限度便利老年人办事。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 484, "section": "第一部分 车驾管业务基础知识", "header": "3.2.54", "question": "公安部与军队有关部门建立军队和武警部队驾驶证信息联网核查机制， 自2021年6月1日起，车辆管理所在办理持军队、武警部队驾驶证换领 地方驾驶证业务（含现役、退役人员）时，综合应用平台将自动核查、 自动比对军队或者武警部队驾驶证信息，对信息系统提示核查不通过的， 要书面告知申请人必须通过核查才能受理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 485, "section": "第一部分 车驾管业务基础知识", "header": "3.2.55", "question": "办理持军队、武警部队驾驶证换领地方驾驶证业务时，军人在部队的驾 驶经历和驾龄不可以连续计算。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 486, "section": "第一部分 车驾管业务基础知识", "header": "3.2.56", "question": "对出国（境）人员因新冠疫情无法回国（入境）及时办理驾驶证期满换 证、审验、提交身体条件证明业务的，可以委托国（境）内人员申请延 期办理。对无法提交身份证明、委托书原件的，可凭复印件或者影像打 印件办理延期业务。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 487, "section": "第一部分 车驾管业务基础知识", "header": "3.2.57", "question": "推行交管业务网上委托后，申请人既可以通过“交管12123”APP委托他 人办理，也可以选择纸质委托书等形式委托他人办理，车辆管理所不得 强制或者变相强制申请人网上委托。对已申请网上委托的，车辆管理所 不再要求申请人出具纸质委托书。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 488, "section": "第一部分 车驾管业务基础知识", "header": "3.2.58", "question": "积极推进与银保监部门以及商业银行、汽车金融公司、财务公司等金融 机构共享抵押、解除抵押信息，免予提交纸质资料。已实现联网核查的， 在机动车档案目录资料中备注“联网核查”，各地在转入时不得以没有纸 质资料为由退档。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 489, "section": "第一部分 车驾管业务基础知识", "header": "3.2.59", "question": "网办中心设置受理岗、复核管理岗，受理岗和复核管理岗人员可以互相兼任。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 490, "section": "第二部分 考试业务知识", "header": "1.1.1", "question": "驾驶机动车在道路上违反道路交通安全法的行为，属于什么行为？", "options": ["A、违章行为", "B、违法行为", "C、过失行为", "D、违规行为"], "answer": "B", "type": "choice"}, {"id": 491, "section": "第二部分 考试业务知识", "header": "1.1.2", "question": "机动车驾驶人违法驾驶造成重大交通事故构成犯罪的，依法追究什么责任？", "options": ["A、刑事责任", "B、民事责任", "C、经济责任", "D、直接责任"], "answer": "A", "type": "choice"}, {"id": 492, "section": "第二部分 考试业务知识", "header": "1.1.3", "question": "机动车驾驶人造成事故后逃逸构成犯罪的，吊销驾驶证且多长时间不得重新取得驾驶证？", "options": ["A、5年内", "B、10年内", "C、终生", "D、20年内"], "answer": "C", "type": "choice"}, {"id": 493, "section": "第二部分 考试业务知识", "header": "1.1.4", "question": "以欺骗、贿赂等不正当手段取得驾驶证被依法撤销驾驶许可的，多长时间不得重新申请驾驶许可？", "options": ["A、3年内", "B、终身", "C、1年内", "D、5年内"], "answer": "A", "type": "choice"}, {"id": 494, "section": "第二部分 考试业务知识", "header": "1.1.5", "question": "驾驶拼装机动车上路行驶的驾驶人，除按规定接受罚款外，还要受到哪种处理？", "options": ["A、处10日以下拘留", "B、暂扣驾驶证", "C、吊销驾驶证", "D、追究刑事责任"], "answer": "C", "type": "choice"}, {"id": 495, "section": "第二部分 考试业务知识", "header": "1.1.6", "question": "驾驶报废机动车上路行驶的驾驶人，除按规定罚款外，还要受到哪种处理？", "options": ["A、撤销驾驶许可", "B、收缴驾驶证", "C、强制恢复车况", "D、吊销驾驶证"], "answer": "D", "type": "choice"}, {"id": 496, "section": "第二部分 考试业务知识", "header": "1.1.7", "question": "公安交通管理部门对驾驶人的交通违法行为除依法给予行政处罚外,实行下列哪种制度？", "options": ["A、违法登记制度", "B、奖励里程制度", "C、累积记分制度", "D、强制报废制度"], "answer": "C", "type": "choice"}, {"id": 497, "section": "第二部分 考试业务知识", "header": "1.1.8", "question": "公安机关交通管理部门对累积记分达到规定分值的驾驶人怎样处理？", "options": ["A、依法追究刑事责任", "B、处15日以下拘留", "C、终生禁驾", "D、进行法律法规教育，重新考试"], "answer": "D", "type": "choice"}, {"id": 498, "section": "第二部分 考试业务知识", "header": "1.1.9", "question": "机动车在道路上变更车道需要注意什么？", "options": ["A、尽快加速进入左侧车道", "B、不能影响其他车辆正常行驶", "C、进入左侧车道时适当减速", "D、开启转向灯迅速向左转向"], "answer": "B", "type": "choice"}, {"id": 499, "section": "第二部分 考试业务知识", "header": "1.1.10", "question": "驾驶机动车在道路上靠路边停车过程中如何使用灯光？", "options": ["A、变换使用远近光灯", "B、不用指示灯提示", "C、开启危险报警闪光灯", "D、提前开启右转向灯"], "answer": "D", "type": "choice"}, {"id": 500, "section": "第二部分 考试业务知识", "header": "1.1.11", "question": "驾驶机动车遇雾、雨、雪等能见度在50米以内时，最高速度不能超过多少？", "options": ["A、70公里/小时", "B、50公里/小时", "C、40公里/小时", "D、30公里/小时"], "answer": "D", "type": "choice"}, {"id": 501, "section": "第二部分 考试业务知识", "header": "1.1.12", "question": "驾驶机动车在进出非机动车道时，最高速度不能超过多少？", "options": ["A、30公里/小时", "B、40公里/小时", "C、50公里/小时", "D、60公里/小时"], "answer": "A", "type": "choice"}, {"id": 502, "section": "第二部分 考试业务知识", "header": "1.1.13", "question": "驾驶机动车在冰雪道路行驶时，最高速度不能超过多少？", "options": ["A、20公里/小时", "B、30公里/小时", "C、40公里/小时", "D、50公里/小时"], "answer": "B", "type": "choice"}, {"id": 503, "section": "第二部分 考试业务知识", "header": "1.1.14", "question": "驾驶机动车在下列哪种情形下不能超越前车 , "answer": "正确", "type": "judgment"}, {"id": 580, "section": "第二部分 考试业务知识", "header": "1.2.32", "question": "在道路上发生交通事故造成人身伤亡时，要立即抢救受伤人员并迅速报警。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 581, "section": "第二部分 考试业务知识", "header": "1.2.33", "question": "不要在驾驶室的前后窗范围内悬挂和放置妨碍驾驶人视线的物品。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 582, "section": "第二部分 考试业务知识", "header": "1.2.34", "question": "驾驶人违反交通运输管理法规发生重大事故致人死亡的处3年以上有期徒刑。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 583, "section": "第二部分 考试业务知识", "header": "1.2.35", "question": "驾驶人违反交通运输管理法规发生重大事故后，因逃逸致人死亡的，处3年以上7年以下有期徒刑。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 584, "section": "第二部分 考试业务知识", "header": "1.2.36", "question": "对未按照国家规定投保交强险的车辆，交通警察依法予以扣留。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 585, "section": "第二部分 考试业务知识", "header": "1.2.37", "question": "对发生道路交通事故需要收集证据的事故车，交通警察可以依法扣留。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 586, "section": "第二部分 考试业务知识", "header": "1.2.38", "question": "驾驶人在一个记分周期内累积记分达到12分的，交通警察依法扣留驾驶证。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 587, "section": "第二部分 考试业务知识", "header": "1.2.39", "question": "道路交通事故中，机动车无号牌、检验合格标志、保险标志时，要保护现场并立即报警。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 588, "section": "第二部分 考试业务知识", "header": "1.2.40", "question": "驾驶机动车发生财产损失交通事故后，当事人对事实及成因无争议，移动车辆时需要对现场拍照或者标划停车位置。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 589, "section": "第二部分 考试业务知识", "header": "1.2.41", "question": "机动车发生财产损失交通事故，对应当自行撤离现场而未撤离造成交通堵塞的，可以对驾驶人处以200元罚款。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 590, "section": "第二部分 考试业务知识", "header": "1.2.42", "question": "驾驶人记分没有达到满分，有罚款尚未缴纳的，记分转入下一记分周期。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 591, "section": "第二部分 考试业务知识", "header": "1.2.43", "q "第二部分 考试业务知识", "header": "1.2.55", "question": "夜间通过无交通信号灯控制的交叉路口时，不得变换远、近光灯。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 604, "section": "第二部分 考试业务知识", "header": "1.2.56", "question": "持有大型客车、重型牵引车、城市公交车、中型客车、大型货车驾驶证的驾驶人，在记分周期内有记分的，应当在记分周期结束后三十日内到公安机关交通管理部门接受审验。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 605, "section": "第二部分 考试业务知识", "header": "1.2.57", "question": "在高速公路上行驶的载货汽车车厢内不得载人。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 606, "section": "第二部分 考试业务知识", "header": "1.2.58", "question": "持有大型货车驾驶证的驾驶人在一个记分周期内有记满12分记录的，车辆管理所应当注销其最高准驾车型驾驶资格。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 607, "section": "第二部分 考试业务知识", "header": "2.1.1", "question": "驾驶机动车在隧道内发生车辆故障时，以下做法正确的是什么？", "options": ["A、车辆能够继续行驶的，应尽可能把车驶出隧道", "B、车辆能够继续行驶的，迅速掉头驶离隧道", "C、车辆不能继续行驶的，立即停车维修", "D、车辆不能继续行驶的，驾乘人员下车将车辆推离车道"], "answer": "A", "type": "choice"}, {"id": 608, "section": "第二部分 考试业务知识", "header": "2.1.2", "question": "在隧道内行驶，发现行驶路线错误时，以下做法正确的是什么？", "options": ["A、在紧急停车带掉头", "B、继续行驶，驶出隧道后寻找合适路线", "C、在隧道内停车，查找清楚路线之后再通行", "D、在确认后方无来车的情况下倒车驶出隧道"], "answer": "B", "type": "choice"}, {"id": 609, "section": "第二部分 考试业务知识", "header": "2.1.3", "question": "驾驶机动车在隧道中行驶时，遇到交通拥堵时以下做法正确的是什么？", "options": ["A、右侧超车", "B、左侧超车", "C、依次排队等候", "D、利用对向车道快速通过"], "answer": "C", "type": "choice"}, {"id": 610, "section": "第二部分 考试业务知识", "header": "2.1.4", "question": "驾驶营运客车在隧道内行驶，遇前方发生火灾等事故时，以下做法正确的顺序是什么？ ①安全停车并开启危险报警闪光灯②驾驶人逃生③疏散乘客逃生", "options": ["A、①③", "B、①②", "C、①③②", "D、①②③"], "answer": "C", "type": "choice"}, {"id": 611, "section": "第二部分 考试业务知识", "header": "2.1.5", "question": "驾驶机动车遇团雾时，以下做法正确的是什么？", "options": ["A、提高行驶速度尽快通过", "B、缩短跟车距离，保持通行效率", "C、开启远光灯", "D、开启雾灯"], "answer": "D", "type": "choice"}, {"id": 612, "section": "第二部分 考试业务知识", "header": "2.1.6", "question": "夜间驾驶机动车在普通道路上发生故障靠边停车后，应如何放置警告标志？", "options": ["A、迎着来车方向在车道内行走，放在车后50米的位置", "B、手持警告标志并将反光面面向来车方向，靠路边行走，放在车后50米外的位置", "C、放在车后20米的位置", "D、到达车后40米处，打开警告标志后放置好"], "answer": "B", "type": "choice"}, {"id": 613, "section": "第二部分 考试业务知识", "header": "2.1.7", "question": "夜间驾驶机动车发生故障时，以下说法正确的是什么？", "options": ["A、夜间车少人少，驾驶人可在车中打电话等候救援", "B、夜间其他车辆不易观察到三角警告标志，可以不用设置", "C、车辆熄火后使用灯光会造成电瓶的损耗，因此不宜开启任何灯光", "D、驾乘人员迅速转移到安全地带等待救援"], "answer": "D", "type": "choice"}, {"id": 614, "section": "第二部分 考试业务知识", "header": "2.1.8", "question": "夜间驾驶机动车从视线不良的小区驶出，若无法看到前方道路是否有车辆通过，以下做法正确的是什么？", "options": ["A、短暂鸣喇叭后如果没有车辆回应，则缓慢驶出", "B、交替变换远近光灯，如没有车辆回应，则缓慢驶出", "C、不用采取任何措施，加速驶出小区", "D、持续鸣喇叭提示"], "answer": "B", "type": "choice"}, {"id": 615, "section": "第二部分 考试业务知识", "header": "2.1.9", "question": "机动车轮胎的胎压标识表示的含义是什么？", "options": ["A、正常情况下的最大安全充气压力值", "B、正常情况下的最小安全充气压力值", "C、正常情况下的充气压力参考值", "D、全车所有轮胎充气压力的平均值"], "answer": "A", "type": "choice"}, {"id": 616, "section": "第二部分 考试业务知识", "header": "2.1.10", "question": "驾驶大型货车在长下坡路段刹车失灵时，以下做法正确的是什么？", "options": ["A、持续使用喷淋装置降温", "B、逐级或越一级减挡，并间歇性使用驻车制动器", "C、将制动踏板猛踩到底制动", "D、越两级挡位减挡"], "answer": "B", "type": "choice"}, {"id": 617, "section": "第二部分 考试业务知识", "header": "2.1.11", "question": "驾驶新能源汽车遇车辆电池起火时，以下做法正确的是什么？", "options": ["A、在起火初期用普通灭火器灭火", "B、在起火初期使用专用灭火器灭火", "C、使用大量清水灭火", "D、火势较大无法控制时使用专用灭火器灭火"], "answer": "B", "type": "choice"}, {"id": 618, "section": "第二部分 考试业务知识", "header": "2.1.12", "question": "驾驶机动车遇后轮爆胎时，以下做法正确顺序的是什么？ ①收油减挡缓慢制动，通过后视镜关注后方车辆情况，避免追尾 ②握紧转向盘 ③安全驶离行车道 ④停车后开启危险报警闪光灯，在来车方向设置警告标志，车上人员迅速撤离到安全地点报警求助", "options": ["A、③②①④", "B、②①③④", "C、①②③④", "D、①③②④"], "answer": "B", "type": "choice"}, {"id": 619, "section": "第二部分 考试业务知识", "header": "2.1.13", "question": "魏某（驾驶证被扣留）驾驶小型客车（逾期未检验）沿某国道行驶至某处时跨双黄实线掉头，与对向车道于某驾驶的重型自卸货车相撞,造成5人死亡、2人受伤。事故发生后魏某驾车逃离事故现场。造成本起事故的直接原因是什么？", "options": ["A、魏某驾驶机动车时跨双黄实线掉头", "B、魏某在驾驶证被扣留期间驾驶机动车", "C、魏某驾驶逾期未检验的机动车", "D、于某超速行驶"], "answer": "A", "type": "choice"}, {"id": 620, "section": "第二部分 考试业务知识", "header": "2.1.14", "question": "驾驶机动车在高速公路上遇前方车流缓行时，以下做法正确的是什么？", "options": ["A、立即停车", "B、跟随车流行驶，保持安全车距", "C、进入应急车道行驶", "D、可以倒车"], "answer": "B", "type": "choice"}, {"id": 621, "section": "第二部分 考试业务知识", "header": "2.1.15", "question": "夜间驾驶机动车在高速公路上发生交通事故，以下做法正确的是什么？", "options": ["A、人员下车在原地等待处理交通事故", "B、开启远光灯，在车内等待救援", "C、开启危险报警闪光灯，人员转移到安全地带", "D、关闭所有灯光，人员转移到右侧护栏以外"], "answer": "C", "type": "choice"}, {"id": 622, "section": "第二部分 考试业务知识", "header": "2.1.16", "question": "驾驶机动车驶出地下车库，遇车流量较大时，以下做法正确的是什么？", "options": ["A、鸣喇叭提醒其他车辆让行", "B、依次排队等候通过", "C、在确认安全的情况下从车库入口驶出", "D、穿插车流尽快驶出"], "answer": "B", "type": "choice"}, {"id": 623, "section": "第二部分 考试业务知识", "header": "2.1.17", "question": "某日早上6时，冉某驾驶一辆大客车出发，连续行驶至上午11时，在宣汉县境内宣南路1公里处，坠于公路一侧垂直高度8.5米的陡坎下，造成13人死亡、9人受伤。冉某的主要违法行为是什么？", "options": ["A、超速行驶", "B、不按交通标线行驶", "C、客车超员", "D、疲劳驾驶"], "answer": "D", "type": "choice"}, {"id": 624, "section": "第二部分 考试业务知识", "header": "2.1.18", "question": "某日13时10分，罗某驾驶一辆中型客车从高速公路0公里处出发，下午2点10分行至该高速公路125公里加200米处时，发生追尾碰撞，机动车驶出西南侧路外边坡，造成11人死亡、2人受伤。罗某的主要违法行为是什么？", "options": ["A、超速行驶", "B、不按交通标线行驶", "C、客车超员", "D、疲劳驾驶"], "answer": "A", "type": "choice"}, {"id": 625, "section": "第二部分 考试业务知识", "header": "2.1.19", "question": "徐某驾驶一辆中型客车（乘载27人）行至四都镇前岭村壶南头路段，在上坡过程中，机动车发生后溜驶出路外坠入落差约80米的山崖，造成11人死亡、7人受伤。徐某的主要违法行为是什么？", "options": ["A、疲劳驾驶", "B、酒后驾驶", "C、客车超员", "D、超速行驶"], "answer": "C", "type": "choice"}, {"id": 626, "section": "第二部分 考试业务知识", "header": "2.1.20", "question": "罗某驾驶大型卧铺客车（乘载44人，核载44人）行至沿河县境内540县道58公里加500米处时，在结冰路面以每小时44公里速度行驶，导致机动车侧滑翻下公路，造成15人死亡、27人受伤。罗某的主要违法行为是什么？", "options": ["A、客车超员", "B、超速行驶", "C、疲劳驾驶", "D、操作不当"], "answer": "B", "type": "choice"}, {"id": 627, "section": "第二部分 考试业务知识", "header": "2.1.21", "question": "机动车在狭窄的坡路会车时，正确的会车方法是什么？", "options": ["A、下坡车让上坡车", "B、坡顶交会时距离坡顶远的一方让行", "C、上坡车让下坡车", "D、下坡车已行至中途而上坡车未上坡时，让上坡车"], "answer": "A", "type": "choice"}, {"id": 628, "section": "第二部分 考试业务知识", "header": "2.1.22", "question": "驾乘人员下车时要怎样做以保证安全？", "options": ["A、停车后立即开门下车", "B、观察前方交通情况", "C、先开车门再观察侧后情况", "D、先观察侧后情况，再缓开车门"], "answer": "D", "type": "choice"}, {"id": 629, "section": "第二部分 考试业务知识", "header": "2.1.23", "question": "机动车驶入双向行驶隧道前，要如何使用灯光？", "options": ["A、开启危险报警闪光灯", "B、开启远光灯", "C、开启雾灯", "D、开启近光灯"], "answer": "D", "type": "choice"}, {"id": 630, "section": "第二部分 考试业务知识", "header": "2.1.24", "question": "山区上坡路段跟车过程中遇前车停车时怎么办？", "options": ["A、从前车两侧超越", "B、紧跟前车后停车", "C、保持大距离停车", "D、连续鸣喇叭提示"], "answer": "C", "type": "choice"}, {"id": 631, "section": "第二部分 考试业务知识", "header": "2.1.25", "question": "驾驶机动车在下坡路段停车怎样使用行车制动？", "options": ["A、比在平路时提前", "B、比在平路时推迟", "C、和平路时一样", "D、要轻踏制动踏板"], "answer": "A", "type": "choice"}, {"id": 632, "section": "第二部分 考试业务知识", "header": "2.1.26", "question": "驾驶机动车上坡行驶如何保持充足动力？", "options": ["A、在车速下降前减挡", "B、在车速下降后减挡", "C、在车速过低时减挡", "D、尽量使用越级减挡"], "answer": "A", "type": "choice"}, {"id": 633, "section": "第二部分 考试业务知识", "header": "2.1.27", "question": "夜间驾驶机动车超车遇前车不让路时怎样处置？", "options": ["A、连续鸣喇叭提示", "B、开远光灯尾随行驶", "C、保持距离等待让行", "D、连续变换前照灯远、近光"], "answer": "C", "type": "choice"}, {"id": 634, "section": "第二部分 考试业务知识", "header": "2.1.28", "question": "夜间会车前，两车在相距150米之外交替变换前照灯远近光的作用是什么？", "options": ["A、会车前两车之间相互提示", "B、驾驶操作的习惯行为", "C、便于双方观察前方情况", "D、驾驶人之间的一种礼节"], "answer": "C", "type": "choice"}, {"id": 635, "section": "第二部分 考试业务知识", "header": "2.1.29", "question": "最容易发生侧滑的路面是：", "options": ["A、干燥水泥路面", "B、下雨开始时的路面", "C、潮湿水泥路面", "D、大雨中的路面"], "answer": "B", "type": "choice"}, {"id": 636, "section": "第二部分 考试业务知识", "header": "2.1.30", "question": "当机动车在湿滑路面上行驶时，路面附着力随着车速的如何变化？", "options": ["A、急剧增大", "B、逐渐增大", "C、急剧减小", "D、没有变化"], "answer": "C", "type": "choice"}, {"id": 637, "section": "第二部分 考试业务知识", "header": "2.1.31", "question": "驾驶机动车在山区冰雪道路上遇前车正在爬坡时如何处置？", "options": ["A、前车通过后再爬坡", "B、迅速超越前车爬坡", "C、低速超越前车爬坡", "D、紧随前车后爬坡"], "answer": "A", "type": "choice"}, {"id": 638, "section": "第二部分 考试业务知识", "header": "2.1.32", "question": "大雾天在高速公路遇事故不能继续行驶时，危险的做法是什么？", "options": ["A、靠边停车迅速下车", "B、尽量站到防护栏以外", "C、开启危险报警闪光灯和雾灯", "D、沿行车道到车后设置警告标志"], "answer": "D", "type": "choice"}, {"id": 639, "section": "第二部分 考试业务知识", "header": "2.1.33", "question": "驾驶机动车在雾天两车交会 1.53", "question": "机动车发生撞击的位置不在驾驶人一侧或撞击力量较小时，驾驶人不正确的做法是什么？", "options": ["A、紧握转向盘", "B、两腿向前蹬", "C、从一侧跳车", "D、身体向后紧靠座椅"], "answer": "C", "type": "choice"}, {"id": 660, "section": "第二部分 考试业务知识", "header": "2.1.54", "question": "在高速公路驾驶机动车意外碰撞护栏时采取什么保护措施？", "options": ["A、握紧转向盘，适量修正", "B、迅速向相反方向转向", "C、迅速采取紧急制动", "D、迅速向碰撞一侧转向"], "answer": "A", "type": "choice"}, {"id": 661, "section": "第二部分 考试业务知识", "header": "2.1.55", "question": "发动机着火后首先怎样处置？", "options": ["A、迅速关闭发动机", "B、用水进行灭火", "C、开启发动机罩灭火", "D、站在下风处灭火"], "answer": "A", "type": "choice"}, {"id": 662, "section": "第二部分 考试业务知识", "header": "2.1.56", "question": "怎样正确使用灭火器灭火？", "options": ["A、人要站在下风处", "B、灭火器瞄准火源", "C、尽量接近火源", "D、灭火器瞄准火苗"], "answer": "B", "type": "choice"}, {"id": 663, "section": "第二部分 考试业务知识", "header": "2.1.57", "question": "雨天机动车在高速公路行驶发生\"水滑\"现象时怎样处置？", "options": ["A、急踏制动踏板减速", "B、缓抬加速踏板减速", "C、迅速转向进行调整", "D、提速增大车轮排水量"], "answer": "B", "type": "choice"}, {"id": 664, "section": "第二部分 考试业务知识", "header": "2.1.58", "question": "机动车在什么样的路面上制动时车轮最容易抱死?", "options": ["A、混凝土路", "B、土路", "C、冰雪路面", "D、沙土路"], "answer": "C", "type": "choice"}, {"id": 665, "section": "第二部分 考试业务知识", "header": "2.1.59", "question": "抢救昏迷失去知觉的伤员需注意什么？", "options": ["A、马上实施心肺复苏", "B、使劲掐伤员的人中", "C、连续拍打伤员面部", "D、抢救前先检查呼吸"], "answer": "D", "type": "choice"}, {"id": 666, "section": "第二部分 考试业务知识", "header": "2.1.60", "question": "采用指压止血法为动脉出血伤员止血时，拇指压住伤口的什么位置？", "options": ["A、近心端动脉", "B、血管下方动脉", "C、远心端动脉", "D、血管中部"], "answer": "A", "type": "choice"}, {"id": 667, "section": "第二部分 考试业务知识", "header": "2.1.61", "question": "救助全身燃烧伤员采取哪种应急措施？", "options": ["A、用沙土覆盖火焰灭火", "B、向身上喷冷水灭火", "C、用灭火器进行灭火", "D、帮助脱掉燃烧的衣服"], "answer": "B", "type": "choice"}, {"id": 668, "section": "第二部分 考试业务知识", "header": "2.1.62", "question": "怎样抢救脊柱骨折的伤员？", "options": ["A、采取保暖措施", "B、用软板担架运送", "C、用三角巾固定", "D、扶持伤者移动"], "answer": "C", "type": "choice"}, {"id": 669, "section": "第二部分 考试业务知识", "header": "2.1.63", "question": "火柴、硫黄和赤磷属于哪类危险化学品？", "options": ["A、爆炸品", "B、氧化性物质", "C、自燃物品", "D、易燃固体"], "answer": "D", "type": "choice"}, {"id": 670, "section": "第二部分 考试业务知识", "header": "2.1.64", "question": "液化石油气罐车在运输途中发生大量泄漏时，下列措施错误的是什么？", "options": ["A、切断一切电源", "B、戴好防护面具和手套", "C、关闭阀门制止渗漏", "D、组织人员向下风方向疏散"], "answer": "D", "type": "choice"}, {"id": 671, "section": "第二部分 考试业务知识", "header": "2.1.65", "question": "夜间道路环境对安全行车的主要影响是什么？", "options": ["A、能见度低、不利于观察道路交通情况", "B、路面复杂多变", "C、驾驶人体力下降", "D、驾驶人易产生冲动、幻觉"], "answer": "A", "type": "choice"}, {"id": 672, "section": "第二部分 考试业务知识", "header": "2.1.66", "question": "泥泞道路对安全行车的主要影响是什么？", "options": ["A、行驶阻力变小", "B、车轮极易滑转和侧滑", "C、能见度低，视野模糊", "D、路面附着力增大"], "answer": "B", "type": "choice"}, {"id": 673, "section": "第二部分 考试业务知识", "header": "2.1.67", "question": "当驾驶车辆行经两侧有行人且有积水的路面时，应怎样做？", "options": ["A、加速通过", "B、正常行驶", "C、减速慢行", "D、连续鸣喇叭"], "answer": "C", "type": "choice"}, {"id": 674, "section": "第二部分 考试业务知识", "header": "2.1.68", "question": "行车中需要借道绕过前方障碍物，但对向来车已接近障碍物时，应怎样做？", "options": ["A、降低速度或停车，让对向来车优先通行", "B、加速提前抢过", "C、鸣喇叭示意对向车辆让道", "D、迅速占用车道，迫使对向来车停车让道"], "answer": "A", "type": "choice"}, {"id": 675, "section": "第二部分 考试业务知识", "header": "2.1.69", "question": "驾驶车辆在交叉路口前变更车道时，应怎样驶入要变更的车道？", "options": ["A、在路口前实线区内根据需要", "B、进入路口实线区内", "C、在虚线区按导向箭头指示", "D、在路口停止线前"], "answer": "C", "type": "choice"}, {"id": 676, "section": "第二部分 考试业务知识", "header": "2.1.70", "question": "行驶车道绿灯亮时，但车辆前方人行横道仍有行人行走，应怎样做？", "options": ["A、直接起步通过", "B、起步后从行人后方绕过", "C、起步后从行人前方绕过", "D、等行人通过后再起步"], "answer": "D", "type": "choice"}, {"id": 677, "section": "第二部分 考试业务知识", "header": "2.1.71", "question": "会车前选择的交会位置不理想时，应怎样做？", "options": ["A、加速选择理想位置", "B、减速、低速会车或停车让行", "C、向左占道，让对方减速让行", "D、打开前照灯，示意对方停车让行"], "answer": "B", "type": "choice"}, {"id": 678, "section": "第二部分 考试业务知识", "header": "2.1.72", "question": "进入左侧道路超车，无法保证与正常行驶前车的横向安全间距时，应怎样做？", "options": ["A、加速超越", "B、并行一段距离后再超越", "C、放弃超车", "D、谨慎超越"], "answer": "C", "type": "choice"}, {"id": 679, "section": "第二部分 考试业务知识", "header": "2.1.73", "question": "山区道路车辆进入弯道前，在对面没有来车的情况下，应怎样做？", "options": ["A、应\"减速、鸣喇叭、靠右行\"", "B、可靠弯道外侧行驶", "C、可短时间借用对方的车道", "D、可加速沿弯道切线方向通过"], "answer": "A", "type": "choice"}, {"id": 680, "section": "第二部分 考试业务知识", "header": "2.1.74", "question": "驾驶车辆驶入铁路道口前减速降挡，进入道口后应怎样做？", "options": ["A、不能变换挡位", "B、可以变换挡位", "C、可换为高挡", "D、停车观察"], "answer": "A", "type": "choice"}, {"id": 681, "section": "第二部分 考试业务知识", "header": "2.1.75", "question": "行车中超越右侧停放的车辆时，为预防其突然起步或开启车门，应怎样做？", "options": ["A、预留出横向安全距离", "B、保持正常速度行驶", "C、长鸣喇叭", "D、加速通过"], "answer": "A", "type": "choice"}, {"id": 682, "section": "第二部分 考试业务知识", "header": "2.1.76", "question": "驶近没有人行横道的交叉路口时，发现有人横穿道路，应怎样做？", "options": ["A、减速或停车让行", "B、鸣喇叭示意其让道", "C、抢在行人之前通过", "D、立即变道绕过行人"], "answer": "A", "type": "choice"}, {"id": 683, "section": "第二部分 考试业务知识", "header": "2.1.77", "question": "行车中遇有非机动车准备绕过停放的车辆时，应怎样做？", "options": ["A、鸣喇叭示意其让道", "B、让其先行", "C、加速绕过", "D、紧随其后鸣喇叭"], "answer": "B", "type": "choice"}, {"id": 684, "section": "第二部分 考试业务知识", "header": "2.1.78", "question": "夜间驾驶车辆遇自行车对向驶来时，应怎样做？", "options": ["A、连续变换远、近光灯", "B、不断鸣喇叭", "C、使用远光灯", "D、使用近光灯，减速或停车避让"], "answer": "D", "type": "choice"}, {"id": 685, "section": "第二部分 考试业务知识", "header": "2.1.79", "question": "车辆在交叉路口有优先通行权的，遇有车辆抢行时，应怎样做？", "options": ["A、强行通过", "B、提前加速通过", "C、按优先权规定正常行驶不予避让", "D、减速避让，必要时停车让行"], "answer": "D", "type": "choice"}, {"id": 686, "section": "第二部分 考试业务知识", "header": "2.1.80", "question": "车辆驶近停在车站的公交车辆时，为预防公交车突然起步或行人从车前穿出，应怎样做？", "options": ["A、减速，保持足够间距，随时准备停车", "B、保持正常车速行驶", "C、随时准备紧急制动", "D、鸣喇叭提醒，加速通过"], "answer": "A", "type": "choice"}, {"id": 687, "section": "第二部分 考试业务知识", "header": "2.1.81", "question": "车辆在山区道路跟车行驶时，应怎样做？", "options": ["A、紧随前车之后", "B、适当加大安全距离", "C、适当减小安全距离", "D、尽可能寻找超车机会"], "answer": "B", "type": "choice"}, {"id": 688, "section": "第二部分 考试业务知识", "header": "2.1.82", "question": "在山区道路超车时，应怎样超越？", "options": ["A、选择较缓的下坡路", "B、抓住任何机会尽快超车", "C、选择宽阔的缓上坡路段", "D、选择较长的下坡路"], "answer": "C", "type": "choice"}, {"id": 689, "section": "第二部分 考试业务知识", "header": "2.1.83", "question": "下长坡连续使用行车制动会导致什么？", "options": ["A、会缩短发动机寿命", "B、会使轮胎磨损严重", "C、会使制动器温度升高而使制动效果急剧下降", "D、容易造成车辆倾翻"], "answer": "C", "type": "choice"}, {"id": 690, "section": "第二部分 考试业务知识", "header": "2.1.84", "question": "夜间行车中，前方出现弯道时，灯光照射会发生怎样的变化？", "options": ["A、距离不变", "B、由高变低", "C、离开路面", "D、由低变高"], "answer": "D", "type": "choice"}, {"id": 691, "section": "第二部分 考试业务知识", "header": "2.1.85", "question": "在暴雨天气驾车，刮水器无法刮净雨水时，应怎样做？", "options": ["A、减速行驶", "B、集中注意力谨慎驾驶", "C、立即减速靠边停车", "D、以正常速度行驶"], "answer": "C", "type": "choice"}, {"id": 692, "section": "第二部分 考试业务知识", "header": "2.1.86", "question": "遇有浓雾或特大雾天能见度过低，行车困难时，应怎样做？", "options": ["A、开启前照灯，继续行驶", "B、开启示廓灯、雾灯，靠右行驶", "C、开启危险报警闪光灯和雾灯，选择安全地点停车", "D、开启危险报警闪光灯，继续行驶"], "answer": "C", "type": "choice"}, {"id": 693, "section": "第二部分 考试业务知识", "header": "2.1.87", "question": "车辆涉水后，应保持低速行驶，怎样操作制动踏板，以恢复制动效果？", "options": ["A、持续重踏", "B、间断重踏", "C、持续轻踏", "D、间断轻踏"], "answer": "D", "type": "choice"}, {"id": 694, "section": "第二部分 考试业务知识", "header": "2.1.88", "question": "前轮胎爆裂已出现转向时，驾驶人不要过度矫正，应在控制住方向的情况下，应怎样做，使车辆缓慢减速？", "options": ["A、采取紧急制动", "B、使用驻车制动", "C、轻踏制动踏板", "D、迅速踏下制动踏板"], "answer": "C", "type": "choice"}, {"id": 695, "section": "第二部分 考试业务知识", "header": "2.1.89", "question": "避免爆胎的错误的做法是什么？", "options": ["A、降低轮胎气压", "B、定期检查轮胎", "C、及时清理轮胎沟槽里的异物", "D、更换有裂纹或有很深损伤的轮胎"], "answer": "A", "type": "choice"}, {"id": 696, "section": "第二部分 考试业务知识", "header": "2.1.90", "question": "头枕在发生追尾事故时，能有效被保护驾驶人的什么部位？", "options": ["A、腰部", "B、胸部", "C、颈部", "D、头部"], "answer": "C", "type": "choice"}, {"id": 697, "section": "第二部分 考试业务知识", "header": "2.1.91", "question": "机动车发生碰撞时，座椅安全带主要作用是什么？", "options": ["A、减轻驾乘人员伤害", "B、保护驾乘人员腰部", "C、保护驾乘人员颈部", "D、保护驾乘人员胸部"], "answer": "A", "type": "choice"}, {"id": 698, "section": "第二部分 考试业务知识", "header": "2.1.92", "question": "防抱死制动系统（ABS）在什么情况下可以最大限度发挥制动器效能?", "options": ["A、间歇制动", "B、持续制动", "C、缓踏制动踏板", "D、紧急制动"], "answer": "D", "type": "choice"}, {"id": 699, "section": "第二部分 考试业务知识", "header": "2.1.93", "question": "客车在加油站加油时，驾驶人应当提醒乘客怎么做？", "options": ["A、系好安全带", "B、在车内等待", "C、不能拨打手机、吸烟", "D、不要在车内随意走动"], "answer": "C", "type": "choice"}, {"id": 700, "section": "第二部分 考试业务知识", "header": "2.1.94", "question": "客车失火无法开启车门时，为了减少伤害，应尽快组织乘客如何逃生？", "options": ["A、砸碎前挡风玻璃", "B、砸碎侧挡风玻璃", "C、撬开车门", "D、先行灭火，再撬开车门"], "answer": "B", "type": "choice"}, {"id": 701, "section": "第二部分 考试业务知识", "header": "2.1.95", "question": "车辆下长坡过程中，当制动鼓温度过高时，应怎样做？", "options": ["A、要尽快进入水中冷却", "B、不要立即进入水中冷却", "C、要立即浇水冷却", "D、不用理会"], "answer": "B", "type": "choice"}, {"id": 702, "section": "第二部分 考试业务知识", "header": "2.2.1", "question": "行车前应对机动车驾驶室、发动机舱、车外部、轮胎进行检查。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 703, "section": "第二部分 考试业务知识", "header": "2.2.2", "question": "驾驶机动车从辅路汇入主路车流时要迅速。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 704, "section": "第二部分 考试业务知识", "header": "2.2.3", "question": "夜间驾驶机动车在照明条件良好的路段可以不使用灯光。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 705, "section": "第二部分 考试业务知识", "header": "2.2.4", "question": "机动车遇有急弯路时要在进入弯路后减速。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 706, "section": "第二部分 考试业务知识", "header": "2.2.5", "question": "驾驶机动车遇到校车在道路右侧停车上下学生，同向只有一条机动车道时，后方机动车应当停车等待。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 707, "section": "第二部分 考试业务知识", "header": "2.2.6", "question": "驾驶机动车遇到校车在道路右侧停车上下学生，同向有两条机动车道时，左侧车道后方机动车应当停车等待。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 708, "section": "第二部分 考试业务知识", "header": "2.2.7", "question": "驾驶人边驾车、边打手持电话是违法行为。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 709, "section": "第二部分 考试业务知识", "header": "2.2.8", "question": "雨天超车要开启前照灯，连续鸣喇叭迅速超越。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 710, "section": "第二部分 考试业务知识", "header": "2.2.9", "question": "在冰雪道路上行车时，机动车的稳定性降低，加速过急时车轮易空转或溜滑。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 711, "section": "第二部分 考试业务知识", "header": "2.2.10", "question": "冰雪路面处理紧急情况不能使用紧急制动，但可采取急转向的方法躲避。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 712, "section": "第二部分 考试业务知识", "header": "2.2.11", "question": "在雪天临时停车要开启前照灯和雾灯。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 713, "section": "第二部分 考试业务知识", "header": "2.2.12", "question": "如果遇到较强横风，感觉机动车产生横向偏移时，要握紧转向盘并紧急制动。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 714, "section": "第二部分 考试业务知识", "header": "2.2.13", "question": "涉水驾驶要保持车速均匀有足够动力，避免停留。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 715, "section": "第二部分 考试业务知识", "header": "2.2.14", "question": "机动车驶离高速公路进入匝道后，要使车速降到限定时速以下。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 716, "section": "第二部分 考试业务知识", "header": "2.2.15", "question": "驾驶机动车从加速车道汇入行车道有困难时可停车让行。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 717, "section": "第二部分 考试业务知识", "header": "2.2.16", "question": "驾驶机动车进入高速公路加速车道后再开启左转向灯。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 718, "section": "第二部分 考试业务知识", "header": "2.2.17", "question": "驾驶人发现轮胎漏气，将机动车驶离主车道时，不要采用紧急制动，以免造成翻车或后车采取制动不及时导致追尾事故。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 719, "section": "第二部分 考试业务知识", "header": "2.2.18", "question": "机动车转向突然失控后，若前方道路条件能够保持直线行驶，不要紧急制动。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 720, "section": "第二部分 考试业务知识", "header": "2.2.19", "question": "出现制动失效后，要首先控制方向，再设法控制车速。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 721, "section": "第二部分 考试业务知识", "header": "2.2.20", "question": "行车中发动机突然熄火后不能启动时，及时靠边停车检查熄火原因。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 722, "section": "第二部分 考试业务知识", "header": "2.2.21", "question": "高速公路行车发生火灾时，要将机动车驶进服务区或停车场灭火。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 723, "section": "第二部分 考试业务知识", "header": "2.2.22", "question": "救火时不要脱去所穿的化纤服装，以免伤害暴露的皮肤。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 724, "section": "第二部分 考试业务知识", "header": "2.2.23", "question": "机动车落水后，要迅速关闭车窗阻挡车内进水，短暂闭绝空气，可打电话告知救援人员失事地点，等待救援。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 725, "section": "第二部分 考试业务知识", "header": "2.2.24", "question": "雾天在高速公路上发生事故后，车上人员不要随便下车行走。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 726, "section": "第二部分 考试业务知识", "header": "2.2.25", "question": "机动车在高速公路上，因故障不能离开行车道时，可在行车道上迅速抢修。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 727, "section": "第二部分 考试业务知识", "header": "2.2.26", "question": "遇伤者被压于车轮或货物下时，要立即拉拽伤者的肢体将其拖出。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 728, "section": "第二部分 考试业务知识", "header": "2.2.27", "question": "搬运昏迷失去知觉的伤员要采取仰卧位。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 729, "section": "第二部分 考试业务知识", "header": "2.2.28", "question": "救助失血过多出现休克的伤员要采取保暖措施。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 730, "section": "第二部分 考试业务知识", "header": "2.2.29", "question": "烧伤伤员口渴时，只能喝白开水。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 731, "section": "第二部分 考试业务知识", "header": "2.2.30", "question": "为防止有害气体中毒的伤员中毒加剧，首先将伤员转移到空气新鲜的地方。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 732, "section": "第二部分 考试业务知识", "header": "2.2.31", "question": "伤员骨折处出血时，先固定好肢体再进行止血和包扎。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 733, "section": "第二部分 考试业务知识", "header": "2.2.32", "question": "腐蚀品着火时，不能用水柱直接喷射扑救。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 734, "section": "第二部分 考试业务知识", "header": "2.2.33", "question": "冰雪道路行车，由于积雪对光线的反射，极易造成驾驶人目眩而产生错觉。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 735, "section": "第二部分 考试业务知识", "header": "2.2.34", "question": "夜间行车，驾驶人视距变短，影响观察，同时注意力高度集中，易产生疲劳。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 736, "section": "第二部分 考试业务知识", "header": "2.2.35", "question": "在道路上跟车行驶时，跟车距离不是主要的，只须保持与前车相等的速度，即可防止发生追尾事故。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 737, "section": "第二部分 考试业务知识", "header": "2.2.36", "question": "驾驶车辆时，长时间左臂搭在车门窗上，或者长时间右手抓住变速器操纵杆，是一种驾驶陋习。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 738, "section": "第二部分 考试业务知识", "header": "2.2.37", "question": "设有安全带装置的车辆，应要求车内乘员系安全带。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 739, "section": "第二部分 考试业务知识", "header": "2.2.38", "question": "车辆行至交叉路口时，左转弯车辆在任何时段都可以进入左弯待转区。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 740, "section": "第二部分 考试业务知识", "header": "2.2.39", "question": "通过山区危险路段，尤其是通过经常发生塌方、泥石流的山区地段，应谨慎驾驶，避免停车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 741, "section": "第二部分 考试业务知识", "header": "2.2.40", "question": "立交桥上一般都是单向行驶，车辆不必减速行驶。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 742, "section": "第二部分 考试业务知识", "header": "2.2.41", "question": "夜间行车，遇对面来车未关闭远光灯时，应减速行驶，以防两车灯光的交汇处有行人通过时发生事故。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 743, "section": "第二部分 考试业务知识", "header": "2.2.42", "question": "浓雾天气能见度低，开启远光灯会提高能见度。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 744, "section": "第二部分 考试业务知识", "header": "2.2.43", "question": "雾天行车多使用喇叭可引起对方注意；听到对方车辆鸣喇叭，也应鸣喇叭回应。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 745, "section": "第二部分 考试业务知识", "header": "2.2.44", "question": "车辆在冰雪路面紧急制动易产生侧滑，应低速行驶，可利用发动机制动进行减速。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 746, "section": "第二部分 考试业务知识", "header": "2.2.45", "question": "行车中当车辆突然爆胎时，驾驶人切忌慌乱中急踏制动踏板，尽量采用\"抢挡\"的方法，利用发动机制动使车辆减速。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 747, "section": "第二部分 考试业务知识", "header": "2.2.46", "question": "行车中当驾驶人意识到车辆爆胎时，应在控制住方向的情况下采取紧急制动。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 748, "section": "第二部分 考试业务知识", "header": "2.2.47", "question": "机动车发生正面碰撞时，安全气囊加上安全带的双重保护才能充分发挥作用。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 749, "section": "第二部分 考试业务知识", "header": "2.2.48", "question": "装有ABS系统的机动车在冰雪路面上会最大限度缩短制动距离。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 750, "section": "第二部分 考试业务知识", "header": "2.2.49", "question": "机动车紧急制动时，ABS系统在提供最大制动力的同时，能使车前轮保持转向能力。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 751, "section": "第二部分 考试业务知识", "header": "2.2.50", "question": "客车在起步前，应检查行李包是否装捆牢固，长、宽、高及重量是否符合规定，可将行李放置在门道或者过道上。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 752, "section": "第二部分 考试业务知识", "header": "2.2.51", "question": "客运驾驶人日间连续驾驶不得超过4小时，夜间连续驾驶不得超过2小时，每次停车休息时间不少于20分钟。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 753, "section": "第二部分 考试业务知识", "header": "2.2.52", "question": "白天驾驶机动车进入隧道时，只要隧道内有灯光照明，就无须开启前照灯。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 754, "section": "第二部分 考试业务知识", "header": "2.2.53", "question": "驾驶机动车驶入隧道前，为防止进入后暗适应过程中与前车发生事故，应降低行驶速度，与前车保持充足的安全距离。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 755, "section": "第二部分 考试业务知识", "header": "2.2.54", "question": "驾驶机动车驶入隧道前，戴太阳镜的驾驶人应提前摘掉太阳镜。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 756, "section": "第二部分 考试业务知识", "header": "2.2.55", "question": "驾驶机动车在隧道内行驶，对向车道无车辆驶来可以掉头。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 757, "section": "第二部分 考试业务知识", "header": "2.2.56", "question": "驾驶机动车在双向通行隧道中行驶时，如前车速度较慢可借用对向车道超车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 758, "section": "第二部分 考试业务知识", "header": "2.2.57", "question": "通过机动车、非机动车和行人混行的隧道时，应降低车速，注意观察非机动车和行人的动态。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 759, "section": "第二部分 考试业务知识", "header": "2.2.58", "question": "在隧道内驾驶时，如果前方发生突发情况，与前车保持足够车距可以让驾驶人有足够的反应时间和避让空间。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 760, "section": "第二部分 考试业务知识", "header": "2.2.59", "question": "驾驶机动车通过特长隧道时要注意观察隧道出口距离预告标志。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 761, "section": "第二部分 考试业务知识", "header": "2.2.60", "question": "驾驶机动车在连续隧道路段行驶，遇服务区以及时驶入休息，避免疲劳驾驶。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 762, "section": "第二部分 考试业务知识", "header": "2.2.61", "question": "驾驶机动车在隧道内行驶，在限速范围内，车辆行驶速度越低就越安全。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 763, "section": "第二部分 考试业务知识", "header": "2.2.62", "question": "白天驾驶机动车驶入照明良好的隧道时，只要前方无车，就无须降低车速。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 764, "section": "第二部分 考试业务知识", "header": "2.2.63", "question": "驾驶营运客车在隧道内发生火灾时，驾驶人应立即开启车门将乘客疏散到隧道中间通风的地点等待救援。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 765, "section": "第二部分 考试业务知识", "header": "2.2.64", "question": "驾驶机动车遇隧道内发生火灾时，应留在车内等待救援。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 766, "section": "第二部分 考试业务知识", "header": "2.2.65", "question": "驾驶机动车在隧道内遇前方车辆运输的危险化学品发生泄露或火灾时，驾驶人应熄火并开启危险报警闪光灯，将钥匙留在车内后弃车逃生。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 767, "section": "第二部分 考试业务知识", "header": "2.2.66", "question": "营运客车驾驶人在隧道行驶遇前方发生火灾等事故时，应本着\"先人后己\"的原则组织乘客逃生。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 768, "section": "第二部分 考试业务知识", "header": "2.2.67", "question": "驾驶机动车遇隧道内发生火灾时，驾乘人员在隧道外等待救援时，险情未解除不得返回隧道。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 769, "section": "第二部分 考试业务知识", "header": "2.2.68", "question": "驾驶机动车在双向通行的隧道内遇到其他车辆发生交通事故时，应减速，注意避让，不得停车围观。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 770, "section": "第二部分 考试业务知识", "header": "2.2.69", "question": "驾驶机动车在长隧道内发生交通事故时，为给救援人员提供准确的位置信息，可使用隧道中紧急电话报警。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 771, "section": "第二部分 考试业务知识", "header": "2.2.70", "question": "机动车在隧道内发生故障，车辆无法移动时，驾驶人可在车内等候救援。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 772, "section": "第二部分 考试业务知识", "header": "2.2.71", "question": "驾驶机动车从隧道驶出时，可能会因横风的影响导致车辆偏离行驶路线。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 773, "section": "第二部分 考试业务知识", "header": "2.2.72", "question": "隧道内因地理位置等原因容易路面湿滑或结冰，遇到这种情况应轻踩制动踏板，以较低车速匀速行驶。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 774, "section": "第二部分 考试业务知识", "header": "2.2.73", "question": "冬季隧道出口路面可能结冰，此时应降低车速，但不得紧急制动。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 775, "section": "第二部分 考试业务知识", "header": "2.2.74", "question": "驾驶机动车遇团雾时，应开启雾灯、示廓灯和前后位灯，轻踩制动踏板减速。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 776, "section": "第二部分 考试业务知识", "header": "2.2.75", "question": "驾驶机动车大雾天气下跟车时，应变换远近光灯提示前车注意安全。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 777, "section": "第二部分 考试业务知识", "header": "2.2.76", "question": "驾驶机动车遇有强浓雾、能见度过低、行车困难时，应开启危险报警闪光灯和雾灯，选择安全地点停车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 778, "section": "第二部分 考试业务知识", "header": "2.2.77", "question": "驾驶机动车在有车辙的冰雪道路行驶，应循车辙低速行驶。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 779, "section": "第二部分 考试业务知识", "header": "2.2.78", "question": "夜间驾驶机动车，应注意控制行驶速度，以便能够在灯光有限的照射范围内及时发现情况，保证行车安全。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 780, "section": "第二部分 考试业务知识", "header": "2.2.79", "question": "夜间驾驶机动车，如果照明条件良好，无需开启前照灯。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 781, "section": "第二部分 考试业务知识", "header": "2.2.80", "question": "夜间会车时，如果发现对向车辆持续变换远近光灯，该驾驶人可能在提示本车关闭远光灯。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 782, "section": "第二部分 考试业务知识", "header": "2.2.81", "question": "夜间在照明不好的路段驾驶机动车，除了开启前照灯外还应开启危险报警闪光灯，以便其他交通参与者注意到本车，保证驾驶安全。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 783, "section": "第二部分 考试业务知识", "header": "2.2.82", "question": "夜间驾驶机动车通过急弯、坡路、拱桥、人行横道时，应当交替使用远近光灯示意。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 784, "section": "第二部分 考试业务知识", "header": "2.2.83", "question": "驾驶机动车在高速公路上爆胎，猛打转向盘和紧急制动可能造成翻车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 785, "section": "第二部分 考试业务知识", "header": "2.2.84", "question": "驾驶机动车遇轮胎压力不足需充气时，应先查看轮胎标识的胎压值。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 786, "section": "第二部分 考试业务知识", "header": "2.2.85", "question": "陈某驾驶小型普通客车行驶至某县道转弯路段时，在结冰湿滑路面上以63km/h的速度超越前方袁某驾驶的小型面包车（行驶速度28km/h）时两车刮擦后坠翻，造成6人死亡、1人受伤。本起事故驾驶人的违法行为是陈某超速行驶和违法超车。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 787, "section": "第二部分 考试业务知识", "header": "2.2.86", "question": "驾驶人冯某驾驶大型普通客车在某高速公路隧道口（限速60km/h）以83km/h的速度冲撞隧道墙，造成36人死亡、13人受伤。调查表明冯某自前一日12时许至事故发生时没有休息。本次事故发生的直接原因是冯某超速行驶、疲劳驾驶。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 788, "section": "第二部分 考试业务知识", "header": "2.2.87", "question": "驾驶机动车在地下车库寻找停车位时，应注意观察行人的动态，遇行人横穿车道时及时减速、停车避让。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 789, "section": "第二部分 考试业务知识", "header": "2.2.88", "question": "大雨天气驾驶机动车，光线会受到雨点的散射，车辆灯光照明效能降低，应降低车速，使用近光灯，谨慎驾驶。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 790, "section": "第二部分 考试业务知识", "header": "2.2.89", "question": "牵引故障车时，牵引车和被牵引车均应当开启危险报警闪光灯。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 791, "section": "第二部分 考试业务知识", "header": "2.2.90", "question": "在高速公路上发生事故导致车辆无法正常行驶时，驾驶人可以拦截过往车辆帮助拖车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 792, "section": "第二部分 考试业务知识", "header": "2.2.91", "question": "机动车在高速公路上发生故障或交通事故无法正常行驶时，在确保安全的情况下，可以由同行的其他机动车牵引。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 793, "section": "第二部分 考试业务知识", "header": "2.2.92", "question": "机动车在高速公路上发生故障时，为确保安全，车上人员应当在坐在车内等待救援。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 794, "section": "第二部分 考试业务知识", "header": "2.2.93", "question": "驾驶机动车进入高速公路加速车道后，可临时停车等待同行的其他车辆。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 795, "section": "第二部分 考试业务知识", "header": "2.2.94", "question": "在高速公路上行驶时，应通过察看行驶速度表来确认车速，以便正确选择行车道。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 796, "section": "第二部分 考试业务知识", "header": "2.2.95", "question": "驾驶机动车驶离高速公路进入普通道路后，应通过察看车速表来控制车速，不能单纯凭感觉判断车速。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 797, "section": "第二部分 考试业务知识", "header": "2.2.96", "question": "在高速公路上驾驶机动车感觉疲劳时，应驶入最近的服务区休息，不得在应急车道内停车休息。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 798, "section": "第二部分 考试业务知识", "header": "2.2.97", "question": "驾驶机动车在高速公路上行驶，可以随时借用应急车道行驶、超车或停车。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 799, "section": "第二部分 考试业务知识", "header": "2.2.98", "question": "驾驶机动车在高速公路上行驶时，应尽可能避免与其他车辆长时间并行。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 800, "section": "第二部分 考试业务知识", "header": "2.2.99", "question": "机动车在道路上发生的造成财产损失、尚未造成人员伤亡，且车辆可以移动的交通事故，必须等待交通警察处理。", "options": ["正确", "错误"], "answer": "错误", "type": "judgment"}, {"id": 801, "section": "第二部分 考试业务知识", "header": "2.2.100", "question": "机动车之间发生的造成财产损失、尚未造成人员伤亡，且车辆可以移动的交通事故，双方驾驶人对交通事故无争议，但其中一方使用伪造、变造的号牌，不可以自行协商解决。", "options": ["正确", "错误"], "answer": "正确", "type": "judgment"}, {"id": 802, "section": "第二部分 考试业务知识", "header": "3.1.1", "question": "轮式自行机械车、无轨电车、有轨电车的考试内容由_____确定。", "options": ["A、公安部交通管理局", "B、省级公安机关交通管理部门", "C、公安部和省级公安机关交通管理部门", "D、设区的市或者相当于同级的公安机关交通管理部门"], "answer": "B", "type": "choice"}, {"id": 803, "section": "第二部分 考试业务知识", "header": "3.1.2", "question": "小型汽车科目二考试内容包括_____。", "options": ["A、桩考", "B、坡道定点停车和起步", "C、通过单边桥", "D、通过限宽门"], "answer": "B", "type": "choice"}, {"id": 804, "section": "第二部分 考试业务知识", "header": "3.1.3", "question": "车辆管理所办理机动车驾驶证业务时，应当设置_____。", "options": ["A、受理岗、考试岗、档案管理岗、监督管理岗", "B、受理岗、考试岗、档案管理岗", "C、考试岗、监督管理岗、档案管理岗", "D、受理岗、考试岗、业务领导岗"], "answer": "A", "type": "choice"}, {"id": 805, "section": "第二部分 考试业务知识", "header": "3.1.4", "question": "在学习驾驶证明有效期内，科目二和科目三道路驾驶技能考试预约考试的次数_____。", "options": ["A、共不得超过10次", "B、共不得超过5次", "C、没有限制", "D、分别不得超过5次"], "answer": "D", "type": "choice"}, {"id": 806, "section": "第二部分 考试业务知识", "header": "3.1.5", "question": "车辆管理所应当至少在考试前_____通过互联网交通安全综合服务管理平台公开考试计划，供申请人查询。", "options": ["A、三日", "B、五日", "C、十日", "D、十五日"], "answer": "C", "type": "choice"}, {"id": 807, "section": "第二部分 考试业务知识", "header": "3.1.6", "question": "首次预约科目一考试的，计算机系统按_____对预约申请人进行自动排序。", "options": ["A、驾驶证申请受理时间", "B、科目一考试预约时间", "C、申请人提出申请的时间", "D、随机安排"], "answer": "A", "type": "choice"}, {"id": 808, "section": "第二部分 考试业务知识", "header": "3.1.7", "question": "车辆管理所应建立多渠道举报投诉查处制度，考试监督岗_____汇总互联网交通安全综合服务管理平台上的考生回访评价，跟踪核查，督办整改。", "options": ["A、每日", "B、每周", "C、每月", "D、每年"], "answer": "B", "type": "choice"}, {"id": 809, "section": "第二部分 考试业务知识", "header": "3.1.8", "question": "大中型客车考试里程不少于_____公里。", "options": ["A、5", "B、10", "C、3", "D、20"], "answer": "B", "type": "choice"}, {"id": 810, "section": "第二部分 考试业务知识", "header": "3.1.9", "question": "申请人在考试过程中有_____行为的，取消考试资格，已经通过考试的其他科目成绩无效，公安机关交通管理部门处二千元以下罚款。", "options": ["A、异常", "B、缺考", "C、贿赂、舞弊", "D、中途离开考场"], "answer": "C", "type": "choice"}, {"id": 811, "section": "第二部分 考试业务知识", "header": "3.1.10", "question": "模拟高速公路_____考试内容。", "options": ["A、属于科目一", "B、属于科目二", "C、属于科目三", "D、不属于"], "answer": "B", "type": "choice"}, {"id": 812, "section": "第二部分 考试业务知识", "header": "3.1.11", "question": "安全文明驾驶常识考试_____考试内容。", "options": ["A、属于科目一", "B、属于科目二", "C、属于科目三", "D、不属于"], "answer": "C", "type": "choice"}, {"id": 813, "section": "第二部分 考试业务知识", "header": "3.1.12", "question": "非首次预约科目一或者预约其他科目考试的，计算机系统按_____规则对预约申请人进行自动排序。", "options": ["A、驾驶证申请受理时间", "B、上一次考试时间", "C、申请人提出申请的时间", "D、随机安排"], "answer": "B", "type": "choice"}, {"id": 814, "section": "第二部分 考试业务知识", "header": "3.1.13", "question": "考试预约成功的申请人因自身原因取消约考或者缺考的，计算机系统按_____规则对预约申请人进行自动排序。", "options": ["A、按照取消预约时间或者缺考时间", "B、上一次考试时间", "C、申请人提出申请的时间", "D、随机安排"], "answer": "A", "type": "choice"}, {"id": 815, "section": "第二部分 考试业务知识", "header": "3.1.14", "question": "科目三夜间考试要求学员在路口转弯时，_____。", "options": ["A、使用远光灯通过", "B、交替使用远、近光灯示意通过", "C、使用近光灯通过", "D、照明良好的道路可关闭前照灯"], "answer": "C", "type": "choice"}, {"id": 816, "section": "第二部分 考试业务知识", "header": "3.1.15", "question": "通过互联网考试预约系统约考成功后，在考试预约截止日期后申请取消约考的，通过_____办理。", "options": ["A、互联网考试预约系统", "B、电话", "C、业务大厅窗口", "D、以上均可"], "answer": "C", "type": "choice"}, {"id": 817, "section": "第二部分 考试业务知识", "header": "3.1.16", "question": "_____为大中型客货车科目二项目。", "options": ["A、通过限宽门", "B、百米加减档", "C、倒车入库", "D、夜间行驶"], "answer": "A", "type": "choice"}, {"id": 818, "section": "第二部分 考试业务知识", "header": "3.1.17", "question": "不属于大型客车、重型牵引挂车、城市公交车、中型客车、大型货车科目二考试内容的是_____。", "options": ["A、窄路掉头", "B、加减挡位", "C、模拟紧急情况处置", "D、模拟连续急弯山区路"], "answer": "B", "type": "choice"}, {"id": 819, "section": "第二部分 考试业务知识", "header": "3.1.18", "question": "属于小型汽车、小型自动挡汽车、残疾人专用小型自动挡载客汽车和低速载货汽车科目二考试内容的是_____。", "options": ["A、通过单边桥", "B、通过连续障碍", "C、起伏路行驶", "D、倒车入库"], "answer": "D", "type": "choice"}, {"id": 820, "section": "第二部分 考试业务知识", "header": "3.1.19", "question": "申请增加轻型牵引挂车准驾车型的，应当考试_____。", "options": ["A、科目一、科目二、科目三", "B、科目一、科目二", "C、科目二和科目三安全文明驾驶常识", "D、科目二、科目三"], "answer": "C", "type": "choice"}, {"id": 821, "section": "第二部分 考试业务知识", "header": "3.1.20", "question": "初次申领城市公交车、大型货车准驾车型的，夜间考试里程不少于_____公里。", "options": ["A、3", "B、5", "C、10", "D、20"], "answer": "A", "type": "choice"}, {"id": 822, "section": "第二部分 考试业务知识", "header": "3.1.21", "question": "申请人因故不能按照预约时间参加考试的，_____申请取消预约。对申请人未按照预约考试时间参加考试的，判定该次考试_____。", "options": ["A、应当提前一日，不合格", "B、应当提前二日，不合格", "C、不可以，缺考", "D、不可以，不合格"], "answer": "A", "type": "choice"}, {"id": 823, "section": "第二部分 考试业务知识", "header": "3.1.22", "question": "窄路掉头考试要求车辆行驶至掉头路段靠右停车，不超过_____，将车辆掉头。", "options": ["A、一进二退", "B、二进二退", "C、三进二退", "D、二进三退"], "answer": "C", "type": "choice"}, {"id": 824, "section": "第二部分 考试业务知识", "header": "3.1.23", "question": "直线行驶考试要求车辆行驶过程中适时观察内、外后视镜，视线不得离开行驶方向_____秒。", "options": ["A、2", "B、3", "C、4", "D、5"], "answer": "A", "type": "choice"}, {"id": 825, "section": "第二部分 考试业务知识", "header": "3.1.24", "question": "学习驾驶证明的有效期为_____。", "options": ["A、一年", "B、二年", "C、三年", "D、四年"], "answer": "C", "type": "choice"}, {"id": 826, "section": "第二部分 考试业务知识", "header": "3.1.25", "question": "每个科目考试一次，考试不合格的，可以补考一次。不参加补考或者补考仍不合格的，本次考试终止，申请人应当重新预约考试，但科目二、科目三考试应当在_____后预约。", "options": ["A、十日", "B、二十日", "C、三十日", "D、四十日"], "answer": "A", "type": "choice"}, {"id": 827, "section": "第二部分 考试业务知识", "header": "3.1.26", "question": "初次申请机动车驾驶证或者申请增加准驾车型的，科目一考试合格后，车辆管理所应当在_____内核发学习驾驶证明。", "options": ["A、一日", "B、三日", "C、二日", "D、当日"], "answer": "A", "type": "choice"}, {"id": 828, "section": "第二部分 考试业务知识", "header": "3.1.27", "question": "持军队、武装警察部队或者境外机动车驾驶证申请机动车驾驶证的，应当自车辆管理所受理之日起_____完成科目考试。", "options": ["A、一年内", "B、二年内", "C、三年内", "D、无时间限制"], "answer": "C", "type": "choice"}, {"id": 829, "section": "第二部分 考试业务知识", "header": "3.1.28", "question": "直辖市、设区的市或者相当于同级的公安机关交通管理部门应当_____向社会公布车辆管理所考试员考试质量情况、_____驾龄驾驶人交通违法率和交通肇事率等信息。", "options": ["A、每月  一年内", "B、每月  三年内", "C、每年  一年内", "D、每年  三年内"], "answer": "B", "type": "choice"}, {"id": 830, "section": "第二部分 考试业务知识", "header": "3.1.29", "question": "大中型客货车科目二考试内容不包括_____。", "options": ["A、侧方停车", "B、通过单边桥", "C、通过连续障碍", "D、曲线行驶"], "answer": "C", "type": "choice"}, {"id": 831, "section": "第二部分 考试业务知识", "header": "3.1.30", "question": "行驶中身体任何部位伸出车外的，_____。", "options": ["A、评判为不合格", "B、扣20分", "C、扣10分", "D、扣5分"], "answer": "A", "type": "choi
